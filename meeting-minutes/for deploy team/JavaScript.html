    } catch (e) {}
  })();

  /* =======================================================================
     PAGE-ACCURATE RENDERING — see PAGINATION.md before changing any of this.

     The reading view, Print/PDF and the editor must break pages in identical
     places. That is achieved by Paged.js, not by measuring heights, and it is
     easy to break by accident. PAGINATION.md records the design, the rules
     that must hold, and the approaches already tried and found not to work.
     ======================================================================= */

  /* ---------------- Real page preview, via Paged.js ------------------------
     The browser fragments a document into pages only while printing, and does
     not expose the result to JavaScript — there is no way to ask "where does
     page 2 begin?". Computing it by hand is an approximation: it misses the
     engine's widow/orphan control and its rule that a heading is never left
     stranded at the foot of a page, which is why a heading sat on page 1 on
     screen but page 2 in the PDF.

     Paged.js exists for exactly this. It reads the same @page rules the
     printer uses and lays the document out into real page elements, so the
     boundaries shown on screen are the boundaries the PDF will have.

     It runs ONLY in the preview iframe. Printing is untouched: the print
     button still hands the document to the browser's own paged-media engine,
     so the PDF is produced exactly as before. */
  var PAGED_PREVIEW_JS =
    '<script src="https://unpkg.com/pagedjs@0.4.3/dist/paged.polyfill.js"><\/script>';

  // Chrome around the paginated preview: Paged.js wraps each page in
  // .pagedjs_page, which is styled here to look like a sheet of paper on a
  // desk. All of it is @media screen — printing never sees these elements
  // because Paged.js is not run for print output.
  // Every rule needs `html` for extra specificity AND !important, because
  // Paged.js injects its own stylesheet at runtime — after this one — and its
  // rules would otherwise win. Verified in a real browser: without these the
  // sheets render transparent with no gaps, i.e. one continuous white column
  // that looks like the pagination never happened.
  var PAGED_PREVIEW_CSS =
    '<style>@media screen{' +
      'html body{background:#eef1f4 !important;}' +
      'html .pagedjs_pages{display:flex !important;flex-direction:column !important;' +
        'align-items:center !important;gap:22px !important;padding:22px 0 !important;}' +
      'html .pagedjs_page{background:#fff !important;position:relative !important;' +
        'box-shadow:0 2px 10px rgba(0,0,0,.18) !important;}' +
    '}<\/style>';

  // Dark-mode variant of the A4 preview — wrapped entirely in @media screen so
  // it can NEVER affect Print/PDF output (a printed page or exported PDF should
  // always be white paper + black ink, never dark background). Only injected
  // into the srcdoc when html.theme-dark is active; the .paper/.frame-wrap
  // chrome around the iframe already darkens (see Stylesheet.html) — this is
  // just the document INSIDE the iframe, which is otherwise a fully separate
  // HTML document that doesn't inherit the outer page's theme class at all.
  var DARK_OVERRIDE_CSS =
    "@media screen{" +
    "html,body{background:#161b22 !important;}" +
    "body{color:#c9d1d9 !important;}" +
    ".vcb-letterhead{color:#79c0ff !important;}" +
    ".vcb-letterdate{color:#8ab4e8 !important;}" +
    ".ai-disclaimer{color:#8b949e !important;background:#1c2128 !important;border-color:#30363d !important;}" +
    "h1,h2{color:#79c0ff !important;}h3,h4{color:#8ab4e8 !important;}" +
    "a{color:#58a6ff !important;}" +
    "td,th{border-color:#30363d !important;}" +
    "th,tr:first-child td{background:#1c2128 !important;}" +
    ".chip-file{border-color:#30363d !important;color:#c9d1d9 !important;background:#1c2128 !important;}" +
    ".chip-file:hover{border-color:#58a6ff !important;background:#161b22 !important;}" +
    "}";

  function openMeeting(id) {
    S.activeId = id;
    renderList();
    if (isMobile()) setMobilePane('detail');
    // Tablet portrait: the list is an overlay, so picking from it must also
    // dismiss it — otherwise the document loads hidden behind the panel.
    closeList();

    /* Do NOT blank the pane while the next meeting loads.
       Replacing it with a spinner produced a visible sequence on every click:
       current document → spinner → empty grey pane → new document, because the
       new iframe needs a moment to paginate before it can be shown. Keeping the
       previous document on screen until the new one is READY means one clean
       swap instead of three intermediate states.

       A placeholder is still shown when the pane is empty (first open of the
       session), where there is nothing to keep. */
    var hasDocument = !!el('detailContent').querySelector('.frame-wrap');
    if (!hasDocument) {
      el('detailContent').innerHTML = '<div class="placeholder"><div class="spin" style="border-color:#ccc;border-top-color:#0b3d62"></div><div>Loading…</div></div>';
    } else {
      // Dim slightly so the click clearly registered while the next one loads.
      el('detailContent').style.opacity = '0.55';
      el('detailContent').style.transition = 'opacity .12s';
    }

    gs('getMeeting', id, TOKEN).then(function (m) {
      if (m) S.contentCache[id] = m;
      el('detailContent').style.opacity = '';
      renderDetail(m);
    }).catch(function (e) {
      el('detailContent').style.opacity = '';
      el('detailContent').innerHTML = '<div class="placeholder">Error: ' + esc(e.message || e) + '</div>';
    });
  }

  function renderDetail(m) {
    if (!m) { showPlaceholder(); return; }
    var p = S.byId[m.projectId] || {};
    var admin = !!BOOTSTRAP.isAdmin;
    var editor = admin || !!BOOTSTRAP.isEditor;
    var bar = '<div class="detail-bar">' +
      '<h2>' + esc(m.title) + '</h2>' +
      // Visibility is no longer a manual switch — it follows from where a
      // meeting sits. Filed into a project = visible to that project's
      // audience; still in an inbox = private. See setFathomTag in Code.js.
      ''  +
      (admin ? '<button class="dbtn" id="d_pin" title="Pin">' + (m.pinned ? '★ <span class="blbl">Pinned</span>' : '☆ <span class="blbl">Pin</span>') + '</button>' : '') +
      (editor && (m.source === 'fathom' || m.source === 'transkriptor') ? '<button class="dbtn primary" id="d_file" title="Also show this in a project">📂 File into project…</button>' : '') +
      (m.fathomUrl ? '<a class="dbtn" id="d_recording" href="' + esc(m.fathomUrl) + '" target="_blank">▶ Recording</a>' : '') +
      // Shown to EVERYONE, including anonymous guests. Google hides visitor
      // emails under this deployment, so the app cannot know an employee is an
      // editor until they identify themselves — hiding the button meant an
      // allow-listed editor saw no way in and assumed they had no access.
      // Guests get the button, click it, and are prompted to sign in with an
      // emailed code; only then does it open the editor.
      '<button class="dbtn primary" id="d_editapp">✎ Edit here</button>' +
      // One button, one panel: edits and comments are the same story about a
      // meeting, so they share a single chronological timeline rather than
      // two surfaces the reader has to cross-reference.
      '<button class="dbtn" id="d_history" title="Edits and comments, newest first">🕘 <span class="blbl">Activity</span></button>' +
      '<button class="dbtn" id="d_share" title="Share link">🔗 <span class="blbl">Share link</span></button>' +
      '<button class="dbtn" id="d_print">🖨 Print / PDF</button>' +
      '<div class="sub">' + esc(p.name || '') + ' · ' + esc(fmtDate(m)) + (fmtTime(m) ? ' · ' + esc(fmtTime(m)) : '') + '</div>' +
      '</div>';

    // Every A4 render carries the company letterhead top-left. The Doc is still the
    // source of truth for the body — we only prepend the letterhead when the content
    // doesn't already lead with the company name, so docs that have it aren't doubled.
    var docHtml = m.html || '<p>(no content)</p>';
    var leadsWithCompany = String(docHtml).replace(/<[^>]*>/g, ' ').slice(0, 220).indexOf('วิจิตรภัณฑ์ก่อสร้าง') !== -1;
    // When we add the letterhead (Doc body has no company header of its own), also
    // add the meeting date under it in Thai, e.g. "วันที่ 12 มิถุนายน 2569" — mirrors
    // the date line Docs that carry their own header already show. Skipped if undated.
    var thaiDate = fmtThaiDate(m);
    var letterhead = leadsWithCompany ? '' :
      '<div class="vcb-letterhead">' + COMPANY_NAME + '</div>' +
      (thaiDate ? '<div class="vcb-letterdate">' + esc(thaiDate) + '</div>' : '');
    // AI-summary disclaimer for Fathom/Transkriptor-sourced meetings — DISPLAY
    // ONLY, exactly like the letterhead above: prepended straight into the
    // rendered srcdoc, never written into m.html itself. If this were part of
    // the stored body it would leak into excerpt (stripTags_(html).slice(0,200)
    // — always the first 200 chars of the body) and into searchMeetings
    // (which greps getContent_(id) directly), matching every AI-sourced
    // meeting on words like "summary"/"AI-Generated" and burying the real
    // excerpt under a fixed boilerplate line. Per explicit instruction
    // 2026-07-21: shown at the top of the render, absent from search/excerpt.
    var aiDisclaimer = (m.source === 'fathom' || m.source === 'transkriptor') ?
      '<p class="ai-disclaimer"><b>AI-Generated Summary:</b> This summary was generated automatically and may contain errors. Please focus on the main discussion points and verify important details where necessary.</p>' : '';
    var isDark = document.documentElement.classList.contains('theme-dark');
    // <title> becomes the browser's default "Save as PDF" filename when
    // printing this iframe (2026-07-22 fix — previously the srcdoc had no
    // title at all, so Chrome/Edge fell back to the OUTER page's title,
    // "VCB Meeting Minutes", for every single meeting regardless of which
    // one was open). Stripped of characters invalid in a Windows/macOS
    // filename (\ / : * ? " < > |) so the browser doesn't silently mangle
    // or reject the suggested name.
    // The <title> becomes the browser's suggested "Save as PDF" filename, so it
    // carries the meeting date — every export was otherwise named just
    // "VCB Meeting Minutes" and they were indistinguishable in a folder.
    // Day-month-year, dash-separated (e.g. "18-08-2569"): dashes because
    // "/" is illegal in a filename, and the Buddhist year to match how every
    // date is shown elsewhere in the app.
    var pdfTitle = (m.title || 'Meeting').replace(/[\\/:*?"<>|]/g, '').trim() || 'Meeting';
    var pdfDate = pdfDateSuffix_(m);
    if (pdfDate) pdfTitle += ' ' + pdfDate;
    // Anti-tampering QR — lives in the @page top-right MARGIN BOX (see
    // buildQrPageCss_), never in body flow, so it can't overlap content.
    var qrPageCss = buildQrPageCss_(verifyQrDataUri_(m.id));
    var srcdocHead = '<!DOCTYPE html><html><head><meta charset="utf-8"><base target="_blank">' +
      '<title>' + esc(pdfTitle) + '</title>' +
      '<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">' +
      '<style>' + (m.css || '') + '</style><style>' + OVERRIDE_CSS + '</style>' +
      (isDark ? '<style>' + DARK_OVERRIDE_CSS + '</style>' : '') +
      (qrPageCss ? '<style>' + qrPageCss + '</style>' : '') + '</head>';
    // The document exactly as it has always been produced — no Paged.js, no
    // preview chrome. This is what gets printed/exported, so the PDF is
    // completely unaffected by the preview changes.
    var srcdocForPrint = srcdocHead + '<body>' + letterhead + aiDisclaimer + docHtml + '</body></html>';
    // The on-screen preview additionally loads Paged.js, which fragments the
    // document into real page elements using the same @page rules the printer
    // uses — so the boundaries shown are the boundaries the PDF will have.
    // The preview CSS goes at the END of the body, after the Paged.js script:
    // Paged.js appends its own stylesheet when it runs, so a <style> in <head>
    // loses on source order. Later in the document means later in the cascade.
    var srcdoc = srcdocHead +
      '<body>' + letterhead + aiDisclaimer + docHtml + PAGED_PREVIEW_JS + PAGED_PREVIEW_CSS + '</body></html>';

    var attendees = '';
    if (m.attendees && m.attendees.length) {
      attendees = '<div class="attendees"><span class="atl">Attendees · ' + m.attendees.length + '</span>' +
        m.attendees.map(function (e) {
          var name = e.split('@')[0].replace(/[._]/g, ' ');
          return '<a class="chip" href="mailto:' + esc(e) + '" title="' + esc(e) + '">' +
            '<span class="av">' + esc(e.charAt(0).toUpperCase()) + '</span>' +
            '<span class="cm"><b>' + esc(name) + '</b><small>' + esc(e) + '</small></span></a>';
        }).join('') + '</div>';
    }

    var tagChips = '';
    if (editor && (m.source === 'fathom' || m.source === 'transkriptor') && m.taggedProjectIds && m.taggedProjectIds.length) {
      tagChips = '<div class="attendees tag-chips"><span class="atl">Also tagged into</span>' +
        m.taggedProjectIds.map(function (pid) {
          var tp = S.byId[pid] || { name: pid, color: '#888' };
          return '<span class="chip tagchip" data-pid="' + esc(pid) + '" style="--c:' + tp.color + '">' +
            '<span class="cm"><b>' + esc(tp.name) + '</b></span>' +
            '<button type="button" class="chip-x" data-pid="' + esc(pid) + '" title="Remove from ' + esc(tp.name) + '">✕</button></span>';
        }).join('') + '</div>';
    }

    var attachRow = '';
    var atts = m.attachments || [];
    if (atts.length || editor) {
      // .attach-footer (not .attendees) — this now sits below .paper, inside
      // .frame-wrap's own grey padded area, not flush against the title bar
      // chrome .attendees was styled for. Same card look as .paper (white,
      // rounded, shadowed, same max-width) so it reads as a distinct
      // "attachments" section at the end of the document, not a floating strip.
      attachRow = '<div class="attach-footer">' +
        '<span class="atl">Attachments' + (atts.length ? ' · ' + atts.length : '') + '</span>' +
        atts.map(function (a) {
          return '<span class="chip attachchip" data-file-id="' + esc(a.fileId) + '">' +
            '<a href="' + esc(a.url) + '" target="_blank" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit;">' +
            fileIconHtml_(a.mimeType, a.name) +
            '<span class="cm"><b>' + esc(a.name) + '</b><small>' + fmtFileSize_(a.size) + '</small></span></a>' +
            (editor ? '<button type="button" class="chip-x" data-file-id="' + esc(a.fileId) + '" title="Remove attachment">✕</button>' : '') +
            '</span>';
        }).join('') +
        (editor ? '<button type="button" class="attach-upload-btn" id="d_attach">＋ Attach file</button>' : '') +
        '</div>';
    }

    // Attachments render AFTER the actual meeting content — inside .frame-wrap,
    // below the iframe — not between the title and the content (2026-07-22).
    // .frame-wrap is the page's only scrolling region (flex:1; overflow:auto);
    // a sibling placed after it at the #detailContent level would be squeezed
    // into whatever space .frame-wrap doesn't claim, i.e. effectively
    // invisible, since .frame-wrap already fills all remaining height. Putting
    // attachRow INSIDE .frame-wrap makes it part of the same scrollable area
    // as the content, so it naturally appears only once you scroll all the
    // way down — exactly like an appendix at the end of a document — instead
    // of eating mobile's limited screen height right at the top before you've
    // even reached the actual summary you opened the meeting to read.
    el('detailContent').innerHTML = bar + attendees + tagChips +
      '<div class="frame-wrap"><div class="paper"><iframe class="render" id="renderFrame"></iframe></div>' + attachRow + '</div>' +
      '<input type="file" id="attachFileInput" style="display:none" accept=".pdf,.ppt,.pptx,.xls,.xlsx,.doc,.docx,.png,.jpg,.jpeg,.gif,.webp,.txt,.csv">';
    // The document area starts hidden and is revealed once Paged.js has laid
    // the pages out (see frame.onload below). Without this the empty iframe
    // paints as a blank grey pane for a few hundred milliseconds on every
    // click — the flash seen when switching meetings. The toolbar above it
    // stays visible throughout, so the click still feels immediate.
    var initialWrap = el('detailContent').querySelector('.frame-wrap');
    if (initialWrap && !isMobile()) initialWrap.style.visibility = 'hidden';

    // Comments slide-out panel. The panel shell (backdrop/aside/header) is
    // created once and lives outside #detailContent so re-renders of the
    // detail pane (renderDetail runs again on pin/visibility toggle etc.)
    // don't wipe it out from under an open panel — only its body is
    // re-rendered here, every time, to reflect the current meeting's comments.
    // The standalone comments side-panel is gone: comments now live in the
    // Activity timeline alongside edits (see renderEditHistory), so there is
    // one place to read the discussion and one place to add to it.

    // On phones, lift the action buttons onto the "← Meetings" backbar row so they
    // don't take a separate row below the title. Moving the nodes (not cloning)
    // keeps the handlers bound just below.
    var backActions = el('detailBackActions');
    if (backActions) {
      backActions.innerHTML = '';
      if (isMobile()) ['d_pin', 'd_share'].forEach(function (id) { var n = el(id); if (n) backActions.appendChild(n); });
    }

    var frame = el('renderFrame');
    frame.srcdoc = srcdoc;
    frame.onload = function () {
      try {
        if (usesContinuousDoc()) {
          applyMobileScale(frame);
          // Fonts (Sarabun) load async — scrollHeight grows after first paint.
          // Recompute once more after fonts settle so .paper height matches content.
          setTimeout(function () { applyMobileScale(frame); }, 600);
          var d = frame.contentWindow && frame.contentWindow.document;
          if (d && d.fonts && d.fonts.ready) d.fonts.ready.then(function () { applyMobileScale(frame); });
        } else {
          // Paged.js lays the document out asynchronously after load, so the
          // height must be taken once it finishes — measuring on `load` alone
          // would size the frame to the pre-pagination document. It signals
          // completion by adding .pagedjs_pages; poll briefly for it and fall
          // back to a plain measurement if it never arrives (e.g. the CDN is
          // blocked), so the view always renders something correct.
          // Reveal only once the layout is final. Sizing the frame immediately
          // showed the un-paginated document at its pre-Paged.js height for a
          // moment — a small scrolling window that then jumped to full size.
          // The frame stays invisible (but still laid out, so measurement
          // works) until the page count settles.
          var revealed = false;
          var fitFrame = function () {
            try {
              var d = frame.contentWindow.document;
              // Size the frame to its content EXACTLY. An extra +48px pad used
              // to be added here as clipping insurance, but the document
              // already ends with .pagedjs_pages' own 22px bottom padding, so
              // the pad rendered as a bare white strip between the last sheet
              // and the attachments card with nothing in it. Verified in a real
              // browser across 1–4 page documents, with webfonts loading late:
              // no clipping and no inner scrollbar without it.
              frame.style.height = d.body.scrollHeight + 'px';
              // Paginated, measured, and about to be shown — the one moment
              // at which a narrow pane can be scaled without fighting
              // Paged.js for the height.
              fitScaleToPane(frame);
              if (!revealed) {
                revealed = true;
                frame.style.visibility = 'visible';
                // Reveal the attachments row at the same moment, so the sheet
                // and everything below it appear together rather than the
                // footer painting first and then being pushed down.
                var wrap = frame.closest ? frame.closest('.frame-wrap') : null;
                if (wrap) { wrap.classList.add('ready'); wrap.style.visibility = ''; }
              }
            } catch (e2) {}
          };
          frame.style.visibility = 'hidden';
          var tries = 0, lastCount = -1, stable = 0;
          var poll = setInterval(function () {
            var d = null;
            try { d = frame.contentWindow.document; } catch (e3) {}
            if (!d || ++tries > 80) { clearInterval(poll); fitFrame(); return; }
            // Paged.js builds pages progressively, so the frame must be sized
            // once the page count has SETTLED — sizing at first sight of a page
            // fits the frame to a partial layout and clips the rest.
            var count = d.querySelectorAll('.pagedjs_page').length;
            if (count > 0 && count === lastCount) {
              if (++stable >= 3) { clearInterval(poll); fitFrame(); }
            } else { stable = 0; lastCount = count; }
          }, 100);
        }
      } catch (e) { frame.style.height = '1400px'; }
    };

    if (el('d_pin')) el('d_pin').onclick = function () {
      showBusy('Updating…');
      gs('togglePin', m.id, TOKEN).then(function (now) {
        m.pinned = now;
        S.meetings.filter(function (x) { return x.id === m.id; }).forEach(function (mm) { mm.pinned = now; });
        renderDetail(m); renderList(); toast(now ? 'Pinned' : 'Unpinned');
      }).catch(function (e) { toast('Failed: ' + (e.message || e)); }).then(hideBusy);
    };
    if (el('d_file')) el('d_file').onclick = function () { openTagPicker(m); };
    Array.prototype.forEach.call(document.querySelectorAll('.chip-x[data-pid]'), function (btn) {
      btn.onclick = function (e) {
        e.preventDefault(); e.stopPropagation();
        var pid = btn.getAttribute('data-pid');
        var tp = S.byId[pid] || { name: pid };
        showBusy('Removing from ' + tp.name + '…');
        gs('untagFathomMeeting', m.id, pid, TOKEN).then(function () {
          return refreshAll().then(function () { openMeeting(m.id); toast('Removed from ' + tp.name + ' — still in Fathom Inbox'); });
        }).catch(function (err) { toast('Failed: ' + (err.message || err)); }).then(hideBusy);
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('.chip-x[data-file-id]'), function (btn) {
      btn.onclick = function (e) {
        e.preventDefault(); e.stopPropagation();
        var fileId = btn.getAttribute('data-file-id');
        confirmDialog('This cannot be undone.', { title: 'Remove this attachment?', okLabel: 'Remove' }).then(function (ok) {
          if (!ok) return;
          showBusy('Removing attachment…');
          gs('removeAttachment', m.id, fileId, TOKEN).then(function () {
            return refreshAll().then(function () { openMeeting(m.id); toast('Attachment removed'); });
          }).catch(function (err) { toast('Failed: ' + (err.message || err)); }).then(hideBusy);
        });
      };
    });
    if (el('d_attach')) el('d_attach').onclick = function () { el('attachFileInput').click(); };
    if (el('attachFileInput')) el('attachFileInput').onchange = function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      if (file.size > 25 * 1024 * 1024) { toast('File too large (max 25MB)'); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var base64 = reader.result.split(',')[1];
        showBusy('Uploading ' + file.name + '…');
        gs('addAttachment', m.id, file.name, file.type || 'application/octet-stream', base64, TOKEN).then(function () {
          return refreshAll().then(function () { openMeeting(m.id); toast('Attached ' + file.name); });
        }).catch(function (err) { toast('Failed: ' + (err.message || err)); }).then(hideBusy);
      };
      reader.onerror = function () { toast('Could not read file'); };
      reader.readAsDataURL(file);
    };
    // Chrome's "Save as PDF" filename is derived from the browser tab's true
    // top-level document title — which Apps Script's IFRAME sandbox mode
    // places this script two iframes below (exec page -> userCodeAppPanel
    // -> userHtmlFrame, where this code runs). Setting document.title here
    // only renames userHtmlFrame's own document, not the tab Chrome reads
    // (confirmed via direct CDP inspection of the real chrome://print/
    // target, 2026-07-24) — and there's no supported way to reach the true
    // top-level document from inside IFRAME sandbox mode (no client API for
    // it; NATIVE sandbox mode, which would avoid the nesting, was fully
    // deprecated and shut down in 2016 and no longer exists as an option).
    // The iframe's own srcdoc <title> (set above, per meeting) still
    // correctly names the on-paper print header — only the save-dialog
    // filename itself is unfixable from here.
    // Printing must NOT use the preview iframe: Paged.js has already split that
    // document into page elements, so handing it to the print engine would
    // paginate an already-paginated document. Instead print from a hidden
    // iframe holding the untouched srcdoc — byte-for-byte what produced the PDF
    // before Paged.js existed, so exports are completely unchanged.
    el('d_print').onclick = function () {
      try {
        var old = document.getElementById('printFrame');
        if (old) old.remove();
        var pf = document.createElement('iframe');
        pf.id = 'printFrame';
        pf.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;';
        pf.srcdoc = srcdocForPrint;
        pf.onload = function () {
          try { pf.contentWindow.focus(); pf.contentWindow.print(); }
          catch (e2) { window.print(); }
        };
        document.body.appendChild(pf);
      } catch (e) { window.print(); }
    };
    el('d_share').onclick = function () { shareLink(m.id); };
    // Re-fetches from the server right before opening the editor, rather than
    // trusting S.contentCache[m.id] — that cache is populated once when the
    // meeting is first opened and never invalidated afterward. If a
    // Fathom/Transkriptor force-refresh (or anyone else's edit) landed on the
    // server AFTER this detail pane was first loaded, editing from the stale

  /* ---------- Date picker (calendar icon next to a date text field) ----------

  function initDatePicker_(ids) {
    var text = el(ids.text), btn = el(ids.btn), pop = el(ids.pop);
    var titleEl = el(ids.title), dowEl = el(ids.dow), gridEl = el(ids.grid);
    var prevBtn = el(ids.prev), nextBtn = el(ids.next);
    if (!text || !btn || !pop) return;
    var DOW = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
    dowEl.innerHTML = DOW.map(function (d) { return '<span>' + d + '</span>'; }).join('');
    var viewY, viewM, selY, selM, selD; // Gregorian throughout; only display uses Buddhist year

    function parseTextDate() {
      var parts = text.value.match(/(\d{1,2})\s*[\/\.]\s*(\d{1,2})\s*[\/\.]\s*(\d{2,4})/);
      if (!parts) return null;
      var y = parseInt(parts[3], 10); if (y < 100) y += 2500; if (y > 2400) y -= 543;
      var d = parseInt(parts[1], 10), mo = parseInt(parts[2], 10);
      if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
      return { y: y, m: mo - 1, d: d };

    function render() {
      titleEl.textContent = MONTHS[viewM] + ' ' + (viewY + 543);
      var first = new Date(viewY, viewM, 1);
      var startDow = first.getDay();
      var daysInMonth = new Date(viewY, viewM + 1, 0).getDate();
      var daysInPrevMonth = new Date(viewY, viewM, 0).getDate();
      var today = new Date();
      var cells = [];
      for (var i = 0; i < startDow; i++) {
        cells.push({ d: daysInPrevMonth - startDow + 1 + i, muted: true });
      }
      for (var d = 1; d <= daysInMonth; d++) cells.push({ d: d, muted: false });
      while (cells.length % 7 !== 0) cells.push({ d: cells.length - startDow - daysInMonth + 1, muted: true });
      gridEl.innerHTML = cells.map(function (c) {
        var isToday = !c.muted && viewY === today.getFullYear() && viewM === today.getMonth() && c.d === today.getDate();
        var isSelected = !c.muted && selY === viewY && selM === viewM && selD === c.d;
        var cls = (c.muted ? 'cal-muted' : '') + (isToday ? ' cal-today' : '') + (isSelected ? ' cal-selected' : '');
        return '<button type="button" class="' + cls.trim() + '" data-d="' + c.d + '" data-muted="' + c.muted + '">' + c.d + '</button>';
      }).join('');
    }

    function open() {
      var parsed = parseTextDate() || { y: new Date().getFullYear(), m: new Date().getMonth(), d: new Date().getDate() };

      selY = parsed.y; selM = parsed.m; selD = parsed.d;
      render();

    prevBtn.onclick = function () { viewM--; if (viewM < 0) { viewM = 11; viewY--; } render(); };
    nextBtn.onclick = function () { viewM++; if (viewM > 11) { viewM = 0; viewY++; } render(); };
    gridEl.onclick = function (e) {
      var t = e.target.closest('button'); if (!t || t.getAttribute('data-muted') === 'true') return;
      var d = parseInt(t.getAttribute('data-d'), 10);

      text.value = pad2_(d) + '/' + pad2_(viewM + 1) + '/' + yBE;
      close();
    };
    function pad2_(n) { return (n < 10 ? '0' : '') + n; }
    document.addEventListener('click', function (e) {
      if (pop.classList.contains('show') && !pop.contains(e.target) && e.target !== btn) close();
    });
  }

  /* ---------- Fathom "tag into project" picker ---------- */
  // Scores how well a project's own name/id keywords appear in the meeting's
  // title + content — a suggestion only, never auto-picked, since project
  // content can be sensitive and the admin must always choose explicitly (see
  // the tagging design: recordings never move/auto-assign on their own).
  // Generic English words that show up as tokens from nameEn (e.g. "Financial
  // Review", "Business Development") but are common enough in ANY business
  // transcript that matching them says little about which project it's
  // actually about. Weighted far below strong signals (id, full Thai name)
  // so e.g. "Financial" alone can't outscore a project whose id/name is
  // mentioned directly (the FIN-vs-ERP mismatch this list was added to fix).
  var WEAK_SUGGEST_WORDS = { all:1, project:1, review:1, section:1, sections:1, business:1, development:1,
    monthly:1, quarterly:1, meeting:1, overview:1, financial:1, highway:1 };
  function suggestProjectFor_(m, projects) {
    var text = (m.title + ' ' + stripHtml_(m.html || '')).toLowerCase();
    var best = null, bestScore = 0;
    projects.forEach(function (p) {
      var score = 0;
      // Strong signals: the project's own id, its short alias in parentheses
      // in nameEn (e.g. "Bang Toey Sections 1+2 (BT)" -> "BT" — the real
      // shorthand Fathom titles actually use), and its full name/nameEn as a
      // whole phrase — all specific enough that a match is meaningful.
      if (p.id && p.id.length >= 2 && text.indexOf(p.id.toLowerCase()) !== -1) score += 5;
      var alias = (p.nameEn || '').match(/\(([^)]+)\)/);
      if (alias && alias[1].length >= 2 && text.indexOf(alias[1].toLowerCase()) !== -1) score += 5;
      [p.name, p.nameEn].forEach(function (full) {
        full = (full || '').trim().toLowerCase();
        if (full.length >= 4 && text.indexOf(full) !== -1) score += 5;
      });
      // Weak signals: individual words split out of name/nameEn — only count
      // ones NOT in the generic-word list, and only worth a fraction each.
      (p.name || '').split(/[\s()+.,·\-]+/).concat((p.nameEn || '').split(/[\s()+.,·\-]+/))
        .map(function (t) { return t.trim().toLowerCase(); })
        .filter(function (t) { return t.length >= 3 && !WEAK_SUGGEST_WORDS[t]; })
        .forEach(function (t) { if (text.indexOf(t) !== -1) score += 1; });
      if (score > bestScore) { bestScore = score; best = p; }
    });
    return bestScore >= 2 ? best : null; // require more than one weak word alone
  }
  function stripHtml_(html) { var d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }

  /* ---------- In-app content editor ---------- */
  var EDIT_M = null;
  var ED_SNAPSHOT = null;

  /* ---------- Editor undo/redo ----------
     The browser's native undo stack only knows about typing and execCommand.
     This editor also changes the DOM directly (tick list, Enter-key list and
     heading splitting, sanitized paste), and those edits are invisible to it —
     which is why Ctrl+Z used to skip past them or do nothing. So the editor
     keeps its own history of the body HTML plus caret position, and Ctrl+Z /
     Ctrl+Y (and the toolbar buttons) replay it. Typing is coalesced: a run of
     keystrokes becomes one undo step once you pause, so undo moves in word-ish
     chunks rather than one character at a time. */
  var ED_UNDO = [], ED_REDO = [], ED_TYPING_TIMER = null, ED_RESTORING = false;
  var ED_UNDO_LIMIT = 200;

  // Caret as a character offset into the body's text, which survives the
  // innerHTML replacement that restoring a snapshot performs.
  // Character offset of the caret within the EDITABLE body.
  //
  // The print header (.ed-printhead) is excluded: it is display-only, and
  // syncPrintHeader_ deletes and recreates it on every pagination pass. Its
  // ~54 characters of letterhead and date would otherwise shift every offset,
  // so a caret saved before a pass landed somewhere else after it.
  function caretOffset_() {
    var area = el('edArea'), sel = window.getSelection();
    if (!sel || !sel.rangeCount || !area.contains(sel.anchorNode)) return null;
    var head = area.querySelector('.ed-printhead');
    if (head && head.contains(sel.anchorNode)) return null;   // caret is in the header
    var r = sel.getRangeAt(0);
    var pre = r.cloneRange();
    pre.selectNodeContents(area);
    pre.setEnd(r.endContainer, r.endOffset);
    var text = pre.toString();
    if (head) {
      // Discount the header's text, which always precedes the caret.
      var headLen = head.textContent.length;
      return Math.max(0, text.length - headLen);
    }
    return text.length;
  }
  // Counterpart to caretOffset_: walks the same text, skipping the display-only
  // print header so both sides measure the identical character sequence.
  function restoreCaret_(offset) {
    if (offset == null) return;
    var area = el('edArea');
    var head = area.querySelector('.ed-printhead');
    var walker = document.createTreeWalker(area, NodeFilter.SHOW_TEXT, null, false);
    var seen = 0, node;
    while ((node = walker.nextNode())) {
      if (head && head.contains(node)) continue;   // not part of the body text
      var len = node.nodeValue.length;
      // A `>= offset` test lands on the FIRST node that reaches the offset,
      // which for an exact boundary is the inter-block whitespace node rather
      // than the paragraph that follows it — the caret then appears on the
      // previous line. Skipping whitespace-only nodes at an exact boundary
      // puts it at the start of the real text instead.
      if (seen + len === offset && !node.nodeValue.trim()) { seen += len; continue; }
      if (seen + len >= offset) {
        var range = document.createRange();
        range.setStart(node, Math.max(0, Math.min(len, offset - seen)));
        range.collapse(true);
        var sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(range);
        return;
      }
      seen += len;
    }
  }
  // Record the current state as an undo point. Each entry is a full snapshot,
  // so it's safe to call either side of a change.
  function pushUndo_() {
    if (ED_RESTORING) return;
    var html = el('edArea').innerHTML;
    if (ED_UNDO.length && ED_UNDO[ED_UNDO.length - 1].html === html) return;
    ED_UNDO.push({ html: html, caret: caretOffset_() });
    if (ED_UNDO.length > ED_UNDO_LIMIT) ED_UNDO.shift();
    ED_REDO.length = 0;
    updateUndoButtons_();
  }
  function applyState_(state) {
    ED_RESTORING = true;
    el('edArea').innerHTML = state.html;
    restoreCaret_(state.caret);
    ED_RESTORING = false;
    updateUndoButtons_();
  }
  function editorUndo_() {
    if (ED_TYPING_TIMER) { clearTimeout(ED_TYPING_TIMER); ED_TYPING_TIMER = null; }
    if (!ED_UNDO.length) return;
    var current = { html: el('edArea').innerHTML, caret: caretOffset_() };
    // The top of the stack equals the current state when nothing was typed
    // since it was pushed; skip it so one Ctrl+Z always moves.
    var prev = ED_UNDO.pop();
    if (prev.html === current.html && ED_UNDO.length) prev = ED_UNDO.pop();
    ED_REDO.push(current);
    applyState_(prev);
    el('edArea').focus();
  }
  function editorRedo_() {
    if (!ED_REDO.length) return;
    ED_UNDO.push({ html: el('edArea').innerHTML, caret: caretOffset_() });
    applyState_(ED_REDO.pop());
    el('edArea').focus();
  }
  function updateUndoButtons_() {
    var u = el('edUndo'), r = el('edRedo');
    if (u) u.disabled = !ED_UNDO.length;
    if (r) r.disabled = !ED_REDO.length;
  }
  function resetUndo_() {
    ED_UNDO = []; ED_REDO = [];
    if (ED_TYPING_TIMER) { clearTimeout(ED_TYPING_TIMER); ED_TYPING_TIMER = null; }
    updateUndoButtons_();
  }

    if (ED_SNAPSHOT !== null && editorSnapshot_() !== ED_SNAPSHOT) {

      closeEditor();

  // Enter is handled with direct Range/DOM manipulation, NEVER execCommand
  // (2026-07-21 root-cause fix — see below for why). Two cases:
  //   1. Cursor inside a heading (H1-H6) -> split off a plain <p>, never
  //      continue the heading for the new line.
  //   2. Cursor inside a list item (LI, possibly nested) -> split that LI
  //      into two siblings at the cursor position, correctly in place.
  // Native contenteditable Enter behavior handles everything else (plain
  // paragraphs, bold/italic runs) correctly already, so this only intercepts
  // the two cases that were actually broken.
  //
  // WHY NOT execCommand (root cause, not a symptom patch): an earlier version
  // of this fix used document.execCommand('insertParagraph'/'formatBlock') for
  // case 1, which was fine on its own — but the SAME underlying browser
  // mechanism is what execCommand('insertHTML', ...) in the paste handler
  // below relies on, and browser vendors do NOT implement execCommand's
  // list-splitting consistently: MDN and the W3C editing spec both document
  // that Firefox/WebKit/IE each produce different, sometimes-broken HTML when
  // execCommand touches a nested <li> — execCommand was deprecated specifically
  // over this unreliability. That is exactly the bug reported 2026-07-21:
  // pressing Enter inside a nested bullet (e.g. under "ปัญหาและอุปสรรคโดยรวม:")
  // didn't split the line in place — it corrupted the list structure and the
  // new line landed at the very end of the whole list. Patching that one
  // symptom (e.g. "detect list items and special-case them") would still
  // leave execCommand doing the actual DOM surgery and could break again in

  // Tag every top-level block so it can be identified after pagination.
  function tagEditorBlocks_() {

    var n = 0;

      if (node.classList && (node.classList.contains('ed-pagebreak') ||

    });
  }

  /* Paginate a copy of the document off-screen and report which block starts
     each page. Runs in a hidden iframe so nothing touches the live editor. */
  function measureRealPageBreaks_(done) {
    var area = el('edArea');
    if (!area) return done([]);
    tagEditorBlocks_();

    // The document exactly as it will print: the same header the editor shows,
    // then the body. Anything present in one and not the other shifts breaks.
    var head = area.querySelector('.ed-printhead');
    var bodyHtml = (head ? head.innerHTML : '');
    Array.prototype.forEach.call(area.children, function (node) {
      if (node.classList && (node.classList.contains('ed-pagebreak') ||
                             node.classList.contains('ed-printhead'))) return;
      bodyHtml += node.outerHTML;
    });

    if (ED_MEASURE_FRAME) ED_MEASURE_FRAME.remove();
    var f = document.createElement('iframe');
    ED_MEASURE_FRAME = f;
    // Off-screen but fully laid out — display:none would give zero heights.
    f.style.cssText = 'position:fixed;left:-10000px;top:0;width:1000px;height:800px;border:0;visibility:hidden;';
    f.srcdoc = '<!DOCTYPE html><html><head><meta charset="utf-8">' +
      '<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">' +
      '<style>' + OVERRIDE_CSS + '</style></head><body>' + bodyHtml + PAGED_PREVIEW_JS + '</body></html>';

    var finished = false;

      if (finished) return;

        // Give up quietly after ~8s: the editor then simply shows no page
        // markers rather than showing wrong ones.
        if (!d || ++tries > 80) { clearInterval(poll); finish([]); return; }
        var count = d.querySelectorAll('.pagedjs_page').length;
        // Wait for the page count to SETTLE, not merely to become non-zero.
        // Paged.js adds pages progressively, so reading at first sight of a
        // page yields a partial layout — in testing that reported 2 pages for
        // a document that actually has 7.
        if (count > 0 && count === lastCount) {

        });
        finish(ids);
      }, 100);
    };
    document.body.appendChild(f);
  }

    var area = el('edArea');
    if (!area || !startIds.length) return;
    clearPageBreaks_(area);
    for (var i = 1; i < startIds.length; i++) {
      var node = area.querySelector('[data-edblock="' + startIds[i] + '"]');
      if (!node) continue;
      var brk = document.createElement('div');
      brk.className = 'ed-pagebreak';

      //
      // paginate_ only inserts/removes break elements BETWEEN blocks and
      // rebuilds the print header — it never edits text, so the browser keeps
      // the selection anchored to the same text node on its own.

      // Restoring it by character offset actively broke it: caretOffset_
      // counts every character in the editor, including the print header's
      // ~54 characters of letterhead and date. Since syncPrintHeader_ removes
      // and recreates that header on each run, an offset captured beforehand
      // was measured against different text than it was restored into — which
      // is why the caret sometimes jumped to the previous line after Enter.

  function editorHtmlForSave_() {
    var clone = el('edArea').cloneNode(true);
    // Both are display-only aids: page breaks, and the mirrored print header.
    // The header especially MUST NOT be saved — print prepends its own copy,

    Array.prototype.forEach.call(clone.querySelectorAll('.ed-pagebreak, .ed-printhead'), function (s) { s.remove(); });

  function selectedListItems_() {

    var range = sel.getRangeAt(0);

    // matching how Word applies list formatting to the current paragraph.

    // outer item whose nested sub-list happens to be selected must not be
    // ticked, which is what made the whole tree convert before.
    return Array.prototype.filter.call(area.querySelectorAll('li'), function (li) {
      if (!range.intersectsNode(li)) return false;
      return Array.prototype.some.call(li.childNodes, function (child) {
        if (child.nodeName === 'UL' || child.nodeName === 'OL') return false;
        if (child.nodeType === 3 && !child.nodeValue.trim()) return false;

      // is the ONLY situation in which this button may call execCommand.

      document.execCommand('insertUnorderedList', false, null);
      items = selectedListItems_();
      if (!items.length) { ED_UNDO.pop(); updateUndoButtons_(); el('edArea').focus(); return; }
      items.forEach(function (li) { li.classList.add('tick-list'); });
      el('edArea').focus();
      return;
    }

    // toggle the class on the selected rows and touch nothing else.

    // document — running insertUnorderedList on rows that are already a list
    // UNWRAPS them, lifting nested rows a level and destroying the indent.

    // turn let the next selection reach the heading above and tick it too.
    // Changing a marker must only change what is drawn, never where a row sits.
    pushUndo_();
    var allTicked = items.every(function (li) { return li.classList.contains('tick-list'); });
    items.forEach(function (li) { li.classList.toggle('tick-list', !allTicked); });

    // wrapper left by an earlier deletion), so re-assert the invariants.

  /* ---------- Edit history (one unified activity + version timeline) ---------- */

  var EH_MEETING_ID = null;
  var EH_MEETING = null; // full meeting object, for the preview header (title/date/project) — the editor only ever changes body HTML, not these fields, so they're accurate for "original" too in the common case
  function openEditHistory(m) {
    EH_MEETING_ID = m.id; EH_MEETING = m;
    el('ehList').innerHTML = '<div class="empty">Loading…</div>';
    el('ehBg').classList.add('show');
    // Everyone who can read the meeting sees the same activity trail.
    gs('getAuditHistory', m.id, TOKEN).then(renderEditHistory)
      .catch(function (e) { el('ehList').innerHTML = '<div class="empty">Failed: ' + esc(e.message || e) + '</div>'; });
  }
  /* One activity timeline: edits and comments interleaved in time order, so a

     that makes either of them meaningful, so they are merged here. */
  function renderEditHistory(entries) {
    // create_meeting/create_project etc. are the same originating event the
    // pinned "Original" row above already represents (with a guaranteed-
    // correct timestamp) — repeating it in the activity list just below
    // reads as if something were created after it was later edited.

    // Comments live on the meeting row; fold them into the same stream.

      return { kind: 'edit', when: e.when, who: e.who, label: e.action,
               seq: (e.details && e.details.versionSeq), text: '' };
    }).concat(comments.map(function (c) {
      return { kind: 'comment', when: c.createdAt, who: c.author, label: 'comment',
               seq: null, text: c.text || '', id: c.id };

    // actually happened — the "Original" row sits at the top as the first

    stream.sort(function (a, b) { return new Date(a.when) - new Date(b.when); });

    var createdWhen = EH_MEETING && EH_MEETING.createdAt ? new Date(EH_MEETING.createdAt).toLocaleString() : '';
    var originalRow = '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0 13px;border-bottom:2px solid var(--line);margin-bottom:4px;font-size:13px;">' +
      '<span><b>Original</b><br><span style="color:var(--ink-faint);font-size:11.5px;">' +
      (createdWhen ? 'Created ' + esc(createdWhen) : 'The first saved version of this meeting') + '</span></span>' +
      // Same rule as the per-entry View button: the stored draft is admin-only.
      (BOOTSTRAP.isAdmin ? '<button type="button" class="dbtn primary" id="ehViewOriginal">View Original</button>' : '') +
      '</div>';

      var canView = BOOTSTRAP.isAdmin && e.kind === 'edit' && e.seq !== undefined && e.seq !== null;

        '<span style="min-width:0;"><b>' + icon + esc(e.label) + '</b> · ' + esc(e.who) +

  }
  function openOriginalPreview(meetingId) {

  var VP_FRAME = null; // the currently-shown preview iframe, so the Print button can reach it

    // the PDF save-dialog filename (that's unfixable from inside Apps
    // Script's IFRAME sandbox — see d_print's comment for the full reason).
    var vpPdfTitle = (title || 'Meeting').replace(/[\\/:*?"<>|]/g, '').trim() || 'Meeting';
    frame.srcdoc = '<!DOCTYPE html><html><head><meta charset="utf-8">' +
      '<title>' + esc(vpPdfTitle) + '</title>' +
      '<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">' +
      '<style>' + OVERRIDE_CSS + '</style>' + (vpIsDark ? '<style>' + DARK_OVERRIDE_CSS + '</style>' : '') +
      '</head><body>' + header + vpDisclaimer + (result.html || '<p>(empty)</p>') + '</body></html>';
  }
  function openVersionPreview(meetingId, seq) {
    el('vpBody').innerHTML = '<div class="empty">Loading…</div>';
    el('vpBg').classList.add('show');
    gs('getVersionContent', meetingId, seq, TOKEN).then(renderVersionPreviewHtml)
      .catch(function (e) { el('vpBody').innerHTML = '<div class="empty">Failed: ' + esc(e.message || e) + '</div>'; });
  }
  function closeVersionPreview() { el('vpBg').classList.remove('show'); VP_FRAME = null; }
  if (el('vpClose')) el('vpClose').onclick = closeVersionPreview;
  if (el('vpBg')) el('vpBg').onclick = function (e) { if (e.target === el('vpBg')) closeVersionPreview(); };
  if (el('vpPrint')) el('vpPrint').onclick = function () {
    if (!VP_FRAME) return;
    try { VP_FRAME.contentWindow.focus(); VP_FRAME.contentWindow.print(); } catch (e) { window.print(); }
  };
  function closeEditHistory() { el('ehBg').classList.remove('show'); }
  if (el('ehClose')) el('ehClose').onclick = closeEditHistory;
  if (el('ehBg')) el('ehBg').onclick = function (e) { if (e.target === el('ehBg')) closeEditHistory(); };

  /* ---------- Search ---------- */
  // Instant client-side filter covers title/date/excerpt/attendees from the
  // already-loaded list. A debounced server call additionally searches full
  // meeting content (transcripts/summaries/Doc bodies) — catches a name or
  // term that's in the body but didn't make it into the 200-char excerpt.
  var searchTimer = null;
  el('search').addEventListener('input', function (e) {
    S.query = e.target.value;
    var q = S.query.trim();
    // searching=true as soon as a query is pending a deep-search round trip,
    // so renderList() can show "Searching…" instead of a final-looking count
    // — otherwise the instant client-side filter's smaller count (title/date/
    // excerpt/attendees only) looks like the final answer, then silently
    // jumps once the full-content server search lands ~350ms later, which
    // reads as the list being wrong rather than still loading.
    S.searching = !!q && !S.searchMatchIds[q];
    renderList();
    if (isMobile() && S.query) setMobilePane('list');
    if (searchTimer) clearTimeout(searchTimer);
    if (!q || S.searchMatchIds[q]) return;
    searchTimer = setTimeout(function () {
      if (S.query.trim() !== q) return; // stale — a newer keystroke superseded this
      gs('searchMeetings', q, TOKEN).then(function (ids) {
        var map = {}; (ids || []).forEach(function (id) { map[id] = true; });
        S.searchMatchIds[q] = map;
        if (S.query.trim() === q) { S.searching = false; renderList(); }
      }).catch(function () { if (S.query.trim() === q) { S.searching = false; renderList(); } });
    }, 350);
  });

  /* ---------- Boot ---------- */
  function refreshAll() {
    return Promise.all([gs('getSessionState', TOKEN), gs('listMeetings', TOKEN)]).then(function (res) {
      BOOTSTRAP = res[0]; S.meetings = Array.isArray(res[1]) ? res[1] : [];
      S.loaded = true;
      setCachedMeetings(S.meetings);
      el('who').textContent = (BOOTSTRAP.user || '') + (BOOTSTRAP.isAdmin ? ' · admin' : (BOOTSTRAP.isEditor ? ' · editor' : ''));
      applyAdminUI();
      renderProjects(); renderList();
    });
  }

  /* ---------- Share links ---------- */
  function shareLink(id) {
    var base = (BOOTSTRAP.execUrl || '').split('?')[0];
    if (!base) { window.prompt('Copy this meeting ID:', id); return; }
    var link = base + '?meeting=' + encodeURIComponent(id);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(function () { toast('Share link copied to clipboard'); }, function () { window.prompt('Copy this link to share:', link); });
    } else { window.prompt('Copy this link to share:', link); }
  }

  // Project permalink: unlike shareLink() above (which points at one fixed
  // meeting), this always resolves to whatever meeting is CURRENTLY latest
  // in the project at the time the link is opened (see startApp's
  // pendingProjectId handling) — paste once, reuse forever.
  function shareProjectLink(projectId) {
    var base = (BOOTSTRAP.execUrl || '').split('?')[0];
    if (!base) { window.prompt('Copy this project ID:', projectId); return; }
    var link = base + '?project=' + encodeURIComponent(projectId);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(function () { toast('Latest-meeting link copied to clipboard'); }, function () { window.prompt('Copy this link to share (always opens the latest meeting):', link); });
    } else { window.prompt('Copy this link to share (always opens the latest meeting):', link); }
  }

  // Anti-tampering QR stamp for printed/PDF output — encodes the exact same
  // live share link as shareLink() above, so scanning a printed page opens
  // the current, authoritative version of that meeting on the web app.
  // One static QR per meeting (keyed on id, not on doc content/version), so
  // re-printing after an edit reuses the same code rather than minting a
  // new one per revision, per explicit requirement.
  function verifyQrDataUri_(id) {
    var base = (BOOTSTRAP.execUrl || '').split('?')[0];
    if (!base || typeof qrcode !== 'function') return '';
    var link = base + '?meeting=' + encodeURIComponent(id);
    var qr = qrcode(0, 'M');
    qr.addData(link);
    qr.make();
    var svg = qr.createSvgTag({ cellSize: 4, margin: 4 });
    // createSvgTag emits width="{N}px" height="{N}px" sized to the actual
    // module count (varies with URL length) alongside a viewBox of the same
    // size. Force the OUTER width/height to a fixed 60x60 — confirmed via
    // real Chrome print-preview testing that @page{@top-right} margin-box
    // images render at the SOURCE SVG's own intrinsic width/height XML
    // attributes (not any CSS override, which real Chrome ignores for this
    // rule) — while leaving viewBox alone so the QR pattern itself still
    // scales down correctly to fit that fixed size, whatever its native
    // module count is.
    svg = svg.replace(/width="[\d.]+px" height="[\d.]+px"/, 'width="60" height="60"');
    return 'data:image/svg+xml;base64,' + btoa(svg);
  }

  /* ---------- Boot ---------- */
  function hideBootLoader() { var b = el('bootLoader'); if (b) b.classList.add('hide'); }

  function startApp(pendingMeeting, pendingProject) {
    PENDING_MEETING = pendingMeeting || null;
    var pendingProjectId = pendingProject || null;
    initHeader(); renderProjects();
    // Apply persisted language to all static labels (theme is already applied by head script).
    applyLangStrings();
    // Shared link on mobile: jump straight to the detail pane (with a spinner) so the
    // home/projects pane never flashes. Normal loads reveal their pane immediately.
    if ((PENDING_MEETING || pendingProjectId) && isMobile()) {
      setMobilePane('detail');
      el('detailContent').innerHTML = '<div class="placeholder"><div class="spin" style="border-color:#ccc;border-top-color:#0b3d62"></div><div>Loading…</div></div>';
    } else {
      hideBootLoader();
    }
    // Hydrate meetings from cache so the Latest tiles paint instantly — fresh
    // data from listMeetings replaces this within a few hundred ms.
    var cached = getCachedMeetings();
    if (cached.length) { S.meetings = cached; renderMobileLatest(); }
    else if (isMobile()) { renderMobileLatestSkeleton(); }
    el('cards').innerHTML = '<div class="empty"><span class="spin" style="border-color:#ccc;border-top-color:#0b3d62"></span><br><br>Loading…</div>';
    Promise.all([gs('getSessionState', TOKEN), gs('listMeetings', TOKEN)]).then(function (res) {
      BOOTSTRAP = res[0]; S.meetings = Array.isArray(res[1]) ? res[1] : [];
      S.loaded = true;
      setCachedMeetings(S.meetings);
      // ?project=<id> permalink: switch to THIS project BEFORE the first
      // renderProjects()/renderList() below, so the sidebar highlight and list
      // header land on the project tab immediately — not on 'ALL' (its default)
      // with only the detail pane correct. Previously this was set after that
      // first render, so the sidebar never got the correct highlight since
      // nothing re-rendered it once S.activeProject changed.
      if (pendingProjectId) { S.activeProject = pendingProjectId; }
      chooseDefaultRange(); initHeader(); renderProjects(); renderMobileLatest();
      renderList();
      // If the user already tapped into a meeting from the cached "Latest" tiles
      // while this boot fetch was still in flight (S.activeId gets set by
      // openMeeting), don't clobber that navigation — just let the detail pane's
      // own getMeeting() call finish loading it. Without this guard, a fast tap
      // during load would flash into the meeting and then snap straight back to
      // the home pane the instant listMeetings/getSessionState resolved.
      if (PENDING_MEETING) { openMeeting(PENDING_MEETING); }
      else if (pendingProjectId) {
        // Always resolve to THIS project's current latest meeting, computed
        // fresh from the just-loaded meeting list — never a stored meeting id,
        // so the same link keeps pointing at whatever is newest each time
        // it's opened.
        var latest = projectLatest(pendingProjectId, 1)[0];
        if (latest) { openMeeting(latest.id); } else { S.activeId = null; renderProjectDashboard(); }
      }
      else if (!S.activeId) { renderDashboard(); }
      if (isMobile() && !S.activeId) { setMobilePane(pendingProjectId ? 'list' : 'projects'); }
      hideBootLoader();
      prefetchLatest();     // warm summaries so project tabs open instantly
    }).catch(function (e) { hideBootLoader(); el('cards').innerHTML = '<div class="empty">Failed to load: ' + esc(e.message || e) + '</div>'; });
  }

  // SERVER_PENDING_MEETING_ID (set in Index.html from doGet's e.parameter.meeting,
  // synchronously, at render time) replaces the old google.script.url.getLocation()
  // + 2-second-timeout race (2026-07-22 fix — see doGet's comment in Code.js for
  // why that was silently dropping ?meeting= links on a slow/cold page load).
  startApp(SERVER_PENDING_MEETING_ID || null, SERVER_PENDING_PROJECT_ID || null);
})();
</script>
