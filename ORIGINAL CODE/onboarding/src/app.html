        /* VCB's own drop continues past its card's top, all the way down
           to the Subsidiaries/Joint Ventures fork below (bottomY) — it's
           the only one of the three with anything branching further
           beneath it. VPO/Holding's dashed drops stop at their own card's
           top; nothing continues under them. */
        var dropBottom = f.dashed ? cardTopY : bottomY;
        var drop = document.createElement('div');
        drop.className = 'org-branch-drop' + (f.dashed ? ' group-family-connector' : '');
        drop.style.left = ((f.centerX - 1) / zoom) + 'px';
        drop.style.top = (topY / zoom) + 'px';
        drop.style.width = '2px';
        drop.style.height = Math.max((dropBottom - topY) / zoom, 2) + 'px';
        frame.appendChild(drop);
      });
    });
  }

  /* Org Chart / Group Structure toggle (see the 'orgchart' case in
     renderSectionContent above) — separate from initOrgChart's
     [data-org-chart] loop since the group-structure panel has no
     click-to-expand teams to wire, just a show/hide switch between the two
     already-rendered panels. Both panels stay in the DOM at all times;
     toggling only flips which one has .org-view-active (display handled in
     styles.html), so switching is instant with no re-render or data
     re-fetch. */
  function initOrgViewToggle(container) {
    container.querySelectorAll('.org-view-toggle').forEach(function (toggle) {
      if (toggle.dataset.wired) return;
      toggle.dataset.wired = '1';
      var wrap = toggle.closest('.org-view-toggle-wrap');
      var panels = wrap && wrap.parentElement ?
        wrap.parentElement.querySelectorAll('[data-org-view-panel]') : [];
      toggle.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-org-view]');
        if (!btn) return;
        var view = btn.getAttribute('data-org-view');
        toggle.querySelectorAll('.seg-btn').forEach(function (b) {
          b.classList.toggle('active', b === btn);
        });
        panels.forEach(function (panel) {
          panel.classList.toggle('org-view-active', panel.getAttribute('data-org-view-panel') === view);
        });
        /* Group Structure's rows (.group-entity-row/.group-jv-row) sit in a
           panel that's display:none (see [data-org-view-panel] in
           styles.html) until this toggle switches it in — renderOrgConnectors
           ran once already on initial page render, but at that point this
           panel measured clientWidth/offsetTop as 0 for everything inside
           it (a hidden element's layout box collapses), producing degenerate
           zero-sized connectors that never got corrected since nothing
           re-measured them afterward. Re-running now, with the panel
           actually visible, gives it real geometry to work from.
           A single synchronous call here was still occasionally stale —
           reported directly ("the trees are unaligned... from when we
           expanded the ones for the organizational chart"): after the Org
           Chart's own zoom/full-width breakout was added, this panel's
           display:none -> block switch didn't always finish reflowing in
           the exact same synchronous tick this ran in, so a fork bar/drop
           could get drawn against a layout that was still mid-transition
           (same class of bug refreshConnectors, above, already guards
           against for the Org Chart side with its own second delayed
           pass). Mirrors that same fix here — one immediate call plus one
           after a short delay to catch whatever the first one might have
           measured too early. */
        renderOrgConnectors(wrap.parentElement);
        setTimeout(function () { renderOrgConnectors(wrap.parentElement); }, 100);
      });
    });
  }

  function renderHero(hero) {
    if (!hero) return '';
    var photoStyle = hero.photo ? ' style="--hero-photo:url(\'' + hero.photo + '\')"' : '';
    var html = '<div class="hero' + (hero.photo ? ' has-photo' : '') + '"' + photoStyle + '>';
    html += '<div class="hero-inner">';
    if (hero.eyebrow) html += '<div class="hero-eyebrow">' + esc(t(hero.eyebrow)) + '</div>';
    html += '<h1>' + esc(t(hero.title)) + '</h1>';
    if (hero.subtitle) html += '<div class="subtitle">' + esc(t(hero.subtitle)) + '</div>';
    if (hero.lead) html += '<p class="lead">' + esc(t(hero.lead)) + '</p>';
    if (hero.note) html += '<div class="note">' + esc(t(hero.note)) + '</div>';
    if (hero.cta) html += '<a class="cta" href="' + pageUrl(hero.cta.page) + '" data-link="' + hero.cta.page + '">' + esc(t(hero.cta.label)) + '</a>';
    html += '</div></div>';
    return html;
  }

  function renderSection(sec, pageKey, blockIndex) {
    return renderSectionContent(sec, pageKey, blockIndex);
  }

  function renderSectionContent(sec, pageKey, blockIndex) {
    var bandClass = sec.band ? ' band-' + sec.band : '';
    var centeredClass = sec.centered !== false ? ' centered' : '';
    var idAttr = sec.sectionId ? ' id="' + esc(sec.sectionId) + '"' : '';
    var out = '<section' + idAttr + ' class="block' + bandClass + centeredClass + '"><div class="section-inner">';
    if (sec.eyebrow) out += '<div class="section-eyebrow">' + esc(t(sec.eyebrow)) + '</div>';
    if (sec.heading) out += '<h2>' + esc(t(sec.heading)) + '</h2>';
    if (sec.subheading) out += '<div class="subheading">' + esc(t(sec.subheading)) + '</div>';

    switch (sec.type) {
      case 'text':
        out += '<div class="section-inner-narrow">';
        out += nl2p(sec.body);
        if (sec.bullets) out += ul(sec.bullets);
        if (sec.footer) out += '<div class="list-footer">' + esc(t(sec.footer)) + '</div>';
        if (sec.image) out += sec.image;
        if (sec.link) {
          if (sec.link.url) {
            /* Real external URL (e.g. the orientation schedule PDF once
               matched via matchAndLinkRequiredDocuments in Code.gs) —
               opens in a new tab, same as a real doc link. */
            out += '<p><a class="feature-link" href="' + esc(sec.link.url) + '" target="_blank" rel="noopener">' + esc(t(sec.link.label)) + ' &rarr;</a></p>';
          } else if (sec.link.placeholder) {
            out += docLink(sec.link.label);
          } else {
            out += '<p><a class="feature-link" href="' + pageUrl(sec.link.page) + '" data-link="' + sec.link.page + '">' + esc(t(sec.link.label)) + ' &rarr;</a></p>';
          }
        }
        out += '</div>';
        /* org chart is genuinely wide content — render it outside the 760px
           narrow column instead of squashed inside it. */
        if (sec.orgChart) out += renderOrgChart();
        break;

      case 'quote':
        out += '<div class="quote-card">';
        if (sec.portrait) out += '<img class="quote-portrait" src="' + sec.portrait + '" alt="' + esc(sec.attribution) + '">';
        out += '<blockquote>&ldquo;' + esc(t(sec.quote)) + '&rdquo;</blockquote>' +
               '<cite>&mdash; ' + esc(t(sec.attribution)) + '</cite></div>';
        break;

      case 'values':
        out += '<div class="values-grid">' + sec.values.map(function (v) {
          var iconHtml = '<img class="value-icon" src="' + v.icon + '" alt="' + esc(t(v.name)) + '" loading="lazy">';
          return '<div class="value-card">' + iconHtml + '<h3>' + esc(t(v.name)) + '</h3><p>' + esc(t(v.body)) + '</p>' +
                 ul(v.bullets) + '<p class="footer-note">' + esc(t(v.footer)) + '</p></div>';
        }).join('') + '</div>';
        break;

      case 'trackrecord':
        out += renderCarousel(sec.slides, pageKey + '-' + blockIndex);
        break;

      case 'feature':
        /* image is optional — sections like Company Structure are
           conceptual (a link to an org chart), not a photo moment, so
           forcing an image (a portrait headshot stretched into this wide
           landscape slot looked wrong) isn't always right. Without one,
           .feature-card.no-image collapses to a single centered column
           instead of leaving an empty second grid cell. */
        out += '<div class="feature-card' + (sec.image ? '' : ' no-image') + '">' + (sec.image || '') +
               '<div class="feature-text"><h3>' + esc(t(sec.title)) + '</h3><p>' + esc(t(sec.body)) + '</p>' +
               '<a class="feature-link" href="' + pageUrl(sec.link.page) + '" data-link="' + sec.link.page + '">' + esc(t(sec.link.label)) + '</a></div></div>';
        break;

      case 'featuregrid':
        out += '<div class="feature-grid" style="--feature-grid-cols:' + sec.features.length + '">' + sec.features.map(function (f) {
          var media = f.image || (f.icon ? '<div class="feature-tile-icon">' + icon(f.icon) + '</div>' : '');
          var bodyIdAttr = f.bodyId ? ' id="' + esc(f.bodyId) + '"' : '';
          var linkHtml = f.link ? '<a class="feature-link" href="' + pageUrl(f.link.page) + '" data-link="' + f.link.page + '">' + esc(t(f.link.label)) + '</a>' : '';
          return '<div class="feature-tile' + (f.image ? '' : ' no-image') + '">' + media +
                 '<div class="feature-tile-text"><h3>' + esc(t(f.title)) + '</h3><p' + bodyIdAttr + '>' + esc(t(f.body)) + '</p>' +
                 linkHtml + '</div></div>';
        }).join('') + '</div>';
        if (sec.externalCta) {
          out += '<div class="external-cta-row">' +
            '<button type="button" class="external-cta-btn secondary" onclick="openCompletionCertificate()">' +
              icon('document') + esc(t('Print Completion Form')) +
            '</button>' +
            '<a class="external-cta-btn" href="' + sec.externalCta.url + '" target="_top">' +
              esc(t(sec.externalCta.label)) + icon('chevronRight') +
            '</a>' +
          '</div>';
        }
        break;

      case 'list':
        out += '<div class="section-inner-narrow">';
        if (sec.intro) out += '<p class="list-intro">' + esc(t(sec.intro)) + '</p>';
        out += ul(sec.items);
        if (sec.footer) out += '<div class="list-footer">' + esc(t(sec.footer)) + '</div>';
        out += '</div>';
        break;

      case 'checklist':
        /* Senior-only items (sr(...) in content.html) are simply absent from
           the DOM for a Junior-track employee — not shown-but-disabled — so
           the progress bar's total and the checklist itself only ever count
           what that employee actually needs to complete. Each item keeps its
           ORIGINAL index i for its task id regardless of whether it got
           filtered out, matching how getPageTaskIds/getPageBlockTaskIds in
           progress.html compute the same ids — otherwise a Junior's saved
           checkbox state would silently point at the wrong item if they're
           later promoted to Senior and the full list renders.
           Phase pages the employee is allowed to VIEW but hasn't reached
           yet in order (see isPhasePageUnlocked in progress.html) still
           render their checklist in full — nothing is hidden — but each
           checkbox is disabled so tasks can only be ticked off in sequence;
           performToggle in progress.html enforces the same rule server-side
           of the click, this is just the initial pre-JS visible state
           (initChecklists reconfirms/reapplies the same disabled state once
           progress has actually loaded, so this only matters before that
           resolves — it doesn't render its own lock explanation banner
           here, since that would repeat once per checklist block on a page
           with several; see renderPhaseLockNotice in progress.html for the
           single page-level banner that explains why). */
        var pageLocked = pageKey && !isPhasePageUnlocked(pageKey);
        var visibleItems = sec.items.filter(isItemVisible);
        out += '<div class="section-inner-narrow checklist-group">';
        out += '<div class="progress-bar"><div class="progress-bar-track"><div class="progress-bar-fill" style="width:0%"></div></div>' +
               '<span class="progress-bar-label">0 / ' + visibleItems.length + ' ' + esc(t('complete')) + '</span></div>';
        out += '<ul class="check-list">' + visibleItems.map(function (item) {
          var taskId = itemId(item);
          var isSenior = itemLevel(item) === 'senior';
          return '<li class="check-item' + (isSenior ? ' senior-task' : '') + (pageLocked ? ' locked' : '') + '"><label>' +
                 '<input type="checkbox" data-task-id="' + taskId + '" onclick="toggleTask(\'' + taskId + '\', this)"' + (pageLocked ? ' disabled' : '') + '>' +
                 '<span class="check-item-text">' + esc(t(itemText(item))) +
                 (isSenior ? ' <span class="senior-badge">' + esc(t('Senior')) + '</span>' : '') +
                 '</span></label></li>';
        }).join('') + '</ul>';
        if (sec.footer) out += '<div class="list-footer">' + esc(t(sec.footer)) + '</div>';
        out += '</div>';
        break;

      case 'doclist':
        if (sec.intro) out += '<p class="doclist-intro">' + esc(t(sec.intro)) + '</p>';
        out += '<div class="doc-grid">' + sec.docs.map(function (d) {
          return docCard(d);
        }).join('') + '</div>';
        break;

      case 'deptgrid':
        if (sec.intro) out += '<p class="deptgrid-intro">' + esc(t(sec.intro)) + '</p>';
        out += '<div class="dept-grid">' + sec.depts.map(function (d, di) {
          var thumb = '<span class="dept-card-icon" aria-hidden="true">' + icon(d.icon) + '</span>';
          var descHtml = d.desc ? '<span class="dept-card-desc">' + esc(t(d.desc)) + '</span>' : '';
          var leadHtml = d.lead ? '<span class="dept-card-lead"><span class="dept-card-lead-label">' + esc(t('Led by')) + '</span>' + esc(t(d.lead)) + '</span>' : '';
          var focusHtml = d.focus ? '<span class="dept-card-focus"><span class="dept-card-focus-label">' + esc(t('Focus')) + '</span>' + esc(t(d.focus)) + '</span>' : '';
          var num = '<span class="dept-card-num">' + String(di + 1).padStart(2, '0') + '</span>';
          return '<a class="dept-card" href="' + pageUrl(d.page) + '" data-link="' + d.page + '" data-dept-id="' + d.deptId + '">' +
                 num + thumb +
                 '<span class="dept-card-label">' + esc(t(d.label)) + '</span>' + descHtml +
                 '<span class="dept-card-meta">' + leadHtml + focusHtml + '</span>' +
                 '<span class="dept-card-cta">' + esc(t('Choose this department')) + icon('chevronRight') + '</span>' +
                 '</a>';
        }).join('') + '</div>';
        if (sec.footer) out += '<p class="deptgrid-footer">' + esc(t(sec.footer)) + '</p>';
        break;

      case 'levelpicker':
        /* Junior/Senior segmented control, same visual language as the
           existing language/theme toggles in the settings panel (.seg/.seg-
           btn, see Index.html). data-level (not data-link) so it doesn't get
           swept up by the generic [data-link] click handler — wired
           separately in initLevelPicker, called after this HTML lands in
           the DOM (see renderPage in this file). */
        var currentLevel = getEmployeeLevel();
        out += '<div class="section-inner-narrow level-picker" id="level-picker">' +
          '<p class="level-picker-intro">' + esc(t('Junior tasks cover the core baseline. Senior adds extra tasks on top, marked in amber.')) + '</p>' +
          '<div class="seg level-picker-seg" id="level-control">' +
            '<button type="button" data-level="junior" class="seg-btn' + (currentLevel === 'junior' ? ' active' : '') + '">' + esc(t('Junior')) + '</button>' +
            '<button type="button" data-level="senior" class="seg-btn' + (currentLevel === 'senior' ? ' active' : '') + '">' + esc(t('Senior')) + '</button>' +
          '</div>' +
        '</div>';
        break;

      case 'phaselinks':
        /* Every phase page is always a real link — an employee can freely
           browse ahead to Day 61-90 material or back to Day 1-30 without
           hitting a wall, since Department Selection is already gated on
           Required Documents before any phase page is reachable at all.
           Ticking off a phase's own tasks is still sequential though (see
           isPhasePageUnlocked in progress.html): a phase card is "locked"
           when it isn't done AND the previous phase isn't done either,
           which gets its own dimmer/lock-icon treatment so the employee is
           steered toward the chronological first incomplete phase without
           being blocked from previewing later ones. "current" (the
           brightest, most inviting state) is specifically the first
           not-yet-done phase in order — the one the employee should
           actually be working on next. */
        out += '<div class="phase-grid">' + sec.phases.map(function (p) {
          var done = isPagePhaseComplete(p.page);
          var unlocked = done || isPhasePageUnlocked(p.page);
          var stateIcon = done ? icon('check') : (unlocked ? '' : icon('lock'));
          var stateClass = done ? ' done' : (unlocked ? ' current' : ' locked');
          return '<a class="phase-card' + stateClass + '" href="' + pageUrl(p.page) + '" data-link="' + p.page + '">' +
            '<span class="phase-card-label">' + esc(t(p.label)) + '</span>' +
            (stateIcon ? '<span class="phase-card-icon">' + stateIcon + '</span>' : '') +
          '</a>';
        }).join('') + '</div>';
        break;

      case 'orgchart':
        /* Interactive org chart, laid out as a real tree matching the
           company's actual chart: Leadership sits alone at the top center,
           a connecting line runs down to a horizontal bar spanning the two
           clearly separated bands below it — Head Office (every functional
           department plus Administration, all on the same plane), then
           Project Managers (own band, like the site/HQ split in the source
           chart). Every node (Leadership included) uses the same gradual
           inline drill-down: click a node to slide its people open beneath
           it in place (no pop, no swap); click a person to reveal their
           role text the same way, at which point every OTHER top-level
           node fades out to narrow focus onto just the one open. A "Back to
           All Teams" control (visible only while focused) restores the
           full tree. See initOrgChart in this file for the underlying
           expand/collapse and orgTeamNodeHtml/orgLeadershipNodeHtml above
           for each node's markup.
           Two extra behaviors layered on top of that base mechanic:
           - Head Office's own label is a button (data-org-expand-all) that
             expands/collapses every department underneath it at once,
             independent of (and in addition to) each department's own
             individual click-to-expand.
           - Project Sites' label works exactly the same way, over the 6
             project cards (orgProjectNodeHtml above) — there's no
             intermediate "Project Managers" node to click through first;
             the projects render directly in this segment's .org-team-row,
             same as Head Office's departments. Each project still expands
             into its own ~20-person crew, shown as a compact grid rather
             than one long vertical list, when clicked individually. */
        /* View toggle — Org Chart (roles/people within Vichitbhan, the
           existing tree below) vs Group Structure (Vichitbhan's position
           relative to its subsidiaries/JV partners, see
           renderGroupStructureHtml below) — two different axes of
           "structure", switched via the same .seg/.seg-btn segmented
           control already used for language/theme/level elsewhere in this
           app. Both views' markup is always in the DOM; the toggle just
           shows/hides via .org-view-active (see initOrgChart's view-toggle
           wiring) rather than re-rendering, since there's nothing async or
           per-employee about either view. */
        out += '<div class="org-view-toggle-wrap">' +
          '<div class="seg org-view-toggle" id="org-view-toggle">' +
            '<button type="button" data-org-view="chart" class="seg-btn active">' + esc(t('Org Chart')) + '</button>' +
            '<button type="button" data-org-view="group" class="seg-btn">' + esc(t('Group Structure')) + '</button>' +
          '</div>' +
        '</div>';
        out += '<div class="org-view-panel-wrap org-view-active" data-org-view-panel="chart">' +
          (sec.chartSubheading ? '<div class="subheading">' + esc(t(sec.chartSubheading)) + '</div>' : '') +
          '<div class="org-chart" data-org-chart>' +
            '<button type="button" class="org-back-btn" data-org-back>' + icon('chevronLeft') + esc(t('Back to All Teams')) + '</button>' +
            '<div class="org-tree">' +
              '<div class="org-tree-top">' + orgLeadershipNodeHtml(sec.leadership) + '</div>' +
              '<div class="org-tree-trunk"></div>' +
              '<div class="org-tree-branches">' +
                '<div class="org-segment org-segment-departments" data-org-expand-group>' +
                  '<button type="button" class="org-segment-label org-segment-label-btn" data-org-expand-all>' + esc(t('Head Office')) + '</button>' +
                  '<div class="org-team-row">' +
                    sec.departments.map(orgTeamNodeHtml).join('') +
                    orgTeamNodeHtml(sec.administration) +
                  '</div>' +
                '</div>' +
                '<div class="org-segment org-segment-pm" data-org-expand-group>' +
                  '<button type="button" class="org-segment-label org-segment-label-btn" data-org-expand-all>' + esc(t('Project Sites')) + '</button>' +
                  '<div class="org-team-row">' + sec.projectManagers.projects.map(function (p) { return orgProjectNodeHtml(p, sec.departments); }).join('') + '</div>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
        if (sec.groupStructure) out += renderGroupStructureHtml(sec.groupStructure, sec.groupSubheading);
        break;

      case 'teamgroup':
        /* Flip card: front shows avatar + name (identical to before), back
           reveals a one-line role blurb on hover/focus, or on tap for touch
           devices (see .team-member.flipped in app.html's click handler and
           the touch-only CSS fallback in styles.html). tabindex + role/aria
           make the flip reachable by keyboard, not just mouse hover. */
        out += '<div class="team-members">' +
              sec.members.map(function (m) {
                var name = typeof m === 'string' ? m : m.name;
                var role = typeof m === 'string' ? '' : (m.role || '');
                var initials = name.replace(/^(Mr\.|Mrs\.|Ms\.)\s*/, '').split(' ').slice(0,2).map(function(w){return w[0];}).join('');
                return '<div class="team-member" tabindex="0" role="button" aria-label="' + esc(name) + (role ? ': ' + esc(role) : '') + '">' +
                  '<div class="team-member-face team-member-front">' +
                    '<div class="team-avatar">' + esc(initials) + '</div>' +
                    '<span class="team-member-name">' + esc(name) + '</span>' +
                  '</div>' +
                  (role ? '<div class="team-member-face team-member-back"><span class="team-member-role">' + esc(t(role)) + '</span></div>' : '') +
                '</div>';
              }).join('') + '</div>';
        break;

      case 'gallery':
        out += '<div class="section-inner-narrow">';
        if (sec.body) out += '<p>' + esc(t(sec.body)) + '</p>';
        out += '</div>';
        if (sec.images && sec.images.length) {
          /* Each image entry is either a plain URL string (old shape, still
             supported — used by the 2-photo topic sections above, which
             already have their own shared heading/body) or an
             { image, caption } object with its own caption shown under
             that specific photo — used by the single-photo "site
             facilities" entries (Navigation Lock, Power House Unit, etc.),
             which used to each be their own full-width gallery section
             (one image stretched edge to edge, no room for anything
             alongside it) and are now one shared gallery-grid tile row
             instead, 4 per row, each labeled individually. */
          out += '<div class="gallery-grid">' + sec.images.map(function (item) {
            /* Plain string entries (the existing 2-photo topic sections —
               Safety Talk, Tool Box Talk, etc.) never get a per-image
               caption box, same as before this change — only { image,
               caption } object entries do (the merged single-photo "site
               facilities" gallery). */
            if (typeof item === 'string') {
              return '<img class="content-image" src="' + item + '" alt="' + esc(t(sec.heading)) + '" loading="lazy">';
            }
            var imgHtml = '<img class="content-image" src="' + item.image + '" alt="' + esc(t(item.caption || sec.heading)) + '" loading="lazy">';
            return item.caption ?
              '<div class="gallery-tile">' + imgHtml + '<div class="gallery-tile-caption">' + esc(t(item.caption)) + '</div></div>' :
              imgHtml;
          }).join('') + '</div>';
        }
        break;
    }
    out += '</div></section>';
    return out;
  }

  /* Bottom-of-page phase trail — replaces the old Back/Next link pair.
     Shows all 3 phases of the current department (Day 1-30 / 31-60 / 61-90)
     as a row of color-coded pills instead of only ever exposing one
     direction at a time, so jumping to ANY phase — earlier, current, or
     later — is always one click, in any order to VIEW; ticking off a
     phase's own tasks is still sequential (see isPhasePageUnlocked in
     progress.html), which is what "locked" reflects below. "current" is
     specifically the phase page actually being viewed right now (per
     explicit request), not the sidebar's "next incomplete phase" — those
     two can differ when revisiting an already-completed earlier phase, or
     jumping ahead to a later one, and this row should still mark that one
     as current since that's where the employee actually is. */
  function renderPhaseTrail(pageKey) {
    var chain = (typeof getFullPhaseChain === 'function') ? getFullPhaseChain(pageKey) : [];
    if (chain.length < 2) return '';
    var dayRanges = ['Day 1–30', 'Day 31–60', 'Day 61–90'];
    var cardsHtml = chain.map(function (key, i) {
      var isCurrent = key === pageKey;
      var done = isPagePhaseComplete(key);
      var unlocked = done || isPhasePageUnlocked(key) || isCurrent;
      var label = dayRanges[i] || crumbLabel(key);
      /* "Next up": the immediately-following phase, unlocked but not yet
         started, while the phase being viewed is finished. This is the one
         the employee should move to now, and it previously looked identical
         to any other plain unlocked pill — nothing marked the transition
         from "locked" to "you can go here". */
      var isNextUp = !isCurrent && !done && unlocked &&
        chain[i - 1] === pageKey && isPagePhaseComplete(pageKey);
      var stateIcon = done ? icon('check') : (unlocked ? '' : icon('lock'));
      var stateClass = (isCurrent ? ' current' : (done ? ' done' : (unlocked ? '' : ' locked'))) +
        (isNextUp ? ' next-up' : '');
      /* The "Next up" tag is text, not just the highlight styling — a
         colour/glow cue alone conveys nothing to a screen reader, and is
         easy to miss on a phone. */
      var inner = '<span class="phase-card-label">' + esc(t(label)) + '</span>' +
        (isNextUp ? '<span class="phase-card-nextup">' + esc(t('Next up')) + '</span>' : '') +
        (stateIcon ? '<span class="phase-card-icon">' + stateIcon + '</span>' : '');
      if (isCurrent) {
        return '<div class="phase-card' + stateClass + '" aria-current="page">' + inner + '</div>';
      }
      return '<a class="phase-card' + stateClass + '" href="' + pageUrl(key) + '" data-link="' + key + '">' + inner + '</a>';
    }).join('');
    /* "Back to Team" link above the phase pills — goes to this department's
       landing page (Meet Your Supervisor / Department Overview), matched by
       pageKey's prefix against DEPARTMENTS (see progress.html). Sits here,
       not just in the sidebar, because the level picker moved off that
       landing page onto every phase page (see phasePage() in content.html)
       — the landing page's Meet Your Supervisor content is otherwise no
       longer reachable from a phase page without this. */
    var dept = (typeof DEPARTMENTS !== 'undefined') ? DEPARTMENTS.filter(function (d) { return pageKey.indexOf(d.prefix) === 0; })[0] : null;
    var backToTeamHtml = (dept && dept.landingPage) ?
      '<a class="back-to-team-link" href="' + pageUrl(dept.landingPage) + '" data-link="' + dept.landingPage + '">&larr; ' + esc(t('Back to')) + ' ' + esc(t(dept.label)) + '</a>' : '';
    /* data-phase-trail carries the page key so refreshPhaseTrail (below) can
       re-render this in place after a checkbox toggle without knowing which
       page it's on. Without that the trail kept whatever lock/done states it
       had at page-render time, so the next phase still looked locked right
       after the employee finished unlocking it. */
    return '<div class="closing-line phase-trail-row" data-phase-trail="' + esc(pageKey) + '">' + backToTeamHtml + '<div class="phase-grid phase-trail-grid">' + cardsHtml + '</div></div>';
  }

  /* Re-renders the phase trail in place from current progress state. Exposed
     on window because progress.html lives outside this IIFE (see the
     include-order note in docs/KNOWN_ISSUES.md). Safe to call on any page —
     it no-ops where there is no trail. */
  window.refreshPhaseTrail = function () {
    var el = document.querySelector('[data-phase-trail]');
    if (!el) return;
    var key = el.getAttribute('data-phase-trail');
    var html = renderPhaseTrail(key);
    if (!html) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    var fresh = tmp.firstElementChild;
    if (fresh) el.replaceWith(fresh);
  };

  function renderPage(pageKey, anchor) {
    /* Admin checklist editor — an entirely different UI shape (no hero, a
       password gate, its own department/phase/block navigation), so it
       owns the #app root directly instead of going through the normal
       hero/sections renderer below (see renderAdminPage, admin.html). Not
       part of PAGES since it isn't real onboarding content — checked
       first so it can never collide with an actual page key. */
    if (pageKey === 'admin') {
      var adminEl = document.getElementById('app');
      adminEl.innerHTML = '';
      renderAdminPage(adminEl);
      document.title = 'Admin — VCB Onboarding Portal';
      return;
    }
    if (pageKey === 'home') markHomeVisited();
    var data = PAGES[pageKey];
    if (!data) {
      data = {
        hero: { eyebrow: 'Not Found', title: 'Page not found' },
        sections: [{ type: 'text', body: ['The page "' + pageKey + '" does not exist in this portal.'],
                     link: { label: 'Return Home', page: 'home' } }]
      };
    }
    /* Completion page's gate — a plain synchronous check, same pattern
       every other progress-gated read in this app already uses
       (isPhasePageUnlocked, etc.), NOT the old async requireOnboardingComplete
       placeholder-swap (revealGatedSections) this page replaced. Reached
       almost always right after actually finishing (via
       celebrateOnboardingComplete's Continue button, whose click only
       fires once isEmployeeOnboardingComplete() is already true in
       PROGRESS_CACHE from the checkbox toggle that triggered it) — but a
       typed URL or a stale link could reach it before that, so
       notCompleteSections is real content, never a blank pending state,
       for exactly that case. */
    if (pageKey === 'completion' && typeof isEmployeeOnboardingComplete === 'function' && !isEmployeeOnboardingComplete()) {
      data = { hero: data.hero, sections: data.notCompleteSections || [] };
    }
    var html = '';
    html += renderHero(data.hero);
    /* Placeholder rendered fresh into the HTML string on every page, right
       after the hero, so the progress bar always sits directly under the
       banner. (Previously the real widget node was physically relocated in
       here via insertAdjacentElement — but appEl.innerHTML further below
       wipes out anything already inside #app, including a node moved in on
       a prior render, so it only ever worked once and then vanished.) */
    html += '<div id="overall-progress-widget" class="overall-progress-wrap"></div>';
    /* Rendered OUTSIDE data.sections on purpose — PHASE_BLOCK_ANCHORS /
       getPageBlockTaskIds (progress.html) still assume block order is
       exactly [Reading, Knowledge, Outputs] at indices [0,1,2] (see
       phasePage in content.html), so inserting this into the array would
       shift that mapping even though individual checkbox state (keyed on
       each item's own permanent id, not position — see it()/itemId())
       would survive it unharmed. blockIndex is irrelevant to the
       'levelpicker' case itself (it only matters for 'checklist'), so
       passing null here is safe. */
    if (data.showLevelPicker) {
      html += renderSectionContent({ type: 'levelpicker', heading: 'Choose Your Level' }, pageKey, null);
    }
    (data.sections || []).forEach(function (sec, i) { html += renderSection(sec, pageKey, i); });

    var phaseTrailHtml = renderPhaseTrail(pageKey);
    if (phaseTrailHtml) html += phaseTrailHtml;
    if (data.closing) {
      if (typeof data.closing === 'string') {
        /* Every department's final phase page uses this plain-string form
           (see phasePage, content.html). Used to just be inert text — the
           only way to actually reach the new Completion page (see
           PAGES['completion']) was the celebration popup's Continue
           button, which only exists for the ONE moment onboarding first
           completes; visiting this page again afterward (or if the popup
           was dismissed by clicking outside it) left no way back at all.
           Explicit request: a real button here too. Only shown once
           isEmployeeOnboardingComplete() is genuinely true — someone
           viewing this page before finishing (every phase is viewable in
           any order, see renderPhaseTrail) still just sees the plain
           closing text, nothing to click ahead of actually finishing. */
        html += '<div class="closing-line">' + esc(t(data.closing)) + '</div>';
        if (typeof isEmployeeOnboardingComplete === 'function' && isEmployeeOnboardingComplete()) {
          html += '<div class="closing-line"><a class="next-phase" href="' + pageUrl('completion') + '" data-link="completion">' + esc(t('Continue to Completion')) + '</a></div>';
        }
      } else {
        html += '<div class="closing-line">';
        if (data.closing.text) html += '<p>' + esc(t(data.closing.text)) + '</p>';
        html += '<a class="next-phase" href="' + pageUrl(data.closing.page) + '" data-link="' + data.closing.page + '">' + esc(t(data.closing.label)) + '</a></div>';
      }
    }

    var appEl = document.getElementById('app');
    appEl.innerHTML = html;
    /* Force the CSS animation to restart on every page render (it only
       plays once per element by default) by toggling the class off and
       triggering a reflow before re-adding it. */
    appEl.classList.remove('app-enter');
    void appEl.offsetWidth;
    appEl.classList.add('app-enter');
    initCarousels(appEl);
    initOrgChart(appEl);
    renderOrgConnectors(appEl);
    initOrgViewToggle(appEl);
    initLevelPicker(appEl, pageKey);
    /* Web fonts (Orbitron for labels like "SUBSIDIARIES"/"บริษัทย่อย", Noto
       Sans Thai for Thai body text — see the Google Fonts <link> in
       Index.html, loaded with display:swap) are almost never finished
       downloading by the time this synchronous render runs, so the very
       first renderOrgConnectors call above measures every label/card box
       at its FALLBACK-FONT width. Once the real font swaps in a moment
       later, any box whose width depends on that text (most visibly a
       .org-segment-label like "SUBSIDIARIES") can reflow by a few px —
       exactly enough to leave the already-drawn connector lines pointing
       at stale positions, seen as a slight kink or offset right where a
       label sits. document.fonts.ready resolves once every requested face
       has actually loaded (or immediately, if the browser has no Font
       Loading API — same as skipping this), so this redraw is a no-op
       when fonts were already cached/loaded and a real fix on the first
       visit when they weren't. */
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { renderOrgConnectors(appEl); });
    }
    /* #app.app-enter's own entrance animation (see styles.html) translates
       each top-level child (hero, each section) up from translateY(10px)
       over up to .5s, staggered up to a further .7s depending on the
       child's position — renderOrgConnectors above runs synchronously
       right after the HTML is inserted, i.e. WHILE these elements are
       still mid-animation and not yet at their final resting position.
       Measuring mid-animation is exactly what put a connector line
       through the middle of a card instead of stopping at its edge: the
       card's animated (still-offset) position got baked into the line's
       coordinates, then nothing redrew once the animation actually
       settled a moment later. 1300ms comfortably covers the longest
       stagger (.7s delay + .5s duration = 1.2s) with a little margin. */
    setTimeout(function () { renderOrgConnectors(appEl); }, 1300);

    document.title = (pageKey === 'home' ? t('VCB 90-Day Onboarding Portal') : crumbLabel(pageKey) + ' — VCB Onboarding Portal');
    /* Jumping to a specific step (e.g. Required Documents / Department
       Selection from the sidebar stepper) scrolls straight to that section
       instead of the page top. */
    if (location.hash && !anchor) {
      history.replaceState(history.state, '', location.pathname + location.search);
    }
    /* Always an exact jump (behavior: 'instant'), never CSS smooth-scroll
       (html/body has scroll-behavior: smooth globally, for in-page anchor
       links). Under smooth-scroll, calling this while a previous smooth
       scroll from the same click sequence is still animating can resolve
       short of true 0/target, and each repeated click compounds that
       shortfall, which is exactly what made "Pre-boarding" appear to creep
       one notch further down the page on every click instead of always
       landing at the top. */
    /* THE actual root cause of every "lands scrolled past the top" report in
       this app (Pre-boarding, department cards, Required Documents alike):
       html/body both have height:100%/min-height:100vh (see styles.html) so
       the page can end up scrolling inside <body> itself instead of the
       window/<html> — confirmed by inspecting a live reproduction: after
       clicking a department card, window.scrollY read 0 (looked "already at
       top") while document.body.scrollTop was really 1142. window.scrollTo
       only ever moves the window/documentElement, so on a page where body is
       the actual scrolling box it silently did nothing — every previous fix
       in this area (scroll-restoration, re-scrolling after async content,
       waiting for images) was real but could never have addressed this,
       because the single scrollTo(0,0) call itself was targeting the wrong
       element the whole time. Now resets all three candidates unconditionally
       — whichever one the browser is actually using for this render, this
       covers it. */
    /* userScrolledAway flips true the moment a real user input (wheel,
       touch drag, or a scroll-moving key) happens after this render
       started — NOT on every 'scroll' event, which also fires for the
       programmatic scrolls forceScroll() itself performs and therefore
       can't distinguish "the browser nudged this" from "the person
       scrolled on purpose." Once true, every LATER forceScroll() call in
       this render (from the async widgets below — checklists, doc cards,
       the overall-progress bar) becomes a no-op.
       Without this, scrolling down manually while any of those were still
       waiting on loadProgress would get silently yanked back to the top
       the moment that widget's data landed — reported directly: "when I
       scroll down and then it loads up the progress panel, it jumps back
       up." The very FIRST forceScroll() call immediately below still
       always runs (nothing has had a chance to scroll yet at that point),
       matching the original intent: land at the top (or the requested
       anchor) right when a page navigation happens, then get out of the
       user's way. */
    var userScrolledAway = false;
    function markUserScrolled() { userScrolledAway = true; }
    ['wheel', 'touchmove', 'keydown'].forEach(function (evt) {
      window.addEventListener(evt, markUserScrolled, { once: true, passive: true });
    });
    function forceScroll() {
      if (userScrolledAway) return;
      if (anchor) {
        var el = document.getElementById(anchor);
        if (el) { el.scrollIntoView({ block: 'start', behavior: 'instant' }); return; }
      }
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    }
    forceScroll();
    /* General safety net on every render: any page can carry <img>s
       (embedded base64 photos/icons) that are
       still mid-decode at this exact tick, so the browser hasn't reserved
       their final layout height yet — a moment later, when they do finish
       decoding, the page can grow under the scroll position forceScroll()
       just set, and (now that native scroll-restoration is off) nothing
       else corrects it. This was the actual cause of "Pre-boarding" in the
       sidebar landing on Company Structure instead of the top of Home —
       Home's CEO portrait/hero photo/value icons hadn't finished decoding
       when the first forceScroll() ran. */
    scrollToElementAfterImagesSettle(appEl, forceScroll);
    initChecklists(appEl, forceScroll);
    initDocCards(appEl, forceScroll);
    var progressWidget = document.getElementById('overall-progress-widget');
    if (progressWidget) renderOverallProgress(progressWidget, forceScroll);
    buildNav();
    highlightNav(pageKey);
  }

  /* Scrolls to el only once every <img> inside it has finished loading (or
     is already loaded/broken) — inline base64 <img> data can still be
     mid-decode at the exact tick a page render finishes, so the browser
     hasn't reserved final layout height for those images yet. Calling the
     scroll callback synchronously in that window can land short of (or,
     via scroll-anchoring, past) the target — it looked like a click
     "needed to be pressed twice", or in one case landed at the very
     bottom of the page instead of the top, when actually the very same
     click's scroll fired before the page's layout had settled. onScrolled
     is called once settled — the caller decides what "scrolled" means
     (scrollIntoView a specific element, or window.scrollTo(0,0), etc.),
     this function only owns the timing. Falls back to a fixed short delay
     if, for any reason, an image's load event never fires. */
  function scrollToElementAfterImagesSettle(el, onScrolled) {
    var imgs = el.querySelectorAll('img');
    var pending = 0;
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      onScrolled();
    }
    imgs.forEach(function (im) {
      if (im.complete) return;
      pending++;
      var settle = function () { pending--; if (pending <= 0) finish(); };
      im.addEventListener('load', settle, { once: true });
      im.addEventListener('error', settle, { once: true });
    });
    if (pending === 0) {
      requestAnimationFrame(function () { requestAnimationFrame(finish); });
    } else {
      setTimeout(finish, 1200); // safety net in case a load/error event never fires
    }
  }

  function highlightNav(pageKey) {
    document.querySelectorAll('nav.sidebar-nav a').forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('data-link') === pageKey);
    });
  }

  /* Simplified nav: department Day 1-30/31-60/61-90 sub-pages are no longer listed
     here as clickable nav children — they're replaced by the progress tracker in
     the sidebar (see renderSidebarProgress in progress.html). Once the employee has
     selected a department, only that department's landing page appears in nav;
     before that (pre-boarding), all 5 remain visible so they can browse and pick one. */
  /* The sidebar is now the vertical journey stepper (renderSidebarProgress in
     progress.html) instead of a flat clickable nav list — it already covers
     every page an employee needs to reach (pre-boarding, documents, department
     selection, each phase, completion), so there is no separate nav to build. */
  function buildNav() {
    if (typeof renderSidebarProgress === 'function') {
      renderSidebarProgress(document.getElementById('sidebar-progress'));
    }
  }

  /* body.nav-open drives one mobile-only rule in styles.html: hiding the
     fixed .menu-toggle, which sits at a higher z-index than the drawer and
     would otherwise stay painted over the brand name. It deliberately does
     NOT lock background scroll — see the note in styles.html's 980px block
     for why that breaks this particular page. */
  function closeSidebar() {
    document.getElementById('site-sidebar').classList.remove('open');
    document.getElementById('sidebar-scrim').classList.remove('open');
    document.body.classList.remove('nav-open');
  }
  function openSidebar() {
    document.getElementById('site-sidebar').classList.add('open');
    document.getElementById('sidebar-scrim').classList.add('open');
    document.body.classList.add('nav-open');
  }

  /* Exposed on window (see below) so progress.html — outside this IIFE —
     can trigger a real page navigation the same way any [data-link] click
     does, without needing its own copy of the pushState/renderPage
     plumbing. Used by celebrateOnboardingComplete's Continue button to
     navigate to the dedicated completion page. */
  function navigate(pageKey, push, anchor) {
    if (push !== false) {
      var url = pageUrl(pageKey) + (anchor ? '#' + anchor : '');
      history.pushState({ page: pageKey, anchor: anchor || null }, '', url);
    }
    renderPage(pageKey, anchor);
    if (window.innerWidth <= 980) closeSidebar();
    /* Any real page navigation (e.g. the Admin link inside the settings
       panel, see Index.html) should close that panel too — unlike the
       language/theme toggle buttons inside it, which stay open since
       you might flip both in one visit, clicking a navigation link is a
       one-shot action that should feel like leaving the panel, not
       leaving it open behind the page it just navigated away from. */
    var settingsPanel = document.getElementById('settings-panel');
    if (settingsPanel && settingsPanel.classList.contains('open')) {
      settingsPanel.classList.remove('open');
      var settingsBtn = document.getElementById('settings-btn');
      if (settingsBtn) settingsBtn.setAttribute('aria-expanded', 'false');
    }
  }
  window.navigate = navigate;
  /* app.html is wrapped in an IIFE, so anything progress.html needs to
     call must be attached to window explicitly (see the include-order note
     in docs/KNOWN_ISSUES.md). Used by promptToChangeName to repaint the
     page after a rename, so the new name shows in the progress widget. */
  window.rerenderCurrentPage = function () { renderPage(currentPage()); };

  document.addEventListener('click', function (e) {
    var link = e.target.closest('[data-link]');
    if (link) {
      e.preventDefault();
      var anchor = link.getAttribute('data-anchor');
      var deptId = link.getAttribute('data-dept-id');
      if (deptId) {
        ensureEmployeeNamed(function () {
          /* Hard-gated on Required Documents — checked here, before
             selectDepartment/navigate run, so an employee who hasn't
             finished pre-boarding docs never actually lands on a
             department page (matches isPhasePageUnlocked's same
             requirement for a department's own Day 1-30, so the lock chain
             now genuinely starts at step one instead of only kicking in
             one step later). */
          if (typeof areRequiredDocsComplete === 'function' && !areRequiredDocsComplete()) {
            promptRequiredDocsIncomplete(getMissingRequiredDocTitles());
            return;
          }
          selectDepartment(deptId);
          navigate(link.getAttribute('data-link'), true, anchor);
        });
        return;
      }
      navigate(link.getAttribute('data-link'), true, anchor);
      return;
    }
    if (e.target.closest('.menu-toggle')) {
      openSidebar();
      return;
    }
    if (e.target.closest('.sidebar-close') || e.target.closest('.sidebar-scrim')) {
      closeSidebar();
      return;
    }
    /* Meet Our Team cards flip on hover via CSS for mouse users; tap-to-flip
       here covers touch devices, which have no hover state at all. */
    var teamCard = e.target.closest('.team-member');
    if (teamCard) {
      teamCard.classList.toggle('flipped');
      return;
    }
    /* A locked checklist item's checkbox is disabled (see the 'checklist'
       case above), so it never fires a click of its own — nothing told the
       employee WHY clicking it did nothing, it just silently ignored the
       click same as any other disabled control. This catches the click on
       the surrounding <label> (which still receives it even though the
       input inside is disabled) and shows a brief explanation instead of
       leaving it looking broken. */
    var lockedItem = e.target.closest('.check-item.locked');
    if (lockedItem) {
      e.preventDefault();
      showLockedToast();
      return;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var teamCard = e.target.closest && e.target.closest('.team-member');
    if (teamCard) {
      e.preventDefault();
      teamCard.classList.toggle('flipped');
    }
  });

  window.addEventListener('popstate', function (e) {
    var page = (e.state && e.state.page) || 'home';
    var anchor = e.state && e.state.anchor;
    renderPage(page, anchor);
  });

  /* Card x-positions (see renderOrgConnectors) only change with viewport
     width, not with expand/collapse — re-measure on resize so the elbow
     connectors stay correct after a window/orientation resize. Debounced
     since 'resize' fires continuously while a user drags a window edge. */
  var orgConnectorResizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(orgConnectorResizeTimer);
    orgConnectorResizeTimer = setTimeout(function () {
      var appEl = document.getElementById('app');
      if (appEl) renderOrgConnectors(appEl);
    }, 150);
  });

  /* Injects the shared SVG icon set into the static chrome (settings gear,
     hamburger/close, theme toggle) — done once on load, not translated. */
  function setChromeIcons() {
    var map = {
      'menu-toggle-btn': 'menu',
      'sidebar-close-btn': 'close',
      'settings-btn-icon': 'gear',
      'lbl-light-icon': 'sun',
      'lbl-dark-icon': 'moon',
      'settings-name-icon': 'document',
      'settings-admin-icon': 'lock'
    };
    Object.keys(map).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.innerHTML = icon(map[id]);
    });
  }

  function currentPage() {
    var p = new URLSearchParams(location.search).get('page');
    return p || window.INITIAL_PAGE || 'home';
  }

  function applyLangUI() {
    document.querySelectorAll('#lang-control .seg-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === LANG);
    });
    /* Index.html hardcodes lang="en" and nothing used to update it, so
       after switching to Thai a screen reader kept announcing Thai text
       with an English voice. This runs on first load as well as on every
       switch, so the attribute always matches what's actually rendered. */
    document.documentElement.lang = LANG;
  }

  function setText(id, str) {
    var el = document.getElementById(id);
    if (el) el.textContent = t(str);
  }
  function applyChromeTranslations() {
    setText('brand-title', 'VCB ONBOARDING');
    setText('brand-subtitle', 'Vichitbhan Construction');
    setText('lbl-language', 'Language');
    setText('lbl-appearance', 'Appearance');
    setText('lbl-light', 'Light');
    setText('lbl-dark', 'Dark');
    setText('lbl-change-name', 'Change my name');
    setText('lbl-admin', 'Admin');
    setText('footer-company', 'Vichitbhan Construction Co., Ltd.');
    setText('footer-company-2', 'Vichitbhan Construction Co., Ltd. — Internal Onboarding Portal');
  }

  function setLang(lang) {
    if (lang !== 'en' && lang !== 'th') lang = 'en';
    LANG = lang;
    try { localStorage.setItem('vcb-lang', lang); } catch (e) {}
    applyLangUI();
    applyChromeTranslations();
    buildNav();
    renderPage(currentPage());
  }

  function applyThemeUI(theme) {
    document.querySelectorAll('#theme-control .seg-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-theme') === theme);
    });
  }
  function setTheme(theme) {
    if (theme !== 'light' && theme !== 'dark') theme = 'light';
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('vcb-theme', theme); } catch (e) {}
    applyThemeUI(theme);
  }

  /* Wires the Junior/Senior toggle on a department landing page (see the
     'levelpicker' case in renderSectionContent above). Changing level
     changes which checklist items are visible on every phase page for this
     department (see isItemVisible in progress.html), so it re-renders the
     current page immediately after switching — same as setLang/setTheme
     re-applying UI state, except here the DOM itself has to change, not
     just labels/CSS variables. No dataset.wired guard needed: unlike the
     carousels/org-chart (which persist across re-renders of the SAME page),
     #level-picker's markup is fully replaced by appEl.innerHTML on every
     renderPage call, so there's never a stale listener to skip. */
  function initLevelPicker(container, pageKey) {
    var control = container.querySelector('#level-control');
    if (!control) return;
    control.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-level]');
      if (!btn) return;
      var level = btn.getAttribute('data-level');
      if (level === getEmployeeLevel()) return;
      setEmployeeLevel(level);
      renderPage(pageKey);
    });
  }

  function initSettings() {
    var savedLang = 'en', savedTheme = null;
    try { savedLang = localStorage.getItem('vcb-lang') || 'en'; } catch (e) {}
    try { savedTheme = localStorage.getItem('vcb-theme'); } catch (e) {}
    if (!savedTheme) {
      savedTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    LANG = (savedLang === 'th') ? 'th' : 'en';
    applyLangUI();
    applyChromeTranslations();
    setTheme(savedTheme);

    document.getElementById('settings-btn').addEventListener('click', function (e) {
      e.stopPropagation();
      var panel = document.getElementById('settings-panel');
      var willOpen = !panel.classList.contains('open');
      panel.classList.toggle('open', willOpen);
      document.getElementById('settings-btn').setAttribute('aria-expanded', String(willOpen));
    });
    document.addEventListener('click', function (e) {
      var panel = document.getElementById('settings-panel');
      if (panel.classList.contains('open') && !e.target.closest('.settings-wrap')) {
        panel.classList.remove('open');
        document.getElementById('settings-btn').setAttribute('aria-expanded', 'false');
      }
    });
    document.getElementById('lang-control').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-lang]');
      if (btn) setLang(btn.getAttribute('data-lang'));
    });
    document.getElementById('theme-control').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-theme]');
      if (btn) setTheme(btn.getAttribute('data-theme'));
    });
    var changeNameBtn = document.getElementById('change-name-btn');
    if (changeNameBtn) {
      changeNameBtn.addEventListener('click', function () {
        var panel = document.getElementById('settings-panel');
        if (panel) panel.classList.remove('open');
        var sBtn = document.getElementById('settings-btn');
        if (sBtn) sBtn.setAttribute('aria-expanded', 'false');
        promptToChangeName();
      });
    }
  }

  /* This SPA already owns scroll position entirely via forceScroll() inside
     renderPage — every navigate() call is a pushState to a URL made of
     nothing but ?page=..., and revisiting the same ?page=... value later in
     the same session (e.g. clicking back into a department you'd already
     scrolled around in before) is exactly the case the browser's default
     scroll restoration ('auto') tries to "help" with by restoring whatever
     scroll offset that URL last had — landing wherever the user happened to
     leave off (e.g. down at the level picker) instead of forceScroll's
     intended top-of-page. 'manual' hands scroll position fully to our own
     code, which is the only thing that should be deciding it here. */
  if ('scrollRestoration' in history) {
    history.scrollRestoration = 'manual';
  }

  document.addEventListener('DOMContentLoaded', function () {
    setChromeIcons();
    initSettings();
    buildNav();
    var initial = window.INITIAL_PAGE || 'home';
    history.replaceState({ page: initial }, '', pageUrl(initial));
    renderPage(initial);
  });
})();
</script>
