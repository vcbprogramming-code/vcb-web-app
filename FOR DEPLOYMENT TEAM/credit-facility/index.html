<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F3864">
<link rel="icon" href="data:,">
<title>VCB Credit Facility Manager</title>
<!-- Sarabun covers Thai and Latin in one face, so a mixed Thai/English line
     does not change weight mid-string. Inter backs it for Latin headings.
     Both are the families named in shared/tailwind.preset.js. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Paint the stored theme before React mounts, so someone on dark does not
  // get a white flash on every load. This is the snippet documented in
  // shared/src/theme.jsx — same key, same class, same color-scheme.
  (function () {
    try {
      var t = localStorage.getItem('vcb_theme') || 'auto';
      var d = t === 'dark' || (t !== 'light' &&
        matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', d);
      document.documentElement.style.colorScheme = d ? 'dark' : 'light';
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
