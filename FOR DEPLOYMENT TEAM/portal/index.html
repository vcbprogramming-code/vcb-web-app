<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VCB Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Manrope replaces Orbitron as the wordmark face: Orbitron is a sci-fi
       display font that was never actually applied anywhere the class map
       below still names it (the sign-in title rendered in Sarabun, the body
       face, at display size — chunky and undistinguished, not "the entrance
       to the whole portal"). Manrope is a clean, restrained geometric sans
       that reads as considered rather than decorative at a large size,
       matching an internal enterprise portal rather than a game or startup
       splash screen. -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Paint the right theme before React mounts, or someone on dark gets a
    // white flash. Mirrors applyStoredThemeEarly() in shared/src/theme.jsx —
    // same key, same class, same fallback.
    (function () {
      try {
        var t = localStorage.getItem('vcb_theme') || 'auto';
        var d = t === 'dark' || (t !== 'light' &&
          matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
