<script>
(function () {
  var S = { projects: [], byId: {}, meetings: [], activeProject: 'ALL', activeId: null, query: '', range: 'all', contentCache: {}, loaded: false, searchMatchIds: {}, searching: false };

  function getToken() { try { return localStorage.getItem('vcb_mm_token') || ''; } catch (e) { return ''; } }
  function setToken(t) { try { t ? localStorage.setItem('vcb_mm_token', t) : localStorage.removeItem('vcb_mm_token'); } catch (e) {} }
  // Meeting metadata cache — paints the Latest tiles on first load without
  // waiting for the listMeetings round-trip. Fresh data replaces it once the
  // server responds (usually within ~300-500ms).
  function getCachedMeetings() {
    try { return JSON.parse(localStorage.getItem('vcb_mm_meetings_cache') || 'null') || []; } catch (e) { return []; }
  }
  function setCachedMeetings(m) {
    try { localStorage.setItem('vcb_mm_meetings_cache', JSON.stringify(m || [])); } catch (e) {}
  }
  var TOKEN = getToken();
  var PENDING_MEETING = null; // a meeting the user tried to open before signing in

  function gs(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (res, rej) {
      google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(google.script.run, args);
    });
  }
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function fileIconHtml_(mime, name) {
    var t = ((mime || '') + ' ' + (name || '')).toLowerCase();
    var cls = 'gen', label = '▭';
    if (/sheet|excel|\.xls|\.csv/.test(t)) { cls = 'xls'; label = 'X'; }
    else if (/presentation|powerpoint|\.ppt/.test(t)) { cls = 'ppt'; label = 'P'; }
    else if (/pdf/.test(t)) { cls = 'pdf'; label = 'PDF'; }
    else if (/document|word|\.doc/.test(t)) { cls = 'doc'; label = 'W'; }
    else if (/image\//.test(t)) { cls = 'img'; label = '🖼'; }
    return '<span class="fi ' + cls + '">' + label + '</span>';
  }
  function fmtFileSize_(bytes) {
    bytes = Number(bytes) || 0;
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }
  function toast(msg) { var t = el('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2600); }
  function showBusy(msg) { el('busyMsg').textContent = msg || 'Working…'; el('busy').classList.add('show'); }
  function hideBusy() { el('busy').classList.remove('show'); }

  // Styled replacement for window.confirm(); resolves true/false. Only one
  // confirm dialog is ever open at a time, so a single set of DOM nodes is reused.
  function confirmDialog(message, opts) {
    opts = opts || {};
    el('cfTitle').textContent = opts.title || 'Are you sure?';
    el('cfMsg').textContent = message;
    el('cfOk').textContent = opts.okLabel || 'Confirm';
    el('cfOk').className = 'dbtn ' + (opts.danger === false ? 'primary' : 'danger-solid');
    var bg = el('cfBg');
    return new Promise(function (resolve) {
      function cleanup(result) { bg.classList.remove('show'); document.removeEventListener('keydown', onKey); resolve(result); }
      function onKey(e) { if (e.key === 'Escape') cleanup(false); }
      el('cfOk').onclick = function () { cleanup(true); };
      el('cfCancel').onclick = function () { cleanup(false); };
      bg.onclick = function (e) { if (e.target === bg) cleanup(false); };
      document.addEventListener('keydown', onKey);
      bg.classList.add('show');
    });
  }

  // Styled replacement for window.prompt(); resolves the entered string, or
  // null if cancelled. Only one prompt dialog is ever open at a time.
  function promptDialog(label, opts) {
    opts = opts || {};
    el('ipTitle').textContent = opts.title || 'Enter a value';
    el('ipLabel').textContent = label;
    el('ipInput').value = opts.value || '';
    el('ipInput').placeholder = opts.placeholder || '';
    el('ipInput').type = opts.type || 'text';
    el('ipOk').textContent = opts.okLabel || 'OK';
    var bg = el('ipBg');
    return new Promise(function (resolve) {
      function cleanup(result) { bg.classList.remove('show'); document.removeEventListener('keydown', onKey); resolve(result); }
      function onKey(e) { if (e.key === 'Escape') cleanup(null); if (e.key === 'Enter') cleanup(el('ipInput').value); }
      el('ipOk').onclick = function () { cleanup(el('ipInput').value); };
      el('ipCancel').onclick = function () { cleanup(null); };
      bg.onclick = function (e) { if (e.target === bg) cleanup(null); };
      document.addEventListener('keydown', onKey);
      bg.classList.add('show');
      el('ipInput').focus();
    });
  }

  /* ---------- Editor sign-in (email + password) ----------
     The app needs its OWN login because the deployment is ANYONE_ANONYMOUS:
     Google never reveals a visitor's email to the script, so an employee on
     EDITOR_EMAILS looks exactly like a stranger. The ✎ Edit button is shown to
     everyone, and identity is demanded only when someone actually tries to
     edit.

     Handles the first-sign-in case too: an account created by an admin is
     flagged mustChange, so the same dialog immediately asks the employee to
     choose their own password — the admin should not go on knowing it.

     onDone runs only after a successful, fully-completed sign-in. */
  // Google Identity Services, loaded once and only if configured. The library
  // is fetched from Google's CDN; if that fails (offline, blocked), the
  // password fallback below still works, so sign-in is never a dead end.
  var GIS_STATE = 'idle';   // idle | loading | ready | failed
  function loadGoogleIdentity_(cb) {
    if (GIS_STATE === 'ready') { cb(true); return; }
    if (GIS_STATE === 'failed') { cb(false); return; }
    if (GIS_STATE === 'loading') { setTimeout(function () { loadGoogleIdentity_(cb); }, 200); return; }
    GIS_STATE = 'loading';
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = function () { GIS_STATE = 'ready'; cb(true); };
    s.onerror = function () { GIS_STATE = 'failed'; cb(false); };
    document.head.appendChild(s);
  }

  function openEditorSignIn(onDone) {
    var bg = el('lgBg');
    var mode = 'login';                 // 'login' | 'change'
    var pendingEmail = '';

    // Render the real Google button when a Client ID is configured. Until an
    // admin sets GOOGLE_CLIENT_ID this stays hidden and the password login is
    // the only route, so the app is never left with no way in.
    var clientId = (BOOTSTRAP && BOOTSTRAP.googleClientId) || '';
    if (clientId) {
      loadGoogleIdentity_(function (ok) {
        if (!ok || !window.google || !google.accounts || !google.accounts.id) return;
        try {
          google.accounts.id.initialize({
            client_id: clientId,
            callback: function (resp) {
              if (!resp || !resp.credential) return;
              showBusy('Signing in…');
              // The browser gets a SIGNED token from Google; the server
              // verifies it with Google before trusting the email inside.
              gs('googleEditorLogin', resp.credential).then(function (res) {
                TOKEN = res.token; setToken(TOKEN);
                return refreshAll().then(function () {
                  hideBusy();
                  toast('Signed in as ' + (res.user || 'editor'));
                  close(true);
                });
              }).catch(function (e) {
                hideBusy();
                msg((e && e.message) ? e.message : 'Sign-in failed.');
              });
            }
          });
          el('lgGoogleWrap').style.display = '';
          google.accounts.id.renderButton(el('lgGoogleBtn'), {
            theme: 'outline', size: 'large', text: 'signin_with', width: 300
          });
        } catch (e) { /* fall back to the password form, already visible */ }
      });
    }

    function msg(text) {
      var m = el('lgMsg');
      if (!text) { m.style.display = 'none'; m.textContent = ''; return; }
      m.style.display = ''; m.textContent = text;
    }
    function setMode(next) {
      mode = next;
      var change = (mode === 'change');
      el('lgTitle').textContent = change ? 'Choose your password' : 'Sign in to edit';
      el('lgPwLabel').textContent = change ? 'New password (min 8 characters)' : 'Password';
      el('lgPw2Row').style.display = change ? '' : 'none';
      el('lgOk').textContent = change ? 'Save password' : 'Sign in';
      el('lgHint').textContent = change
        ? 'This replaces the password an admin gave you. Only you will know it.'
        : (clientId
            ? 'Signing in with Google is preferred — no password to remember.'
            : 'No password yet? Ask an admin to set one for you.');
      // In change mode the email is already known and must not be edited.
      el('lgEmail').disabled = change;
      el('lgPw').value = ''; el('lgPw2').value = '';
      (change ? el('lgPw') : el('lgEmail')).focus();
    }

    function close(result) {
      bg.classList.remove('show');
      document.removeEventListener('keydown', onKey);
      el('lgEmail').disabled = false;
      el('lgEmail').value = ''; el('lgPw').value = ''; el('lgPw2').value = '';
      msg('');
      if (result && typeof onDone === 'function') onDone();
    }
    function onKey(e) {
      if (e.key === 'Escape') close(false);
      if (e.key === 'Enter') submit();
    }

    function submit() {
      msg('');
      if (mode === 'login') {
        var email = (el('lgEmail').value || '').trim();
        var pw = el('lgPw').value || '';
        if (!email || !pw) { msg('Enter your email and password.'); return; }
        showBusy('Signing in…');
        gs('editorLogin', email, pw).then(function (res) {
          TOKEN = res.token; setToken(TOKEN);
          pendingEmail = res.user || email;
          // Refresh so the whole UI reflects the new role, not just this button.
          return refreshAll().then(function () {
            hideBusy();
            if (res.mustChange) {
              // Signed in, but the password is one the admin chose — force a
              // change before letting them through.
              el('lgEmail').value = pendingEmail;
              setMode('change');
              return;
            }
            toast('Signed in as ' + pendingEmail);
            close(true);
          });
        }).catch(function (e) {
          hideBusy();
          msg((e && e.message) ? e.message : 'Sign-in failed.');
          el('lgPw').value = ''; el('lgPw').focus();
        });
        return;
      }

      // mode === 'change'
      var cur = '';   // the admin-set password was just used to sign in
      var pw1 = el('lgPw').value || '';
      var pw2 = el('lgPw2').value || '';
      if (pw1.length < 8) { msg('Password must be at least 8 characters.'); return; }
      if (pw1 !== pw2) { msg('The two passwords do not match.'); return; }
      // The server requires the CURRENT password to change it, so ask for it
      // once here rather than trusting the session alone.
      promptDialog('Re-enter the password an admin gave you', {
        title: 'Confirm it is you', type: 'password', okLabel: 'Continue'
      }).then(function (given) {
        if (given == null || given === '') return;
        cur = given;
        showBusy('Saving…');
        return gs('changeEditorPassword', cur, pw1, TOKEN).then(function () {
          return refreshAll();
        }).then(function () {
          hideBusy();
          toast('Password updated. Signed in as ' + pendingEmail);
          close(true);
        }).catch(function (e) {
          hideBusy();
          msg((e && e.message) ? e.message : 'Could not change the password.');
        });
      });
    }

    el('lgOk').onclick = submit;
    el('lgCancel').onclick = function () { close(false); };
    bg.onclick = function (e) { if (e.target === bg) close(false); };
    document.addEventListener('keydown', onKey);
    setMode('login');
    bg.classList.add('show');
  }

  /* ---------- Theme + Language (persisted in localStorage) ---------- */
  var I18N = {
    en: {
      latestMeetings: 'Latest meetings',
      projects: 'Projects',
      allMeetings: 'All meetings',
      allMeetingsSub: 'ทุกการประชุม',
      newMeeting: '＋ New meeting',
      searchPlaceholder: 'Search meetings, decisions, people…',
      searchPlaceholderMobile: 'Search…',
      settings: 'Settings',
      signIn: '🔓 Sign in',
      signOut: 'Sign out',
      projectAccess: 'Project access',
      readMinutes: 'Read minutes →',
      backProjects: '← Projects',
      backMeetings: '← Meetings',
      signedInAs: 'Signed in as',
      display: 'การแสดงผล / DISPLAY',
      theme: 'โหมดสี / Theme',
      language: 'ภาษา / Language',
      readingSize: 'ขนาดตัวอักษร / Reading size',
      sizeSmall: 'เล็ก Small', sizeNormal: 'ปกติ Normal', sizeLarge: 'ใหญ่ Large',
      about: 'เกี่ยวกับ / ABOUT',
      build: 'Build', adminLabel: 'Admin',
      close: 'Close',
      records: 'record', recordsPlural: 'records',
      backToPortal: 'Back to VCB Connect home'
    },
    th: {
      latestMeetings: 'การประชุมล่าสุด',
      projects: 'โครงการ',
      allMeetings: 'ทุกการประชุม',
      allMeetingsSub: 'All meetings',
      newMeeting: '＋ เพิ่มการประชุม',
      searchPlaceholder: 'ค้นหาการประชุม, มติ, บุคคล…',
      searchPlaceholderMobile: 'ค้นหา…',
      settings: 'ตั้งค่า',
      signIn: '🔓 เข้าสู่ระบบ',
      signOut: 'ออกจากระบบ',
      projectAccess: 'สิทธิ์โครงการ',
      readMinutes: 'อ่านบันทึก →',
      backProjects: '← โครงการ',
      backMeetings: '← การประชุม',
      signedInAs: 'เข้าสู่ระบบโดย',
      display: 'การแสดงผล / DISPLAY',
      theme: 'โหมดสี / Theme',
      language: 'ภาษา / Language',
      readingSize: 'ขนาดตัวอักษร / Reading size',
      sizeSmall: 'เล็ก Small', sizeNormal: 'ปกติ Normal', sizeLarge: 'ใหญ่ Large',
      about: 'เกี่ยวกับ / ABOUT',
      build: 'เวอร์ชั่น', adminLabel: 'ผู้ดูแล',
      close: 'ปิด',
      records: 'รายการ', recordsPlural: 'รายการ',
      backToPortal: 'กลับไปหน้าหลัก VCB Connect'
    }
  };
  function currentLang() { return document.documentElement.classList.contains('lang-th') ? 'th' : 'en'; }
  function tr(key) {
    var lang = currentLang();
    return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  }
  function applyTheme(theme) {
    var html = document.documentElement;
    html.classList.remove('theme-light', 'theme-dark');
    html.classList.add('theme-' + theme);
    try { localStorage.setItem('vcb_mm_theme', theme); } catch (e) {}
    Array.prototype.forEach.call(document.querySelectorAll('#themeSeg .set-seg-opt'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-theme') === theme);
    });
    // The A4 render is a separate iframe document with its own <style> blocks
    // baked into a static srcdoc string at render time (see renderDetail) —
    // toggling html.theme-dark alone only affects the OUTER page's live CSS,
    // it can never reach into an already-generated iframe. Without this, a
    // meeting opened in dark mode stayed dark forever even after switching
    // back to light (bug found 2026-07-21) — re-render on every theme change
    // so the iframe's CSS is always regenerated for the CURRENT theme.
    if (S.activeId && S.contentCache[S.activeId]) renderDetail(S.contentCache[S.activeId]);
  }
  function applyLang(lang) {
    var html = document.documentElement;
    html.classList.remove('lang-th', 'lang-en');
    html.classList.add('lang-' + lang);
    try { localStorage.setItem('vcb_mm_lang', lang); } catch (e) {}
    Array.prototype.forEach.call(document.querySelectorAll('#langSeg .set-seg-opt'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    applyLangStrings();
  }
  function applyLangStrings() {
    // Static labels — id'd elements that hold persistent text.
    var s = el('search');
    if (s) s.setAttribute('placeholder', isMobile() ? tr('searchPlaceholderMobile') : tr('searchPlaceholder'));
    if (el('brandLink')) el('brandLink').setAttribute('title', tr('backToPortal'));
    if (el('newBtn')) el('newBtn').textContent = tr('newMeeting');
    if (el('accessBtn')) el('accessBtn').textContent = tr('projectAccess');
    if (el('setAccess')) { var saLbl = el('setAccess').querySelector('.set-row-btn-label'); if (saLbl) saLbl.textContent = tr('projectAccess'); }
    if (el('setHeading')) el('setHeading').textContent = tr('settings');
    if (el('setWhoLabel')) el('setWhoLabel').textContent = tr('signedInAs');
    if (el('setDisplayTitle')) el('setDisplayTitle').textContent = tr('display');
    if (el('setThemeLabel')) el('setThemeLabel').textContent = tr('theme');
    if (el('setLangLabel')) el('setLangLabel').textContent = tr('language');
    if (el('setClose')) el('setClose').textContent = tr('close');
    if (el('sideLabel')) el('sideLabel').textContent = tr('projects');
    if (el('setAboutTitle')) el('setAboutTitle').textContent = tr('about');
    if (el('setBuildK')) el('setBuildK').textContent = tr('build');
    if (el('setAdminK')) el('setAdminK').textContent = tr('adminLabel');
    // Back bars
    Array.prototype.forEach.call(document.querySelectorAll('.mobile-back-btn'), function (b) {
      var to = b.getAttribute('data-back-to');
      if (to === 'projects') b.textContent = tr('backProjects');
      if (to === 'list') b.textContent = tr('backMeetings');
    });
    // Re-render dynamic content that has translated strings baked in.
    if (typeof renderProjects === 'function' && Array.isArray(S.projects) && S.projects.length) renderProjects();
    if (typeof renderList === 'function' && Array.isArray(S.meetings)) renderList();
    if (S.activeProject === 'ALL' && !S.activeId && typeof renderDashboard === 'function') renderDashboard();
  }

  // Mobile single-pane stack navigation. .is-mobile is toggled in <head>;
  // .mobile-pane-* tracks which pane is currently visible on phones.
  function isMobile() { return document.documentElement.classList.contains('is-mobile'); }
  // Phones bypass Paged.js and scale a continuous document; every other
  // width paginates first and is scaled afterwards if the pane is narrow.
  function usesContinuousDoc() { return isMobile(); }

  // Tablet portrait keeps the meeting list as an overlay so the document has
  // room to be read. Below this width the list is absolutely positioned and
  // slid off-screen; at or above it the list is a real grid column and
  // .list-open matches nothing.
  //
  // Must stay in step with the @media (max-width: 900px) block in
  // Stylesheet.html — opening the overlay at a width where the CSS does not
  // define it leaves a class nothing can clear, which then takes effect the
  // moment the window is narrowed.
  var LIST_OVERLAY_MAX = 900;
  function listIsOverlay() {
    return !isMobile() && window.innerWidth <= LIST_OVERLAY_MAX;
  }
  function openList() { if (!listIsOverlay()) return; var b = el('body'); if (b) b.classList.add('list-open'); }
  function closeList() { var b = el('body'); if (b) b.classList.remove('list-open'); }
  if (el('listPeek')) el('listPeek').onclick = openList;
  // Tapping the dimmed document dismisses the overlay. The scrim is a
  // ::before on .detail, so the click lands on .detail itself.
  //
  // The .sidebar and #listPeek exemptions are what make this safe to run on
  // the same click that OPENED the panel: choosing a project calls
  // openList() and then bubbles up to here, and without them this handler
  // would close the panel again in the same tick. The sidebar drives the
  // list, so a click there must never dismiss it.
  document.addEventListener('click', function (e) {
    var b = el('body');
    if (!b || !b.classList.contains('list-open')) return;
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest('.list') || t.closest('.sidebar') || t.closest('#listPeek')) return;
    closeList();
  });
  function setMobilePane(pane) {
    var h = document.documentElement;
    h.classList.remove('mobile-pane-projects', 'mobile-pane-list', 'mobile-pane-detail');
    h.classList.add('mobile-pane-' + pane);
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== document) {
      if (t.classList && t.classList.contains('mobile-back-btn')) {
        setMobilePane(t.getAttribute('data-back-to') || 'projects');
        return;
      }
      t = t.parentNode;
    }
  });

  // Scale the rendered Doc iframe to fit the phone width without distorting its
  // 860px layout. Sizes the iframe to its full content, then transforms it down
  // and sizes the .paper to the visual (scaled) dimensions so vertical scroll works.
  // The layout width the rendered document is authored at (see .paper). The
  // sheet inside it is A4/210mm; this is the surrounding page box. Panes
  // narrower than this scale the whole thing down rather than clip it —
  // fitScaleToPane owns that decision, measuring the pane it is handed.
  var DOC_VIRTUAL_W = 860;

  // Scale an ALREADY-PAGINATED document into a narrow pane. Deliberately
  // does not set frame.style.height: fitFrame has just measured the real
  // paginated height, and overwriting it would clip the last page. Clears
  // the transform when the pane is wide enough, so widening a window
  // restores the sheet to full size.
  function fitScaleToPane(frame) {
    var paper = frame && frame.parentNode;
    var wrap = paper && paper.parentNode;
    if (!paper || !wrap) return;
    var cs = window.getComputedStyle(wrap);
    var padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    var availW = Math.max(0, (wrap.clientWidth || 0) - padX);
    var h = parseFloat(frame.style.height) || frame.offsetHeight || 0;
    if (!availW || availW >= DOC_VIRTUAL_W) {          // room for the full sheet
      frame.style.transform = '';
      frame.style.width = '';
      paper.style.width = '';
      paper.style.height = '';
      // Also drop a height left behind by applyMobileScale. Crossing the
      // 500px phone boundary re-toggles .is-mobile mid-session, and the
      // continuous-document height it set would otherwise stick on a frame
      // Paged.js never re-measures (onload does not fire again).
      if (!usesContinuousDoc()) frame.style.height = '';
      return;
    }
    var scale = availW / DOC_VIRTUAL_W;
    frame.style.width = DOC_VIRTUAL_W + 'px';
    frame.style.transformOrigin = 'top left';
    frame.style.transform = 'scale(' + scale + ')';
    // .paper carries the VISUAL size, so the outer scroll container sees
    // the scaled height rather than the pre-scale one.
    paper.style.width = (DOC_VIRTUAL_W * scale) + 'px';
    if (h) paper.style.height = (h * scale) + 'px';
  }

  function applyMobileScale(frame) {
    if (!frame || !frame.contentWindow) return;
    try {
      var doc = frame.contentWindow.document;
      var bodyH = doc.body.scrollHeight;
      var paper = frame.parentNode;
      var wrap = paper && paper.parentNode;
      if (!paper || !wrap) return;
      // clientWidth already excludes the scrollbar, but .frame-wrap carries
      // horizontal padding on desktop that the sheet cannot occupy; subtract
      // it or the scaled sheet overflows by exactly that much.
      var cs = window.getComputedStyle(wrap);
      var padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
      var availW = Math.max(0, (wrap.clientWidth || window.innerWidth) - padX);
      var virtualW = DOC_VIRTUAL_W;
      var scale = availW / virtualW;
      if (scale > 1) scale = 1;
      frame.style.width = virtualW + 'px';
      frame.style.height = bodyH + 'px';
      frame.style.border = '0';
      frame.style.transformOrigin = 'top left';
      frame.style.transform = 'scale(' + scale + ')';
      paper.style.width = (virtualW * scale) + 'px';
      paper.style.height = (bodyH * scale) + 'px';
    } catch (e) { /* cross-origin or not ready */ }
  }
  // Debounced: a drag-resize fires this continuously, and each call reads
  // layout out of the iframe.
  var docScaleTimer = null;
  function rescaleDoc(delay) {
    clearTimeout(docScaleTimer);
    // Bind the frame NOW, not when the timer fires: opening another meeting
    // in between replaces the srcdoc, and scaling that fresh frame would
    // measure an unpaginated document (min-height:80vh) and write a wrong
    // paper height until the pagination poll corrected it.
    var target = el('renderFrame');
    docScaleTimer = setTimeout(function () {
      var f = el('renderFrame');
      if (!f || f !== target) return;   // replaced meanwhile; its own onload will scale it
      // A frame still waiting on Paged.js has no measured height yet. Leave
      // it alone — fitScaleToPane runs inside fitFrame once pagination
      // settles, which is the authoritative moment.
      if (!usesContinuousDoc() && !parseFloat(f.style.height)) return;
      // Phones own the whole geometry (no Paged.js, height set by the
      // scaler); everywhere else Paged.js owns the height and only the
      // transform is ours, so the two cases need different scalers.
      // fitScaleToPane already clears itself when the pane is wide enough.
      if (usesContinuousDoc()) applyMobileScale(f);
      else fitScaleToPane(f);
    }, delay || 120);
  }
  window.addEventListener('resize', function () {
    // Widening out of the overlay band strands .list-open: the CSS stops
    // matching, so nothing on screen can clear it, and it would spring the
    // panel open again on the next narrowing.
    if (!listIsOverlay()) closeList();
    rescaleDoc(120);
  });
  window.addEventListener('orientationchange', function () { rescaleDoc(220); });

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var THAI_MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  // Thai letterhead date line, e.g. "วันที่ 12 มิถุนายน 2569". Returns '' when the
  // meeting has no parseable date (overviews), so callers can skip the line.
  function fmtThaiDate(m) {
    var p = String((m && m.date) || '').split('-');
    if (p.length !== 3) return '';
    var y = +p[0], mo = +p[1], d = +p[2];
    if (!y || mo < 1 || mo > 12 || !d) return '';
    return 'วันที่ ' + d + ' ' + THAI_MONTHS_FULL[mo - 1] + ' ' + (y + 543);
  }
  // One standard professional format everywhere: "21 May 2569" (Buddhist-era year).
  function fmtDate(m) {
    if (m.date) {
      var p = String(m.date).split('-');
      if (p.length === 3) {
        var y = +p[0], mo = +p[1], d = +p[2];
        if (y && mo >= 1 && mo <= 12 && d) return d + ' ' + MONTHS[mo - 1] + ' ' + (y + 543);
      }
    }
    if (m.kind === 'overview') return 'Overview';
    // last resort: original label minus time
    return String(m.dateLabel || '').replace(/\s*\d{1,2}\s*[:.]\s*\d{2}\s*(?:AM|PM|am|pm|น\.?)?\s*$/i, '').trim();
  }
  /* Date suffix for an exported PDF's filename: "d.m.yy" in the Buddhist
     era, matching how dates are shown everywhere else in the app.

     Falls back to parsing dateLabel when the ISO `date` column is empty (older
     rows, and anything the importer could not parse), and returns '' when
     there is no usable date at all — the filename then simply omits it rather
     than carrying something misleading like "NaN-NaN-NaN". */
  function pdfDateSuffix_(m) {
    var y, mo, d;
    if (m.date) {
      var p = String(m.date).split('-');
      if (p.length === 3) { y = +p[0]; mo = +p[1]; d = +p[2]; }
    }
    if (!(y && mo >= 1 && mo <= 12 && d)) {
      // dateLabel is free text ("18 Aug 2569", "18/08/2569"); take the first
      // d-m-y triple it yields.
      var lbl = String(m.dateLabel || '');
      var mm = lbl.match(/(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{2,4})/);
      if (mm) { d = +mm[1]; mo = +mm[2]; y = +mm[3]; }
    }
    if (!(y && mo >= 1 && mo <= 12 && d)) return '';
    // Stored years may be Gregorian or already Buddhist; normalise to Buddhist.
    if (y < 2400) y += 543;
    // Format matches the filenames already in the user's export folder
    // ("VCB Meeting Minutes 18.8.69"): dot-separated, NO zero padding, and a
    // 2-digit Buddhist year. Dots are legal in a filename on every OS; slashes
    // would not be.
    return d + '.' + mo + '.' + (y % 100);
  }

  function fmtTime(m) {
    var mm = String(m.time || '').match(/(\d{1,2}):(\d{2})/);
    return mm ? (mm[1].length < 2 ? '0' : '') + mm[0] + ' น.' : '';
  }

  /* ---------- Per-project access (admin) ----------
     A full-page workspace rather than a dialog. Each project card carries its

     is named instead of in a separate screen. */
  var AC_PROJECTS = [];   // last payload from the server, for filtering without a refetch
  var AC_FILTER = '';

  function openAccess() {
    el('acPage').classList.add('show');

    document.body.style.overflow = 'hidden';

    el('acEditors').innerHTML = '<div class="empty">Loading…</div>';
    gs('getProjectAccess', TOKEN).then(function (list) {

    }).catch(function (e) { toast('Failed: ' + (e.message || e)); });

    // admin lands back where they came from rather than on a bare app.

  el('acPageClose').onclick = closeAccess;
  // Esc closes the page, with two things deliberately taking precedence:
  //  1. any modal open ON TOP of it (the prompt/confirm dialogs listen on
  //     document too, so without this an Esc meant for the "Copy to…"
  //     prompt dismissed the prompt AND the whole panel behind it);
  //  2. a text input with something typed in it, where Esc should clear the
  //     field rather than throw away the screen.
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !el('acPage').classList.contains('show')) return;
    if (document.querySelector('.modal-bg.show')) return;

    if (t && t.tagName === 'INPUT' && t.value) { t.value = ''; if (t.id === 'acSearch') { AC_FILTER = ''; renderProjectAccess(); } return; }
    closeAccess();
  });

  Array.prototype.forEach.call(document.querySelectorAll('#acTabs .ac-tab'), function (tab) {

  // One filter box over both the project name and every address on it, so

  el('acSearch').oninput = function () {

  // Each editor row shows whether that person can actually SIGN IN yet. Being
  // on the list is only half of it — without a password they still cannot
  // identify themselves, which is exactly the trap the old build fell into
  // (allow-listed employees with no way in). "Set password" / "Reset" makes
  // that state visible and fixable from here.
  function renderEditors(list) {
    // list is either the plain email array (addEditor/removeEditor return that)
    // or the richer account objects from getEditorAccounts.
    var rows = (list || []).map(function (x) {
      return (typeof x === 'string') ? { email: x, hasPassword: null } : x;
    });
    el('acEditors').innerHTML = rows.map(function (r) {
      var badge = r.hasPassword === null ? ''
        : r.hasPassword
          ? (r.mustChange
              ? '<span style="font-size:11.5px;color:#9a6700;background:#fff8c5;border:1px solid #eac54f;border-radius:999px;padding:1px 8px;margin-left:8px;">must change</span>'
              : '<span style="font-size:11.5px;color:#1a7f37;background:#dafbe1;border:1px solid #aceebb;border-radius:999px;padding:1px 8px;margin-left:8px;">can sign in</span>')
          : '<span style="font-size:11.5px;color:#cf222e;background:#ffebe9;border:1px solid #ffcecb;border-radius:999px;padding:1px 8px;margin-left:8px;">no password</span>';
      return '<div class="ac-item"><span>' + esc(r.email) + badge + '</span>' +
        '<span style="display:flex;gap:6px;">' +
        '<button data-pw-e="' + esc(r.email) + '">' + (r.hasPassword ? 'Reset password' : 'Set password') + '</button>' +
        '<button data-editor-e="' + esc(r.email) + '">Remove</button>' +
        '</span></div>';
    }).join('') || '<div class="empty" style="padding:4px 0;">No editors yet.</div>';

    Array.prototype.forEach.call(el('acEditors').querySelectorAll('button[data-editor-e]'), function (b) {
      b.onclick = function () {

    Array.prototype.forEach.call(el('acEditors').querySelectorAll('button[data-pw-e]'), function (b) {
      b.onclick = function () {

          title: 'Set editor PIN', type: 'text', okLabel: 'Save'
        }).then(function (pw) {
          if (pw == null || pw === '') return;
          pw = String(pw).trim();
          // Validate here as well as on the server, so a typo gives an instant
          // answer instead of a round trip.
          if (!/^\d{4}$/.test(pw)) { toast('PIN must be exactly 4 digits.'); return; }
          showBusy('Saving…');
          gs('setEditorPassword', who, pw, TOKEN).then(function () {
            return loadEditors();
          }).then(function () {
            hideBusy();
            // Shown, not emailed: the admin hands it over in person or by
            // whatever channel they choose, and the employee is forced to
            // replace it on first sign-in.
            toast('PIN set for ' + who + ' — they must change it on first sign-in.');
          }).catch(function (e) {
            hideBusy();
            // Surface the REAL reason. A silent failure here is what made this
            // look like "I set it but it says no password".
            toast('Could not set PIN: ' + ((e && e.message) ? e.message : e));
          });

    });

  /* ---------- Shared team PIN ----------

     is stored recoverably so the admin can look it up to tell someone — its
     whole purpose is to be shared, and resetting it to "recover" it would
     lock out everyone else at once. Personal PINs stay one-way hashed and can
     never be shown, only replaced. */
  var SHARED_PIN_SHOWN = false;
  function renderSharedPin(st) {
    var on = !!(st && st.enabled);
    el('acSharedState').textContent = on
      ? (SHARED_PIN_SHOWN ? '' : 'Set — hidden')
      : 'Not set';
    el('acSharedState').style.display = (on && SHARED_PIN_SHOWN) ? 'none' : '';
    el('acSharedValue').style.display = (on && SHARED_PIN_SHOWN) ? '' : 'none';

  function loadSharedPin() {

  el('acSharedReveal').onclick = function () {

  el('acSharedSet').onclick = function () {

  // Prefer the richer account list (shows who can actually sign in); fall back

  el('acEditorAddBtn').onclick = function () {

  };
  // Draws every project card from AC_PROJECTS, honouring the filter box. Takes
  // no argument on purpose: server calls store their result in AC_PROJECTS and
  // then call this, so a re-render after a filter keystroke needs no refetch.
  function renderProjectAccess() {
    var q = AC_FILTER;
    var list = AC_PROJECTS.filter(function (p) {
      if (!q) return true;
      // Match the project name OR any address on it, so an admin can search by
      // person ("who is nattapong@ on?") as readily as by project.
      var hay = ((p.name || '') + ' ' + (p.nameEn || '') + ' ' + (p.emails || []).join(' ')).toLowerCase();
      return hay.indexOf(q) > -1;
    });

    el('acProjectsEmpty').style.display = list.length ? 'none' : '';

    // Standing banner while any locked project still has nobody named on it.
    // Locked + empty means admins and editors only, which is easy to set up
    // by accident and confusing to diagnose from the other side.
    var bare = AC_PROJECTS.filter(function (p) { return !p.isPublic && !(p.emails || []).length; });
    var warn = el('acBare');
    if (warn) {
      warn.style.display = bare.length ? '' : 'none';
      warn.innerHTML = bare.length
        ? '<b>' + bare.length + ' locked project' + (bare.length === 1 ? '' : 's') + ' with nobody named</b> — ' +
          'only admins and editors can see ' + (bare.length === 1 ? 'it' : 'them') + ' right now. ' +
          'Add the people who should have access, or set ' + (bare.length === 1 ? 'it' : 'them') + ' back to Public.'
        : '';
    }
    el('acProjects').innerHTML = list.map(function (p, idx) {
      var pid = p && p.id != null ? String(p.id) : ('IDX' + idx);
      var emails = p.emails || [];
      var body;
      if (p.isPublic) {

        // a control that does nothing. Say so instead of showing a dead input.
        body = '<div class="ac-public-note">Open to everyone — no sign-in needed, so there is no guest list to keep. ' +
               'Lock it to choose exactly who may see it' +
               (emails.length ? ', and the ' + emails.length + ' ' + (emails.length === 1 ? 'person' : 'people') + ' already named here will apply again.' : '.') +
               '</div>';

          ? '<div class="ac-chips">' + emails.map(function (e) {
              return '<span class="ac-chip"><span class="ac-chip-mail">' + esc(e) + '</span>' +
                '<button type="button" title="Remove ' + esc(e) + '" data-rm-p="' + esc(pid) + '" data-rm-e="' + esc(e) + '">&times;</button></span>';
            }).join('') + '</div>'

        body =

              (emails.length ? '<button type="button" class="ac-proj-copy" data-copy-p="' + esc(pid) + '">Copy to…</button>' : '') +
            '</div>' +

              '<button type="button" class="dbtn primary" data-add-p="' + esc(pid) + '">Add</button>' +
            '</div>' +

            '<span class="ac-proj-label">' + esc(p.name || pid) + '</span></div>' +
          '<button type="button" class="ac-lock-btn' + (p.isPublic ? ' unlocked' : '') + '" data-lock="' + esc(pid) + '" data-public="' + (p.isPublic ? '1' : '0') + '">' +
            (p.isPublic ? '🔓 Public' : '🔒 Locked') +

  // Applies the server's reply and redraws. Every mutating call ends here, so
  // the card list and the filter always agree with what was just saved.
  function acApply(list) { AC_PROJECTS = list || []; renderProjectAccess(); }

  function wireProjectCards() {
    var root = el('acProjects');

    Array.prototype.forEach.call(root.querySelectorAll('button[data-lock]'), function (b) {
      b.onclick = function () {
        var pid = b.getAttribute('data-lock');
        var willBePublic = b.getAttribute('data-public') !== '1';
        var go = function () {
          showBusy(willBePublic ? 'Unlocking…' : 'Locking…');
          gs('setProjectPublic', pid, willBePublic, TOKEN)
            .then(function (list) { hideBusy(); acApply(list); })
            .catch(function (e) { hideBusy(); toast('Failed: ' + (e.message || e)); });
        };
        try {
          if (willBePublic) {
            confirmDialog('Publish every meeting in this project? Anyone with the app link will be able to read them — any email domain, no sign-in required — and meetings added to this project later will be published too. Locking again will not re-hide meetings that were already published.', { title: 'Unlock project', okLabel: 'Unlock', danger: false }).then(function (ok) { if (ok) go(); });
          } else { go(); }
        } catch (e) { toast('Failed: ' + (e.message || e)); }
      };
    });

    // Add one or many. The server splits on commas/semicolons/whitespace and
    // rejects the whole batch if any entry is malformed, so a typo is reported
    // rather than half-saved.
    Array.prototype.forEach.call(root.querySelectorAll('button[data-add-p]'), function (b) {
      var pid = b.getAttribute('data-add-p');
      var inp = root.querySelector('input[data-add-in="' + pid + '"]');
      var submit = function () {
        var text = (inp.value || '').trim();
        if (!text) return;
        showBusy('Adding…');
        gs('addProjectViewers', pid, text, TOKEN).then(function (list) {
          hideBusy(); inp.value = ''; acApply(list);
          toast('Access updated.');
        }).catch(function (e) { hideBusy(); toast('Could not add: ' + ((e && e.message) ? e.message : e)); });
      };
      b.onclick = submit;
      // Enter submits, so adding several people in a row never needs the mouse.
      if (inp) inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
    });

    Array.prototype.forEach.call(root.querySelectorAll('button[data-rm-e]'), function (b) {
      b.onclick = function () {
        var pid = b.getAttribute('data-rm-p'), email = b.getAttribute('data-rm-e');
        showBusy('Removing…');
        gs('removeProjectViewer', pid, email, TOKEN)
          .then(function (list) { hideBusy(); acApply(list); })
          .catch(function (e) { hideBusy(); toast('Failed: ' + ((e && e.message) ? e.message : e)); });
      };
    });

    // Copy one list onto others. Several projects usually share an audience,
    // and retyping the same five addresses per project is how lists end up
    // quietly disagreeing with each other.
    Array.prototype.forEach.call(root.querySelectorAll('button[data-copy-p]'), function (b) {
      b.onclick = function () {
        var pid = b.getAttribute('data-copy-p');
        var targets = AC_PROJECTS.filter(function (p) { return String(p.id) !== pid && !p.isPublic; });
        if (!targets.length) { toast('No other locked project to copy to.'); return; }
        promptDialog(
          'Copy this list to which projects? Enter the numbers, separated by commas:\n\n' +
            targets.map(function (p, i) { return (i + 1) + '. ' + (p.name || p.id); }).join('\n'),
          { title: 'Copy access list', type: 'text', okLabel: 'Copy' }
        ).then(function (ans) {
          if (ans == null || !String(ans).trim()) return;
          var picked = String(ans).split(/[\s,;]+/).filter(Boolean).map(function (n) {
            var i = parseInt(n, 10); return (i >= 1 && i <= targets.length) ? targets[i - 1].id : null;
          }).filter(Boolean);
          if (!picked.length) { toast('No valid project number in that answer.'); return; }
          showBusy('Copying…');
          gs('copyProjectViewers', pid, picked, TOKEN).then(function (list) {
            hideBusy(); acApply(list);
            toast('Copied to ' + picked.length + ' project' + (picked.length === 1 ? '' : 's') + '.');
          }).catch(function (e) { hideBusy(); toast('Failed: ' + ((e && e.message) ? e.message : e)); });
        });
      };
    });
  }

  /* ---------- Settings sheet (mobile + desktop ⚙ gear) ---------- */
  function openSettings() {
    el('setWho').textContent = (BOOTSTRAP.user || 'Signed in with Google') + (BOOTSTRAP.isAdmin ? ' · admin' : (BOOTSTRAP.isEditor ? ' · editor' : ''));
    el('setAccess').style.display = BOOTSTRAP.isAdmin ? '' : 'none';
    el('setAdminLogin').style.display = BOOTSTRAP.isAdmin ? 'none' : '';
    el('setAdminLogout').style.display = BOOTSTRAP.isAdmin ? '' : 'none';
    // Sync segment-button highlights to current state every time we open.
    applyTheme(document.documentElement.classList.contains('theme-dark') ? 'dark' : 'light');
    applyLang(currentLang());
    // Populate build string from the deployment URL so it updates per deploy.
    if (el('setBuildV')) {
      var u = (BOOTSTRAP.execUrl || '').split('/s/')[1] || '';
      var depId = u.split('/')[0] || '';
      el('setBuildV').textContent = depId ? depId.slice(-10) : '—';
    }
    el('setBg').classList.add('show');
  }
  function closeSettings() { el('setBg').classList.remove('show'); }
  el('settingsBtn').onclick = openSettings;
  el('settingsBtnD').onclick = openSettings;
  el('setClose').onclick = closeSettings;
  el('setBg').onclick = function (e) { if (e.target === el('setBg')) closeSettings(); };
  el('setAccess').onclick = function () { closeSettings(); openAccess(); };
  el('setAdminLogin').onclick = function () {
    promptDialog('Admin password', { title: 'Admin login', type: 'password', okLabel: 'Log in' }).then(function (pw) {
      if (pw == null || pw === '') return;
      showBusy('Signing in…');
      gs('adminLogin', pw).then(function (res) {
        TOKEN = res.token; setToken(TOKEN);
        return refreshAll();
      }).then(function () {
        hideBusy(); toast('Signed in as admin'); openSettings();
      }).catch(function (e) { hideBusy(); toast('Failed: ' + (e.message || e)); });
    });
  };
  el('setAdminLogout').onclick = function () {
    showBusy('Signing out…');
    gs('signOut', TOKEN).then(function () {
      TOKEN = ''; setToken('');
      return refreshAll();
    }).then(function () { hideBusy(); applyAdminUI(); openSettings(); }).catch(function (e) { hideBusy(); toast('Failed: ' + (e.message || e)); });
  };
  // Theme + Language + Reading size segment clicks
  Array.prototype.forEach.call(document.querySelectorAll('#themeSeg .set-seg-opt'), function (b) {
    b.onclick = function () { applyTheme(b.getAttribute('data-theme')); };

  Array.prototype.forEach.call(document.querySelectorAll('#langSeg .set-seg-opt'), function (b) {
    b.onclick = function () { applyLang(b.getAttribute('data-lang')); };

  // Fathom Inbox and Transkriptor Inbox are standalone review queues, not part
  // of "All meetings" — each has its own tile/count and must never be folded
  // into the ALL aggregate.
  var FATHOM_INBOX_ID = 'FATHOM_INBOX';
  var TRANSKRIPTOR_INBOX_ID = 'TRANSKRIPTOR_INBOX';

  function renderProjects() {

    var total = S.projects.reduce(function (a, p) { return isInboxProject_(p.id) ? a : a + p.count; }, 0);
    var html = '';
    html += projRow({ id: 'ALL', name: tr('allMeetings'), nameEn: tr('allMeetingsSub'), color: '#0b3d62', count: total });
    S.projects.forEach(function (p) { html += projRow(p); });
    el('projects').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('.proj'), function (node) {
      node.onclick = function (e) {

  // Rename is only offered for real, admin-editable projects — not the ALL
  // aggregate tile and not the inbox pseudo-projects (their name/id are fixed by design).
  function projRow(p) {
    var active = S.activeProject === p.id ? ' active' : '';
    var canRename = BOOTSTRAP.isAdmin && p.id !== 'ALL' && !isInboxProject_(p.id);

  // Non-interactive placeholder shown the instant the projects pane paints,
  // before any meeting data (cached or fresh) is available. Reserves the same
  // 2-up grid footprint as the real tiles so the project list below it never
  // shifts once renderMobileLatest() swaps in real content — without this,
  // the project tiles sat at the very top (nothing above them yet) and then

  function renderMobileLatestSkeleton() {

  }

  // Compact "latest 2" strip shown at the top of the mobile projects pane.
  // Hidden on desktop via CSS; we still render it cheaply on every refresh
  // so it stays in sync after edits / new meetings.
  function renderMobileLatest() {
    var node = el('mobileLatest');
    if (!node || !Array.isArray(S.meetings)) return;
    var latest = S.meetings.filter(function (m) {
      if (m.kind === 'overview') return false;
      if (isInboxProject_(m.projectId)) return false;
      if (BOOTSTRAP.isAdmin) return true;
      return m.visible !== false;
    }).sort(function (a, b) {

    }).slice(0, 2);
    if (!latest.length) { node.innerHTML = ''; return; }
    node.innerHTML = '<div class="ml-label">' + tr('latestMeetings') + '</div>' +
      latest.map(function (m) {
        var p = S.byId[m.projectId] || {};
        return '<div class="ml-item" data-id="' + m.id + '" style="--c:' + (p.color || '#888') + '">' +
          '<div class="ml-proj">' + esc(p.name || '') + '</div>' +
          '<div class="ml-date">🗓 ' + esc(fmtDate(m)) + (fmtTime(m) ? ' · ' + esc(fmtTime(m)) : '') + '</div>' +
          '<div class="ml-ttl">' + esc(m.title) + '</div>' +
          '<div class="ml-ex">' + esc(m.excerpt || '') + '</div>' +
          '<div class="ml-read">' + tr('readMinutes') + '</div>' +
        '</div>';
      }).join('');
    Array.prototype.forEach.call(node.querySelectorAll('.ml-item'), function (n) {

  /* ---------- Time-range filter ---------- */
  function pad2_(n) { return (n < 10 ? '0' : '') + n; }
  function isoOf(d) { return d.getFullYear() + '-' + pad2_(d.getMonth() + 1) + '-' + pad2_(d.getDate()); }
  function rangeCutoff(range) {
    var now = new Date();
    if (range === 'week') { var d = new Date(now); var dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return isoOf(d); }
    if (range === 'month') { return isoOf(new Date(now.getFullYear(), now.getMonth(), 1)); }
    return null;
  }
  function inRange(m, range) {
    if (range === 'all') return true;
    if (!m.date) return false;
    return m.date >= rangeCutoff(range);
  }
  function countInRange(range) {
    if (!Array.isArray(S.meetings)) return 0;
    return S.meetings.filter(function (m) {
      if (S.activeProject === 'ALL') { if (isInboxProject_(m.projectId)) return false; }
      else if (m.projectId !== S.activeProject) return false;
      return inRange(m, range);
    }).length;
  }
  function chooseDefaultRange() { S.range = 'all'; }
  function renderRangeFilter() {
    var labels = { all: 'All', week: 'This week', month: 'This month' };
    el('rangeFilter').innerHTML = ['all', 'week', 'month'].map(function (r) {
      return '<button data-r="' + r + '" class="' + (S.range === r ? 'active' : '') + '">' +
        labels[r] + ' <span class="n">' + countInRange(r) + '</span></button>';
    }).join('');
    Array.prototype.forEach.call(el('rangeFilter').querySelectorAll('button'), function (b) {
      b.onclick = function () { S.range = b.getAttribute('data-r'); renderList(); };
    });
  }

  /* ---------- Meeting list ---------- */
  function visibleMeetings() {
    var q = S.query.trim().toLowerCase();
    if (!Array.isArray(S.meetings)) return [];
    return S.meetings.filter(function (m) {
      if (S.activeProject === 'ALL') { if (isInboxProject_(m.projectId)) return false; }
      else if (m.projectId !== S.activeProject) return false;
      if (!inRange(m, S.range)) return false;
      if (q) {
        var attHay = (m.attendees || []).join(' ');
        var hay = (m.title + ' ' + (m.dateLabel || '') + ' ' + (m.excerpt || '') + ' ' + attHay).toLowerCase();
        var qTrimmed = S.query.trim();
        var searchMatch = S.searchMatchIds[qTrimmed] && S.searchMatchIds[qTrimmed][m.id];
        if (hay.indexOf(q) === -1 && !searchMatch) return false;
      }
      return true;
    }).sort(function (a, b) {
      if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
      var ova = a.kind === 'overview' ? 1 : 0, ovb = b.kind === 'overview' ? 1 : 0;
      if (ova !== ovb) return ova - ovb;            // overviews to the bottom
      return (b.date || '0000-00-00').localeCompare(a.date || '0000-00-00'); // newest first
    });
  }

  function renderList() {
    renderMobileLatest();
    var bodyEl = el('body');
    if (S.activeProject === 'TIMELINE') {
      // timeline-mode: the Timeline project is selected (drives the grid).
      // timeline-only: the timeline VIEW is actually on screen, i.e. no
      // meeting is open. Opening one from a dot leaves activeProject on
      // TIMELINE, so the rules that hide the meeting list must key off the
      // narrower class or that screen becomes a dead end.
      if (bodyEl) {
        bodyEl.classList.add('timeline-mode');
        bodyEl.classList.toggle('timeline-only', !S.activeId);
      }
      el('listHead').textContent = 'Timeline';
      el('rangeFilter').innerHTML = '';
      el('cards').innerHTML = '';
      renderTimeline();
      return;
    }
    if (bodyEl) bodyEl.classList.remove('timeline-mode', 'timeline-only');
    renderRangeFilter();
    var items = visibleMeetings();
    var label = S.activeProject === 'ALL' ? tr('allMeetings') : (S.byId[S.activeProject] || {}).name;
    // Before the first data load finishes (and nothing was cached), show a loader
    // instead of "0 records / No meetings match." — that empty state misleads users
    // into thinking there's no data while it's still being fetched.
    if (!S.loaded && !items.length) {
      el('listHead').textContent = label;
      el('cards').innerHTML = '<div class="empty"><span class="spin" style="border-color:#ccc;border-top-color:#0b3d62"></span><br><br>Loading…</div>';
      return;
    }
    var recWord = (items.length === 1 ? tr('records') : tr('recordsPlural'));
    // While the full-content search is still in flight, the count shown is
    // only the instant client-side match (title/date/excerpt/attendees) —
    // label it explicitly so it doesn't read as a final, complete count that
    // then silently jumps once the deeper server search lands.
    el('listHead').textContent = label + ' · ' + items.length + ' ' + recWord + (S.searching ? ' · searching…' : '');
    if (!items.length && S.searching) {
      el('cards').innerHTML = '<div class="empty"><span class="spin" style="border-color:#ccc;border-top-color:#0b3d62"></span><br><br>Searching…</div>';
      return;
    }
    if (!items.length) { el('cards').innerHTML = '<div class="empty">No meetings match.</div>'; return; }
    el('cards').innerHTML = items.map(function (m) {
      var p = S.byId[m.projectId] || { color: '#888' };
      var badges = '';
      if (BOOTSTRAP.isAdmin && !m.visible) badges += '<span class="badge hiddenb">🚫 Hidden</span>';
      if (m.pinned) badges += '<span class="badge pin" title="Pinned">★</span>';
      if (m.kind === 'overview') badges += '<span class="badge overview">Overview</span>';
      if (m.hasFathom) badges += '<span class="badge fathom">▶ Fathom</span>';
      if (m.source === 'transkriptor') badges += '<span class="badge fathom">▤ Transkriptor</span>';
      if (m.attachmentCount) badges += '<span class="badge manual">📎 ' + m.attachmentCount + '</span>';
      var active = (m.id === S.activeId ? ' active' : '') + (BOOTSTRAP.isAdmin && !m.visible ? ' ishidden' : '');
      return '<div class="card' + active + '" data-id="' + m.id + '">' +
        '<div class="meta"><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + p.color + '"></span>' +
        '<span class="date">' + esc(fmtDate(m)) + (fmtTime(m) ? ' · ' + esc(fmtTime(m)) : '') + '</span>' + badges + '</div>' +
        '<div class="ttl">' + esc(m.title) + '</div>' +
        '<div class="ex">' + esc(m.excerpt || '') + '</div></div>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.card'), function (node) {
      node.onclick = function () { openMeeting(node.dataset.id); };
    });
  }

  /* ---------- Dashboard (Latest) ---------- */
  function latestPerProject() {
    var by = {};
    S.meetings.forEach(function (m) {
      if (m.kind === 'overview') return;
      var cur = by[m.projectId];
      if (!cur || (m.date || '') > (cur.date || '')) by[m.projectId] = m;
    });
    return by;
  }
  function renderDashboard() {
    var by = latestPerProject();
    var projectsWithMeetings = S.projects.filter(function (p) { return !isInboxProject_(p.id) && by[p.id]; });
    // Desktop shows at most the 6 most-recently-updated projects — beyond
    // that the grid just kept growing with every new project, past the
    // point of being a quick "what's new" glance (2026-07-24). Mobile is
    // unaffected (its own separate, already-compact card layout).
    if (!isMobile()) {
      projectsWithMeetings = projectsWithMeetings.slice().sort(function (a, b) {
        return (by[b.id].date || '').localeCompare(by[a.id].date || '');
      }).slice(0, 6);
    }
    var cards = projectsWithMeetings.map(function (p) {
      var m = by[p.id];
      return '<div class="dash-card" data-id="' + m.id + '" style="--c:' + p.color + '">' +
        '<div class="dash-proj"><span class="dot" style="background:' + p.color + '"></span>' + esc(p.name) + '</div>' +
        '<div class="dash-date">🗓 ' + esc(fmtDate(m)) + (fmtTime(m) ? ' · ' + esc(fmtTime(m)) : '') + (m.hasFathom ? ' &nbsp;<span class="badge fathom">▶ Fathom</span>' : '') + (m.source === 'transkriptor' ? ' &nbsp;<span class="badge fathom">▤ Transkriptor</span>' : '') + '</div>' +
        '<div class="dash-ttl">' + esc(m.title) + '</div>' +
        '<div class="dash-ex">' + esc(m.excerpt || '') + '</div>' +
        '<div class="dash-read">' + tr('readMinutes') + '</div></div>';
    }).join('');
    el('detailContent').innerHTML =
      '<div class="dash-wrap"><div class="dash-head"><h2>' + tr('latestMeetings') + '</h2>' +
      '<p>The most recent minutes from each project — click any card to read the full record.</p></div>' +
      '<div class="dash-grid">' + (cards || '<div class="empty">No meetings to show yet.</div>') + '</div></div>';
    Array.prototype.forEach.call(document.querySelectorAll('.dash-card'), function (node) {
      node.onclick = function () { openMeeting(node.dataset.id); };
    });

  /* ---------- Project dashboard (2 latest for one project) ---------- */
  function projectLatest(projectId, n) {
    return S.meetings.filter(function (m) {
      return m.projectId === projectId && m.kind !== 'overview';
    }).sort(function (a, b) {
      if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
      return (b.date || '0000-00-00').localeCompare(a.date || '0000-00-00');
    }).slice(0, n || 2);
  }

  // Pull a few short, skimmable highlights out of the meeting's rendered HTML.
  // Prefer the Doc's own list items; fall back to its first substantive paragraphs.
  // Each point is trimmed to one concise clause so the whole meeting reads at a glance.
  function concise(t) {
    t = (t || '').replace(/\s+/g, ' ').trim();
    // Points are often written as "label | detail" or "label: detail" — the detail is
    // the substance, so keep that and drop the throwaway label prefix.
    var parts = t.split(/\s[|｜]\s|：\s?|:\s/);
    if (parts.length > 1) {
      var detail = parts.slice(1).join(' · ').trim();
      if (detail.length >= 12) t = detail;
    }
    if (t.length > 140) t = t.slice(0, 138).replace(/\s+\S*$/, '').trim() + '…';
    return t;
  }
  function bulletsFromHtml(html, max) {
    max = max || 4;
    var div = document.createElement('div');
    div.innerHTML = html || '';
    var out = [], seen = {};
    function push(raw) {
      var t = concise(raw);
      var key = t.slice(0, 24);
      if (t.length < 6 || seen[key]) return;
      seen[key] = 1; out.push(t);
    }
    var lis = div.querySelectorAll('li');
    for (var i = 0; i < lis.length && out.length < max; i++) push(lis[i].textContent);
    if (!out.length) {
      var ps = div.querySelectorAll('p, h2, h3');
      for (var j = 0; j < ps.length && out.length < max; j++) {
        if ((ps[j].textContent || '').trim().length >= 24) push(ps[j].textContent);
      }
    }
    return out;
  }

  // Section headings used across the meeting docs (Thai + English variants).
  var SUMMARY_RE = /สรุปผู้บริหาร|บทสรุป|executive\s*summary|key\s*takeaway|ประเด็นสำคัญ/i;
  var ACTION_RE = /action\s*item|รายการที่ต้องดำเนินการ|รายการที่ต้องทำ|สิ่งที่ต้องทำ|สิ่งที่ต้องดำเนินการ|ขั้นตอนถัดไป|ขั้นตอนต่อไป|มอบหมายงาน|next\s*step/i;

  function docFrom(html) { var d = document.createElement('div'); d.innerHTML = html || ''; return d; }
  function headingRank(node) {
    if (!node || node.nodeType !== 1) return 0;
    return /^H[1-6]$/.test(node.tagName) ? +node.tagName.charAt(1) : 0;
  }

  // Pull a whole section (its heading's content up to the next same-or-higher heading)
  // out of the rendered Doc HTML, returning clean inner HTML — or '' if not found.
  function sectionHtml(root, re) {
    var els = root.children;
    for (var i = 0; i < els.length; i++) {
      var r = headingRank(els[i]);
      if (!r || !re.test((els[i].textContent || '').replace(/\s+/g, ' '))) continue;
      var wrap = document.createElement('div');
      for (var j = i + 1; j < els.length; j++) {
        var ej = els[j], rj = headingRank(ej);
        if (rj && rj <= r) break;                       // next same/higher heading ends the section
        if (!(ej.textContent || '').trim() && !ej.querySelector('img,table,hr')) continue; // drop blank spacers
        wrap.appendChild(ej.cloneNode(true));
      }
      Array.prototype.forEach.call(wrap.querySelectorAll('*'), function (e) {
        ['style', 'class', 'id', 'width', 'height', 'align', 'dir'].forEach(function (a) { e.removeAttribute(a); });
      });
      return wrap.innerHTML.trim();
    }
    return '';
  }

  function loadSummary(m) {
    function fill(html) {
      var box = el('sum_' + m.id);
      if (!box) return;
      var root = docFrom(html);
      var summary = sectionHtml(root, SUMMARY_RE);
      var parts = '';
      if (summary) parts += '<div class="seclabel">📌 บทสรุปผู้บริหาร · Executive Summary</div><div class="secbody">' + summary + '</div>';
      if (!parts) {                                       // older docs without this section — fall back to bullets
        var bl = bulletsFromHtml(html, 4);
        parts = bl.length
          ? '<ul class="dash-bullets">' + bl.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul>'
          : '<div class="bmuted">' + esc(concise(m.excerpt) || 'Open to read the full minutes.') + '</div>';
      }
      box.innerHTML = parts;
    }
    if (S.contentCache[m.id]) { fill(S.contentCache[m.id].html); return; }
    gs('getMeeting', m.id, TOKEN).then(function (full) {
      if (full) { S.contentCache[m.id] = full; fill(full.html); } else fill('');
    }).catch(function () { fill(''); });
  }

  function renderProjectDashboard() {
    var p = S.byId[S.activeProject] || {};
    var items = projectLatest(S.activeProject, 1);
    if (!items.length) {
      el('detailContent').innerHTML = '<div class="placeholder"><div class="big">📄</div><div>No meetings yet for ' + esc(p.name || 'this project') + '.</div></div>';
      return;
    }
    var m = items[0];
    // The meeting title is often just the date — don't repeat it under the formatted date line.
    var titleIsDate = /25\d{2}/.test(m.title || '');
    var card = '<div class="pbig-card" data-id="' + m.id + '" style="--c:' + (p.color || '#888') + '">' +
      '<div class="pbig-ttl">🗓 ' + esc(fmtDate(m)) + (fmtTime(m) ? ' · ' + esc(fmtTime(m)) : '') + (m.pinned ? ' &nbsp;<span class="badge pin" title="Pinned">★</span>' : '') + (m.hasFathom ? ' &nbsp;<span class="badge fathom">▶ Fathom</span>' : '') + (m.source === 'transkriptor' ? ' &nbsp;<span class="badge fathom">▤ Transkriptor</span>' : '') + '</div>' +
      (titleIsDate ? '' : '<div class="pbig-sub">' + esc(m.title) + '</div>') +
      '<div class="pbig-body" id="sum_' + m.id + '"><div class="bmuted">Loading summary…</div></div>' +
      '<div class="dash-read">' + tr('readMinutes') + '</div></div>';
    el('detailContent').innerHTML =
      '<div class="dash-wrap"><div class="dash-head"><h2><span class="dot" style="display:inline-block;width:11px;height:11px;border-radius:50%;background:' + (p.color || '#888') + ';vertical-align:middle;margin-right:7px"></span>' + esc(p.name || '') + ' — ' + tr('latestMeetings') + '</h2>' +
      '<button type="button" class="dbtn" id="d_shareProject" title="Copy a permanent link that always opens this project\'s latest meeting">🔗 Share latest-meeting link</button>' +
      '<p>Executive summary and action items from the most recent meeting — click to read the full record.</p></div>' +
      card + '</div>';
    var node = el('detailContent').querySelector('.pbig-card');
    if (node) node.onclick = function (e) { if (e.target.closest && e.target.closest('a')) return; openMeeting(m.id); };
    var shareBtn = el('d_shareProject');
    if (shareBtn) shareBtn.onclick = function () { shareProjectLink(S.activeProject); };
    loadSummary(m);
  }

  // Warm the content cache for each project's latest meeting in the background so the
  // project-tab summary appears instantly on click instead of waiting on a fetch.
  function prefetchLatest() {
    if (!Array.isArray(S.projects)) return;
    S.projects.forEach(function (p) {

      style.textContent = buildEditorPageCss_();
