<script>
/* ============================================================
   Onboarding checklist progress: employee identification,
   task completion state, backend sync, toast celebrations.
   ============================================================ */

var EMPLOYEE_NAME = null;
var EMPLOYEE_DEPARTMENT = null;
var PROGRESS_CACHE = {};   // taskId -> true
var PROGRESS_LOADED = false;
var PROGRESS_LOAD_PROMISE = null;

/* Departments a new employee can belong to — one only. Prefix matches the
   page-key namespace used by each department's phase pages (see content.html). */
/* headOfDept mirrors the "lead" name on each department's card in
   content.html's deptgrid — duplicated here (rather than reached for
   across files) so the completion certificate's signature block (see
   buildCompletionCertificateHtml) can print who that signature line
   belongs to without threading PAGES data through. */
/* landingPage is each department's deptLanding() page key (Meet Your
   Supervisor / Department Overview / etc.) — mostly "<id>-team" but
   property breaks that pattern ("property-asset-management", matching its
   PAGES key in content.html), so it's spelled out explicitly here rather
   than derived from id/prefix by string surgery. Used by the phase-trail's
   "Back to Team" link (see renderPhaseTrail in app.html). */
var DEPARTMENTS = [
  { id: 'accounting', label: 'Accounting Team', shortLabel: 'Accounting', prefix: 'accounting-', landingPage: 'accounting-team', headOfDept: 'Mrs. Wanpen Yamploy, Head of Accounting' },
  { id: 'finance', label: 'Finance Team', shortLabel: 'Finance', prefix: 'finance-', landingPage: 'finance-team', headOfDept: 'Mr. Vivich Chavananand, Head of Finance' },
  { id: 'procurement', label: 'Procurement Team', shortLabel: 'Procurement', prefix: 'procurement-', landingPage: 'procurement-team', headOfDept: 'Mrs. Thongthip Chavananand, Head of Procurement' },
  { id: 'property', label: 'Property & Asset Management', shortLabel: 'Property', prefix: 'property-', landingPage: 'property-asset-management', headOfDept: 'Mr. Watcharit Chavananand, Head of Asset Management' },
  { id: 'engineering', label: 'Engineering Team', shortLabel: 'Engineering', prefix: 'engineering-', landingPage: 'engineering-team', headOfDept: 'Mr. Vivat Chavananand, Head of Engineering' }
];

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function getEmployeeName() {
  if (EMPLOYEE_NAME) return EMPLOYEE_NAME;
  try { EMPLOYEE_NAME = localStorage.getItem('vcb-employee-name') || null; } catch (e) {}
  return EMPLOYEE_NAME;
}

function setEmployeeName(name) {
  EMPLOYEE_NAME = name;
  try { localStorage.setItem('vcb-employee-name', name); } catch (e) {}
}

function getEmployeeDepartment() {
  if (EMPLOYEE_DEPARTMENT) return EMPLOYEE_DEPARTMENT;
  try { EMPLOYEE_DEPARTMENT = localStorage.getItem('vcb-employee-department') || null; } catch (e) {}
  return EMPLOYEE_DEPARTMENT;
}

function setEmployeeDepartment(deptId) {
  EMPLOYEE_DEPARTMENT = deptId;
  try { localStorage.setItem('vcb-employee-department', deptId); } catch (e) {}
}

/* Junior/Senior track — chosen once on the department landing page (see
   deptLanding's level picker in content.html) and applies for that whole
   department's checklists. Defaults to 'junior' (the baseline task set)
   whenever nothing has been chosen yet, rather than null, so every piece of
   code that filters items by level (renderSectionContent, getPageTaskIds,
   the completion certificate) can compare against it unconditionally. */
var EMPLOYEE_LEVEL = null;
function getEmployeeLevel() {
  if (EMPLOYEE_LEVEL) return EMPLOYEE_LEVEL;
  try { EMPLOYEE_LEVEL = localStorage.getItem('vcb-employee-level') || 'junior'; } catch (e) { EMPLOYEE_LEVEL = 'junior'; }
  return EMPLOYEE_LEVEL;
}
function setEmployeeLevel(level) {
  EMPLOYEE_LEVEL = level;
  try { localStorage.setItem('vcb-employee-level', level); } catch (e) {}
}
/* An item is visible to the current employee unless it's tagged senior-only
   (see sr()/itemLevel in content.html) and the employee is on the Junior
   track — Senior sees everything, Junior sees only the untagged baseline. */
function isItemVisible(item) {
  return itemLevel(item) !== 'senior' || getEmployeeLevel() === 'senior';
}

/* Reverse lookup: a checklist item's own permanent id (see it()/itemId() in
   content.html) -> the pageKey of the phase page it lives on. Task ids no
   longer embed their pageKey the way the old "pageKey::section::item"
   scheme did (a stable id can't encode its own current location without
   reintroducing the exact fragility it exists to avoid — an item's page
   never changes today, but nothing should assume that going forward), so
   anything that needs "which phase page does this task belong to" (locking,
   department inference) looks it up here instead of parsing the id. Built
   once and cached, same pattern as TASK_IDS_CACHE_BY_DEPT_LEVEL further
   down. */
var PAGE_KEY_BY_TASK_ID_CACHE = null;
function getPageKeyByTaskId() {
  if (PAGE_KEY_BY_TASK_ID_CACHE) return PAGE_KEY_BY_TASK_ID_CACHE;
  var map = {};
  Object.keys(PAGES).forEach(function (pageKey) {
    (PAGES[pageKey].sections || []).forEach(function (sec) {
      if (sec.type !== 'checklist') return;
      sec.items.forEach(function (item) {
        var id = itemId(item);
        if (id) map[id] = pageKey;
      });
    });
  });
  PAGE_KEY_BY_TASK_ID_CACHE = map;
  return map;
}
function pageKeyFromTaskId(taskId) {
  return getPageKeyByTaskId()[taskId] || null;
}

/* All 8 pre-boarding document IDs (see content.html's Required Documents
   doclist) — used to know when that step of the journey is fully done.
   Each document's completion is tracked as taskId "doc::<docId>" through the
   same PROGRESS_CACHE/setTaskDone path as department checklist tasks, so it
   rides the same Sheet-backed persistence rather than a separate mechanism. */
var REQUIRED_DOC_IDS = [
  'employment-contract', 'application-form', 'nda', 'pdpa-consent',
  'pdpa-policy', 'anti-corruption', 'reporting-form', 'tax-form'
];

function isDocDone(docId) {
  return !!PROGRESS_CACHE['doc::' + docId];
}

function areRequiredDocsComplete() {
  return REQUIRED_DOC_IDS.every(isDocDone);
}

/* Human-readable titles of whichever required documents aren't done yet —
   looked up from PAGES['required-documents']'s own doclist (content.html)
   rather than a second hardcoded id->title map that could drift out of
   sync with it. Used by the Department Selection gate (see the dept-card
   click handler in app.html) to tell the employee exactly what's still
   missing instead of just refusing the click. */
function getMissingRequiredDocTitles() {
  var docsSection = ((PAGES['required-documents'] || {}).sections || []).filter(function (s) { return s.type === 'doclist'; })[0];
  var docs = (docsSection && docsSection.docs) || [];
  return docs.filter(function (d) { return !isDocDone(d.id); }).map(function (d) { return d.title; });
}

/* Manual "Complete" checkbox on a document card — same optimistic-update +
   backend-sync pattern as toggleTask, but scoped to a single doc task id. */
function toggleDocTask(taskId, docId, checkboxEl) {
  ensureEmployeeNamed(function (name) {
    var newState = !isDocDone(docId);
    PROGRESS_CACHE[taskId] = newState;
    checkboxEl.checked = newState;
    updateDocCardUI(docId);
    if (newState) showRewardToast();
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      syncTaskDone(name, taskId, newState, checkboxEl, function () {
        updateDocCardUI(docId);
      });
    }
  });
}

/* Upload flow: opens a hidden file input, reads the chosen file as base64,
   sends it to Code.gs (uploadRequiredDocument) which saves it to Drive and
   marks the doc task done server-side, then reflects that locally. */
function triggerDocUpload(docId) {
  ensureEmployeeNamed(function (name) {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.pdf,.jpg,.jpeg,.png,.doc,.docx';
    input.addEventListener('change', function () {
      var file = input.files[0];
      if (file) handleDocFileSelected(docId, file);
    });
    input.click();
  });
}

/* Apps Script's google.script.run payload ceiling is ~50MB, and base64
   inflates a file by ~33%, so the real limit is well under that. 10MB is a
   comfortable margin that still accommodates a phone photo of a document.
   Checked BEFORE reading the file: previously there was no size check at
   all on either side, so an oversized scan failed the RPC and showed
   "Upload failed. Please try again." — advice that could never work, since
   retrying the same file failed identically every time. */
var MAX_DOC_UPLOAD_BYTES = 10 * 1024 * 1024;

function handleDocFileSelected(docId, file) {
  var btn = document.querySelector('.doc-upload-btn[data-doc-id="' + docId + '"]');
  if (file.size > MAX_DOC_UPLOAD_BYTES) {
    alert(t('That file is too large (limit 10MB). Please upload a smaller scan or photo.'));
    return;
  }
  if (file.size === 0) {
    alert(t('That file is empty. Please choose a different file.'));
    return;
  }
  if (btn) btn.classList.add('is-uploading');
  var reader = new FileReader();
  /* Previously unhandled: a FileReader failure left the button stuck in
     is-uploading forever with no error and no way back short of a reload. */
  reader.onerror = function () {
    if (btn) btn.classList.remove('is-uploading');
    alert(t('Could not read that file. Please try a different one.'));
  };
  reader.onload = function () {
    var base64 = String(reader.result).split(',')[1] || '';
    var name = getEmployeeName();
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (res) {
          PROGRESS_CACHE['doc::' + docId] = true;
          /* The server returns { fileUrl, fileName } and this used to
             discard it entirely — so the employee got no confirmation of
             WHAT had been received, and no way to check it. Remember it so
             updateDocCardUI can show a link to the actual file. */
          if (res && res.fileUrl) setUploadedDocInfo(docId, res);
          if (btn) btn.classList.remove('is-uploading');
          updateDocCardUI(docId);
          showRewardToast();
        })
        .withFailureHandler(function (err) {
          if (btn) btn.classList.remove('is-uploading');
          /* Surface the server's actual reason (e.g. the file-type
             rejection) rather than a blanket "try again" that gives the
             employee nothing to act on. */
          var msg = err && err.message ? String(err.message) : '';
          alert(msg ? t('Upload failed') + ': ' + msg : t('Upload failed. Please try again.'));
        })
        .uploadRequiredDocument(name, docId, file.name, file.type, base64);
    } else {
      /* No Apps Script backend available (e.g. local preview) — still let
         the employee mark progress locally so the flow is testable. */
      PROGRESS_CACHE['doc::' + docId] = true;
      if (btn) btn.classList.remove('is-uploading');
      updateDocCardUI(docId);
      showRewardToast();
    }
  };
  reader.readAsDataURL(file);
}

/* Refreshes both progress displays that live outside the checklist/doc card
   itself — the sidebar stepper and the "Your Onboarding Progress" bar under
   the hero. Called after every task/doc toggle so both stay live instead of
   only updating on the next full page navigation. */
function refreshProgressDisplays() {
  var sidebarPanel = document.getElementById('sidebar-progress');
  if (sidebarPanel) renderSidebarProgress(sidebarPanel);
  var progressWidget = document.getElementById('overall-progress-widget');
  if (progressWidget) renderOverallProgress(progressWidget);
}

/* Uploaded-file receipts, keyed per employee so switching names doesn't
   surface someone else's uploads. localStorage-only, deliberately: the
   authoritative copy is the file in Drive, and this is just a convenience
   receipt so the employee can confirm and open what they sent. A cleared
   browser loses the link, not the file. Wrapped in try/catch to match how
   every other localStorage access in this file degrades. */
function uploadedDocsKey() {
  return 'vcb-uploaded-docs::' + normalizeNameForKey(getEmployeeName() || '');
}
function normalizeNameForKey(n) {
  return String(n || '').trim().toLowerCase();
}
function getUploadedDocs() {
  try { return JSON.parse(localStorage.getItem(uploadedDocsKey()) || '{}'); } catch (e) { return {}; }
}
function setUploadedDocInfo(docId, info) {
  try {
    var all = getUploadedDocs();
    all[docId] = { fileUrl: info.fileUrl, fileName: info.fileName };
    localStorage.setItem(uploadedDocsKey(), JSON.stringify(all));
  } catch (e) {}
}

function updateDocCardUI(docId) {
  var card = document.querySelector('[data-doc-card="' + docId + '"]');
  if (!card) return;
  var done = isDocDone(docId);
  card.classList.toggle('is-done', done);
  var checkbox = card.querySelector('[data-doc-task-id]');
  if (checkbox) checkbox.checked = done;

  var slot = card.querySelector('[data-doc-uploaded="' + docId + '"]');
  if (slot) {
    var info = getUploadedDocs()[docId];
    slot.innerHTML = info && info.fileUrl
      ? '<span class="doc-uploaded-label">' + esc(t('You uploaded')) + ':</span> ' +
        '<a href="' + esc(info.fileUrl) + '" target="_blank" rel="noopener">' +
          esc(info.fileName || t('View file')) +
        '</a> ' +
        '<span class="doc-uploaded-hint">' + esc(t('(uploading again replaces this)')) + '</span>'
      : '';
  }
  refreshProgressDisplays();
}

function hasVisitedHome() {
  try { return localStorage.getItem('vcb-visited-home') === '1'; } catch (e) { return false; }
}

function markHomeVisited() {
  try { localStorage.setItem('vcb-visited-home', '1'); } catch (e) {}
}

/* Infers the department from a taskId via its page (see pageKeyFromTaskId
   above) — pageKey is always prefixed with the department slug, e.g.
   "accounting-day-1-30". */
function departmentFromTaskId(taskId) {
  if (!taskId) return null;
  var pageKey = pageKeyFromTaskId(taskId);
  if (!pageKey) return null;
  var match = DEPARTMENTS.filter(function (d) { return pageKey.indexOf(d.prefix) === 0; })[0];
  return match ? match.id : null;
}

/* Rename flow. Reached from Settings → "Change my name" (Index.html).
   The point is correcting a typo — and a typo'd name has usually already
   accumulated progress rows under it, so this MUST carry those rows over
   server-side (renameEmployee in Code.gs) rather than just rewriting
   localStorage, which would silently orphan them and present the employee
   with an empty checklist. */
function promptToChangeName() {
  var current = getEmployeeName() || '';
  var overlay = document.createElement('div');
  overlay.className = 'name-modal-overlay';
  overlay.innerHTML =
    '<div class="name-modal" role="dialog" aria-modal="true" aria-labelledby="rename-modal-title">' +
      '<h3 id="rename-modal-title">' + esc(t('Change my name')) + '</h3>' +
      '<p>' + esc(t('Correct a misspelling. Your saved progress moves with you.')) + '</p>' +
      '<label class="sr-only" for="rename-modal-input">' + esc(t('Your full name')) + '</label>' +
      '<input type="text" id="rename-modal-input" class="name-modal-input" value="' + esc(current) + '">' +
      '<div class="name-modal-actions">' +
        '<button type="button" class="name-modal-btn name-modal-btn-secondary" id="rename-modal-cancel">' + esc(t('Cancel')) + '</button>' +
        '<button type="button" class="name-modal-btn" id="rename-modal-submit">' + esc(t('Save')) + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);
  var input = overlay.querySelector('#rename-modal-input');
  input.focus();
  input.select();

  function close() {
    if (overlay.parentNode) document.body.removeChild(overlay);
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e) { if (e.key === 'Escape') close(); }
  /* Registered and removed as a matched pair regardless of HOW the modal
     closes. The older modals in this file only removed this listener
     inside the Escape branch itself, so closing via the scrim or a button
     leaked one document-level listener per open. */
  document.addEventListener('keydown', onKey);

  function submit() {
    var next = input.value.trim();
    if (!next) { input.focus(); return; }
    if (next === current) { close(); return; }
    var btn = overlay.querySelector('#rename-modal-submit');
    btn.disabled = true;
    btn.textContent = t('Saving…');
    function finish() {
      setEmployeeName(next);
      close();
      showToast('Name updated.', 'celebrate');
      if (typeof window.rerenderCurrentPage === 'function') window.rerenderCurrentPage();
      refreshProgressDisplays();
    }
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(finish)
        .withFailureHandler(function () {
          btn.disabled = false;
          btn.textContent = t('Save');
          showSaveFailedToast('Could not update your name. Please try again.');
        })
        .renameEmployee(current, next);
    } else {
      finish();
    }
  }
  overlay.querySelector('#rename-modal-submit').addEventListener('click', submit);
  overlay.querySelector('#rename-modal-cancel').addEventListener('click', close);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
}

function promptForEmployeeName(onDone, knownDeptId) {
  var overlay = document.createElement('div');
  overlay.className = 'name-modal-overlay';
  var deptOptions = (knownDeptId ? '' : '<option value="" disabled selected>' + esc(t('Select your department')) + '</option>') +
    DEPARTMENTS.map(function (d) {
      var selected = d.id === knownDeptId ? ' selected' : '';
      return '<option value="' + d.id + '"' + selected + '>' + esc(t(d.label)) + '</option>';
    }).join('');
  overlay.innerHTML =
    /* aria-labelledby gives the dialog an accessible name (it announced as
       an unnamed dialog before), and the inputs get real labels — they
       previously had only placeholders, which are not accessible names. */
    '<div class="name-modal" role="dialog" aria-modal="true" aria-labelledby="name-modal-title">' +
      '<h3 id="name-modal-title">' + esc(t('Welcome! What is your name?')) + '</h3>' +
      '<p>' + esc(t('We use this to save your onboarding checklist progress.')) + '</p>' +
      '<label class="sr-only" for="name-modal-input">' + esc(t('Your full name')) + '</label>' +
      '<input type="text" id="name-modal-input" class="name-modal-input" placeholder="' + esc(t('Your full name')) + '">' +
      '<label class="sr-only" for="name-modal-dept">' + esc(t('Select your department')) + '</label>' +
      '<select id="name-modal-dept" class="name-modal-input"' + (knownDeptId ? ' disabled' : '') + '>' + deptOptions + '</select>' +
      (knownDeptId ? '<input type="hidden" id="name-modal-dept-locked" value="' + esc(knownDeptId) + '">' : '') +
      '<button type="button" class="name-modal-btn" id="name-modal-submit">' + esc(t('Start Onboarding')) + '</button>' +
    '</div>';
  document.body.appendChild(overlay);
  var input = overlay.querySelector('#name-modal-input');
  var deptSelect = overlay.querySelector('#name-modal-dept');
  input.focus();
  function close() {
    if (overlay.parentNode) document.body.removeChild(overlay);
  }
  function submit() {
    var val = input.value.trim();
    var dept = knownDeptId || deptSelect.value;
    if (!val) { input.focus(); return; }
    if (!dept) { deptSelect.focus(); return; }
    setEmployeeName(val);
    setEmployeeDepartment(dept);
    close();
    if (onDone) onDone(val);
  }
  overlay.querySelector('#name-modal-submit').addEventListener('click', submit);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  deptSelect.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) close();
  });
  document.addEventListener('keydown', function escHandler(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escHandler); }
  });
}

/* taskId is optional — when present and its page maps to a known department,
   the modal pre-fills and locks that department instead of asking again. */
function ensureEmployeeIdentified(callback, taskId) {
  var name = getEmployeeName();
  var dept = getEmployeeDepartment();
  if (name && dept) { callback(name); return; }
  promptForEmployeeName(callback, departmentFromTaskId(taskId));
}

/* Lighter gate for pre-boarding actions (document upload/tick) that happen
   before Department Selection in the journey — only needs a name, since
   requiring a department this early would force that step out of order. */
function promptForNameOnly(onDone) {
  var overlay = document.createElement('div');
  overlay.className = 'name-modal-overlay';
  overlay.innerHTML =
    '<div class="name-modal" role="dialog" aria-modal="true">' +
      '<h3>' + esc(t('Welcome! What is your name?')) + '</h3>' +
      '<p>' + esc(t('We use this to save your onboarding checklist progress.')) + '</p>' +
      '<input type="text" id="name-only-modal-input" class="name-modal-input" placeholder="' + esc(t('Your full name')) + '">' +
      '<button type="button" class="name-modal-btn" id="name-only-modal-submit">' + esc(t('Continue')) + '</button>' +
    '</div>';
  document.body.appendChild(overlay);
  var input = overlay.querySelector('#name-only-modal-input');
  input.focus();
  function close() {
    if (overlay.parentNode) document.body.removeChild(overlay);
  }
  function submit() {
    var val = input.value.trim();
    if (!val) { input.focus(); return; }
    setEmployeeName(val);
    close();
    if (onDone) onDone(val);
  }
  overlay.querySelector('#name-only-modal-submit').addEventListener('click', submit);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
  document.addEventListener('keydown', function escHandler(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escHandler); }
  });
}

function ensureEmployeeNamed(callback) {
  var name = getEmployeeName();
  if (name) { callback(name); return; }
  promptForNameOnly(callback);
}

function loadProgress(callback) {
  if (PROGRESS_LOADED) { callback(PROGRESS_CACHE); return; }
  var name = getEmployeeName();
  if (!name) { callback({}); return; }
  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    PROGRESS_LOADED = true;
    callback(PROGRESS_CACHE);
    return;
  }
  google.script.run
    .withSuccessHandler(function (result) {
      PROGRESS_CACHE = result || {};
      PROGRESS_LOADED = true;
      callback(PROGRESS_CACHE);
    })
    .withFailureHandler(function () {
      /* Do NOT set PROGRESS_LOADED here. This used to mark the load
         "done" and hand back the empty cache, which rendered a transient
         network failure as a fully-unchecked checklist — visually
         identical to a genuinely new employee, with no error shown. An
         employee then re-ticking boxes was writing on top of saved state
         they couldn't see, and because the flag was set, it never
         retried for the life of the page. Leaving the flag false means
         the next navigation genuinely retries. */
      showSaveFailedToast('Could not load your saved progress. Any ticks shown may be incomplete — please reload before continuing.');
      callback(PROGRESS_CACHE);
    })
    .getProgress(name);
}

function isTaskDone(taskId) {
  return !!PROGRESS_CACHE[taskId];
}

/* True once the employee has at least one completed task in their current department. */
function hasStartedCurrentDepartment() {
  var dept = getEmployeeDepartment();
  if (!dept) return false;
  var ids = getDepartmentTaskIds(dept);
  return ids.some(function (id) { return PROGRESS_CACHE[id]; });
}

function promptDepartmentSwitchConfirm(fromDeptId, toDeptId, onConfirm) {
  var fromLabel = (DEPARTMENTS.filter(function (d) { return d.id === fromDeptId; })[0] || {}).label || fromDeptId;
  var toLabel = (DEPARTMENTS.filter(function (d) { return d.id === toDeptId; })[0] || {}).label || toDeptId;
  var overlay = document.createElement('div');
  overlay.className = 'name-modal-overlay';
  overlay.innerHTML =
    '<div class="name-modal" role="dialog" aria-modal="true">' +
      '<h3>' + esc(t('Switch department?')) + '</h3>' +
      '<p>' + esc(t('You already have progress in')) + ' <strong>' + esc(t(fromLabel)) + '</strong>. ' +
        esc(t('Starting tasks in')) + ' <strong>' + esc(t(toLabel)) + '</strong> ' +
        esc(t('will permanently delete all your saved progress in')) + ' ' + esc(t(fromLabel)) + '. ' +
        esc(t('An employee can only be onboarding in one department at a time.')) + '</p>' +
      '<button type="button" class="name-modal-btn" id="switch-confirm-btn">' + esc(t('Delete progress and switch')) + '</button>' +
      '<button type="button" class="name-modal-btn-secondary" id="switch-cancel-btn">' + esc(t('Stay in')) + ' ' + esc(t(fromLabel)) + '</button>' +
    '</div>';
  document.body.appendChild(overlay);
  function close() {
    if (overlay.parentNode) document.body.removeChild(overlay);
  }
  overlay.querySelector('#switch-confirm-btn').addEventListener('click', function () {
    close();
    onConfirm();
  });
  overlay.querySelector('#switch-cancel-btn').addEventListener('click', close);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
  document.addEventListener('keydown', function escHandler(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escHandler); }
  });
}

/* Blocks Department Selection (and, by the same lock chain, every phase
   behind it — see isPhasePageUnlocked above) until Required Documents is
   actually complete, and tells the employee exactly which ones are still
   missing rather than just silently refusing the click. Called from the
   dept-card click handler in app.html BEFORE selectDepartment/navigate run,
   so an incomplete employee never actually lands on a department page at
   all — same "hard lock from the first step" the phase pages already get
   via isPhasePageUnlocked, now applied one step earlier in the chain. */
function promptRequiredDocsIncomplete(missingTitles) {
  var overlay = document.createElement('div');
  overlay.className = 'name-modal-overlay';
  var listHtml = '<ul class="missing-docs-list">' + missingTitles.map(function (title) {
    return '<li>' + esc(t(title)) + '</li>';
  }).join('') + '</ul>';
  overlay.innerHTML =
    '<div class="name-modal" role="dialog" aria-modal="true">' +
      '<h3>' + esc(t('Finish Required Documents first')) + '</h3>' +
      '<p>' + esc(t('Choosing a department is locked until every required document is marked complete. Still missing:')) + '</p>' +
      listHtml +
      '<button type="button" class="name-modal-btn" id="missing-docs-goto-btn">' + esc(t('Go to Required Documents')) + '</button>' +
      '<button type="button" class="name-modal-btn-secondary" id="missing-docs-close-btn">' + esc(t('Close')) + '</button>' +
    '</div>';
  document.body.appendChild(overlay);
  function close() {
    if (overlay.parentNode) document.body.removeChild(overlay);
  }
  overlay.querySelector('#missing-docs-goto-btn').addEventListener('click', function () {
    close();
    if (typeof navigate === 'function') navigate('required-documents', true, 'required-documents');
  });
  overlay.querySelector('#missing-docs-close-btn').addEventListener('click', close);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
  document.addEventListener('keydown', function escHandler(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escHandler); }
  });
}

function switchDepartment(fromDeptId, toDeptId, onSwitched) {
  var name = getEmployeeName();
  var fromDept = DEPARTMENTS.filter(function (d) { return d.id === fromDeptId; })[0];
  var ids = getDepartmentTaskIds(fromDeptId);
  ids.forEach(function (id) { delete PROGRESS_CACHE[id]; });
  setEmployeeDepartment(toDeptId);
  if (typeof google !== 'undefined' && google.script && google.script.run && fromDept) {
    google.script.run
      .withFailureHandler(function () {
        /* Local state is already cleared, so the employee can carry on in
           their new department either way — but the old department's rows
           are still on the sheet and WILL come back on the next load, so
           this can't stay silent the way it used to be. */
        showSaveFailedToast('Could not clear your previous department’s saved progress. It may reappear — please tell HR.');
      })
      .clearDepartmentProgress(name, [fromDept.prefix]);
  }
  if (onSwitched) onSwitched();
}

/* Called when the employee clicks a department tile on the Department
   Selection grid — completes that stepper step immediately rather than
   waiting for their first checklist task click inside the department. */
function selectDepartment(deptId) {
  var currentDept = getEmployeeDepartment();
  if (currentDept === deptId) return;
  if (currentDept && hasStartedCurrentDepartment()) {
    promptDepartmentSwitchConfirm(currentDept, deptId, function () {
      switchDepartment(currentDept, deptId, function () {
        refreshProgressDisplays();
      });
    });
    return;
  }
  setEmployeeDepartment(deptId);
  refreshProgressDisplays();
}

function toggleTask(taskId, checkboxEl) {
  ensureEmployeeIdentified(function (name) {
    var taskDept = departmentFromTaskId(taskId);
    var currentDept = getEmployeeDepartment();
    if (taskDept && currentDept && taskDept !== currentDept && hasStartedCurrentDepartment()) {
      checkboxEl.checked = isTaskDone(taskId);
      promptDepartmentSwitchConfirm(currentDept, taskDept, function () {
        switchDepartment(currentDept, taskDept, function () {
          performToggle(taskId, checkboxEl, name);
        });
      });
      return;
    }
    if (taskDept && currentDept && taskDept !== currentDept) {
      setEmployeeDepartment(taskDept);
    }
    performToggle(taskId, checkboxEl, name);
  }, taskId);
}

/* Saves a task's done/not-done state to the backend, retrying once before
   giving up — a single transient failure (brief network blip, momentary
   quota hiccup) shouldn't leave an employee's checked-off box silently
   unsaved with no indication anything went wrong. The UI is already
   optimistic (caller has flipped the checkbox before this runs), so on
   final failure this reverts PROGRESS_CACHE + the checkbox back to
   whatever was actually last confirmed saved and tells the employee via
   toast — better to visibly un-check something than let them believe a
   task is recorded when their eventual printed 90-day form won't reflect
   it. onReverted lets each call site re-sync whatever UI it separately
   derived from the optimistic state (group progress, celebration checks). */
function syncTaskDone(name, taskId, newState, checkboxEl, onReverted) {
  function attempt(isRetry) {
    google.script.run
      .withSuccessHandler(function () {})
      .withFailureHandler(function () {
        if (!isRetry) { attempt(true); return; }
        PROGRESS_CACHE[taskId] = !newState;
        if (checkboxEl) checkboxEl.checked = !newState;
        showSaveFailedToast();
        if (onReverted) onReverted();
      })
      .setTaskDone(name, taskId, newState);
  }
  attempt(false);
}

function performToggle(taskId, checkboxEl, name) {
  if (!isPhaseUnlocked(taskId)) {
    checkboxEl.checked = isTaskDone(taskId);
    return;
  }
  /* Snapshotted before PROGRESS_CACHE is mutated below — updateChecklistUI
     runs after the mutation, so it can never see a "before" state on its own
     and would otherwise never detect the moment onboarding just finished. */
  var wasOnboardingComplete = isEmployeeOnboardingComplete();
  var togglePageKey = pageKeyFromTaskId(taskId);
  var wasPhaseComplete = togglePageKey ? isPagePhaseComplete(togglePageKey) : true;
  var newState = !isTaskDone(taskId);
  PROGRESS_CACHE[taskId] = newState;
  checkboxEl.checked = newState;
  updateChecklistUI(checkboxEl, wasOnboardingComplete, wasPhaseComplete);
  if (newState) showRewardToast();
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    syncTaskDone(name, taskId, newState, checkboxEl, function () {
      /* On revert, pass the CURRENT (post-revert) states as the "was"
         values so no celebration re-fires for a save that ultimately
         failed. */
      updateChecklistUI(checkboxEl, isEmployeeOnboardingComplete(),
        togglePageKey ? isPagePhaseComplete(togglePageKey) : true);
    });
  }
}

function updateChecklistUI(checkboxEl, wasOnboardingComplete, wasPhaseComplete) {
  var item = checkboxEl.closest('.check-item');
  if (item) item.classList.toggle('done', checkboxEl.checked);
  var group = checkboxEl.closest('.checklist-group');
  refreshProgressDisplays();
  /* Repaint the bottom phase trail on every toggle, not just on navigation.
     It was rendered once by renderPage, so the next phase's pill stayed
     visibly locked even after the employee finished everything that unlocks
     it — the state only caught up if they happened to navigate away and
     back. */
  if (typeof window.refreshPhaseTrail === 'function') window.refreshPhaseTrail();

  var nowOnboardingComplete = isEmployeeOnboardingComplete();
  if (nowOnboardingComplete && !wasOnboardingComplete && checkboxEl.checked) {
    celebrateOnboardingComplete();
    if (!group) return;
    refreshGroupProgress(group);
    return;
  }
  if (!group) return;
  var wasComplete = group.classList.contains('is-complete');
  refreshGroupProgress(group);
  var nowComplete = group.classList.contains('is-complete');

  /* Phase completion outranks section completion: finishing the phase's
     LAST section completes both at once, and two overlays would stack. The
     phase card is the more useful of the two, so it wins. */
  var pageKey = getCurrentChecklistPageKey(checkboxEl);
  if (pageKey && checkboxEl.checked && !wasPhaseComplete && isPagePhaseComplete(pageKey)) {
    celebratePhaseComplete(pageKey);
    return;
  }
  if (nowComplete && !wasComplete && checkboxEl.checked) {
    celebrateSectionComplete(group);
  }
}

/* The page key a checklist checkbox belongs to, derived from its own task id
   rather than the URL — a stable id carries no pageKey in its own string
   (see pageKeyFromTaskId), and reading the URL would break if this is ever
   called during a navigation. */
function getCurrentChecklistPageKey(checkboxEl) {
  var taskId = checkboxEl.getAttribute('data-task-id');
  return taskId ? pageKeyFromTaskId(taskId) : null;
}

function refreshGroupProgress(group) {
  var boxes = group.querySelectorAll('.check-item input[type="checkbox"]');
  var total = boxes.length, done = 0;
  boxes.forEach(function (b) { if (b.checked) done++; });
  var bar = group.querySelector('.progress-bar-fill');
  var label = group.querySelector('.progress-bar-label');
  var pct = total ? Math.round((done / total) * 100) : 0;
  if (bar) bar.style.width = pct + '%';
  if (label) label.textContent = done + ' / ' + total + ' ' + t('complete');
  group.classList.toggle('is-complete', total > 0 && done === total);
}

/* Full-screen milestone card shown when a whole checklist section (Required Reading,
   Knowledge Requirements, or Required Outputs) is completed by the user's own action —
   not replayed when a finished page is simply revisited. */
function celebrateSectionComplete(group) {
  var heading = group.previousElementSibling;
  while (heading && heading.tagName !== 'H2') heading = heading.previousElementSibling;
  var sectionName = heading ? heading.textContent : t('Section');

  var page = group.closest('#main-content') ? document.querySelector('.hero h1') : null;
  var phaseName = page ? page.textContent : '';

  var overlay = document.createElement('div');
  overlay.className = 'milestone-overlay';
  overlay.innerHTML =
    '<div class="milestone-card">' +
      '<div class="milestone-badge">' + icon('check') + '</div>' +
      '<div class="milestone-eyebrow">' + esc(t('Section Complete')) + '</div>' +
      '<h3>' + esc(sectionName) + '</h3>' +
      (phaseName ? '<p class="milestone-sub">' + esc(phaseName) + '</p>' : '') +
      '<button type="button" class="name-modal-btn" id="milestone-continue">' + esc(t('Continue')) + '</button>' +
    '</div>';
  document.body.appendChild(overlay);
  requestAnimationFrame(function () { overlay.classList.add('show'); });

  function close() {
    overlay.classList.remove('show');
    setTimeout(function () { if (overlay.parentNode) document.body.removeChild(overlay); }, 200);
  }
  overlay.querySelector('#milestone-continue').addEventListener('click', close);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
  setTimeout(close, 3200);
}

/* Shown when every task in the CURRENT phase is done — the milestone that
   sat unmarked between "one section complete" (celebrateSectionComplete,
   fires 3x per phase) and "all 90 days complete" (celebrateOnboardingComplete,
   fires once ever). Finishing a phase is the moment an employee actually
   becomes able to move on, and nothing previously said so: the last section
   popup looked identical to the two before it, and the phase trail at the
   bottom still showed the next phase locked until a navigation re-rendered it.

   Deliberately NOT a clone of celebrateSectionComplete's visual treatment —
   it names the phase just finished, states the unlock in words, and offers a
   direct button to the next phase rather than a bare "Continue", so the
   employee doesn't have to work out where to go next. Suppressed when this
   phase completion is also the whole-program completion, since
   celebrateOnboardingComplete already owns that moment and two stacked
   overlays would fight. */
function celebratePhaseComplete(pageKey) {
  var page = PAGES[pageKey] || {};
  var phaseName = (page.hero && page.hero.title) ? page.hero.title : t('This phase');
  var next = page.nextPhase && page.nextPhase.page ? page.nextPhase.page : null;
  var nextPage = next ? PAGES[next] : null;
  var nextLabel = (nextPage && nextPage.hero && nextPage.hero.title) ? nextPage.hero.title : '';

  var overlay = document.createElement('div');
  overlay.className = 'milestone-overlay';
  overlay.innerHTML =
    '<div class="milestone-card phase-complete-card">' +
      '<div class="milestone-badge">' + icon('check') + '</div>' +
      '<div class="milestone-eyebrow">' + esc(t('Phase Complete')) + '</div>' +
      '<h3>' + esc(t(phaseName)) + '</h3>' +
      '<p class="milestone-sub">' +
        esc(t('You can now proceed to the next phase.')) +
      '</p>' +
      (next
        ? '<button type="button" class="name-modal-btn" id="phase-next">' +
            esc(nextLabel ? t('Start') + ' ' + t(nextLabel) : t('Go to next phase')) +
          '</button>' +
          '<button type="button" class="name-modal-btn-secondary" id="phase-stay">' + esc(t('Stay on this page')) + '</button>'
        : '<button type="button" class="name-modal-btn" id="phase-stay">' + esc(t('Continue')) + '</button>') +
    '</div>';
  document.body.appendChild(overlay);
  requestAnimationFrame(function () { overlay.classList.add('show'); });

  function close() {
    overlay.classList.remove('show');
    setTimeout(function () { if (overlay.parentNode) document.body.removeChild(overlay); }, 200);
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e) { if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);

  var nextBtn = overlay.querySelector('#phase-next');
  if (nextBtn) {
    nextBtn.addEventListener('click', function () {
      close();
      /* navigate() is exposed on window by app.html's IIFE — see the
         include-order note in docs/KNOWN_ISSUES.md. */
      if (typeof window.navigate === 'function') window.navigate(next);
      else window.location.search = '?page=' + encodeURIComponent(next);
    });
  }
  var stayBtn = overlay.querySelector('#phase-stay');
  if (stayBtn) stayBtn.addEventListener('click', close);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
  /* No auto-dismiss timer, unlike celebrateSectionComplete's 3200ms: this
     card asks the employee to make a choice (move on, or stay), so it waits
     for them rather than vanishing mid-decision. */
}

/* One-time celebration for finishing the entire 90-day program — deliberately
   bigger and slower than the per-section milestone (confetti burst, longer
   on-screen time, warmer copy) since this is the actual finish line after
   weeks of tedious checklist work, not just one more completed sub-task. */
function celebrateOnboardingComplete() {
  var dept = getEmployeeDepartment();
  var deptLabel = (DEPARTMENTS.filter(function (d) { return d.id === dept; })[0] || {}).label || '';
  var name = getEmployeeName() || '';

  var overlay = document.createElement('div');
  overlay.className = 'milestone-overlay completion-overlay';
  overlay.innerHTML =
    '<canvas class="confetti-canvas"></canvas>' +
    '<div class="milestone-card completion-card">' +
      '<div class="milestone-badge completion-badge">' + icon('celebrate') + '</div>' +
      '<div class="milestone-eyebrow">' + esc(t('90 Days Complete')) + '</div>' +
      '<h3>' + esc(t('Welcome, officially, to the team!')) + '</h3>' +
      '<p class="milestone-sub completion-sub">' +
        esc(t('You’ve completed the full 90-day onboarding program')) +
        (deptLabel ? ' — ' + esc(t(deptLabel)) : '') + '. ' +
        esc(t('Every checklist, every document, every phase — that took real persistence. We’re glad to have you with us for the long run.')) +
      '</p>' +
      '<button type="button" class="name-modal-btn" id="completion-print">' + esc(t('Print Completion Form')) + '</button>' +
      '<button type="button" class="name-modal-btn-secondary" id="completion-continue">' + esc(t('Continue')) + '</button>' +
    '</div>';
  document.body.appendChild(overlay);
  requestAnimationFrame(function () { overlay.classList.add('show'); });
  runConfetti(overlay.querySelector('.confetti-canvas'));

  /* Continue used to close the popup and reveal Meet Our Team / Life on
     Site / Return to Portal IN PLACE on whatever page the employee
     happened to be on (revealGatedSectionsForCurrentPage, an async
     placeholder-swap — see app.html/KNOWN_ISSUES.md) — replaced with a
     real navigation to a dedicated completion page per explicit request,
     after that reveal mechanism went through five rounds of real bugs
     across earlier sessions and still sometimes didn't appear right
     away. window.navigate (app.html) is a normal page navigation — same
     one every [data-link] click already goes through — so there's no
     separate "did the content actually land" state to track here
     anymore; the completion page renders its own content synchronously,
     like any other page. */
  function close() {
    overlay.classList.remove('show');
    setTimeout(function () { if (overlay.parentNode) document.body.removeChild(overlay); }, 250);
    if (typeof window.navigate === 'function') {
      window.navigate('completion');
    }
  }
  overlay.querySelector('#completion-print').addEventListener('click', openCompletionCertificate);
  overlay.querySelector('#completion-continue').addEventListener('click', close);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
  /* No auto-dismiss timer — unlike the section milestone, this one waits for
     the employee to close it themselves so the moment isn't rushed. */
}

/* Printable completion form — one table row per task (every required
   document, plus every phase's Reading/Knowledge/Outputs items), each with
   a completion checkmark (they're only reachable here because
   isEmployeeOnboardingComplete() gated the button that opens this) and a
   blank 1-5 rating scale for the department head to circle by hand, plus a
   signature line beneath so the printed page can double as the physical
   sign-off/performance record HR files after the 90 days. Ratings are
   pen-and-paper (circle a number), not form inputs — this is meant to be
   printed and signed, not filled in on-screen. Opened in a new tab/window
   (not an in-page modal) so window.print() only prints this content —
   printing the app underneath would include the sidebar, hero banner, and
   everything else on whatever page triggered it. */
function buildCompletionCertificateHtml() {
  var name = getEmployeeName() || '';
  var deptId = getEmployeeDepartment();
  var dept = DEPARTMENTS.filter(function (d) { return d.id === deptId; })[0] || {};
  var chain = deptId ? getDepartmentPhaseChain(deptId) : [];
  var today = new Date();
  var dateStr = today.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });

  var ratingDotsHtml = [1, 2, 3, 4, 5].map(function (n) { return '<span class="cert-rating-dot">' + n + '</span>'; }).join('');
  var ratingCellHtml = '<td class="cert-rating">' + ratingDotsHtml + '</td>';

  /* Page 2 categories — general attitude / working-relationship qualities,
     not tied to any specific phase or task, so this is a fixed list rather
     than derived from PAGES/chain like page 1's rows are. */
  var ATTITUDE_CATEGORIES = [
    'Attitude & Discipline',
    'Teamwork & Cooperation',
    'Communication',
    'Initiative & Ownership',
    'Reliability & Punctuality',
    'Adaptability'
  ];

  /* Required Documents are pass/fail (signed or not) — rating them 1-5
     doesn't mean anything, so those rows render without the rating cell.
     Every other task (Reading/Knowledge/Outputs items) is actual on-the-job
     performance, so it keeps the rating column. Senior-only items (see
     sr() in content.html) are skipped entirely for a Junior-track employee
     — same isItemVisible rule the on-screen checklist and progress
     tracking already use — so the printed form only asks a department head
     to rate tasks that employee was actually required to complete; a
     Senior's certificate includes them, tagged so they're visibly extra
     rather than blending into the baseline rows. */
  function taskRowsHtml(items, withRating) {
    return items.filter(isItemVisible).map(function (item) {
      var isSenior = itemLevel(item) === 'senior';
      var label = esc(t(itemText(item))) + (isSenior ? ' <span class="cert-senior-badge">' + esc(t('Senior')) + '</span>' : '');
      var taskCell = '<td class="cert-task' + (isSenior ? ' cert-senior-task' : '') + '"' + (withRating ? '' : ' colspan="2"') + '><span class="cert-check">&#10003;</span>' + label + '</td>';
      return '<tr>' + taskCell + (withRating ? ratingCellHtml : '') + '</tr>';
    }).join('');
  }
  function sectionHeaderRow(label) {
    return '<tr class="cert-section-row"><td colspan="2">' + esc(t(label)) + '</td></tr>';
  }
  /* The "RATING 1-5" label sits directly above the rating circles column
     on the subsection banner itself (Knowledge Requirements / Required
     Outputs) instead of a page-wide "Task / Rating" header banner — rating
     only ever applies to some sections, never the whole form, so there's
     no single banner that's accurate for every row underneath it. */
  var ratingBadgeHtml = '<span class="cert-rating-badge">' + esc(t('RATING 1–5')) + '</span>';
  function subsectionHeaderRow(label, hasRating) {
    return '<tr class="cert-subsection-row"><td colspan="2">' +
      '<span class="cert-subsection-label">' + esc(t(label)) + '</span>' +
      (hasRating ? ratingBadgeHtml : '') +
    '</td></tr>';
  }

  /* Each phase's rows are grouped into their own <tbody class="cert-phase-
     group"> (see the @media print rule above) so the browser treats that
     whole group as one unit when deciding where to break across pages,
     instead of breaking wherever it runs out of vertical space mid-group —
     which was splitting a phase's section banner from its own rows across
     the page boundary. */
  function tbodyGroup(innerHtml) {
    return '<tbody class="cert-phase-group">' + innerHtml + '</tbody>';
  }

  var tableBodies = '';

  chain.forEach(function (pageKey) {
    var page = PAGES[pageKey];
    if (!page) return;
    var phaseTitle = (page.hero && (page.hero.eyebrow || page.hero.title)) || pageKey;
    var phaseRows = sectionHeaderRow(phaseTitle);
    (page.sections || []).filter(function (s) { return s.type === 'checklist'; }).forEach(function (sec) {
      /* Required Reading is left off the certificate entirely (not just
         unrated) — whether someone actually read the material is already
         proven (or not) by whether they could produce Required Outputs;
         a separate "did they read it" line is redundant with that and
         nobody can verify it independently anyway. Detected via sectionId
         (see PHASE_BLOCK_ANCHORS in content.html) rather than matching on
         heading text, which could drift out of sync with a translated or
         reworded heading. Knowledge Requirements and Required Outputs are
         the two sections that stay, both rated. */
      if (sec.sectionId === 'phase-reading') return;
      phaseRows += subsectionHeaderRow(sec.heading, true);
      phaseRows += taskRowsHtml(sec.items, true);
    });
    tableBodies += tbodyGroup(phaseRows);
  });

  return '<!DOCTYPE html><html><head><meta charset="utf-8">' +
    '<title>' + esc(t('Onboarding Completion Form')) + '</title>' +
    '<style>' +
      '*{box-sizing:border-box;}' +
      'body{font-family:\'Segoe UI\',Arial,Helvetica,sans-serif;color:#1a1a2e;max-width:860px;margin:0 auto 32px;padding:0 24px;background:#fff;}' +
      '.cert-letterhead{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:3px solid #0a1440;margin-bottom:16px;}' +
      '.cert-letterhead img{height:48px;width:auto;}' +
      '.cert-letterhead-text{line-height:1.3;}' +
      '.cert-company{font-size:14px;font-weight:700;color:#0a1440;letter-spacing:.02em;}' +
      /* The company name, "90-Day Onboarding" and "Completion Form" used to
         repeat across three separate lines (letterhead sub-text, <h1>, and
         a subtitle) — collapsed into one line here so the phrase appears
         exactly once. */
      '.cert-company-sub{font-size:15px;font-weight:700;color:#3a5bff;letter-spacing:.01em;margin-top:2px;}' +
      '.cert-meta{display:flex;flex-wrap:wrap;gap:8px 28px;background:#eef1fb;border:1px solid #dde2f5;border-radius:10px;padding:11px 16px;margin-bottom:14px;font-size:11.5px;}' +
      '.cert-meta-item{display:flex;flex-direction:column;}' +
      '.cert-meta-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#666f9c;margin-bottom:2px;}' +
      '.cert-meta-value{font-weight:600;color:#1a1a2e;}' +
      /* table-layout:fixed + explicit <col> widths (see the <colgroup> in
         the table markup below) is what actually makes the "RATING 1-5"
         label line up above the circles — without it, .cert-rating's
         width:220px is only ever a hint the browser's automatic table
         layout can ignore depending on the other column's content width,
         while .cert-rating-badge (rendered via flex, inside a colspan=2
         cell that doesn't participate in that same column-width
         calculation) used an unrelated 220px of its own. Two different
         layout systems computing "220px" independently drifted apart —
         fixed layout with real <col> widths puts both under one shared
         grid instead. */
      /* Page 1 (systematic/skills — Knowledge Requirements + Required
         Outputs per phase) is tuned tight: smaller base font, thinner row
         padding, smaller rating dots. Leaves enough headroom on a normal
         Letter/A4 page for a modest amount of future growth (e.g. a phase
         picking up a 4th objective) without spilling onto a second page —
         it's a fit budget, not a guarantee against unlimited future
         additions; a large enough increase in content will still push rows
         onto an extra printed page no matter how tight the CSS is. */
      'table.cert-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:10.5px;margin-bottom:8px;border:1px solid #e4e7f4;border-radius:10px;overflow:hidden;}' +
      '.cert-table td{border-bottom:1px solid #edf0fa;padding:3.5px 10px;vertical-align:middle;}' +
      '.cert-table tbody tr:nth-child(even):not(.cert-section-row):not(.cert-subsection-row) td{background:#f8f9fd;}' +

      '.cert-attitude-row{display:flex;align-items:center;gap:16px;padding:10px 14px;border:1px solid #e4e7f4;border-radius:10px;margin-bottom:8px;}' +

      '.cert-comments{margin-top:18px;}' +

      '.cert-comments-line{border-bottom:1px solid #d7dbef;height:26px;}' +
