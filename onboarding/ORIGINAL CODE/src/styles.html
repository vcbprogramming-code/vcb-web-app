<style>
  /* ---------- theme tokens (ported from VCB Connect) ---------- */
  :root,
  :root[data-theme="light"] {
    --bg-0: #eef1f8;
    --bg-1: #f7f8fc;
    --sidebar-0: #0a1440;
    --sidebar-1: #101c56;
    --sidebar-text: #c7cdf0;
    --sidebar-text-dim: #8992c4;
    --sidebar-active: #1b2a72;
    --accent: #3a5bff;
    --accent-2: #5b7cff;
    --accent-soft: rgba(58, 91, 255, 0.35);
    --accent-glow: rgba(58, 91, 255, 0.55);
    --text: #171b2e;
    --text-dim: #666f9c;
    --card: #ffffff;
    --card-border: #e4e7f4;
    --card-border-hover: #c3caf2;
    --topbar-bg: rgba(255, 255, 255, 0.85);
    --shadow-card: 0 1px 2px rgba(23, 27, 46, .04), 0 8px 24px rgba(23, 27, 46, .06);
    --shadow-card-hover: 0 4px 10px rgba(23, 27, 46, .06), 0 16px 36px rgba(23, 27, 46, .10);
    --pill-bg: #eef1fb;
    --status-good: #16a34a;
    --status-good-soft: #bdedd0;
    --status-warn-soft: #ffdcb0;
    /* Zone color system (org chart avatars — see .org-zone-* below):
       blue (--accent, default) = Head Office, amber (--status-warn-soft) =
       off-site/Project Sites, this = site Administration. Deliberately a
       DIFFERENT green from --status-good/--status-good-soft, which this
       app already uses everywhere else for "done/complete" (checklist
       progress, the stepper) — reusing that exact color for "this person
       is an Admin" would misread as a completion signal wherever an
       Admin avatar happens to sit near real progress UI. */
    --zone-admin: #0d9488;
    --zone-admin-soft: #ccfbf1;
    --tree-line: #9aa3d1;
    color-scheme: light;

    /* legacy tokens still referenced by section styles below — mapped onto the new palette */
    --navy: var(--sidebar-0);
    --navy-dark: var(--sidebar-0);
    --gold: var(--accent);
    --gold-light: var(--accent-2);
    --teal: var(--accent);
    --teal-dark: var(--accent-2);
    --bg: var(--bg-0);
    --panel: var(--pill-bg);
    --ink: var(--text);
    --ink-soft: var(--text-dim);
    --border: var(--card-border);
    --radius: 14px;
    --maxw: 1520px;
    --sidebar-w: 274px;
  }
  :root[data-theme="dark"] {
    --bg-0: #02050d;
    --bg-1: #061029;
    --sidebar-0: #05070f;
    --sidebar-1: #0a0f22;
    --sidebar-text: #c9d6f0;
    --sidebar-text-dim: #7686b3;
    --sidebar-active: #16214a;
    --accent: #4fd1ff;
    --accent-2: #7ee8ff;
    --accent-soft: rgba(79, 209, 255, 0.45);
    --accent-glow: rgba(79, 209, 255, 0.75);
    --text: #e6f3ff;
    --text-dim: #93acce;
    --card: rgba(15, 24, 48, 0.75);
    --card-border: rgba(79, 209, 255, 0.16);
    --card-border-hover: rgba(126, 232, 255, 0.5);
    --topbar-bg: rgba(6, 12, 28, 0.85);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    --shadow-card-hover: 0 4px 14px rgba(0, 0, 0, .35), 0 16px 40px rgba(0, 0, 0, .4);
    --pill-bg: rgba(79, 209, 255, 0.08);
    --status-good: #34d399;
    --status-good-soft: rgba(52, 211, 153, 0.22);
    --status-warn-soft: rgba(255, 176, 74, 0.22);
    --zone-admin: #2dd4bf;
    --zone-admin-soft: rgba(45, 212, 191, 0.22);
    --tree-line: rgba(147, 172, 206, 0.6);
    color-scheme: dark;

    --navy: var(--sidebar-0);
    --navy-dark: var(--sidebar-0);
    --gold: var(--accent);
    --gold-light: var(--accent-2);
    --teal: var(--accent);
    --teal-dark: var(--accent-2);
    --bg: var(--bg-0);
    --panel: var(--pill-bg);
    --ink: var(--text);
    --ink-soft: var(--text-dim);
    --border: var(--card-border);
  }

  * { box-sizing: border-box; }
  /* Apps Script always serves this page inside Google's own sandboxed
     iframe wrapper (script.google.com/.../exec), which we can't reach or
     restyle from here. width:100% + overflow-x:hidden + no inherited
     rounding gap from min-height:100vh (using height:100% instead, tied
     to the iframe's own exact box) is a defensive measure against a thin
     background sliver appearing along an edge — closes it in the cases
     that ARE under our control (our own box sizing), though a gap coming
     from Google's outer wrapper itself is not something CSS here can fix. */
  html, body {
    /* height:100% (rather than min-height) combined with overflow-x:hidden
       makes body its own clipped scroll container: on a phone the document
       is pinned to exactly one viewport and the page cannot scroll at all,
       so everything below the fold is unreachable. min-height alone lets
       the document grow to its content and scroll normally. */
    margin: 0; padding: 0; width: 100%; min-height: 100vh;
    overflow-x: hidden;
    background: var(--bg-0);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans Thai', 'Leelawadee UI', 'Segoe UI', system-ui, -apple-system, sans-serif;
    scroll-behavior: smooth;
    transition: background-color .15s, color .15s;
  }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }

  .skip-link {
    position: absolute; left: -999px; top: 0;
    background: var(--accent); color: #fff; padding: 8px 14px; z-index: 999;
  }
  .skip-link:focus { left: 8px; top: 8px; }

  /* ---------- app shell: fixed sidebar + full-width content ---------- */
  .shell { display: flex; min-height: 100vh; }

  /* ---------- sidebar ---------- */
  aside.sidebar {
    flex: 0 0 var(--sidebar-w); width: var(--sidebar-w);
    background: linear-gradient(180deg, var(--sidebar-1), var(--sidebar-0));
    color: var(--sidebar-text);
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0;
    overflow-y: auto;
    z-index: 100;
  }
  .sidebar-close {
    display: none;
    align-items: center; justify-content: center;
    position: absolute; top: 14px; right: 14px;
    background: none; border: none; color: #cfd5e0;
    cursor: pointer; padding: 6px;
    z-index: 2;
  }
  .sidebar-brand {
    display: flex; align-items: center; gap: 12px;
    padding: 22px 20px 18px;
  }
  .sidebar-brand-name {
    font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: .06em;
    font-size: 13px; color: #fff; line-height: 1.2; display: block;
  }
  .sidebar-brand-sub {
    font-size: 10px; letter-spacing: .1em; color: var(--sidebar-text-dim);
    margin-top: 3px; display: block;
  }

  /* ---------- vertical journey stepper (replaces the flat nav list) ---------- */
  /* Whole 90-day journey as one linear path — Pre-boarding, Required Documents,
     Department Selection, the 3 phases, Completion — each node connected by a
     continuous line running top to bottom so the employee can see exactly
     where they are at a glance, not just what pages exist. */
  .sidebar-progress { flex: 1; padding: 10px 8px 20px; overflow-y: auto; }
  .stepper { display: flex; flex-direction: column; }
  /* Wraps one phase's stepper-row plus its Reading/Knowledge/Outputs
     sub-rows (if any). The connecting line lives here, not on
     .stepper-row, so it spans the wrapper's full height — row + sub-rows
     — and keeps running continuously down to the next item's dot instead
     of stopping short at the row's own bottom edge. */
  .stepper-item { position: relative; }
  .stepper-item.last .stepper-line { display: none; }
  .stepper-row {
    position: relative; display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 10px 10px 4px; text-decoration: none; color: var(--sidebar-text-dim);
    border-radius: 8px; cursor: default;
  }
  .stepper-item:not(:last-child) { padding-bottom: 12px; }
  a.stepper-row { cursor: pointer; }
  a.stepper-row:hover { background: rgba(255,255,255,.05); }
  /* left must equal .stepper-row's own left padding (4px, see above) plus
     half the dot's width (26px / 2 = 13px), minus half this line's own
     width (2px / 2 = 1px) — i.e. the dot's true horizontal CENTER, not a
     separately eyeballed value. This was off by a few px (previously
     19px against the dot's real 16px center), which read as the line
     joining the dot slightly off-axis instead of running straight through
     its middle — reported directly ("the lines... are not centered from
     the circle"). 4 + 13 - 1 = 16. */
  .stepper-line {
    position: absolute; left: 16px; top: 28px; bottom: -12px; width: 2px;
    background: rgba(255,255,255,.12);
  }
  .stepper-item.done .stepper-line { background: var(--status-good); }
  .stepper-dot {
    position: relative; z-index: 1; flex: none;
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    background: rgba(255,255,255,.08); color: var(--sidebar-text-dim);
    border: 2px solid rgba(255,255,255,.12);
  }
  .stepper-row.done .stepper-dot { background: var(--status-good); border-color: var(--status-good); color: #05070f; }
  .stepper-row.done .stepper-dot .icon { width: 13px; height: 13px; }
  .stepper-row.current .stepper-dot { background: var(--accent); border-color: var(--accent-2); color: #fff; }
  .stepper-label {
    padding-top: 3px; font-size: 13px; line-height: 1.35;
  }
  .stepper-row.current { color: #fff; }
  .stepper-row.current .stepper-label { font-weight: 700; }
  .stepper-row.done .stepper-label { color: var(--sidebar-text); }

  /* Completion IS a real clickable link now (it navigates to the dedicated
     PAGES['completion'] page, see getJourneySteps in progress.html) —
     still gold instead of the regular green "done" so it visually reads
     as "you finished" rather than blending in as just one more completed
     step. .current stacks on top of .completion-done (see
     renderSidebarProgress) while the employee is actually ON that page —
     specificity-wise this rule still wins over .stepper-row.current's own
     blue dot color (same specificity, declared later), so the gold
     "you're finished" read stays intact even while also marked current. */
  .stepper-row.completion-done .stepper-dot { background: #d4a72c; border-color: #d4a72c; color: #05070f; }
  .stepper-item.completion-done .stepper-line { background: #d4a72c; }
  .stepper-row.completion-done .stepper-label { color: #e8c766; font-weight: 700; }

  /* Reading / Knowledge / Outputs sub-rows under a phase's stepper row —
     abbreviated labels for each of that phase's 3 checklist blocks (see
     getJourneySteps in progress.html), smaller and indented past the main
     dot column so they read as detail nested under the phase, not peers
     of it. Each is independently clickable/deep-linkable once the phase
     itself is unlocked. */
  .stepper-substeps {
    display: flex; flex-direction: column; gap: 2px;
    margin: 6px 0 0 38px; position: relative; z-index: 1;
  }
  .stepper-substep {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px; border-radius: 6px; text-decoration: none;
    color: var(--sidebar-text-dim); font-size: 11.5px;
  }
  .stepper-substep:hover { background: rgba(255,255,255,.05); color: var(--sidebar-text); }
  .stepper-substep-dot {
    flex: none; width: 14px; height: 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
  }
  .stepper-substep-dot .icon { width: 9px; height: 9px; }
  .stepper-substep.done .stepper-substep-dot { background: var(--status-good); border-color: var(--status-good); color: #05070f; }
  .stepper-substep.done { color: var(--sidebar-text); }

  .menu-toggle {
    display: none;
    align-items: center; justify-content: center;
    position: fixed; top: 14px; left: 14px; z-index: 120;
    background: var(--sidebar-0); border: 1px solid rgba(255,255,255,0.2); color: #fff;
    border-radius: 8px; padding: 9px; cursor: pointer;
  }

  .sidebar-scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 99; }

  .sidebar-foot {
    padding: 14px 20px 18px; font-size: 10.5px; letter-spacing: .06em;
    color: var(--sidebar-text-dim); border-top: 1px solid rgba(255,255,255,.06);
  }

  @media (max-width: 980px) {
    .menu-toggle { display: flex; }
    aside.sidebar {
      /* The desktop entry fade (.sidebar { animation: app-enter ... both })
         animates `transform` and uses fill-mode `both`, so its final
         `transform: none` keeps winning over the translateX below for as
         long as it applies — pinning the drawer on-screen at x:0, covering
         the content, with no way to dismiss it. A running animation's
         value beats a plain declaration, so this must be cancelled rather
         than overridden. The fade is a desktop nicety anyway; the drawer
         has its own slide transition. */
      animation: none;
      transform: translateX(-100%); transition: transform .2s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,0.3);
    }
    aside.sidebar.open { transform: translateX(0); }
    .sidebar-close { display: flex; }
    .sidebar-scrim.open { display: block; }
    .main { margin-left: 0 !important; }

    /* Cap the drawer to the phone's width. Uses percentages, NOT vw: this
       app is served inside the Apps Script sandbox iframe, where vw units
       resolve against a viewport that does not reliably match the visible
       frame, and an earlier attempt using min(86vw, 320px) mis-sized here
       even though it measured correctly in a local harness. max-width in %
       resolves against the containing block, which is correct in both. */
    /* The sidebar is position:fixed with an explicit width:var(--sidebar-w),
       so a max-width alone does not shrink it — the width itself has to be
       overridden. Percentages resolve against the viewport for a fixed
       element, which is what we want, and unlike vw they behave correctly
       inside the Apps Script sandbox iframe. */
    aside.sidebar { width: 86%; flex-basis: 86%; max-width: 320px; }

    /* .menu-toggle is position:fixed at z-index 120 — ABOVE the sidebar's
       z-index 100 — so without this it stays painted on top of the opened
       drawer, overlapping the brand name (there is already a .sidebar-close
       inside the drawer for closing it). */
    body.nav-open .menu-toggle { display: none; }

    /* NOTE: do NOT add `body.nav-open { overflow: hidden }` here as a
       scroll lock. `html, body` are set to height:100% near the top of this
       file, so overflow:hidden on body clips the whole document to a single
       viewport — the page renders blank/frozen rather than merely locked,
       and it does not restore reliably. This was tried once and reverted
       after it broke the live app on mobile. */

    /* Group Structure: the base rule pins each segment to min-width:456px
       (deliberately — it prevents a wrap that previously drew "disjointed"
       connector lines, see the comment above that rule). Two segments plus
       the gap is ~950px, so between 481px and 980px they could not sit
       side by side; flex-wrap let them wrap to separate lines at squeezed
       widths (~342px each at 768px), which is the very wrap that rule
       exists to prevent. Stacking them explicitly at full width instead
       keeps each segment whole and its connectors correct.
       (Measured, not inferred: an earlier version of this comment claimed
       the overflow was clipped and unreachable via html/body's
       overflow-x:hidden. Rendering it showed the segments wrapped and
       shrank instead — no clipping. Verify layout claims here by
       measuring, per the discipline in docs/KNOWN_ISSUES.md.) */
    .group-structure-branches { flex-direction: column; }
    .group-structure-branches .org-segment { min-width: 0; width: 100%; }
  }

  /* ---------- main column ---------- */
  .main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; margin-left: var(--sidebar-w); }

  /* ---------- settings button ---------- */
  /* Positioned inside the hero banner's own top-right corner with equal
     inset from the top and the side. The hero now sits flush against
     .main's edges (see .hero below), so the inset is just the banner's
     own 20px padding from its top-right corner.
     .settings-wrap-floating.settings-wrap (both classes on one selector) so
     this beats the plain .settings-wrap{position:relative} rule below
     regardless of source order — two classes outrank one in specificity. */
  .settings-wrap.settings-wrap-floating {
    position: absolute; top: 20px; right: 20px; z-index: 20;
  }
  .icon-btn {
    background: var(--pill-bg); border: 1px solid var(--card-border); color: var(--text-dim);
    width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--card-border-hover); }

  /* ---------- settings dropdown ---------- */
  .settings-wrap { position: relative; }
  .settings-menu {
    display: none;
    position: absolute; top: calc(100% + 8px); right: 0; width: 240px;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
    box-shadow: var(--shadow-card-hover); padding: 8px; z-index: 30;
  }
  .settings-menu.open { display: block; }
  .settings-section {
    padding: 8px 10px 4px; font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 10px 8px; }
  .settings-divider { height: 1px; background: var(--card-border); margin: 6px 4px; }
  /* Entry point into the admin checklist editor (?page=admin) — plain
     navigation link styled to match the rest of the settings menu, not a
     toggle like language/theme above it, so it's deliberately NOT inside
     its own .settings-row (which is a flex row meant for paired
     controls). Always visible to anyone who opens Settings (explicit
     choice over hiding it behind a secret trigger) — the password gate on
     the admin page itself is the actual access control, this is just
     navigation. */
  .settings-admin-link {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px;
    color: var(--text-dim); font-size: 12.5px; font-weight: 600; text-decoration: none;
    transition: background .15s, color .15s;
  }
  .settings-admin-link:hover { background: var(--pill-bg); color: var(--accent); }
  .settings-admin-link .icon { width: 15px; height: 15px; flex: none; }
  .seg { display: flex; background: var(--pill-bg); border: 1px solid var(--card-border); border-radius: 9px; padding: 2px; gap: 2px; }
  .seg-btn {
    display: flex; align-items: center; gap: 6px; justify-content: center;
    border: none; background: transparent; color: var(--text-dim); font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 7px; cursor: pointer; font-family: inherit;
    transition: background .15s ease, color .15s ease;
  }
  .seg-btn.active { background: var(--card); color: var(--accent); box-shadow: var(--shadow-card); }
  .seg-btn .icon { width: 14px; height: 14px; }

  /* ---------- shared icon sizing ---------- */
  /* icon() always renders <svg class="icon">; size context-specific instances
     via the icon's own wrapper element, not by adding size classes to the svg. */
  .icon { width: 18px; height: 18px; flex: none; display: block; }
  .icon-btn .icon { width: 17px; height: 17px; }
  .dept-icon-svg { width: 40px; height: 40px; color: var(--accent); }
  .milestone-badge .icon { width: 30px; height: 30px; color: #fff; }
  .stepper-dot .icon { width: 13px; height: 13px; }

  .phase-lock-icon { display: inline-flex; }
  .phase-lock-icon .icon { width: 16px; height: 16px; color: var(--text-dim); }
  .doc-icon { display: inline-flex; }
  .doc-icon .icon { width: 18px; height: 18px; color: var(--accent); }
  .placeholder-icon { display: inline-flex; }
  .placeholder-icon .icon { width: 28px; height: 28px; color: var(--text-dim); }
  .reward-toast-icon { display: inline-flex; margin-right: 4px; vertical-align: middle; }
  .reward-toast-icon .icon { width: 16px; height: 16px; }

  /* ---------- content column: full-width, efficient use of space ---------- */

  main#main-content { flex: 1; padding: 0 0 40px; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; min-height: 260px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: #fff;
    background: linear-gradient(rgba(5,7,15,0.65), rgba(5,7,15,0.65)), var(--sidebar-0) center/cover no-repeat;
    padding: 48px 32px; margin: 0 0 24px;
  }
  .hero.has-photo { background-image: linear-gradient(rgba(5,7,15,0.55), rgba(5,7,15,0.55)), var(--hero-photo); background-size: cover; background-position: center; }
  .hero-inner { max-width: 900px; }
  .hero-eyebrow { text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.72rem; color: var(--accent-2); font-weight: 700; margin-bottom: 10px; }
  .hero h1 { font-family: 'Orbitron', sans-serif; font-size: 2.1rem; margin: 0 0 14px; color: #fff; line-height: 1.3; font-weight: 700; }
  .hero .subtitle { font-size: 1.05rem; color: #fff; font-weight: 600; margin: -6px 0 14px; }
  .hero .lead { font-size: 1rem; color: #dfe6ff; max-width: 760px; line-height: 1.6; margin: 0 auto; }
  .hero .note {
    /* Always a near-white card regardless of theme, so its text must
       always be dark too — using var(--text) here was the bug: in dark
       mode --text is near-white (#e6f3ff), landing near-white text on a
       near-white background and making it almost unreadable. */
    margin: 14px auto 0; font-size: 0.9rem; color: #171b2e;
    background: rgba(255,255,255,0.96); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 8px;
    max-width: 760px; text-align: left; box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .hero .cta {
    display: inline-block; margin-top: 20px;
    background: var(--accent); color: #fff; font-weight: 700;
    padding: 12px 26px; border-radius: 999px; font-size: 0.92rem;
    box-shadow: 0 6px 16px var(--accent-soft);
  }
  .hero .cta:hover { filter: brightness(1.08); }


  .overall-progress-wrap:not(:empty) { margin: 14px 28px 24px; }
  .overall-progress {
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    box-shadow: var(--shadow-card); padding: 20px 24px; text-align: left;
  }
  .overall-progress-head { display: flex; justify-content: space-between; align-items: baseline; color: var(--text); font-weight: 700; font-size: 0.95rem; margin-bottom: 10px; }
  .overall-progress .progress-bar-track { background: var(--pill-bg); }
  .overall-progress-sub { color: var(--text-dim); font-size: 0.8rem; margin-top: 6px; }
  .overall-progress p { color: var(--text-dim); margin: 0 0 12px; text-align: center; }
  .overall-progress-btn { max-width: 220px; margin: 0 auto; display: block; }

  /* ---------- Sections: full-width, efficient grid use ---------- */
  section.block { margin: 0; padding: 8px 28px 28px; scroll-margin-top: 84px; }
  section.block.centered { text-align: center; }
  /* Milestone band: used for the single highest-stakes decision in
     pre-boarding (Department Selection) — needs to visually outweigh a
     plain content section, not blend into the page background. */
  section.block.band-teal {
    background: linear-gradient(180deg, var(--accent-soft), transparent 65%);
    border-top: 1px solid var(--card-border);
    border-bottom: 1px solid var(--card-border);
    padding-top: 72px; padding-bottom: 80px; margin: 8px 0;
    min-height: 90vh; display: flex; align-items: center;
  }
  section.block.band-teal .section-inner { width: 100%; }
  /* Light-touch band for the Completion page's feature grid — same soft
     accent wash as band-teal so the "you're done" moment doesn't read as
     flat gray-on-white, but without the full-viewport hero treatment
     (min-height/huge padding) that band-teal uses for the Department
     Selection decision moment; this section is a lower-stakes coda, not
     another milestone choice. */
  section.block.band-completion {
    background: linear-gradient(180deg, var(--accent-soft), transparent 80%);
    border-top: 1px solid var(--card-border);
    padding-top: 40px; padding-bottom: 44px; margin: 8px 0 0;
  }
  .section-eyebrow {
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--accent); margin-bottom: 8px; text-align: center;
  }
  section.block.band-teal h2 { font-size: 2rem; }
  section.block h2 {
    font-family: 'Orbitron', sans-serif; font-size: 1.25rem; color: var(--text); margin: 0 0 12px; font-weight: 700;
  }
  section.block.centered h2 { text-align: center; }
  section.block .subheading { color: var(--text-dim); font-size: 0.95rem; margin: 0 0 16px; }
  section.block p { line-height: 1.7; color: var(--text); font-size: 0.97rem; }
  .section-inner { width: 100%; max-width: var(--maxw); margin: 0 auto; }
  .section-inner-narrow { max-width: 760px; margin: 0 auto; }

  .quote-card {
    max-width: 760px; margin: 0 auto; padding: 24px;
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    box-shadow: var(--shadow-card);
  }
  .quote-portrait { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; margin: 0 auto 16px; border: 3px solid var(--accent-2); }
  .quote-card blockquote { margin: 0; font-style: italic; font-size: 1.05rem; line-height: 1.7; color: var(--text); }
  .quote-card cite { display: block; margin-top: 14px; font-style: normal; font-weight: 700; color: var(--text); }

  .values-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; max-width: var(--maxw); margin: 0 auto; }
  .value-icon { width: 96px; height: 96px; margin: 0 auto 14px; object-fit: contain; display: block; }
  .value-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    box-shadow: var(--shadow-card); padding: 20px; text-align: center;
    transition: box-shadow .15s, border-color .15s;
  }
  .value-card:hover { box-shadow: var(--shadow-card-hover); border-color: var(--card-border-hover); }
  .value-card h3 { margin: 0 0 8px; color: var(--text); font-size: 1.1rem; font-weight: 700; }
  .value-card p { font-size: 0.85rem; margin: 0 0 8px; color: var(--text-dim); }
  .value-card ul { margin: 0 0 8px; padding: 0; list-style: none; text-align: center; }
  .value-card ul li { font-size: 0.85rem; color: var(--text); margin-bottom: 4px; line-height: 1.5; }
  .value-card .footer-note { font-size: 0.85rem; font-weight: 400; color: var(--text); margin: 0; }
  @media (max-width: 1100px) { .values-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .values-grid { grid-template-columns: 1fr; } }

  .feature-card {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center;
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    box-shadow: var(--shadow-card); padding: 24px;
    max-width: var(--maxw); margin: 0 auto;
  }
  /* Base .feature-link — used standalone (e.g. "View Orientation Schedule",
     rendered as a plain <p><a> outside any .feature-card/.feature-tile) as
     well as inside those two containers, which override it below with a
     lighter underline treatment that fits their card context better. Without
     this base rule the standalone case had NO styling of its own at all and
     inherited the surrounding muted body-text color — reading as plain gray
     text, not a clickable link, despite being an important CTA. Styled as a
     filled pill button (matching .next-phase) so it reads as clearly
     actionable rather than a plain inline hyperlink. */
  .feature-link {
    display: inline-flex; align-items: center; gap: 8px; width: fit-content;
    padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 0.9rem;
    background: var(--accent); color: #fff; transition: filter .15s;
  }
  .feature-link:hover { filter: brightness(1.08); }
  .feature-card .feature-text { text-align: center; }
  .feature-card .feature-text h3 { margin: 10px 0; color: var(--text); font-weight: 700; font-size: 1.2rem; }
  .feature-card .feature-text p { margin: 0 0 10px; font-size: 0.9rem; color: var(--text-dim); }
  .feature-card .feature-link {
    display: inline-block; width: auto; padding: 0; border-radius: 0;
    background: none; color: var(--accent); font-weight: 600; font-size: 0.9rem;
    border-bottom: 1px solid var(--accent); padding-bottom: 1px;
  }
  .feature-card img.content-image { border-radius: 12px; }
  @media (max-width: 780px) { .feature-card { grid-template-columns: 1fr; } }
  /* No photo (e.g. Company Structure — a conceptual link, not a photo
     moment): collapse the two-column grid to one centered column instead
     of leaving a blank second cell / stretching a mismatched image into
     it. */
  .feature-card.no-image {
    grid-template-columns: 1fr; max-width: 640px; text-align: center;
  }
  .feature-card.no-image .feature-text h3 { font-size: 1.4rem; margin-top: 0; }

  /* Whole-app entrance animation on first load. Pure CSS, no JS involved —
     GAS inlines the entire document (all includes + scripts) as one blob
     before the browser paints anything, so a JS-driven class removal (the
     previous approach here) had no real "before paint" / "after paint" gap
     to animate across and could resolve before the browser ever rendered
     the pre-animation frame. A @keyframes animation that starts on element
     paint has no such race: the browser always honors it regardless of how
     fast or slow script execution around it is.
     Sidebar leads, main content follows once the sidebar's motion is mostly
     settled (rather than both starting together), and each top-level block
     inside #app (hero, then each rendered section in turn) is staggered
     after that so the page reads as one continuous cascade instead of a
     single flat block fading in all at once. */
  @keyframes app-enter {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  .sidebar { animation: app-enter .55s ease both; }
  .settings-wrap { animation: app-enter .55s ease both; animation-delay: .1s; }
  /* #app's content is rebuilt on every page navigation (see renderPage in
     app.html), not just first load — .app-enter is removed and re-added by
     JS on each render (with a forced reflow in between) so the animation
     replays every time instead of only once. Each direct child (.hero, each
     .block section) gets its own staggered delay via nth-child so they
     cascade one after another; capped at 8 explicit steps with a shared
     fallback delay after that so a page with many sections doesn't end up
     with the last ones absurdly delayed. */
  #app.app-enter > * { animation: app-enter .5s ease both; animation-delay: .16s; }
  #app.app-enter > *:nth-child(1) { animation-delay: .16s; }
  #app.app-enter > *:nth-child(2) { animation-delay: .24s; }
  #app.app-enter > *:nth-child(3) { animation-delay: .32s; }
  #app.app-enter > *:nth-child(4) { animation-delay: .40s; }
  #app.app-enter > *:nth-child(5) { animation-delay: .48s; }
  #app.app-enter > *:nth-child(6) { animation-delay: .56s; }
  #app.app-enter > *:nth-child(7) { animation-delay: .64s; }
  #app.app-enter > *:nth-child(n+8) { animation-delay: .7s; }
  @media (prefers-reduced-motion: reduce) {
    /* This kills the ENTRY ANIMATION only. `.sidebar` must NOT get
       `transform: none !important` here: below 980px the mobile drawer is
       positioned off-screen with `transform: translateX(-100%)`, and an
       !important override cancels that positioning outright — leaving the
       drawer stuck open over the content, unclosable, on any phone with
       "Reduce Motion" enabled. The animation-suppression intent is served
       by `animation`/`opacity` alone; the drawer's own slide transition is
       already handled by the reduced-motion rule further down this file. */
    .sidebar, .settings-wrap, #app.app-enter > * { animation: none !important; opacity: 1 !important; }
    .settings-wrap, #app.app-enter > * { transform: none !important; }
  }

  /* Two feature tiles side by side (image on top, text below), e.g. Meet Our
     Team / Life on Site on the Completion page — instead of stretching to
     the page's full content width (var(--maxw), 1520px), which read as
     oversized/stray with only two tiles in the row. 920px keeps each tile a
     sensible card width (~450px) and keeps the pair visually centered and
     symmetrical rather than spanning edge to edge. */
  .feature-grid {
    display: grid; grid-template-columns: repeat(var(--feature-grid-cols, 2), 1fr); gap: 20px;
    max-width: 920px; margin: 0 auto;
  }
  .feature-tile {
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    box-shadow: var(--shadow-card); overflow: hidden;
    transition: box-shadow .15s, border-color .15s;
  }
  .feature-tile:hover { box-shadow: var(--shadow-card-hover); border-color: var(--card-border-hover); }
  .feature-tile img.content-image { border-radius: 0; max-height: 260px; }
  .feature-tile-text { text-align: center; padding: 18px 20px 22px; }
  .feature-tile-text h3 { margin: 0 0 10px; color: var(--text); font-weight: 700; font-size: 1.15rem; }
  .feature-tile-text p { margin: 0 0 10px; font-size: 0.9rem; color: var(--text-dim); line-height: 1.6; }
  /* No-photo tile (e.g. a "Your Documents" utility card in a photo-led
     grid) — an icon badge stands in for the missing image instead of
     leaving a blank top section or stretching an unrelated photo in. */
  .feature-tile-icon {
    display: flex; align-items: center; justify-content: center;
    width: 56px; height: 56px; margin: 28px auto 0; border-radius: 50%;
    background: var(--pill-bg); color: var(--accent);
  }
  .feature-tile-icon .icon { width: 26px; height: 26px; }
  .feature-tile.no-image .feature-tile-text { padding-top: 14px; }
  /* Overrides the base .feature-link pill (filled background, white text —
     see .feature-link above) back down to a plain underlined link for this
     card context, matching .feature-card .feature-link's own reset just
     below. background was missing here specifically: the base rule's
     background:var(--accent) survived untouched while only color got
     overridden to var(--accent) too, so the button rendered as
     accent-on-accent — text and background the exact same blue, invisible
     regardless of theme or language (confirmed via computed styles: both
     color and background-color resolved to the identical rgb value). */
  .feature-tile-text .feature-link {
    display: inline-block; width: auto; padding: 0; border-radius: 0;
    background: none; font-weight: 600; color: var(--accent);
    border-bottom: 1px solid var(--accent); padding-bottom: 1px; font-size: 0.9rem;
  }
  @media (max-width: 980px) { .feature-grid { grid-template-columns: repeat(2, 1fr) !important; } }
  @media (max-width: 780px) { .feature-grid { grid-template-columns: 1fr !important; } }

  .external-cta-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .external-cta-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 0.92rem;
    padding: 13px 26px; border-radius: 999px; box-shadow: 0 6px 16px var(--accent-soft);
    transition: filter .15s ease; border: none; cursor: pointer; font-family: inherit;
  }
  .external-cta-btn:hover { filter: brightness(1.08); }
  .external-cta-btn .icon { width: 16px; height: 16px; }
  .external-cta-btn.secondary {
    background: transparent; color: var(--accent); box-shadow: none;
    border: 1px solid var(--card-border);
  }
  .external-cta-btn.secondary:hover { filter: none; border-color: var(--card-border-hover); }

  .content-image { width: 100%; max-height: 420px; border-radius: 12px; border: 1px solid var(--card-border); object-fit: cover; }
  /* Square-ish (not a short fixed height) — a short fixed height on a wide
     grid column is what gave a single landscape jobsite photo the
     "pancake" look when it was the only image in its own gallery section
     (stretched edge to edge, barely any height). object-fit:cover crops
     to fill the square without stretching, same as before. */
  .gallery-grid .content-image { aspect-ratio: 1 / 1; height: auto; min-height: 0; max-height: none; }
  .erp-flow-photo { max-height: 480px; object-fit: contain; background: #fff; padding: 8px; border-radius: 12px; }

  /* ---------- Rotating carousel ---------- */
  /* Shows --carousel-visible slides side by side (3 on desktop — see
     CAROUSEL_VISIBLE_COUNT in app.html) instead of one full-bleed image at
     a time. .carousel-viewport clips to exactly that many slide-widths;
     .carousel-track is a flex row of ALL slides that slides left/right by
     one slide-width per step via translateX (see initCarousels). Each
     .carousel-slide is sized to 100/--carousel-visible % so exactly
     --carousel-visible of them ever fit in the viewport at once.
     .carousel-static (<= --carousel-visible slides total, e.g. exactly the
     3 Track Record photos) skips the viewport/clipping/controls entirely
     and just lays the slides out in a plain row — nothing to scroll to. */
  .carousel {
    position: relative; max-width: var(--maxw); margin: 0 auto;
  }
  .carousel-viewport { overflow: hidden; border-radius: var(--radius); }
  .carousel-track {
    display: flex; transition: transform .5s ease;
  }
  .carousel-static .carousel-track { gap: 12px; }
  .carousel-slide {
    position: relative; flex: 0 0 calc(100% / var(--carousel-visible));
    height: 260px; overflow: hidden;
  }
  .carousel-static .carousel-slide {
    border-radius: var(--radius); box-shadow: var(--shadow-card);
    background: var(--card); border: 1px solid var(--card-border);
  }
  .carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .carousel-caption {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px;
    background: linear-gradient(0deg, rgba(2,5,13,0.75), transparent);
    color: #fff; font-weight: 600; font-size: 0.85rem;
  }
  .carousel-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(2,5,13,0.5); border: 1px solid rgba(255,255,255,0.25); color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background .15s ease; z-index: 2;
  }
  .carousel-arrow:hover { background: rgba(2,5,13,0.72); }
  .carousel-arrow.next { right: 14px; }
  @media (max-width: 720px) {
    .carousel-slide { flex-basis: 100%; height: 220px; }
    .carousel:not(.carousel-static) { --carousel-visible: 1 !important; }
  }
  @media (prefers-reduced-motion: reduce) { .carousel-track { transition: none; } }

  /* ---------- ERP flow diagram ---------- */
  .erp-diagram { background: var(--sidebar-0); border-radius: var(--radius); padding: 20px; margin-top: 16px; overflow-x: auto; }
  .erp-diagram-title { color: var(--accent-2); font-weight: 700; font-size: 0.95rem; text-align: center; margin-bottom: 16px; letter-spacing: 0.02em; }
  .erp-grid { display: flex; flex-direction: column; gap: 8px; min-width: 720px; }
  .erp-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .erp-node { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 8px 6px; text-align: center; color: #dfe3ec; }
  .erp-node-label { font-size: 0.72rem; font-weight: 700; line-height: 1.25; }
  .erp-node-tag { font-size: 0.6rem; color: #9aa4c0; margin-top: 3px; }
  .erp-empty { background: none; border: none; }
  .erp-node.erp-highlight { background: var(--accent); border-color: var(--accent-2); color: #fff; box-shadow: 0 0 0 2px var(--accent-soft); }
  .erp-node.erp-highlight .erp-node-tag { color: rgba(255,255,255,0.85); }
  @media (max-width: 720px) { .erp-row { grid-template-columns: repeat(3, 1fr); } }

  .placeholder-box {
    background: var(--pill-bg); border: 2px dashed var(--card-border); border-radius: var(--radius);
    min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 0.85rem; gap: 8px; text-align: center; padding: 12px;
  }

  ul.plain-list { padding-left: 20px; text-align: left; display: inline-block; }
  ul.plain-list li { margin-bottom: 8px; line-height: 1.6; font-size: 0.95rem; }
  .list-intro { margin-bottom: 10px; }
  .list-footer {
    margin-top: 14px; font-weight: 600; color: var(--text); font-size: 0.95rem; font-style: italic;
    background: var(--card); border: 1px solid var(--card-border); border-left: 4px solid var(--accent);
    padding: 14px 18px; border-radius: var(--radius); box-shadow: var(--shadow-card);
  }

  .doclist-intro { margin-bottom: 14px; color: var(--text-dim); }
  /* 4-column document grid, each card stacking: open-link row + a completion
     row (upload button and/or manual tick) so progress is visible per document
     rather than only inferred from having clicked the placeholder link. */
  /* 2 columns x 4 rows for the 8 required documents — a single full-width
     column made each card far wider than its (short, 1-2 line) title and
     description needed, leaving a lot of dead horizontal space. */
  .doc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; max-width: var(--maxw); margin: 0 auto; }
  @media (max-width: 720px) { .doc-grid { grid-template-columns: 1fr; } }

  .doc-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    box-shadow: var(--shadow-card); overflow: hidden;
    transition: border-color .15s, box-shadow .15s;
  }
  .doc-card:hover { border-color: var(--card-border-hover); box-shadow: var(--shadow-card-hover); }
  .doc-card.is-done { border-color: var(--status-good); }
  /* text-align:left is explicit, not the default, because .doclist's parent
     section is .centered (text-align:center) by default — without
     overriding it here, .doc-title/.doc-desc inherited that centering while
     .doc-icon stayed pinned to the left edge by the flex layout, so each
     card's title started at a different x-position depending on how long
     that title's text was (a short one-line title looked roughly centered,
     a longer one that wrapped looked ragged) instead of every title
     starting at the same left edge next to the icon. */
  .doc-link {
    display: flex; align-items: flex-start; gap: 10px; text-align: left;
    padding: 18px 20px; font-weight: 600; font-size: 0.92rem; color: var(--text);
  }
  .doc-link-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .doc-desc { font-weight: 400; font-size: 0.82rem; line-height: 1.5; color: var(--text-dim); }
  .doc-arrow { margin-left: auto; color: var(--accent); flex: none; }

  /* Standalone placeholder link (e.g. "View Orientation Schedule") used
     outside a .doc-card — needs its own contained, centered card look,
     since .doc-link alone has no background/border of its own anymore. */
  .doc-link-standalone {
    display: flex; align-items: center; gap: 10px;
    max-width: 420px; margin: 14px auto 0;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    padding: 14px 18px; font-weight: 600; font-size: 0.88rem; color: var(--text);
    box-shadow: var(--shadow-card);
    transition: border-color .15s, box-shadow .15s;
  }
  .doc-link-standalone:hover { border-color: var(--card-border-hover); box-shadow: var(--shadow-card-hover); }
  .doc-link-standalone .doc-arrow { margin-left: auto; color: var(--accent); flex: none; }
  .doc-card-status {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 20px; border-top: 1px solid var(--card-border);
    background: var(--pill-bg);
  }
  .doc-check {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    font-size: 0.78rem; color: var(--text-dim); user-select: none;
  }
  .doc-check input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--status-good); cursor: pointer; }
  /* Download sits between Complete and Upload — same pill-button look as
     Upload, but margin-left:auto stays on Upload alone (the last button in
     the row) so it's the one that gets pushed to the far right; Download
     just flows inline next to it. */
  .doc-download-btn, .doc-upload-btn {
    display: flex; align-items: center; gap: 5px;
    background: none; border: 1px solid var(--card-border); border-radius: 8px;
    padding: 5px 10px; font-size: 0.75rem; font-weight: 600; color: var(--text-dim); cursor: pointer;
    font-family: inherit; transition: border-color .15s, color .15s;
  }
  .doc-upload-btn { margin-left: auto; }
  .doc-download-btn:hover, .doc-upload-btn:hover { border-color: var(--accent); color: var(--accent); }
  .doc-download-btn .icon, .doc-upload-btn .icon { width: 13px; height: 13px; }
  .doc-upload-btn.is-uploading { opacity: 0.6; pointer-events: none; }
  .doc-card.is-done .doc-check { color: var(--status-good); font-weight: 600; }

  .deptgrid-intro {
    max-width: 680px; margin: 0 auto 40px; text-align: center;
    color: var(--text-dim); font-size: 1.02rem; line-height: 1.7;
  }
  /* All 5 stay on one row — narrower columns than a 3-across layout, but
     each card still carries a number badge, description, "Led by" line,
     focus line, and CTA, just stacked more tightly than before. */
  .dept-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px;
    max-width: var(--maxw); margin: 0 auto;
  }
  .dept-card {
    position: relative; display: flex; flex-direction: column; background: var(--card);
    border: 1px solid var(--card-border); border-radius: var(--radius); overflow: hidden;
    text-align: center; height: 100%;
    box-shadow: var(--shadow-card); transition: box-shadow .18s, border-color .18s, transform .18s;
  }
  .dept-card:hover { box-shadow: var(--shadow-card-hover); border-color: var(--accent); transform: translateY(-4px); }
  .dept-card-num {
    position: absolute; top: 10px; left: 12px; font-family: 'Orbitron', sans-serif;
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; color: var(--text-dim); opacity: 0.55;
  }
  .dept-card-icon {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 118px; flex: none;
    font-size: 2.2rem; background: var(--pill-bg);
  }
  .dept-card-icon .dept-icon-svg { width: 46px; height: 46px; }
  .dept-card-label {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 700;
    font-size: 0.9rem; line-height: 1.3; padding: 13px 10px; white-space: normal; word-break: break-word;
  }
  .dept-card:hover .dept-card-label { filter: brightness(1.08); }
  .dept-card-desc {
    padding: 13px 14px 4px; font-size: 0.76rem; line-height: 1.5; color: var(--text-dim);
  }
  .dept-card-meta {
    flex: 1; display: flex; flex-direction: column; gap: 8px;
    margin: 12px 14px 0; padding-top: 12px; border-top: 1px solid var(--card-border);
    text-align: left;
  }
  .dept-card-lead, .dept-card-focus {
    display: flex; flex-direction: column; gap: 2px; font-size: 0.72rem; color: var(--text); line-height: 1.35;
  }
  .dept-card-lead-label, .dept-card-focus-label {
    font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent);
  }
  .dept-card-cta {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    margin: 14px 14px 16px; padding: 9px 10px; border-radius: 999px;
    background: var(--pill-bg); color: var(--accent); font-weight: 700; font-size: 0.7rem;
    transition: background .18s, color .18s;
  }
  .dept-card-cta .icon { width: 12px; height: 12px; }
  .dept-card:hover .dept-card-cta { background: var(--accent); color: #fff; }
  .deptgrid-footer {
    max-width: 680px; margin: 36px auto 0; text-align: center;
    color: var(--text-dim); font-size: 0.85rem; font-style: italic; line-height: 1.6;
  }
  @media (max-width: 1300px) { .dept-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 780px) { .dept-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .dept-grid { grid-template-columns: 1fr; } }

  .phase-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 14px;
    max-width: var(--maxw); margin: 0 auto;
  }
  .phase-card {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--card); border: 1px solid var(--card-border); border-left: 4px solid var(--accent);
    border-radius: 12px; padding: 18px; font-weight: 700; color: var(--text); font-size: 0.95rem;
    box-shadow: var(--shadow-card);
  }
  a.phase-card:hover { border-left-color: var(--accent-2); box-shadow: var(--shadow-card-hover); }
  /* Phase by phase (see 'phaselinks' in app.html): .done (already
     completed) gets a green check, .current (unlocked, the one to do now)
     is the normal clickable look above, .locked (its prerequisite phase
     isn't done yet) is dimmed with a lock icon — but still a real link, so
     it can always be opened and read; only that phase's own checkboxes are
     disabled once you're on the page (see .check-item.locked below). */
  .phase-card.done { border-left-color: var(--status-good); }
  .phase-card.done .phase-card-icon { color: var(--status-good); }
  .phase-card.locked {
    background: var(--pill-bg); border-left-color: var(--card-border); color: var(--text-dim);
    box-shadow: none;
  }
  .phase-card.locked .phase-card-icon { color: var(--text-dim); }
  .phase-card-icon .icon { width: 18px; height: 18px; display: block; }
  /* .current — the phase page actually being viewed right now (see
     renderPhaseTrail in app.html), distinct from .done (finished, possibly
     including the one you're currently revisiting) and plain unlocked
     (reachable but not where you are). Filled with the accent color rather
     than just an outline so "you are here" reads at a glance in a row where
     every other state is a light card. */
  .phase-card.current {
    background: var(--accent); border-left-color: var(--accent); color: #fff; cursor: default;
  }

  /* .next-up — the phase that just became reachable because the one being
     viewed was completed (see renderPhaseTrail in app.html). It sits
     between .locked (can't go yet) and plain unlocked (could go, no
     particular reason to), and marks the single most useful action on the
     page at that moment. Accent-tinted outline + soft glow rather than a
     solid fill, so it reads as "open, go here" without competing with
     .current's solid "you are here". */
  .phase-card.next-up {
    border-color: var(--accent); border-left-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-card);
  }
  a.phase-card.next-up:hover {
    border-left-color: var(--accent-2);
    box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-card-hover);
  }
  .phase-card-nextup {
    margin-left: auto; font-size: 0.68rem; font-weight: 800;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft);
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
  }
  /* The pulse draws the eye to a state that appears mid-page, without a
     navigation to signal the change. Runs a few times and stops rather than
     looping forever — a permanently animating element is a distraction to
     read past, and this only needs to catch attention once. */
  @media (prefers-reduced-motion: no-preference) {
    .phase-card.next-up { animation: next-up-pulse 1.6s ease-out 3; }
  }
  @keyframes next-up-pulse {
    0%, 100% { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-card); }
    50% { box-shadow: 0 0 0 7px var(--accent-soft), var(--shadow-card); }
  }

  /* Phase trail — the same phase-card/phase-grid look reused at the bottom
     of every phase page (see renderPhaseTrail in app.html) instead of the
     old two-link Back/Next pair, so all 3 phases (not just the adjacent
     ones) are always visible and color-coded. Full-width/same size as the
     department landing page's own phaselinks section (explicit request:
     the two should look the same, not one shrunk down) — .phase-trail-grid
     no longer overrides .phase-grid's own sizing, just adds the top spacing
     needed for sitting inside the page-end .closing-line band. */
  /* align-self:stretch on the .phase-grid overrides .closing-line's own
     align-items:center, which otherwise shrinks its flex CHILDREN (this
     .phase-grid included — .closing-line and .phase-trail-row are the same
     element, not nested, so this class combo IS the flex container, and
     .phase-grid is what needs stretching, not it) to their content width.
     .phase-grid has its own max-width already (see .phase-grid above) so
     this doesn't make it unbounded, just lets it actually reach that width
     instead of collapsing to however wide its 3 cards happen to need. */
  .phase-trail-row { padding-top: 24px; }
  .phase-trail-row .phase-grid { align-self: stretch; width: 100%; }
  /* "Back to Team" link above the phase pills (see renderPhaseTrail) — the
     only way back to a department's Meet Your Supervisor / Department
     Overview content from a phase page now that the level picker (and thus
     any reason to keep a link there) moved off that landing page. */
  .back-to-team-link {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px;
    font-size: 0.85rem; font-weight: 600; color: var(--text-dim); transition: color .15s;
  }
  .back-to-team-link:hover { color: var(--accent); }

  /* .next-phase — still used by the "You have completed all three phases"
     closing link at the end of a department's final phase (data.closing.page
     in renderPage, app.html), separate from the phase trail above. */
  .next-phase {
    display: flex; width: fit-content; align-items: center; gap: 8px;
    padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 0.9rem;
    background: var(--accent); color: #fff;
  }
  .next-phase:hover { filter: brightness(1.08); }

  .team-group { margin-bottom: 26px; }
  .team-group h2 { font-size: 1.1rem; }
  .team-members { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 14px; }

  /* Flip card: .team-member is the 3D stage (perspective), the two
     .team-member-face children are absolutely stacked and rotated opposite
     ways so exactly one is ever facing the viewer. Hover/focus flips it for
     mouse/keyboard users; .flipped (toggled by app.html's tap handler)
     covers touch devices, which have no hover state to trigger this at all. */
  .team-member {
    position: relative; perspective: 800px; cursor: pointer;
    border-radius: 12px; outline: none; height: 148px;
  }
  .team-member-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    padding: 14px; text-align: center; box-shadow: var(--shadow-card);
    transition: transform .5s cubic-bezier(.4,.2,.2,1), border-color .18s, box-shadow .18s;
  }
  .team-member-front { position: relative; transform: rotateY(0deg); }
  .team-member-back { transform: rotateY(180deg); }
  .team-member:hover .team-member-face,
  .team-member:focus-visible .team-member-face,
  .team-member.flipped .team-member-face {
    box-shadow: var(--shadow-card-hover); border-color: var(--accent);
  }
  .team-member:hover .team-member-front,
  .team-member:focus-visible .team-member-front,
  .team-member.flipped .team-member-front { transform: rotateY(-180deg); }
  .team-member:hover .team-member-back,
  .team-member:focus-visible .team-member-back,
  .team-member.flipped .team-member-back { transform: rotateY(0deg); }
  .team-member-name {
    font-size: 0.88rem; font-weight: 600; color: var(--text); line-height: 1.3;
  }
  .team-avatar {
    width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700;
    flex: none;
  }
  /* Slight hue variety across the grid so it doesn't read as one flat block
     of identical blue circles — cycles through 4 subtly different gradients. */
  .team-member:nth-of-type(4n+2) .team-avatar { background: linear-gradient(135deg, var(--accent-2), #7c9bff); }
  .team-member:nth-of-type(4n+3) .team-avatar { background: linear-gradient(135deg, #5b7cff, var(--accent)); }
  .team-member:nth-of-type(4n+4) .team-avatar { background: linear-gradient(135deg, #4f6bef, var(--accent-2)); }
  .team-member-back {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent;
  }
  .team-member-role {
    font-size: 0.78rem; font-weight: 600; color: #fff; line-height: 1.45;
  }
  @media (prefers-reduced-motion: reduce) { .team-member-face { transition: none; } }

  /* ---------- Interactive org chart (Meet Our Team) ----------
     A real tree, matching the company's actual chart: Leadership sits alone
     at the top center, a trunk line runs down to a horizontal bar, which
     branches into two clearly separated bands — Departments, then Project
     Managers — each with its own tinted background so the segments read as
     distinct zones (mirrors the HQ/site color-coding in the source chart).

     Every node still expands via the same gradual inline drill-down as
     before — nothing pops or swaps, everything grows in place via
     max-height transitions (see initOrgChart in app.html):
       1. All nodes sit in their row by default (Leadership on its own row,
          departments and PM each in their own row within their segment).
       2. Click a node -> its people list slides open directly beneath that
          button; other nodes stay exactly where they are.
       3. Click a person -> their role text slides open beneath their name,
          and .org-chart gains .focused, which fades out every OTHER node
          (the opened one stays put) so attention narrows to just them.
     A "Back to All Teams" control (hidden until .focused) collapses
     everything and restores the full tree. */
  /* Org Chart / Group Structure toggle (see the 'orgchart' case in
     renderSectionContent, app.html) — both panels render into the DOM at
     once; .org-view-active picks which one is visible, everything else
     stays display:none rather than being torn down/rebuilt on switch. */
  .org-view-toggle-wrap { display: flex; justify-content: center; margin-bottom: 28px; }
  /* Bigger + symmetrical — explicit request. Equal-width buttons (not
     each sized to its own text) so "Org Chart" and "Group Structure"
     read as two equal options, not a short button next to a long one. */
  .org-view-toggle { padding: 4px; gap: 4px; border-radius: 12px; }
  .org-view-toggle .seg-btn {
    min-width: 160px; padding: 12px 22px; font-size: 0.92rem; border-radius: 9px;
  }
  [data-org-view-panel] { display: none; }
  [data-org-view-panel].org-view-active { display: block; }

  /* zoom (not transform: scale) shrinks the ENTIRE Company Structure
     section — every panel, font, icon, padding, and gap at once — while
     keeping normal document flow and click hit-testing accurate (a
     transform:scale-based approach visually shrinks but leaves the
     original, larger layout box for click/hover/measurement purposes,
     which would silently break renderOrgConnectors' own getBoundingClientRect
     math throughout this view). Added once the Org Chart view switched to
     fully-expanded-by-default (see initOrgChart, app.html) — showing every
     team/person at once made the un-scaled page require far more side-to-
     side/up-down navigation than a click-to-expand version ever did;
     explicit request to make everything smaller-but-still-readable rather
     than leave it that tall/wide. Applies to both Org Chart and Group
     Structure views, since they share this same .org-chart wrapper. */
  /* max-width: none + negative side margins matching section.block's own
     28px side padding — a standard "full-bleed breakout" so this chart
     uses the ENTIRE available width of .main (viewport minus sidebar),
     not the shared --maxw content cap (1520px, but the real limiter on
     an ordinary window is .main's own narrower width) every other
     section respects. Explicit request: no horizontal scrollbar on
     either the Org Chart or Group Structure view, ever — every card in
     Head Office's row (Engineering through Administration, including
     Asset Management's own wider two-branch state) must fit without one,
     which the shared narrower content width couldn't guarantee no matter
     how much individual card sizes got tuned. */
  .org-chart { max-width: none; width: calc(100% + 56px); margin: 0 -28px; zoom: 0.66; }
  .org-back-btn {
    display: none; align-items: center; gap: 6px; margin: 0 auto 18px;
    background: var(--pill-bg); border: 1px solid var(--card-border); border-radius: 999px;
    padding: 8px 16px; font-size: 0.82rem; font-weight: 700; color: var(--text-dim);
    cursor: pointer; font-family: inherit; transition: border-color .15s, color .15s;
  }
  .org-chart.focused .org-back-btn { display: inline-flex; }
  .org-back-btn:hover { border-color: var(--card-border-hover); color: var(--accent); }
  .org-back-btn .icon { width: 14px; height: 14px; }

  .org-tree { display: flex; flex-direction: column; align-items: center; }
  .org-tree-top { display: flex; justify-content: center; }
  /* Paints the 28px run directly below Leadership. A prior version of this
     rule set background:none here on the theory that .org-tree-branches::before
     (below) would cover this SAME span as one merged element spanning the
     full 28+28 — that was wrong: ::before is `top:0` relative to
     .org-tree-branches' OWN box, which starts only after this trunk's 28px
     already ends, so it can never reach backward to paint over this box.
     The result was a real, empty 28px gap with nothing drawn in it at all
     — reported directly ("does not start from the bottom part of the
     leadership panel... leaves a gap"). Restored to a plain painted stub,
     the same shape Head Office/Project Sites' own analogous connectors
     use. Group Structure still overrides this back to background:none for
     its own view (see .group-structure-frame .org-tree-trunk below) since
     ITS trunk is drawn by a separate JS-measured element instead. */
  .org-tree-trunk { width: 2px; height: 28px; background: var(--tree-line); }
  /* Head Office and Project Sites stack vertically here (.org-segment is
     plain block-level, no flex/grid — they are NOT side by side), so there
     is only ever ONE branch point below Leadership, not a left/right fork.
     A full-width horizontal bar (8%-92% of the page) used to sit here
     regardless, with only a single center drop under it — visually
     implying a fork to two things that don't actually exist side by side,
     while the wide bar itself connected to nothing at its own left/right
     ends. Replaced with a short, centered drop matching the same visual
     language as every other connector in this tree (a plain short stub,
     not an oversized bar), running straight from Leadership above into
     Head Office's own top edge below. */
  .org-tree-branches { position: relative; width: 100%; padding-top: 28px; }
  /* Continues the trunk line from .org-tree-trunk (above) down into Head
     Office's/Project Sites' own top edge. A prior version tried merging
     this with .org-tree-trunk into one 56px element to fix a doubled-line
     artifact at their seam — that broke worse (a real 28px GAP, see
     .org-tree-trunk's own comment), so this is back to its original
     28px/paints-its-own-span shape. The doubled-line-at-the-seam concern
     this was chasing is addressed differently now (both this and
     .org-tree-trunk paint the exact same --tree-line color at the exact
     same centered x, and .org-chart's zoom is applied to the whole
     ancestor tree uniformly, not per-element, so both scale together
     without drifting apart at their shared boundary). */
  .org-tree-branches::before {
    content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 28px;
    background: var(--tree-line); transform: translateX(-50%); z-index: 0;
  }

  .org-segment {
    position: relative; z-index: 1;
    border-radius: var(--radius); padding: 24px 20px; margin-bottom: 18px;
  }
  /* Drops from this segment's own top edge down to the horizontal branch
     bar (see .org-branch-bar / renderOrgConnectors in app.html) — every
     segment gets this independently (Head Office AND Project Sites).
     Stops at 58px: segment padding-top (24px) + .org-segment-label's own
     line-height/margin-bottom. */
  .org-segment::before {
    content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 58px;
    background: var(--tree-line); transform: translateX(-50%); z-index: 0;
    pointer-events: none;
  }
  .org-segment-departments { background: var(--accent-soft); }
  .org-segment-pm { background: var(--status-warn-soft); }
  .org-segment-pm .org-segment-label { color: #a15c00; }
  /* Leadership's own outer segment (see orgLeadershipNodeHtml, app.html) —
     a neutral wash rather than reusing --accent-soft (Head Office, right
     below it in the tree) or --status-good-soft (already used INSIDE this
     same segment, for the Board of Directors/Advisors row) — picking
     either would either clash with a sibling segment's own color or with
     this segment's own internal tier coloring. */
  .org-segment-leadership { background: var(--pill-bg); }
  /* .org-segment::before (above) unconditionally draws a drop from EVERY
     .org-segment's own top edge, on the assumption there's always
     something above it to connect from (true for Head Office/Project
     Sites, which sit below Leadership in the tree). Leadership is now
     also an .org-segment (see the restructure in orgLeadershipNodeHtml,
     app.html) but sits at the very TOP of the tree with nothing above
     it — so this same rule was drawing a stray line poking out of
     Leadership's own top edge into empty space, reported directly ("a
     line up downwards onto it... why is it the highest one"). Disabled
     here the same way Group Structure already disables it for its own
     segments (see .group-structure-frame .org-segment::before further
     down) — Leadership needs no lead-in drop at all, it has nothing to
     connect to above it. */
  .org-segment-leadership::before { content: none; }
  /* .org-segment's own margin-bottom:18px (base rule above) exists to
     separate Head Office from Project Sites when they stack — Leadership
     never had that gap as a plain .org-team, and introducing it here left
     an unaccounted-for 15px break between Leadership's own box and
     .org-tree-trunk right below it (that trunk's height, plus
     .org-tree-branches::before further down, were both sized assuming
     Leadership's box ended flush against them, not 18px above) — the
     reported "disconnected" line. Zeroed out since Leadership has no
     later segment stacked directly beneath IT specifically (Head Office
     is reached via the trunk/branches connector, not by simple document
     flow stacking) — nothing needs that spacing here. */
  .org-segment-leadership { margin-bottom: 0; }
  .org-segment-label {
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--accent); text-align: center; margin-bottom: 14px;
  }
  /* Head Office's label doubles as an "expand all departments" button
     (see [data-org-expand-all] in initOrgChart) — reset native <button>
     chrome so it stays visually identical to the plain .org-segment-label
     div used elsewhere (e.g. Project Managers), plus a chevron that flips
     when everything underneath is expanded. */
  .org-segment-label-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; background: none; border: none; font: inherit; cursor: pointer;
    padding: 0;
  }
  .org-segment-label-btn::after {
    content: ''; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: rotate(45deg); margin-top: -3px; transition: transform .2s ease;
  }
  .org-segment-label-btn.is-expanded::after { transform: rotate(-135deg); margin-top: 2px; }

  /* Connects the segment label ("HEAD OFFICE" / "PROJECT SITES") down to
     EVERY team card as an explicit right-angle elbow — a horizontal branch
     bar spanning from the leftmost to the rightmost card, with a short
     vertical drop from that bar into each individual card — matching a
     real org-chart/subway-map connector, not a row of independent short
     ticks that only look aligned when nothing has shifted. Several
     "independent per-card stem" approaches were tried before this and
     each one turned out to only be verifiable by trusting that a stem's
     own top edge lined up with the row's own top edge — correct in
     isolation, but what actually reads as "connected" is a single
     continuous line with a visible corner, which isolated stems can never
     produce even when perfectly positioned. Built as real DOM elements by
     renderOrgConnectors (see app.html), positioned by measured pixel
     offsets — .org-branch-bar (horizontal) and .org-branch-drop (one per
     card, vertical) — appended into .org-team-row itself, both behind the
     cards (z-index 0). Re-run once on initial render and again on resize
     (rows no longer wrap — see .org-team-row below — so card positions
     never shift from expand/collapse, only from a width change). */
  .org-team-row {
    position: relative; display: flex; justify-content: center; align-items: flex-start;
    gap: 16px; overflow-x: auto; overflow-y: hidden; padding-top: 18px;
    scrollbar-width: thin; scrollbar-color: var(--card-border-hover) transparent;
  }
  .org-team-row::-webkit-scrollbar { height: 6px; }
  .org-team-row::-webkit-scrollbar-track { background: transparent; }
  .org-team-row::-webkit-scrollbar-thumb { background: var(--card-border-hover); border-radius: 999px; }
  /* Project Sites specifically (not Head Office, which keeps its original
     horizontal-scroll shelf) wraps into rows instead of scrolling side to
     side — explicit request: opened project panels (each ~20 people, far
     taller than a Head Office card) reading better stacked 2-3 per line
     than requiring a horizontal scrollbar to see a panel opened off to the
     side. Safe now that renderOrgConnectors re-runs on every expand/collapse
     (see refreshConnectors in app.html) rather than only on load/resize —
     its bar/drop logic already groups cards into lines by offsetTop
     specifically to support more than one wrapped row, so wrapping here
     doesn't need any connector-side change. */
  .org-segment-pm .org-team-row {
    flex-wrap: wrap; justify-content: center; overflow-x: visible;
  }
  .org-branch-bar, .org-branch-drop {
    position: absolute; background: var(--tree-line); z-index: 0; pointer-events: none;
  }
  /* justify-content:center only centers content that's narrower than the
     row — once cards overflow into the horizontal scrollbar, flexbox left-
     aligns instead (nothing to center against), which is correct: a
     scrollable row reads as a shelf, not something that needs centering. */
  .org-team {
    position: relative; display: flex; flex-direction: column; width: 190px; flex: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  .org-team > * { position: relative; z-index: 1; }
  /* Leadership sits in .org-tree-top, directly under .org-tree-trunk, not
     inside .org-team-row alongside the other teams. */
  .org-leadership { width: 980px; max-width: 100%; }
  .org-chart.focused .org-team:not(.open) { opacity: 0; transform: scale(0.96); pointer-events: none; position: absolute; }
  .org-team-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 14px 20px; cursor: pointer;
    box-shadow: var(--shadow-card); transition: box-shadow .18s, border-color .18s;
    font-family: inherit;
  }
  .org-team-btn:hover, .org-team-btn:focus-visible { box-shadow: var(--shadow-card-hover); border-color: var(--accent); }
  .org-team.open .org-team-btn { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-soft), var(--card) 70%); }
  .org-team-label { font-weight: 700; font-size: 0.92rem; color: var(--text); }
  .org-team-count {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--accent);
  }

  /* Group Structure view (see renderGroupStructureHtml, app.html).
     Reuses the same visual vocabulary as .dept-card (Department Selection)
     rather than the flat bordered boxes this section started with — icon
     header band, gradient name strip, hover lift — so it reads as part of
     the same design system instead of a separate, plainer component. */

  /* .group-structure-frame draws a visible border around the WHOLE tree
     (Vichitbhan + Subsidiaries + Joint Ventures together) — a soft gradient
     wash + rounded frame matching --radius, not a hard 2px rectangle, so
     the "Vichitbhan Group" name reads as enclosing everything beneath it
     as one group rather than just labeling the top card. */
  .group-structure-frame {
    position: relative;
    background: linear-gradient(180deg, var(--pill-bg), transparent 65%);
    border: 1px solid var(--card-border); border-radius: calc(var(--radius) + 6px);
    padding: 28px 24px 24px; width: 100%;
  }
  /* The shareholder-to-Vichitbhan-to-Subsidiaries run used to be FOUR
     separately positioned pieces — .group-shareholder-connector (CSS),
     .org-tree-trunk (CSS), a JS-measured segment fork, and a JS-measured
     lead-in — each independently rounded to its own nearest pixel. Even
     with every individual measurement correct, 3-4 independent rounding
     boundaries stacked in one visually-continuous run is exactly what
     produced the reported "rigid"/kinked line: not really one line, but
     several short ones lined up to LOOK like one. Both CSS pieces below
     keep their layout height (so nothing else shifts) but lose their own
     background — renderOrgConnectors (app.html) now draws the entire
     shareholder-tier-to-branches run as ONE absolutely positioned element,
     measured once, in this frame's own coordinate space. One element
     cannot kink against itself. */
  /* .org-tree-trunk's base rule (above) paints its own line again (Org
     Chart's Leadership-to-Head-Office run needs that) — Group Structure
     still needs it invisible here, since renderGroupStructureTrunk draws
     this view's own shareholder-to-Vichitbhan run as one JS-measured
     element instead (see the comment above); this box's real height is
     still needed for correct layout spacing, just not its own paint. */
  .group-structure-frame .group-shareholder-connector,
  .group-structure-frame .org-tree-trunk { background: none; }
  .group-name-label {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    text-align: center; font-family: 'Orbitron', sans-serif;
    font-size: 0.74rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--accent); margin-bottom: 20px;
  }
  .group-name-label::before, .group-name-label::after {
    content: ''; flex: 1; max-width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--card-border-hover));
  }
  .group-name-label::after { background: linear-gradient(90deg, var(--card-border-hover), transparent); }

  /* Shareholder tier — who OWNS Vichitbhan, sitting ABOVE the parent card
     (see renderShareholderTierHtml, app.html), matching a real ownership-
     chart reference the user provided: boxes with ownership %, connector
     lines merging into one line feeding down into Vichitbhan below. */
  .group-shareholder-tier { display: flex; flex-direction: column; align-items: center; margin-bottom: 8px; }
  .group-shareholder-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .group-shareholder-box {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: 140px; background: var(--pill-bg); border: 1px solid var(--card-border);
    border-radius: 8px; padding: 10px 14px;
  }
  .group-shareholder-label { font-size: 0.82rem; font-weight: 700; color: var(--text); }
  .group-shareholder-label sup { font-size: 0.7em; color: var(--text-dim); }
  .group-shareholder-pct { font-family: 'Orbitron', sans-serif; font-size: 0.78rem; font-weight: 600; color: var(--accent); }
  /* New Investor — styled distinctly (amber/warn, matching the reference
     chart's own orange callout box for this same not-yet-finalized
     entity), so it visually reads as "different in kind" from the other
     two confirmed shareholders, not just another item in the row. */
  .group-shareholder-highlight {
    background: var(--status-warn-soft); border-color: transparent;
  }
  .group-shareholder-highlight .group-shareholder-label,
  .group-shareholder-highlight .group-shareholder-pct { color: #a15c00; }
  .group-shareholder-connector { width: 2px; height: 22px; background: var(--tree-line); }
  .group-shareholder-note {
    font-size: 0.72rem; font-style: italic; color: #a15c00; text-align: center;
    max-width: 260px; margin-top: -4px; margin-bottom: 4px;
  }

  .group-structure-tree { width: 100%; }
  /* Connects the segment label ("SUBSIDIARIES" / "JOINT VENTURES") down to
     EVERY stem individually, as a real measured elbow connector — same
     .org-branch-bar/.org-branch-drop mechanism used for Head Office/
     Project Sites (see renderOrgConnectors in app.html), not a CSS-only
     bar assumed to line up with each stem. A pure-CSS version was tried
     first (one central drop + one wide horizontal bar both fixed at the
     row's own top:0) and consistently left a real gap: the row has
     padding-top:18px so its CONTENT (the stems) starts 18px below the
     row's top edge, but the bar/drop were drawn at that top edge itself
     with nothing spanning the 18px between them and where the stems
     actually begin — and even where the center drop did reach, the outer
     cards (V&K, VN, VC, etc.) had no drop of their own reaching them at
     all, just a horizontal bar floating disconnected above their tops.
     renderOrgConnectors solves both: it measures each stem's REAL
     offsetTop/offsetLeft after render and draws the bar/drops to match
     exactly, the same fix already verified working for the org chart
     above. .group-entity-row/.group-jv-row register as connector targets
     the same way .org-team-row does — see the querySelector list in
     renderOrgConnectors. */
  .group-entity-row, .group-jv-row { position: relative; padding-top: 18px; }
