<script>
/* ============================================================
   Shared line-art icon set (24x24, currentColor stroke) — ported
   from the VCB Connect design system so both apps share one visual
   language instead of ad-hoc emoji.
   ============================================================ */
var ICON_SVG_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';

var ICONS = {
  search: ICON_SVG_OPEN + ' class="icon">' +
    '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',

  gear: ICON_SVG_OPEN + ' class="icon">' +
    '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.86l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.86-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.86.34l-.06.06A2 2 0 1 1 4.2 16.93l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.86l-.06-.06A2 2 0 1 1 7.03 4.2l.06.06a1.7 1.7 0 0 0 1.86.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.86-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.86V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>',

  menu: ICON_SVG_OPEN + ' class="icon">' +
    '<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>',

  close: ICON_SVG_OPEN + ' class="icon">' +
    '<path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>',

  sun: ICON_SVG_OPEN + ' class="icon">' +
    '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4-1.4"/><path d="M17.7 6.3l1.4-1.4"/></svg>',

  moon: ICON_SVG_OPEN + ' class="icon">' +
    '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',

  lock: ICON_SVG_OPEN + ' class="icon">' +
    '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',

  check: ICON_SVG_OPEN + ' class="icon">' +
    '<path d="M5 13l4 4L19 7"/></svg>',

  celebrate: ICON_SVG_OPEN + ' class="icon">' +
    '<path d="M12 3l1.8 4.3L18 9l-4.2 1.7L12 15l-1.8-4.3L6 9l4.2-1.7z"/><path d="M19 15l.8 1.9L21.5 18l-1.7.9L19 21l-.8-2.1-1.7-.9 1.7-1.1z"/></svg>',

  warning: ICON_SVG_OPEN + ' class="icon">' +
    '<path d="M12 3.5 2.5 20h19z"/><path d="M12 9.5v4.5"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>',

  document: ICON_SVG_OPEN + ' class="icon">' +
    '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7"/><path d="M9 17h5"/></svg>',

  camera: ICON_SVG_OPEN + ' class="icon">' +
    '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l2-3h4l2 3"/><circle cx="12" cy="13.5" r="3.2"/></svg>',

  chevronLeft: ICON_SVG_OPEN + ' class="icon">' +
    '<path d="M15 5l-7 7 7 7"/></svg>',

  chevronRight: ICON_SVG_OPEN + ' class="icon">' +
    '<path d="M9 5l7 7-7 7"/></svg>',

  upload: ICON_SVG_OPEN + ' class="icon">' +
    '<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',

  download: ICON_SVG_OPEN + ' class="icon">' +
    '<path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',

  ledger: ICON_SVG_OPEN + ' class="icon dept-icon-svg">' +
    '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h5"/></svg>',

  coin: ICON_SVG_OPEN + ' class="icon dept-icon-svg">' +
    '<circle cx="12" cy="12" r="9"/><path d="M12 7v10"/><path d="M9 9.5c0-1.4 1.3-2.5 3-2.5s3 1.1 3 2.5-1.3 2-3 2.5-3 1.1-3 2.5 1.3 2.5 3 2.5 3-1.1 3-2.5"/></svg>',

  package: ICON_SVG_OPEN + ' class="icon dept-icon-svg">' +
    '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',

  building: ICON_SVG_OPEN + ' class="icon dept-icon-svg">' +
    '<rect x="4" y="3" width="10" height="18"/><rect x="14" y="9" width="6" height="12"/><path d="M7 7h1"/><path d="M10 7h1"/><path d="M7 11h1"/><path d="M10 11h1"/><path d="M7 15h1"/><path d="M10 15h1"/></svg>',

  wrench: ICON_SVG_OPEN + ' class="icon dept-icon-svg">' +
    '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2-2z"/></svg>',

  /* Joint-venture glyph: two horizontal sleeve rects (left/right) each
     overlapped by a raised "fist" circle at the center, so the grip point
     reads as a distinct raised bump above the flat arms rather than one
     undifferentiated blob. A thin var(--card)-colored (matches whatever
     background this icon sits on, in either theme) stroke splits the two
     fists down the middle so it reads as two hands meeting, not one fused
     shape — without that seam this rendered as a single cloud/blob at real
     size. Deliberately simplified vs. the user's own more detailed
     reference image (which includes small building silhouettes and
     individual finger creases) — that level of illustrated detail was
     tried multiple times and never survived being hand-plotted as SVG path
     coordinates at this icon's real ~24px rendered size (see
     .group-jv-icon in styles.html); a bold simple silhouette reads
     correctly small the way fine linework didn't. */
  handshake: '<svg viewBox="0 0 24 24" fill="currentColor" class="icon dept-icon-svg">' +
    '<rect x="1" y="10.5" width="8.3" height="3.4" rx="1.5"/>' +
    '<rect x="14.7" y="10.5" width="8.3" height="3.4" rx="1.5"/>' +
    '<circle cx="9.8" cy="10.2" r="3.4"/>' +
    '<circle cx="14.2" cy="10.2" r="3.4"/>' +
    '<path d="M12 6.5v7.5" stroke="var(--card)" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>'
};

function icon(name) {
  return ICONS[name] || '';
}
</script>
