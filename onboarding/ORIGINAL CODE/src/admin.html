<script>
(function () {
  'use strict';

  /* ============================================================
     Admin checklist editor — reachable at ?page=admin. Lets an admin
     edit/add/remove/reorder Required Reading, Knowledge Requirements, and
     Required Outputs items for any department/phase without a code
     deploy. Password-gated (see checkAdminPassword in Code.gs) — the
     client never holds the real password, every attempt round-trips to
     the server. Edits are saved via saveChecklistItem/deleteChecklistItem
     (Code.gs), which write to the "Checklist Content" sheet; the next
     page load (this page or any employee's) picks them up via
     applyChecklistOverrides (content.html), which layers them onto the
     hardcoded PAGES baseline at render time — see doGet in Code.gs for
     where that override data gets fetched and injected.
     Entirely separate render path from renderPage's normal hero/sections
     layout (see the 'admin' special-case in renderPage, app.html) — this
     UI doesn't fit that shape (no hero, a totally different navigation
     model), so it owns its own DOM from the #app root down. */

  var PHASES = [
    { suffix: 'day-1-30', label: 'Phase 1 (Day 1–30)' },
    { suffix: 'day-31-60', label: 'Phase 2 (Day 31–60)' },
    { suffix: 'day-61-90', label: 'Phase 3 (Day 61–90)' }
  ];
  var BLOCKS = [
    { index: 0, heading: 'Required Reading' },
    { index: 1, heading: 'Knowledge Requirements' },
    { index: 2, heading: 'Required Outputs' }
  ];

  var adminPassword = null; // held in memory only, never persisted — re-prompted every fresh page load/reload

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ---------------- password gate ---------------- */

  function renderAdminLocked(appEl, errorMsg) {
    appEl.innerHTML =
      '<div class="admin-gate">' +
        '<div class="admin-gate-card">' +
          '<h1>Admin — Checklist Editor</h1>' +
          '<p>Enter the admin password to edit department checklists.</p>' +
          (errorMsg ? '<p class="admin-gate-error">' + esc(errorMsg) + '</p>' : '') +
          '<form id="admin-gate-form">' +
            '<input type="password" id="admin-gate-input" autocomplete="current-password" placeholder="Admin password" autofocus>' +
            '<button type="submit">Unlock</button>' +
          '</form>' +
        '</div>' +
      '</div>';
    var form = document.getElementById('admin-gate-form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var input = document.getElementById('admin-gate-input');
      var attempt = input.value;
      var btn = form.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Checking…';
      google.script.run
        .withSuccessHandler(function (ok) {
          if (ok) {
            adminPassword = attempt;
            renderAdminEditor(appEl);
          } else {
            renderAdminLocked(appEl, 'Incorrect password.');
          }
        })
        .withFailureHandler(function () {
          renderAdminLocked(appEl, 'Could not reach the server — try again.');
        })
        .checkAdminPassword(attempt);
    });
  }

  /* ---------------- editor shell: department/phase/block navigation ---------------- */

  var currentDeptId = null;
  var currentPhaseSuffix = PHASES[0].suffix;
  var currentBlockIndex = 0;
  var overridesCache = null; // { itemId: {text, level, deleted, order, pageKey, blockIndex} }, refetched on demand

  function pageKeyFor(deptId, phaseSuffix) {
    var dept = DEPARTMENTS.filter(function (d) { return d.id === deptId; })[0];
    return dept ? dept.prefix + phaseSuffix : null;
  }

  function renderAdminEditor(appEl) {
    if (!currentDeptId) currentDeptId = DEPARTMENTS[0].id;
    appEl.innerHTML =
      '<div class="admin-shell">' +
        '<div class="admin-header">' +
          '<h1>Checklist Editor</h1>' +
          /* data-link, not a plain href — this app is served inside
             Google's own sandboxed iframe (userCodeAppPanel), where a raw
             <a href="?page=..."> triggers a real browser navigation of
             that iframe to a relative URL that doesn't resolve the way it
             would outside the sandbox, landing on a blank page. Every
             other in-app link uses data-link for exactly this reason
             (see the document-wide click handler in app.html, which
             intercepts these and calls navigate() — a client-side
             re-render, no actual page load involved). */
          '<a href="?page=home" class="admin-exit-link" data-link="home">Exit to portal</a>' +
        '</div>' +
        '<div class="admin-nav">' +
          '<div class="admin-nav-group">' +
            '<div class="admin-nav-label">Department</div>' +
            '<div class="admin-nav-row" id="admin-dept-tabs">' +
              DEPARTMENTS.map(function (d) {
                return '<button type="button" class="admin-tab admin-tab-main' + (d.id === currentDeptId ? ' active' : '') + '" data-dept="' + esc(d.id) + '">' + esc(d.shortLabel) + '</button>';
              }).join('') +
            '</div>' +
          '</div>' +
          '<div class="admin-nav-group">' +
            '<div class="admin-nav-label">Phase</div>' +
            '<div class="admin-nav-row" id="admin-phase-tabs">' +
              PHASES.map(function (p) {
                return '<button type="button" class="admin-tab admin-tab-sub' + (p.suffix === currentPhaseSuffix ? ' active' : '') + '" data-phase="' + esc(p.suffix) + '">' + esc(p.label) + '</button>';
              }).join('') +
            '</div>' +
          '</div>' +
          '<div class="admin-nav-group">' +
            '<div class="admin-nav-label">Section</div>' +
            '<div class="admin-nav-row" id="admin-block-tabs">' +
              BLOCKS.map(function (b) {
                return '<button type="button" class="admin-tab admin-tab-sub' + (b.index === currentBlockIndex ? ' active' : '') + '" data-block="' + b.index + '">' + esc(b.heading) + '</button>';
              }).join('') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div id="admin-block-content"></div>' +
      '</div>';

    appEl.querySelectorAll('#admin-dept-tabs [data-dept]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentDeptId = btn.getAttribute('data-dept');
        renderAdminEditor(appEl);
      });
    });
    appEl.querySelectorAll('#admin-phase-tabs [data-phase]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentPhaseSuffix = btn.getAttribute('data-phase');
        renderAdminEditor(appEl);
      });
    });
    appEl.querySelectorAll('#admin-block-tabs [data-block]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentBlockIndex = Number(btn.getAttribute('data-block'));
        renderAdminEditor(appEl);
      });
    });

    renderBlockContent(appEl);
  }

  /* Re-fetches overrides fresh on every block render (rather than trusting
     a stale in-memory cache) — simplest way to always reflect the latest
     save without hand-tracking cache invalidation across edit/add/delete/
     reorder, and this editor's own request volume is far too low (one
     admin, occasional visits) for the extra round trip to matter. */
  function renderBlockContent(appEl) {
    var container = document.getElementById('admin-block-content');
    container.innerHTML = '<p class="admin-loading">Loading…</p>';
    google.script.run
      .withSuccessHandler(function (overrides) {
        overridesCache = overrides || {};
        renderBlockItems(container);
      })
      .withFailureHandler(function () {
        container.innerHTML = '<p class="admin-gate-error">Could not load checklist content.</p>';
      })
      .getChecklistOverrides();
  }

  function getBlockItems(pageKey, blockIndex) {
    var page = (typeof PAGES !== 'undefined') ? PAGES[pageKey] : null;
    var sec = page && (page.sections || [])[blockIndex];
    var baseline = sec && sec.type === 'checklist' ? sec.items : [];
    /* PAGES already has applyChecklistOverrides baked in (it runs once at
       load, see content.html) — so `baseline` here already reflects
       whatever was saved as of THIS page load. Editing again in the same
       session re-fetches overridesCache fresh (see renderBlockContent)
       but PAGES itself doesn't re-run applyChecklistOverrides, so a
       just-saved edit shows correctly attributed to its id (the save
       handlers below update the item in place / push a new one directly
       into PAGES rather than relying on a second overrides pass) — see
       saveItemEdit/addNewItem/deleteItemRow. */
    return baseline;
  }

  function renderBlockItems(container) {
    var pageKey = pageKeyFor(currentDeptId, currentPhaseSuffix);
    var items = getBlockItems(pageKey, currentBlockIndex);
    container.innerHTML =
      '<ul class="admin-item-list" id="admin-item-list"></ul>' +
      '<button type="button" class="admin-add-btn" id="admin-add-item-btn">+ Add item</button>';
    var list = document.getElementById('admin-item-list');
    items.forEach(function (item, i) {
      list.appendChild(buildItemRow(item, i, items.length, pageKey));
    });
    document.getElementById('admin-add-item-btn').addEventListener('click', function () {
      addNewItem(pageKey, currentBlockIndex, container);
    });
  }

  function buildItemRow(item, index, total, pageKey) {
    var li = document.createElement('li');
    li.className = 'admin-item-row';
    var isSenior = item.level === 'senior';
    li.innerHTML =
      '<div class="admin-item-main">' +
        '<textarea class="admin-item-text" rows="2">' + esc(item.text) + '</textarea>' +
        '<label class="admin-item-senior"><input type="checkbox"' + (isSenior ? ' checked' : '') + '> Senior-only</label>' +
      '</div>' +
      '<div class="admin-item-actions">' +
        '<div class="admin-item-move-pair">' +
          '<button type="button" class="admin-move-up" title="Move up"' + (index === 0 ? ' disabled' : '') + '>↑</button>' +
          '<button type="button" class="admin-move-down" title="Move down"' + (index === total - 1 ? ' disabled' : '') + '>↓</button>' +
        '</div>' +
        '<button type="button" class="admin-save-btn">Save</button>' +
        '<button type="button" class="admin-delete-btn">Delete</button>' +
        '<span class="admin-item-status"></span>' +
      '</div>';

    var textEl = li.querySelector('.admin-item-text');
    var seniorEl = li.querySelector('.admin-item-senior input');
    var statusEl = li.querySelector('.admin-item-status');

    li.querySelector('.admin-save-btn').addEventListener('click', function () {
      saveItemEdit(item.id, pageKey, { text: textEl.value, level: seniorEl.checked ? 'senior' : 'junior' }, statusEl);
    });
    li.querySelector('.admin-delete-btn').addEventListener('click', function () {
      if (!confirm('Delete this checklist item? This cannot be undone from the editor.')) return;
      deleteItemRow(item.id, pageKey, li, statusEl);
    });
    li.querySelector('.admin-move-up').addEventListener('click', function () {
      moveItem(item.id, pageKey, currentBlockIndex, -1, statusEl);
    });
    li.querySelector('.admin-move-down').addEventListener('click', function () {
      moveItem(item.id, pageKey, currentBlockIndex, 1, statusEl);
    });

    return li;
  }

  function setStatus(el, msg, isError) {
    el.textContent = msg;
    el.className = 'admin-item-status' + (isError ? ' admin-item-status-error' : ' admin-item-status-ok');
    setTimeout(function () { el.textContent = ''; el.className = 'admin-item-status'; }, 2500);
  }

  function saveItemEdit(itemId, pageKey, fields, statusEl) {
    statusEl.textContent = 'Saving…';
    google.script.run
      .withSuccessHandler(function () {
        // reflect the edit in the in-memory PAGES immediately, so re-rendering this block shows it without a full page reload
        applyLocalEdit(pageKey, itemId, fields);
        setStatus(statusEl, 'Saved', false);
      })
      .withFailureHandler(function (err) {
        setStatus(statusEl, 'Save failed', true);
      })
      .saveChecklistItem(itemId, fields, adminPassword);
  }

  function deleteItemRow(itemId, pageKey, li, statusEl) {
    statusEl.textContent = 'Deleting…';
    google.script.run
      .withSuccessHandler(function () {
        applyLocalDelete(pageKey, itemId);
        li.remove();
      })
      .withFailureHandler(function () {
        setStatus(statusEl, 'Delete failed', true);
      })
      .deleteChecklistItem(itemId, adminPassword);
  }

  /* Moving up/down assigns the moved item an explicit order value that
     sits strictly between its new neighbors (or beyond the first/last
     item) — see applyChecklistOverrides's Pass 3 (content.html) for why a
     strictly-between value is required rather than reusing a neighbor's
     own position (an admin-explicit order colliding with another item's
     default-derived order has undefined tie-breaking). Every other item
     in the block also gets its CURRENT position persisted as its own
     explicit order at the same time, so this move is stable across a
     page reload instead of only holding in memory until next edit. */
  function moveItem(itemId, pageKey, blockIndex, direction, statusEl) {
    var items = getBlockItems(pageKey, blockIndex);
    var fromIndex = items.findIndex(function (it) { return it.id === itemId; });
    var toIndex = fromIndex + direction;
    if (toIndex < 0 || toIndex >= items.length) return;
    var reordered = items.slice();
    var moved = reordered.splice(fromIndex, 1)[0];
    reordered.splice(toIndex, 0, moved);

    statusEl.textContent = 'Saving…';
    var calls = reordered.map(function (item, i) {
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .saveChecklistItem(item.id, { pageKey: pageKey, blockIndex: blockIndex, order: i * 1000 }, adminPassword);
      });
    });
    Promise.all(calls).then(function () {
      applyLocalReorder(pageKey, blockIndex, reordered);
      renderBlockContent(document.getElementById('admin-block-content').parentElement);
    }).catch(function () {
      setStatus(statusEl, 'Reorder failed', true);
    });
  }

  function addNewItem(pageKey, blockIndex, container) {
    var text = prompt('New checklist item text:');
    if (!text) return;
    var newId = 'admin-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
    google.script.run
      .withSuccessHandler(function () {
        applyLocalAdd(pageKey, blockIndex, newId, text);
        renderBlockItems(container);
      })
      .withFailureHandler(function () {
        alert('Could not add the new item — try again.');
      })
      .saveChecklistItem(newId, { pageKey: pageKey, blockIndex: blockIndex, text: text, level: 'junior' }, adminPassword);
  }

  /* ---- keep the in-memory PAGES object (already loaded for this page
     view) in sync with saves, so the editor reflects its own changes
     immediately without a full reload. Every employee-facing page load
     picks up saved changes independently via applyChecklistOverrides
     (content.html) reading fresh from the sheet — these four helpers only
     patch THIS admin session's already-loaded copy. ---- */
  function applyLocalEdit(pageKey, itemId, fields) {
    var items = getBlockItems(pageKey, currentBlockIndex);
    var item = items.filter(function (it) { return it.id === itemId; })[0];
    if (item) {
      if (fields.text !== undefined) item.text = fields.text;
      if (fields.level !== undefined) item.level = fields.level;
    }
  }
  function applyLocalDelete(pageKey, itemId) {
    var sec = PAGES[pageKey].sections[currentBlockIndex];
    sec.items = sec.items.filter(function (it) { return it.id !== itemId; });
  }
  function applyLocalAdd(pageKey, blockIndex, itemId, text) {
    var sec = PAGES[pageKey].sections[blockIndex];
    sec.items.push({ id: itemId, text: text, level: 'junior' });
  }
  function applyLocalReorder(pageKey, blockIndex, reorderedItems) {
    PAGES[pageKey].sections[blockIndex].items = reorderedItems;
  }

  /* ---------------- entry point ---------------- */

  function renderAdminPage(appEl) {
    if (adminPassword) {
      // Already unlocked earlier in this same page session (e.g. navigated away within the SPA and back) — re-verify silently rather than trusting client memory alone.
      google.script.run
        .withSuccessHandler(function (ok) {
          if (ok) renderAdminEditor(appEl);
          else { adminPassword = null; renderAdminLocked(appEl, null); }
        })
        .withFailureHandler(function () { renderAdminLocked(appEl, null); })
        .checkAdminPassword(adminPassword);
    } else {
      renderAdminLocked(appEl, null);
    }
  }

  window.renderAdminPage = renderAdminPage;
})();
</script>
