<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F3864">
<script>
  // Pre-paint theme, so people on dark do not get a white flash before React
  // mounts. Verbatim from the snippet documented in shared/src/theme.jsx —
  // one key (vcb_theme), one selector (class="dark" on <html>), replacing this
  // module's old sop-night key.
  (function () {
    try {
      var t = localStorage.getItem('vcb_theme') || 'auto';
      var d = t === 'dark' || (t !== 'light' &&
        window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', d);
      document.documentElement.style.colorScheme = d ? 'dark' : 'light';
    } catch (e) {}
    try {
      var l = localStorage.getItem('vcb_lang');
      if (l === 'th' || l === 'en') document.documentElement.lang = l;
    } catch (e) {}
  })();
</script>
<title>VCB-MANGO ERP — SOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
