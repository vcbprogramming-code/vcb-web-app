<style>
  :root {
    --bg: #f6f8fa;
    --panel: #ffffff;
    --ink: #1f2328;
    --ink-soft: #57606a;
    --ink-faint: #8b949e;
    --line: #d8dee4;
    --line-soft: #eaeef2;
    --brand: #0b3d62;
    --brand-2: #1f6feb;
    --accent: #1f6feb;
    --danger: #cf222e;
    --ok: #1a7f37;
    --shadow: 0 1px 3px rgba(27,31,36,.08), 0 8px 24px rgba(27,31,36,.06);
    --radius: 12px;
    --sans: "Sarabun", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  a { color: var(--brand-2); }

  /* ----- Layout ----- */
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  /* Banner — matched exactly to the VCB Document Control app */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 30px; color: #fff; z-index: 5;
    background: linear-gradient(135deg, #1F3864 0%, #2E75B6 100%);
    box-shadow: 0 2px 12px rgba(31,56,100,.25);
    font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  .brandwrap { display: flex; align-items: center; gap: 18px; }
  .brand-txt { display: flex; align-items: center; gap: 16px; }
  .brand-h1 { font-size: 24px; font-weight: 800; letter-spacing: .3px; line-height: 1; color: #fff; margin: 0; }
  .brand-h1 .brand-link { color: inherit; text-decoration: none; cursor: pointer; transition: opacity .15s; }
  a.brand-link:hover { opacity: .8; text-decoration: none; }
  .brand-div { width: 1px; height: 40px; background: rgba(255,255,255,.45); }
  .brand-stack { display: flex; flex-direction: column; gap: 6px; }
  .brand-sub { font-size: 12.5px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #fff; }
  .brand-th { font-size: 13px; font-weight: 500; color: #fff; letter-spacing: .5px; line-height: 1; }
  .hdr-right { display: flex; align-items: center; gap: 14px; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18);
    border-radius: 9px; padding: 7px 11px; width: 320px; max-width: 38vw;
  }
  .search input {
    border: none; background: transparent; color: #fff; outline: none;
    width: 100%; font-size: 13.5px;
  }
  .search input::placeholder { color: #b6c6d6; }
  .tbtn {
    background: rgba(255,255,255,.14); color: #fff;
    border: 1px solid rgba(255,255,255,.2); border-radius: 9px;
    padding: 7px 12px; font-size: 13px; white-space: nowrap;
  }
  .tbtn:hover { background: rgba(255,255,255,.24); }
  .who { font-size: 13.5px; color: #fff; font-weight: 500; margin-left: 4px; white-space: nowrap; }

  /* --- Base layout (unconditional; responsive overrides follow) --- */
  .body { display: grid; grid-template-columns: 294px 360px 1fr; min-height: 0; }
  .body.timeline-mode { grid-template-columns: 294px 0 1fr; }
  .body.timeline-mode .list { border-right: none; overflow: hidden; }

  /* --- Responsive: narrow the fixed columns as width runs out --- */
  /* 1200, not 1100: an iPad Air/Pro 11 in landscape is 1180px and was
     falling into the widest band, which gave the sheet a WORSE scale than
     the same tablet in portrait (0.56 vs 0.71). */
  @media (max-width: 1200px) {
    .body { grid-template-columns: 258px 320px 1fr; }
    .body.timeline-mode { grid-template-columns: 258px 0 1fr; }
  }
  /* Tablets (iPad Pro 1024, iPad Air landscape). Narrow the two fixed
     columns so the reading pane keeps a usable share of the width; the sheet
     itself is then CSS-scaled to whatever is left (fitScaleToPane, applied
     once Paged.js has settled). Without this the document was simply clipped
     on its left edge, with no way to scroll to the text that fell off. */
  @media (max-width: 1040px) {
    .body { grid-template-columns: 214px 268px 1fr; }
    .body.timeline-mode { grid-template-columns: 214px 0 1fr; }
  }
  /* Tablet PORTRAIT: two columns, not three. At 820px three columns left the
     sheet ~390px — a 43% scale, present but not readable. The meeting list
     gives up its column and slides over the document when wanted. */
  /* Tablet PORTRAIT only — every rule is scoped html:not(.is-mobile).
     Phones ALSO match max-width:900px, but they swap whole panes via
     .mobile-pane-* and never override position/transform, so an unscoped
     rule here slid the phone meeting list off-screen with no way back. */
  @media (max-width: 900px) {
    html:not(.is-mobile) .body { position: relative; grid-template-columns: 188px 1fr; }
    html:not(.is-mobile) .body.timeline-mode { grid-template-columns: 188px 1fr; }
    html:not(.is-mobile) .list {
      position: absolute; top: 0; bottom: 0; left: 188px; width: min(300px, 52vw);
      z-index: 24; border-right: 1px solid var(--line); background: var(--panel);
      box-shadow: 6px 0 18px rgba(15,20,28,.13);
      transform: translateX(-102%); transition: transform .18s ease;
    }
    html:not(.is-mobile) .body.list-open .list { transform: translateX(0); }
    /* The timeline VIEW uses the whole pane, so the list stays away while it
       is on screen. Scoped to .timeline-only, not .timeline-mode: opening a
       meeting from a timeline dot keeps activeProject === TIMELINE, and hiding
       the list unconditionally left that screen with no way back to it. */
    html:not(.is-mobile) .body.timeline-only .list { display: none; }
    html:not(.is-mobile) .detail { position: relative; }
    /* Tapping the document dismisses the list, so it needs no close button.
       NOT in timeline mode: nothing there can dismiss it (both the list and
       the peek button are hidden), so the scrim would sit over the whole
       timeline and eat the first click. */
    html:not(.is-mobile) .body.list-open:not(.timeline-only) .detail::before {
      content: ''; position: absolute; inset: 0; z-index: 23;
      background: rgba(15,20,28,.18);
    }
  }

  /* The list toggle. Hidden everywhere except tablet portrait, where the
     list is an overlay rather than a column. */
  .list-peek { display: none; }
  @media (max-width: 900px) {
    /* :not(.is-mobile) — phones switch panes with the back-bar instead, and
       an absolutely-positioned toggle would land on top of that button. */
    html:not(.is-mobile) .list-peek {
      display: inline-flex; align-items: center; gap: 7px;
      position: absolute; top: 10px; left: 12px; z-index: 22;
      border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
      border-radius: 999px; padding: 6px 14px 6px 11px; font: inherit; font-size: 13px;
      font-weight: 600; box-shadow: 0 1px 3px rgba(15,20,28,.12); cursor: pointer;
    }
    html:not(.is-mobile) .list-peek:hover { color: var(--ink); border-color: var(--brand-2); }
    html:not(.is-mobile) .list-peek-ic { font-size: 14px; line-height: 1; }
    /* Once the list is open the toggle would sit under it — and tapping the
       document already closes it, so it is redundant. */
    html:not(.is-mobile) .body.list-open .list-peek { display: none; }
    /* The timeline view itself has no list to peek at; a meeting opened from
       it does (see .timeline-only above). */
    html:not(.is-mobile) .body.timeline-only .list-peek { display: none; }
    /* Room for the floating ☰ toggle in every view the detail pane can show —
       not just a meeting. On the dashboards it would otherwise sit on top of
       the heading and swallow clicks meant for it.

       Only while the toggle is actually shown, though: when it is hidden the
       indent is a 128px hole that wraps the detail-bar buttons onto an extra
       row. Same condition as .list-peek above. */
    html:not(.is-mobile) .body:not(.list-open):not(.timeline-only) .detail-bar { padding-left: 128px; }
  }

  /* ----- Sidebar ----- */
  .sidebar { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; }
  .side-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); margin: 6px 8px 8px; font-weight: 600; }
  .proj { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; cursor: pointer; margin-bottom: 2px; }
  .proj:hover { background: var(--line-soft); }
  .proj.active { background: #e8f0fe; }
  .proj .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .proj .pn { flex: 1; min-width: 0; }
  .proj .pn b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj .pn small { color: var(--ink-faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .proj .cnt { font-size: 11.5px; color: var(--ink-soft); background: var(--line-soft); border-radius: 20px; padding: 1px 8px; }
  .proj-rename { border: none; background: transparent; color: var(--ink-faint); font-size: 12px; line-height: 1; cursor: pointer; padding: 5px 6px; border-radius: 6px; opacity: 0; flex: none; }
  .proj:hover .proj-rename { opacity: 1; }
  .proj-rename:hover { background: var(--line-soft); color: var(--ink); }
  .newbtn { width: 100%; margin-top: 12px; background: var(--brand-2); color: #fff; border: none; border-radius: 9px; padding: 10px; font-size: 13.5px; font-weight: 600; }
  .newbtn:hover { filter: brightness(1.05); }
  .newbtn.secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); margin-top: 8px; }
  .newbtn.secondary:hover { background: var(--line-soft); filter: none; }

  /* ----- Meeting list ----- */
  .list { background: var(--bg); border-right: 1px solid var(--line); overflow-y: auto; }
  .list-head { padding: 12px 14px 6px; font-size: 12px; color: var(--ink-soft); position: sticky; top: 0; background: var(--bg); }
  .range { display: flex; gap: 6px; padding: 4px 12px 8px; position: sticky; top: 34px; background: var(--bg); z-index: 1; }
  .range button { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 4px; font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .range button .n { color: var(--ink-faint); font-weight: 400; }
  .range button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .range button.active .n { color: #c7d6e5; }
  .range button:not(.active):hover { background: var(--line-soft); }

  /* Dashboard */
  .dash-wrap { padding: 26px 28px; max-width: 1100px; }
  .dash-head h2 { margin: 0 0 4px; font-size: 20px; color: var(--brand); }
  .dash-head p { margin: 0 0 18px; color: var(--ink-soft); font-size: 13.5px; }
  .dash-head #d_shareProject { margin: 2px 0 12px; }
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .dash-card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--brand)); border-radius: 12px; padding: 15px 16px; cursor: pointer; transition: box-shadow .12s, transform .12s; }
  .dash-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .dash-proj { font-size: 12px; font-weight: 700; color: var(--ink-soft); display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
  .dash-date { font-size: 12px; font-weight: 700; color: var(--brand-2); margin-bottom: 4px; }
  .dash-ttl { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .dash-ex { font-size: 12.5px; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 50px; }
  .dash-read { margin-top: 10px; font-size: 12.5px; font-weight: 700; color: var(--brand-2); }
  .dash-bullets { margin: 4px 0 2px; padding-left: 20px; color: var(--ink); }
  .dash-bullets li.bmuted { list-style: none; margin-left: -20px; color: var(--ink-soft); font-style: italic; }
  .pbig-card { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--c, var(--brand)); border-radius: 14px; padding: 22px 26px; max-width: 880px; cursor: pointer; transition: box-shadow .12s, transform .12s; }
  .pbig-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .pbig-ttl { font-size: 17px; font-weight: 700; color: var(--brand-2); margin: 0 0 4px; }
  .pbig-sub { font-size: 14px; font-weight: 700; margin: 0 0 10px; }
  .pbig-ttl + .pbig-body { margin-top: 8px; }
  .pbig-body { font-size: 14px; line-height: 1.6; min-height: 40px; }
  .seclabel { font-size: 12.5px; font-weight: 800; color: var(--brand-2); margin: 16px 0 7px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .seclabel:first-child { margin-top: 2px; }
  .secbody { color: var(--ink); }
  .secbody p { margin: 0 0 7px; }
  .secbody ul, .secbody ol { margin: 0 0 9px; padding-left: 20px; }
  .secbody li { margin: 0 0 5px; }
  .secbody h1, .secbody h2, .secbody h3 { font-size: 14.5px; color: var(--brand); margin: 11px 0 5px; }

  /* Timeline — one fixed layout shell shared by both modes so the header/toggle
     row never shifts, and the body below always fills the rest of the page. */
  .tl-wrap { padding: 20px 28px 24px; display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  .tl-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; flex: none; }
  .tl-head h2 { margin: 0 auto 0 0; font-size: 20px; color: var(--brand); display: inline-flex; align-items: center; gap: 8px; }
  .tl-year-nav { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .tl-year-nav .dbtn { padding: 5px 11px; }
  .tl-mode-switch { display: flex; gap: 4px; background: var(--line-soft); border-radius: 9px; padding: 3px; }
  .tl-mode-switch button { display: inline-flex; align-items: center; gap: 6px; border: none; background: transparent; padding: 6px 14px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .tl-mode-switch button svg { flex: none; }
  .tl-mode-switch button.active { background: var(--panel); color: var(--brand-2); box-shadow: var(--shadow); }
  .tl-toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; flex: none; }
  .tl-toggle { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 20px; padding: 5px 13px 5px 8px; font-size: 12.5px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .tl-toggle .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .tl-toggle.off { opacity: .45; text-decoration: line-through; }
  .tl-toggle:hover { border-color: var(--brand-2); }
  #tlBody { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .tl-horizontal { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .tl-lanes-area { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .tl-lane { display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 14px; padding: 10px 0; flex: 1; min-height: 0; position: relative; z-index: 1; }
  .tl-lane-label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-lane-label .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .tl-lane-label small { color: var(--ink-faint); font-weight: 400; }
  .tl-lane-track { position: relative; height: 22px; background: var(--line-soft); border-radius: 4px; }
  .tl-dot { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--brand)); border: 2px solid var(--panel); transform: translate(-50%, -50%); cursor: pointer; box-shadow: var(--shadow); transition: transform .1s; }
  .tl-dot:hover { transform: translate(-50%, -50%) scale(1.35); z-index: 2; }
  .tl-gridlines { position: absolute; top: 0; bottom: 0; left: 214px; right: 0; pointer-events: none; z-index: 0; }
  .tl-gridline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--line); }
  .tl-axis { position: relative; height: 26px; margin-top: 6px; margin-left: 214px; flex: none; }
  .tl-tick { position: absolute; top: 0; transform: translateX(-50%); font-size: 10.5px; color: var(--ink-faint); white-space: nowrap; }

  /* Year calendar (12 mini-months on one page, sized to fill the viewport with no scrolling) */
  .tl-year-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 1100px) { .tl-year-grid { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); } }
  @media (max-width: 760px) { .tl-year-grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(6, 1fr); } }
  .tl-year-month { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--panel); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .tl-year-month-name { font-size: 14px; font-weight: 700; color: var(--brand); margin-bottom: 6px; text-align: center; flex: none; }
  .tl-year-dow { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 10px; font-weight: 700; color: var(--ink-faint); text-align: center; flex: none; margin-bottom: 2px; }
  .tl-year-grid-days { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 2px; }
  .tl-year-day { position: relative; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ink); border-radius: 5px; cursor: default; min-height: 0; }
  .tl-year-day.tl-year-day-empty { visibility: hidden; }
  .tl-year-day.tl-year-day-today { background: var(--brand-2); color: #fff; font-weight: 700; }
  .tl-year-day.tl-year-day-has-meetings { cursor: pointer; font-weight: 700; }
  .tl-year-day-dots { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); display: flex; gap: 2.5px; }
  .tl-year-day-dots span { width: 5px; height: 5px; border-radius: 50%; }
  .tl-year-day-today .tl-year-day-dots span { outline: 1px solid #fff; }
  .secbody table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 4px 0 9px; }
  .secbody td, .secbody th { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; text-align: left; }
  .secbody a { color: var(--brand-2); }
  .secbody img { max-width: 100%; height: auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 8px 12px; padding: 11px 13px; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
  .card:hover { border-color: #c0c8d0; box-shadow: var(--shadow); }
  .card.active { border-color: var(--brand-2); box-shadow: 0 0 0 2px rgba(31,111,235,.18); }
  .card .meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: nowrap; min-width: 0; }
  .card .meta .date { flex: none; white-space: nowrap; }
  .card .meta .badge { flex: none; }
  .card .date { font-size: 12px; font-weight: 700; color: var(--brand); }
  .card .ttl { font-size: 13.5px; font-weight: 600; margin: 1px 0 4px; }
  .card .ex { font-size: 12px; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: .03em; }
  .badge.fathom { background: #fdeef0; color: #cf222e; }
  .badge.overview { background: #eef6ff; color: #1f6feb; }
  .badge.manual { background: #eafbf0; color: #1a7f37; }
  .badge.pin { background: #fff4d6; color: #9a6700; }
  .badge.hiddenb { background: #ffe9e9; color: #cf222e; }
  .badge.suggest-badge { margin-left: auto; }
  .proj.suggested { background: #fff9e0; box-shadow: inset 0 0 0 1.5px #e8c94a; }
  .proj.suggested:hover { background: #fff4c8; }
  .card.ishidden { opacity: .62; background: repeating-linear-gradient(45deg, #fff, #fff 10px, #fcf4f4 10px, #fcf4f4 20px); }
  .empty { padding: 30px 16px; color: var(--ink-faint); text-align: center; }

  /* ----- Detail ----- */
  .detail { background: var(--panel); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .detail-bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .detail-bar h2 { font-size: 16px; margin: 0; flex: 1; min-width: 200px; }
  .detail-bar .sub { font-size: 12px; color: var(--ink-soft); width: 100%; margin-top: -2px; }
  .dbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font-size: 12.5px; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
  .dbtn:hover { background: var(--line-soft); }
  .dbtn.primary { background: var(--brand-2); color: #fff; border-color: var(--brand-2); }
  .dbtn.danger:hover { background: #fdeef0; color: var(--danger); border-color: #f3c2c8; }
  .dbtn.danger-solid { background: var(--danger); color: #fff; border-color: var(--danger); }
  .dbtn.danger-solid:hover { background: #a5121f; border-color: #a5121f; }

  /* Comments slide-out panel — toggled via a "show" class from openComments()/
     closeComments() in JavaScript.html, not conditional DOM creation, so it
     survives renderDetail() re-runs (pin/visibility toggles rebuild #detailContent). */
  .ibtn { background: transparent; border: 1px solid transparent; border-radius: 7px; width: 28px; height: 28px; font-size: 14px; color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ibtn:hover { background: var(--line-soft); border-color: var(--line); }
  /* ----------------------- Activity side drawer ---------------------------
     Docks to the right of the screen as a strip, so the minutes stay readable
     while the trail is open — it is reference material, not a task that has
     to interrupt reading. The scrim is deliberately faint and click-to-close
     rather than a heavy modal backdrop. */
  .eh-scrim { display: none; position: fixed; inset: 0; background: rgba(15,20,28,.28); z-index: 60; }
  .eh-scrim.show { display: block; }
  .eh-drawer {
    position: fixed; top: 0; right: 0; bottom: 0;

  /* Does NOT scroll on its own. The iframe is sized to its full paginated
     height, so a scrollable .frame-wrap produced a second scrollbar floating in
     the middle of the pane, next to the sheet, instead of one scrollbar at the
     right edge of the window. Scrolling belongs to #detailContent (below), the
     outermost box, so the whole detail pane scrolls as one. */
  .frame-wrap { background: #eef1f4; padding: 22px; }

     860px clamp on .paper, whose width is set in pixels by the scaler. */

  /* Page width is NOT set here. It comes from @page{size:A4} inside the iframe
     (see OVERRIDE_CSS), which is the only place both pagination engines read
     it from; .paper is merely an outer centring box wide enough to hold an A4
     sheet plus its drop shadow.
     The 48px of screen-only body padding that used to sit INSIDE the iframe was
     removed (it shifted the on-screen document relative to the printed one);
     this padding sits outside the iframe instead, so it gives the sheet
     breathing room without affecting where pages break. */
  /* Transparent, with no sheet styling of its own: Paged.js renders each page
     as its own white sheet with a shadow, so a white panel behind them would
     show as a page inside a page. The container is now just a centring box. */
  .paper { max-width: 860px; margin: 0 auto; background: transparent; }
  /* Sits below .paper inside .frame-wrap's own scroll area — same max-width/
     centering as .paper so it lines up with the document above it, own card
     chrome (white, rounded, shadowed) so it reads as a distinct trailing
     section rather than a continuation of the paper or a floating strip. */
  /* Hidden until the document has paginated, then revealed with the sheet.
     Otherwise it painted immediately at the top of an empty grey pane and
     jumped down once the iframe grew — the flash reported on load. */
  .attach-footer { max-width: 860px; margin: 16px auto 0; background: #fff; border-radius: 8px; box-shadow: var(--shadow); padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; visibility: hidden; }
  .frame-wrap.ready .attach-footer { visibility: visible; }
  /* Must come AFTER the 860px clamps above: equal specificity, so source
     order decides. Once the sheet is scaled, .paper is given an explicit
     pixel width by fitScaleToPane and any max-width would fight it. */
  @media (max-width: 1040px) {
    .paper { max-width: none; }
    .attach-footer { max-width: none; }
  }
  /* Mobile does not run Paged.js and never adds .ready — show it immediately. */
  html.is-mobile .attach-footer { visibility: visible; }
  .attach-footer .atl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); font-weight: 700; margin-right: 4px; flex-basis: 100%; }
  /* Starts hidden AND already full-height: Paged.js paginates asynchronously,
     so without both the pane painted as a short grey box and then jumped to
     full size — the flash reported repeatedly. `min-height: 80vh` keeps the
     container the right shape while the document lays out; JS then sets the
     exact height and reveals it once the page count has settled.
     `visibility` rather than `display` so the frame is still laid out and
     measurable while hidden. Mobile reveals immediately — no Paged.js there. */
  iframe.render { width: 100%; border: 0; display: block; border-radius: 8px; min-height: 80vh; visibility: hidden; }
  .placeholder { display: flex; height: 100%; align-items: center; justify-content: center; color: var(--ink-faint); flex-direction: column; gap: 10px; text-align: center; padding: 40px; }

  /* ----------------------- A4 EDITING SURFACE ------------------------------
     The editor is 1:1 with the printed page. Every metric below is taken from
     the print stylesheet (OVERRIDE_CSS / @page in JavaScript.html):

        sheet width   A4 210mm = 794px
        text column   794px wide with 17mm side margins -> 665px of text
        page height   A4 297mm, minus 2.7cm top + 2cm bottom -> 945px usable
        type          15px / 1.55, same family

     Matching the COLUMN WIDTH is what makes this real: if the editor wraps
     lines at a different width from print, no page break can land in the same
     place, however the pages are drawn.

     These numbers come from @page in OVERRIDE_CSS and MUST be changed together
     with it. They were previously 816px / 64px — a US-Letter sheet — while the
     printed page was A4, so the editor's column was 688px against print's
     665px and the two wrapped differently. See PAGINATION.md.

     Page boundaries are drawn by .ed-pagebreak elements that the pagination
     code inserts at the exact 945px intervals, so a break is a real element in
     the flow rather than a stripe painted behind the text. */
  /* Plain block layout, NOT flex. A column flex container will not let an item
     grow past its own height, so the white sheet stopped at one page while the
     rest of the text spilled onto the grey desk behind it. As a normal block
     with `margin: auto` for centring, the sheet's height is driven by its
     content and the white background covers every page. */
  .ed-scroll {
    flex: 1; overflow: auto; background: #6b7280;
    padding: 26px 0 40px;
  }
  .ed-area {
    position: relative;
    width: 210mm; box-sizing: border-box;   /* A4, matching @page{size:A4} */
    margin: 0 auto;               /* centred without flex */
    padding: 2.7cm 17mm 2cm;      /* matches @page{margin:2.7cm 17mm 2cm} */
    background: #fff;
    /* Colour, font and size deliberately absent: they come from the print
       stylesheet via buildEditorPageCss_, so the editor cannot drift from the
       PDF. Only the sheet's own frame is defined here. */
    outline: none;
    box-shadow: 0 2px 12px rgba(0,0,0,.28);
    min-height: 297mm;
  }
  /* A page boundary: the bottom margin of one page, the gap between sheets,
     and the top margin of the next — drawn in the flow so the text below it
     genuinely starts on a new page instead of merely appearing to. */
  /* A page boundary. It is a full-width BLOCK so no text can share its line —
     an earlier version used a negative margin to span the sheet, and inline
     content ended up rendering inside the grey band. The break spans the sheet
     by being positioned across it rather than by overflowing its own box. */
  .ed-pagebreak {
    display: block;
    height: calc(2cm + 26px + 2.7cm);
    width: 210mm;                  /* the full sheet, not the text column */
    position: relative;
    left: -17mm;                   /* pull back over the sheet's side padding */
    clear: both;
    user-select: none;
    pointer-events: none;
    background:
      linear-gradient(to bottom,
        #fff 0, #fff 2cm,
        rgba(0,0,0,.22) 2cm, rgba(0,0,0,.22) calc(2cm + 1px),
        #6b7280 calc(2cm + 1px), #6b7280 calc(2cm + 25px),
        rgba(0,0,0,.22) calc(2cm + 25px), rgba(0,0,0,.22) calc(2cm + 26px),
        #fff calc(2cm + 26px), #fff 100%);
  }
  /* Shadows on the facing edges, so the gutter reads as the bottom of one
     sheet and the top of the next rather than a grey stripe drawn on one long
     page. The editor is necessarily a single contenteditable element — the
     caret cannot span two — so this is what makes it look like separate pages
     while remaining one editing surface. */
  .ed-pagebreak::before {
    content: '';
    position: absolute; left: 0; right: 0;
    top: 2cm; height: 26px;
    box-shadow: inset 0 6px 8px -6px rgba(0,0,0,.30),
                inset 0 -6px 8px -6px rgba(0,0,0,.30);
    pointer-events: none;
  }
  .ed-pagebreak::after {
    content: attr(data-label);
    position: absolute; right: 72px; top: calc(2cm + 6px);
    font-size: 10px; color: #cbd5e1; letter-spacing: .04em;
  }
  html.theme-dark .ed-scroll { background: #0d1117; }
  html.theme-dark .ed-area { background: #161b22; color: var(--ink); }
  html.theme-dark .ed-pagebreak {
    background:
      linear-gradient(to bottom,
        #161b22 0, #161b22 2cm,
        rgba(0,0,0,.55) 2cm, rgba(0,0,0,.55) calc(2cm + 1px),
        #0d1117 calc(2cm + 1px), #0d1117 calc(2cm + 25px),
        rgba(0,0,0,.55) calc(2cm + 25px), rgba(0,0,0,.55) calc(2cm + 26px),
        #161b22 calc(2cm + 26px), #161b22 100%);
  }


  /* ---------------------------------------------------------------------
     NO TYPOGRAPHY IS DEFINED HERE.

     Every rule that affects how text is measured — fonts, headings, list
     metrics, paragraph spacing, the tick marker, the letterhead — is derived
     at runtime from OVERRIDE_CSS, the exact stylesheet the print/PDF iframe
     uses (see buildEditorPageCss_ in JavaScript.html). Duplicating those
     values here is what made the editor drift from the PDF: each hand-copy
     was one more thing that could fall out of step, and every drift moved
     every page break below it.

     This file now describes only the SHEET — its width, page margins,
     background, shadow — plus the page-break bands, which exist on screen
     only. If a rule changes how text flows, it belongs in OVERRIDE_CSS. */
  .ed-area .ed-printhead { user-select: none; }

  /* The guest list inside each project card. */
  .ac-proj-people { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .ac-proj-people-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .ac-proj-people-t { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-soft); }
  .ac-proj-copy { border: 0; background: transparent; font: inherit; font-size: 11.5px; color: var(--brand); cursor: pointer; text-decoration: underline; padding: 0; }
  .ac-public-note { font-size: 12px; color: var(--ink-faint); line-height: 1.55; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .ac-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
  .ac-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 6px 3px 11px; font-size: 12.5px; }
  .ac-chip-mail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ac-chip button { border: 0; background: transparent; color: var(--ink-faint); font-size: 14px; line-height: 1; padding: 0 4px; cursor: pointer; border-radius: 50%; }
  .ac-chip button:hover { color: var(--danger); background: #fdeef0; }
  html.theme-dark .ac-chip button:hover { background: #3d1418; }
  .ac-chips-empty { font-size: 12.5px; color: var(--ink-faint); margin-bottom: 9px; }
  .ac-proj-add { display: flex; gap: 7px; }
  .ac-proj-add input { flex: 1; min-width: 0; font-size: 12.5px; padding: 6px 10px; }
  .ac-proj-add button { flex: none; font-size: 12.5px; padding: 6px 13px; }

  .ac-add { display: flex; gap: 10px; }
  .ac-add input { flex: 1; min-width: 0; }
  /* Taller than the old modal allowed: a full page has the room, so the editor
     list no longer scrolls inside an already-scrolling panel. */
  .ac-list { display: flex; flex-direction: column; gap: 8px; max-height: min(460px, 52vh); overflow: auto; margin-bottom: 12px; }
  .ac-list .empty { padding: 4px 2px; text-align: left; font-size: 12.5px; }
  .ac-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 13px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .ac-item.admin { background: #f6f8fa; color: var(--ink-soft); }
  .ac-shared-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .ac-shared-state { font-size: 12.5px; color: var(--ink-soft); }
  /* Monospace + letter-spacing so a revealed PIN is unambiguous to read aloud. */
  .ac-shared-value { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; font-weight: 700; letter-spacing: .18em; color: var(--ink); background: #f6f8fa; border: 1px solid var(--line); border-radius: 6px; padding: 2px 12px; }
  .ac-item button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 12px; font-size: 12px; color: var(--danger); }
  .ac-item button:hover { background: #fdeef0; border-color: #f3c2c8; }

  /* Phone: the header stacks, the search goes full width, one card per row. */
  html.is-mobile .ac-page-top { flex-direction: column; align-items: stretch; gap: 12px; padding: 16px 16px 12px; }
  html.is-mobile .ac-page-tools { justify-content: space-between; }
  html.is-mobile .ac-search { flex: 1; }
  html.is-mobile .ac-search input { width: 100%; max-width: none; }
  html.is-mobile .ac-tabs { padding: 0 16px; }
  html.is-mobile .ac-page-body { padding: 16px 16px 40px; }
  html.is-mobile .ac-projects-grid { grid-template-columns: 1fr; }

  .denied { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 12px; text-align: center; padding: 40px; color: var(--ink-soft); }
  .denied .big { font-size: 46px; }
  /* Above .ac-page (65) — a toast confirming an access change must not be
     painted behind the full-screen panel that raised it. */
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #1f2328; color: #fff; padding: 10px 18px; border-radius: 24px; font-size: 13px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 95; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ===========================================================
     Mobile (phone) — single-pane stack navigation
     Scoped to html.is-mobile (toggled by JS in <head>) so narrow
     desktop windows and misreporting in-app browsers both get it.
     Desktop layout is untouched.
     =========================================================== */
  .mobile-backbar { display: none; }

  /* ⚙ Settings — desktop variant lives in .hdr-right, icon-only, styled like a .tbtn.
     Hidden on mobile (mobile uses .settings-btn in .brandwrap instead). */
  .settings-btn-d {
    width: 38px;
    padding: 7px 0;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
  }
  html.is-mobile .settings-btn-d.tbtn { display: none; }
  html.is-mobile #timelineBtn { display: none; }

  /* ⚙ Settings — removed from mobile entirely (2026-07-22): theme/language/
     Project Access/build-info are desktop-only now, reachable via
     #settingsBtnD (already hidden on mobile, unaffected by this). Kept as
     display:none rather than deleting the button/modal outright — the
     underlying #setBg modal and its wiring still exist, unreachable on
     mobile with no entry point, harmless to leave in place. */
  .settings-btn { display: none; }
  html.is-mobile .settings-btn { display: none; }
  /* Settings sheet — identity + segmented controls */
  .set-who { font-size: 14px; padding: 2px 0; color: var(--ink); font-weight: 600; }
  .set-group { display: flex; flex-direction: column; gap: 8px; }
  .set-group-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    font-weight: 700;
    margin-top: 6px;
  }
  .set-mini-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    font-weight: 700;
  }
  .set-row-label {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
    margin-bottom: 2px;
  }
  .set-segment {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
  }
  .set-seg-opt {
    background: transparent;
    border: none;
    padding: 11px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    border-radius: 9px;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .set-seg-opt.active {
    background: var(--brand-2);
    color: #fff;
    box-shadow: 0 1px 4px rgba(31,111,235,.35);
  }
  .set-seg-opt:not(.active):hover { background: var(--line-soft); color: var(--ink); }
  .set-segment-3 { grid-template-columns: 1fr 1fr 1fr; }
  .set-about { gap: 4px; margin-top: 4px; }

  /* Standardized full-width settings-panel action row — same visual weight
     as the theme/language segment buttons above it, so all Settings actions
     read at one consistent size instead of small inline .dbtn chips. */
  .set-row-btn {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 16px; font-family: inherit; font-size: 14px; font-weight: 600;
    color: var(--ink); cursor: pointer; text-align: left;
  }
  .set-row-btn:hover { background: var(--line-soft); }
  .set-row-btn-ic { font-size: 17px; flex: none; }
  .set-row-btn-label { flex: 1; }
  .set-row-btn-chev { color: var(--ink-faint); font-size: 18px; flex: none; }

  /* Sign-out is a low-emphasis, occasional action — a plain centered text
     link below About, not a full row button competing with Project access. */
  .set-logout-link {
    display: block; width: 100%; text-align: center; margin-top: 4px;
    background: none; border: none; font-family: inherit; font-size: 13px;
    font-weight: 600; color: var(--danger); cursor: pointer; padding: 8px;
  }
  .set-logout-link:hover { text-decoration: underline; }
  .set-about-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    padding: 3px 2px;
    border-bottom: 1px solid var(--line-soft);
  }
  .set-about-row:last-child { border-bottom: none; }
  .set-about-k { color: var(--ink-faint); font-weight: 600; }
  .set-about-v { color: var(--ink); text-align: right; }
  a.set-about-v { color: var(--brand-2); text-decoration: none; }
  a.set-about-v:hover { text-decoration: underline; }

  /* ===========================================================
     Dark theme — variable overrides + targeted surface fixes
     for places that hardcoded #fff / light backgrounds.
     The topbar stays brand-blue in both themes (it IS the brand).
     The rendered Doc iframe stays light — Docs are paper, not chrome.
     =========================================================== */
  html.theme-dark {
    --bg: #0d1117;
    --panel: #161b22;
    --ink: #e6edf3;
    --ink-soft: #9da7b1;
    --ink-faint: #7d8590;
    --line: #30363d;
    --line-soft: #21262d;
    --brand-2: #58a6ff;
    --accent: #58a6ff;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
  html.theme-dark .modal { background: var(--panel); color: var(--ink); }
  html.theme-dark .modal h3 { border-bottom-color: var(--line); }
  html.theme-dark .modal .actions { border-top-color: var(--line); }
  html.theme-dark .modal input,
  html.theme-dark .modal select,
  html.theme-dark .modal textarea { background: #0d1117; color: var(--ink); border-color: var(--line); }
  html.theme-dark .editor { background: var(--panel); color: var(--ink); }
  html.theme-dark .editor h3 { border-bottom-color: var(--line); }
  html.theme-dark .ed-meta { border-bottom-color: var(--line); }
  html.theme-dark .ed-meta input { background: #0d1117; color: var(--ink); border-color: var(--line); }
  html.theme-dark .ed-toolbar { background: #1c2128; border-bottom-color: var(--line); }
  html.theme-dark .ed-toolbar button { background: var(--panel); color: var(--ink); border-color: var(--line); }
  html.theme-dark .ed-toolbar button:hover { background: var(--line-soft); }
  html.theme-dark .ed-toolbar button:disabled:hover { background: var(--panel); }
  html.theme-dark .ed-area { color: var(--ink); }
  html.theme-dark .ed-area h1, html.theme-dark .ed-area h2 { color: var(--brand-2); }
  html.theme-dark .ed-area td, html.theme-dark .ed-area th { border-color: var(--line); }
  html.theme-dark .dbtn { background: var(--panel); color: var(--ink); border-color: var(--line); }
  html.theme-dark .dbtn:hover { background: var(--line-soft); }
  html.theme-dark .dbtn.primary { background: var(--brand-2); color: #fff; border-color: var(--brand-2); }
  html.theme-dark .dbtn.danger-solid { background: var(--danger); color: #fff; border-color: var(--danger); }
  html.theme-dark .eh-drawer-body input[type="text"] { background: #0d1117; color: var(--ink); border-color: var(--line); }
  html.theme-dark .proj.active { background: rgba(88,166,255,.18); }
  html.theme-dark .proj:hover { background: var(--line-soft); }
  html.theme-dark .range button { background: var(--panel); color: var(--ink-soft); border-color: var(--line); }
  html.theme-dark .range button:not(.active):hover { background: var(--line-soft); }
  html.theme-dark .attendees { background: #1c2128; border-bottom-color: var(--line); }
  html.theme-dark .chip { background: var(--panel); border-color: var(--line); color: var(--ink); }
  html.theme-dark .chip-x:hover { background: #3a1d23; color: #ff7a85; }
  html.theme-dark .frame-wrap { background: #1a1f26; }
  html.theme-dark .paper { background: #161b22; }
  html.theme-dark .mobile-backbar { background: var(--panel); border-bottom-color: var(--line); }
  html.theme-dark .mobile-back-btn { background: transparent; border-color: var(--line); color: var(--brand-2); }
  html.theme-dark.is-mobile .ml-item { background: var(--panel); border-color: var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.3); }
  html.theme-dark.is-mobile .ml-item:active { background: var(--line-soft); }
  html.theme-dark .dash-card { background: var(--panel); border-color: var(--line); }
  html.theme-dark .card { background: var(--panel); border-color: var(--line); }
  /* Declared here, after .dash-wrap/.placeholder above, so the tablet
     top-padding actually wins: equal specificity means source order decides.
     Gives the floating ☰ toggle room in the views that have no .detail-bar. */
  @media (max-width: 900px) {
    html:not(.is-mobile) .body:not(.list-open):not(.timeline-only) .dash-wrap { padding-top: 46px; }
    html:not(.is-mobile) .body:not(.list-open):not(.timeline-only) .placeholder { padding-top: 66px; }
  }
  html.theme-dark .dash-head h2 { color: var(--brand-2); }
  html.theme-dark .card .date, html.theme-dark .dash-date { color: var(--brand-2); }
  html.theme-dark .list-head, html.theme-dark .range { background: var(--bg); }
  html.theme-dark .badge.fathom { background: #3a1d23; color: #ff7a85; }
  html.theme-dark .badge.overview { background: #1e2a40; color: #7aa2f7; }
  html.theme-dark .badge.manual { background: #1c2e23; color: #6dcf7e; }
  html.theme-dark .badge.pin { background: #3a2e16; color: #ffce62; }
  html.theme-dark .badge.hiddenb { background: #3a1d23; color: #ff7a85; }
  html.theme-dark .badge.suggest-badge { background: #3a2e16; color: #ffce62; }
  html.theme-dark .proj.suggested { background: #2e2712; box-shadow: inset 0 0 0 1.5px #a4822c; }
  html.theme-dark .proj.suggested:hover { background: #3a3018; }
  html.theme-dark .card.ishidden { background: repeating-linear-gradient(45deg, #161b22, #161b22 10px, #1f1719 10px, #1f1719 20px); }
  html.theme-dark .ac-status { background: #1e2a40; color: #7aa2f7; }
  html.theme-dark .ac-status.restricted { background: #3a2e16; color: #ffce62; }
  html.theme-dark .ac-item { background: var(--panel); border-color: var(--line); }
  html.theme-dark .ac-item.admin { background: var(--bg); }
  html.theme-dark .ac-item button { background: var(--panel); border-color: var(--line); }

  html.is-mobile {
    -webkit-tap-highlight-color: rgba(31, 111, 235, 0.18);
  }
  /* Fathom tagging (File into project / tag chips) is an admin desktop-review
     workflow — nobody triages recordings from a phone, and the button/chips
     just eat space in the already-tight mobile detail bar. */
  html.is-mobile #d_file,
  html.is-mobile .tag-chips {
    display: none;
  }
  html.is-mobile body {
    overscroll-behavior-y: contain;
    -webkit-tap-highlight-color: rgba(31, 111, 235, 0.18);
  }

  html.is-mobile .app {
    height: 100vh;
    height: 100dvh;
  }

  /* html/body background matches the topbar's own blue on mobile (2026-07-22
     fix) — with viewport-fit=cover + env(safe-area-inset-top), the area
     behind the iOS notch/status-bar is real page space above .topbar's own
     box; its color came from body's background (the light grey app
     background, --bg), not the topbar, showing as a mismatched white/grey
     sliver above the blue header ("banner not fully connected to the top").
     Matching body's background to the topbar's own blue makes that inset
     region blend in seamlessly regardless of exactly how much of it the
     browser chrome exposes. */
  html.is-mobile, html.is-mobile body { background: #1F3864; }
  /* --- Topbar compaction: brand on row 1, search + buttons on a single nowrap row 2 --- */
  html.is-mobile .topbar {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    padding: 8px 12px;
    padding-top: max(8px, env(safe-area-inset-top));
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }
  /* Brand row 1: title on the left, ⚙ Settings on the right (mobile only). */
  html.is-mobile .brandwrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
  }
  html.is-mobile .brand-txt { gap: 8px; flex: 1; min-width: 0; }
  html.is-mobile .brand-h1 { font-size: 15px; }
  html.is-mobile .brand-div { height: 20px; }
  html.is-mobile .brand-stack { gap: 2px; }
  html.is-mobile .brand-sub { font-size: 10px; letter-spacing: 1.2px; }
  html.is-mobile .brand-th { font-size: 10.5px; }
  html.is-mobile .hdr-right {
    display: flex;
    flex-wrap: nowrap;
    align-items: stretch;
    width: 100%;
    gap: 6px;
  }
  /* Search + buttons share one row and must visually match — same height, padding, line-height. */
  html.is-mobile .search,
  html.is-mobile .tbtn {
    height: 38px;
    box-sizing: border-box;
    padding: 0 12px;
    display: flex;
    align-items: center;
    line-height: 1;
  }
  html.is-mobile .search {
    order: 0;
    flex: 1 1 0;
    width: auto;
    max-width: none;
    min-width: 0;
    gap: 6px;
  }
  html.is-mobile .search input {
    font-size: 16px;
    line-height: 1;
    width: 100%;
    min-width: 0;
    height: auto;
    padding: 0;
    background: transparent;
    border: none;
  }
  /* Each row-2 control shares the row width equally — search and buttons all flex:1. */
  html.is-mobile .tbtn {
    flex: 1 1 0;
    min-width: 0;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    justify-content: center;
  }
  /* Identity label takes up too much room on a phone — hide; sign-out is in the same row. */
  html.is-mobile .who { display: none; }

  /* --- Single-pane navigation --- */
  html.is-mobile .body {
    display: block;
    height: 100%;
    min-height: 0;
  }
  html.is-mobile .sidebar,
  html.is-mobile .list,
  html.is-mobile .detail {
    display: none;
    border-right: none;
    height: 100%;
    width: 100%;
  }
  html.is-mobile.mobile-pane-projects .sidebar {
    display: block;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }
  html.is-mobile.mobile-pane-list .list {
    display: block;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  html.is-mobile.mobile-pane-detail .detail {
    display: flex;
    flex-direction: column;
  }

  /* --- Sticky back bar at the top of each non-root pane --- */
  /* Boot loader: a full-screen spinner shown on mobile until the app routes to its
     first pane. Stops a shared link from flashing the home/projects pane while data
     loads. Desktop keeps its instant cached render (overlay never shows). */
  .boot-loader { display: none; }
  html.is-mobile .boot-loader {
    display: flex; align-items: center; justify-content: center;
    position: fixed; inset: 0; z-index: 200; background: var(--bg);
  }
  html.is-mobile .boot-loader.hide { display: none; }
  .boot-loader .spin { width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: sp .7s linear infinite; }

  html.is-mobile .mobile-backbar {
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 8px 12px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    z-index: 30;
    min-height: 48px;
  }
  html.is-mobile .mobile-back-btn {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 14px;
    font-size: 14px;
    color: var(--brand);
    font-weight: 600;
    min-height: 40px;
    font-family: inherit;
  }
  html.is-mobile .mobile-back-btn:active { background: var(--line-soft); }

  /* --- Mobile-only "Latest meetings" tiles at the top of the projects pane.
     2-up grid with a project-colored stripe + drop shadow so they read as
     featured highlights and don't blend into the project list below. --- */
  .mobile-latest { display: none; }
  html.is-mobile .mobile-latest {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  html.is-mobile .ml-label {
    grid-column: 1 / -1;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-faint);
    margin: 2px 2px -2px;
    font-weight: 600;
  }
  html.is-mobile .ml-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-left: 4px solid var(--c, var(--brand));
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 1px 2px rgba(27,31,36,.05), 0 4px 12px rgba(27,31,36,.04);
    min-height: 180px;
    cursor: pointer;
  }
  html.is-mobile .ml-item:active { background: var(--line-soft); }
  html.is-mobile .ml-proj {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  html.is-mobile .ml-date {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--brand-2);
    margin-bottom: 2px;
  }
  html.is-mobile .ml-ttl {
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: normal;
    margin-bottom: 4px;
  }
  html.is-mobile .ml-ex {
    font-size: 11.5px;
