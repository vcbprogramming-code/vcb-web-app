function openCompletionCertificate() {
  /* Opened as a real separate popup WINDOW (explicit width/height/left/top
     features), not a new tab — window.open('', '_blank') with no features
     opens as a tab in the SAME browser window in most browsers, and the
     native print dialog that win.print() triggers below then blocks
     interaction with the entire browser window (every tab, including the
     portal tab that opened it) until the print dialog is dismissed —
     reported as the whole portal "freezing" after clicking Print until
     the print tab is closed first. A genuinely separate window's print
     dialog only blocks that one window, leaving the portal's own window
     fully interactive the whole time. */
  var features = 'width=900,height=1000,left=100,top=60,menubar=no,toolbar=no,location=no,status=no';
  var win = window.open('', '_blank', features);
  if (!win) { alert(t('Please allow popups to print the completion form.')); return; }
  win.document.open();
  win.document.write(buildCompletionCertificateHtml());
  win.document.close();
  win.focus();
  /* Slight delay so the popup's own layout/fonts settle before the print
     dialog captures it — printing immediately on write can occasionally
     grab a blank/partial first paint in some browsers. */
  setTimeout(function () { win.print(); }, 300);
}

/* Lightweight canvas confetti burst — no external library, respects
   prefers-reduced-motion by skipping the animation (still shows the static card). */
function runConfetti(canvas) {
  if (!canvas) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx = canvas.getContext('2d');
  var colors = ['#4fd1ff', '#7ee8ff', '#3a5bff', '#5b7cff', '#ffffff'];
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  var pieces = [];
  var count = 140;
  for (var i = 0; i < count; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.5,
      w: 6 + Math.random() * 6,
      h: 8 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      speedY: 2 + Math.random() * 3,
      speedX: (Math.random() - 0.5) * 2,
      rotation: Math.random() * 360,
      spin: (Math.random() - 0.5) * 8
    });
  }

  var start = null;
  var duration = 4200;
  function frame(ts) {
    if (!start) start = ts;
    var elapsed = ts - start;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function (p) {
      p.x += p.speedX;
      p.y += p.speedY;
      p.rotation += p.spin;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (elapsed < duration) {
      requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      window.removeEventListener('resize', resize);
    }
  }
  requestAnimationFrame(frame);
}

/* Shared bottom-of-screen pill toast — originally built for the reward
   messages below, generalized so the same lightweight, auto-dismissing
   affordance can carry any short message + icon (see showLockedToast,
   which reuses this for "this task is locked" instead of adding a second,
   near-identical DOM element/CSS block just for a different message). */
var toastTimer = null;
function showToast(message, iconName) {
  var toast = document.getElementById('reward-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'reward-toast';
    /* The toast is the ONLY channel for a failed save (showSaveFailedToast)
       and for the locked-item explanation (showLockedToast). Without a live
       region both are silent to screen-reader users — a save failure would
       pass with no indication at all. role="status" (polite) rather than
       alert, so a celebration toast doesn't interrupt mid-sentence; the
       failure cases are still announced as soon as the user is idle. */
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');
    document.body.appendChild(toast);
  }
  /* is-warning styles this red instead of the default dark pill (see
     .reward-toast.is-warning, styles.html) — a save failure shouldn't look
     identical to a celebration toast, since an employee glancing at the
     bottom of the screen needs to tell "nice work!" apart from "this
     didn't save" at a glance. */
  toast.className = 'reward-toast' + (iconName === 'warning' ? ' is-warning' : '');
  toast.innerHTML = '<span class="reward-toast-icon icon">' + icon(iconName) + '</span> ' + esc(t(message));
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
}
function showRewardToast() {
  var messages = [
    'Nice work!', 'Great job!', 'Keep it up!', 'Well done!', 'You’re on track!'
  ];
  showToast(messages[Math.floor(Math.random() * messages.length)], 'celebrate');
}
/* 3200ms (vs the reward toast's 2200ms), same reasoning as
   showLockedToast below — a save-failure message needs an extra beat to
   actually read, not just register as a flash. */
function showSaveFailedToast(message) {
  showToast(message || 'Could not save — please try again.', 'warning');
  clearTimeout(toastTimer);
  var toast = document.getElementById('reward-toast');
  toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 3200);
}
/* Everything looked equally clickable whether a phase/task was actually
   reachable or not, with nothing telling the employee WHY a click did
   nothing (see isPhasePageUnlocked above for the underlying rule) — this
   is the explicit "why" the disabled/dimmed state alone didn't provide.
   3200ms (vs the reward toast's 2200ms) since this message is a little
   longer and worth an extra beat to actually read. */
function showLockedToast() {
  showToast('Complete the previous phase before starting this one.', 'lock');
  clearTimeout(toastTimer);
  var toast = document.getElementById('reward-toast');
  toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 3200);
}

/* Counts every checklist task belonging to one department (static per department, computed once).
   A new employee belongs to exactly one department, so overall progress is scoped to it —
   never averaged across all departments' checklists. */
/* Cached PER LEVEL, not just per department — a Junior and a Senior
   employee in the same department don't have the same real task list
   (see isItemVisible below), so the same cache key for both silently
   served whichever level's result got computed and cached first to
   every later caller regardless of their own actual level. */
var TASK_IDS_CACHE_BY_DEPT_LEVEL = {};
function getDepartmentTaskIds(deptId) {
  /* Senior-only items (see sr()/itemLevel in content.html) were
     previously included unconditionally here, unlike getPageTaskIds
     (below), which already filters to isItemVisible — a Junior employee
     who finished everything they were actually required to do (and whom
     isEmployeeOnboardingComplete() correctly reports as complete) still
     saw a stuck-below-100% "27 / 36 tasks complete" on the overall
     progress bar, because the denominator here kept counting Senior-only
     tasks they were never asked to complete. Filtering to isItemVisible
     here too makes this match the same completion definition used
     everywhere else in this file. */
  var level = getEmployeeLevel();
  var cacheKey = deptId + '::' + level;
  if (TASK_IDS_CACHE_BY_DEPT_LEVEL[cacheKey]) return TASK_IDS_CACHE_BY_DEPT_LEVEL[cacheKey];
  var dept = DEPARTMENTS.filter(function (d) { return d.id === deptId; })[0];
  var ids = [];
  if (dept) {
    Object.keys(PAGES).forEach(function (pageKey) {
      if (pageKey.indexOf(dept.prefix) !== 0) return;
      var page = PAGES[pageKey];
      (page.sections || []).forEach(function (sec) {
        if (sec.type === 'checklist') {
          sec.items.forEach(function (item) { if (isItemVisible(item)) ids.push(itemId(item)); });
        }
      });
    });
  }
  TASK_IDS_CACHE_BY_DEPT_LEVEL[cacheKey] = ids;
  return ids;
}

/* Maps a phase page key to the page key that must be fully completed first
   (built from PAGES' own nextPhase links, so Day 1-30 -> 31-60 -> 61-90 order
   is derived from content.html rather than hardcoded here). */
var PREV_PHASE_CACHE = null;
function getPrevPhaseMap() {
  if (PREV_PHASE_CACHE) return PREV_PHASE_CACHE;
  var map = {};
  Object.keys(PAGES).forEach(function (pageKey) {
    var next = PAGES[pageKey].nextPhase;
    if (next && next.page) map[next.page] = pageKey;
  });
  PREV_PHASE_CACHE = map;
  return map;
}

/* Task ids come from each item's own permanent id (see it()/itemId() in
   content.html), not from its position in sec.items — an admin reordering,
   inserting, or deleting checklist items (see the admin editor) can never
   silently repoint an employee's already-saved checkmark at a different
   task the way a positional index would. Only items visible at the
   employee's current level are included in the returned list, which is
   what makes phase/block completion (isPageBlockComplete/isPagePhaseComplete
   below) require just the Junior baseline for a Junior employee, and the
   full set for Senior. */
function getPageTaskIds(pageKey) {
  var page = PAGES[pageKey];
  var ids = [];
  if (!page) return ids;
  (page.sections || []).forEach(function (sec) {
    if (sec.type === 'checklist') {
      sec.items.forEach(function (item) { if (isItemVisible(item)) ids.push(itemId(item)); });
    }
  });
  return ids;
}

/* Task ids scoped to one checklist block (Required Reading / Knowledge
   Requirements / Required Outputs) instead of the whole page — used to
   drive the sidebar stepper's per-subsection sub-rows (see
   getJourneySteps below), which need Reading/Knowledge/Outputs to each
   show their own done state rather than only the phase's overall state. */
function getPageBlockTaskIds(pageKey, blockIndex) {
  var page = PAGES[pageKey];
  var ids = [];
  if (!page) return ids;
  var sec = (page.sections || [])[blockIndex];
  if (sec && sec.type === 'checklist') {
    sec.items.forEach(function (item) { if (isItemVisible(item)) ids.push(itemId(item)); });
  }
  return ids;
}
function isPageBlockComplete(pageKey, blockIndex) {
  var ids = getPageBlockTaskIds(pageKey, blockIndex);
  if (!ids.length) return true;
  return ids.every(function (id) { return PROGRESS_CACHE[id]; });
}

function isPagePhaseComplete(pageKey) {
  var ids = getPageTaskIds(pageKey);
  if (!ids.length) return true;
  return ids.every(function (id) { return PROGRESS_CACHE[id]; });
}

/* Every phase page can be VIEWED freely once Required Documents is done —
   an employee can read ahead to Day 61-90 material, or revisit Day 1-30,
   without hitting a wall (see the phaselinks/phase-trail rendering in
   app.html, which no longer gates the link itself on this function).
   Completing a phase's tasks, however, is still sequential: this only
   returns true for the first phase in a department's chain, or a later
   phase whose immediately-previous phase is fully complete. Reintroduced
   after the earlier "freely navigable" change was found to let an
   employee check off Day 61-90 tasks before finishing Day 1-30 — the
   fix here is checkbox-level (see isPhaseUnlocked/performToggle below and
   the check-item lock state in app.html), not page-level, so browsing
   ahead still works. */
function isPhasePageUnlocked(pageKey) {
  if (!areRequiredDocsComplete()) return false;
  var prev = getPrevPhaseMap()[pageKey];
  if (!prev) return true;
  return isPagePhaseComplete(prev) && isPhasePageUnlocked(prev);
}

function isPhaseUnlocked(taskId) {
  var pageKey = pageKeyFromTaskId(taskId);
  return pageKey ? isPhasePageUnlocked(pageKey) : true;
}

/* Renders the persistent "your progress" bar in the page shell (visible on
   every page, not just Home) — stays hidden until the employee has selected
   a department (pre-boarding has no department context yet). Stays visible
   at 100% once the 90-day program is complete rather than disappearing, so
   the employee still sees confirmation of where they landed. */
/* onSettled (optional) is called once this widget's async content has
   actually landed in the DOM — this widget sits above the fold on every
   phase/department page, so inserting it late (after loadProgress resolves)
   can shift page layout enough to trigger the browser's native scroll
   anchoring, which compensates by scrolling the page down to keep whatever
   was near the viewport in the same visual position. That's what made
   picking a department appear to "jump down" past the hero straight to the
   level picker/phase links instead of landing at the true top — the initial
   scrollTo(0,0) was correct at the moment it ran, then this widget's later
   insertion silently moved things under it. See renderPage in app.html,
   which passes forceScroll as onSettled. */
function renderOverallProgress(targetEl, onSettled) {
  var name = getEmployeeName();
  var dept = getEmployeeDepartment();
  if (!name || !dept) {
    targetEl.innerHTML = '';
    return;
  }
  var deptLabel = (DEPARTMENTS.filter(function (d) { return d.id === dept; })[0] || {}).label || dept;
  loadProgress(function (cache) {
    var allIds = getDepartmentTaskIds(dept);
    var done = 0;
    allIds.forEach(function (id) { if (cache[id]) done++; });
    var pct = allIds.length ? Math.round((done / allIds.length) * 100) : 0;
    targetEl.innerHTML =
      '<div class="overall-progress">' +
        '<div class="overall-progress-head">' +
          '<span>' + esc(t('Your Onboarding Progress')) + ' — ' + esc(name) + ' (' + esc(t(deptLabel)) + ')</span>' +
          '<span>' + pct + '%</span>' +
        '</div>' +
        '<div class="progress-bar-track"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="overall-progress-sub">' + done + ' / ' + allIds.length + ' ' + esc(t('tasks complete in your department')) + '</div>' +
      '</div>';
    if (onSettled) onSettled();
  });
}

/* Full ordered phase chain (Day 1-30 -> 31-60 -> 61-90) for whichever phase
   page the employee is CURRENTLY looking at, regardless of which one that
   is — walks backward via getPrevPhaseMap and forward via nextPhase from
   pageKey itself, rather than assuming the chain always starts from Phase 1
   the way getDepartmentPhaseChain(deptId) does. Used by the bottom-of-page
   phase trail (see renderPhaseTrail in app.html), which needs to show all
   3 phases with the one actually being viewed marked "current" even if the
   employee is revisiting an already-completed earlier phase. Returns []
   for a pageKey that isn't part of any phase chain (e.g. Home). */
function getFullPhaseChain(pageKey) {
  if (!pageKey || !PAGES[pageKey]) return [];
  var chain = [pageKey];
  var prev = getPrevPhaseMap()[pageKey];
  while (prev) { chain.unshift(prev); prev = getPrevPhaseMap()[prev]; }
  var cur = PAGES[pageKey];
  var next = cur && cur.nextPhase ? cur.nextPhase.page : null;
  while (next) { chain.push(next); cur = PAGES[next]; next = cur && cur.nextPhase ? cur.nextPhase.page : null; }
  return chain;
}

/* Finds the department's ordered phase page keys (Day 1-30 -> 31-60 -> 61-90)
   by walking nextPhase links starting from that department's first phase page.
   Restricted to "-day-" pages so the department's plain landing page (e.g.
   "accounting-team", which shares the same prefix but isn't a phase and has
   no checklist) never gets mistaken for the first phase. */
function getDepartmentPhaseChain(deptId) {
  var dept = DEPARTMENTS.filter(function (d) { return d.id === deptId; })[0];
  if (!dept) return [];
  var first = Object.keys(PAGES).filter(function (k) {
    return k.indexOf(dept.prefix) === 0 && k.indexOf('-day-') !== -1 && !getPrevPhaseMap()[k];
  })[0];
  var chain = [];
  var cur = first;
  while (cur) {
    chain.push(cur);
    var next = PAGES[cur] && PAGES[cur].nextPhase;
    cur = next ? next.page : null;
  }
  return chain;
}

/* True once the employee has a department and every phase page in that
   department's chain (Day 1-30, 31-60, 61-90) is fully checked off. Gates
   Home-page content (Meet Our Team / Life on Site) that should only appear
   after the 90-day program is actually finished. */
function isEmployeeOnboardingComplete() {
  var dept = getEmployeeDepartment();
  if (!dept) return false;
  var chain = getDepartmentPhaseChain(dept);
  if (!chain.length) return false;
  return chain.every(function (pageKey) { return isPagePhaseComplete(pageKey); });
}

/* Builds the whole-journey step list: Pre-boarding -> Required Documents ->
   Department Selection -> [department's 3 phases] -> Completion. Unlike
   getDepartmentPhaseChain (department phases only), this covers the entire
   90-day journey end to end, in the order the employee actually moves
   through it, for the vertical stepper that replaces the old flat nav list. */
function getJourneySteps() {
  var dept = getEmployeeDepartment();
  var steps = [
    /* alwaysUnlocked: true on these three — Home, and both halves of the
       Required Documents page, are freely browsable regardless of
       progress (there's nothing to gate before pre-boarding even starts).
       Department Selection itself still can't actually be COMPLETED
       without finishing Required Documents (see the dept-card click
       handler in app.html, which blocks with a popup), but simply viewing
       that section of the page was never the thing worth locking. */
    { id: 'pre-boarding', label: 'Pre-boarding', page: 'home', done: hasVisitedHome(), alwaysUnlocked: true },
    /* Required Documents / Department Selection moved off Home onto their
       own page ('required-documents' — see content.html) when Pre-boarding
       was split out to end at Company Structure; both anchors still exist
       on that page (sectionId is unchanged), just the page key changed. */
    { id: 'required-docs', label: 'Required Documents', page: 'required-documents', anchor: 'required-documents', done: areRequiredDocsComplete(), alwaysUnlocked: true },
    { id: 'dept-selection', label: 'Department Selection', page: 'required-documents', anchor: 'department-selection', done: !!dept, alwaysUnlocked: true }
  ];
  var deptEntry = dept ? DEPARTMENTS.filter(function (d) { return d.id === dept; })[0] : null;
  var deptShort = deptEntry ? deptEntry.shortLabel : null;
  var dayRanges = ['Day 1–30', 'Day 31–60', 'Day 61–90'];
  var chain = dept ? getDepartmentPhaseChain(dept) : [null, null, null];
  /* Each phase's own 3 checklist blocks (Required Reading, Knowledge
     Requirements, Required Outputs — see PHASE_BLOCK_ANCHORS in
     content.html) surfaced as sub-rows under that phase's stepper row,
     abbreviated to Reading/Knowledge/Outputs so the sidebar stays scannable.
     Each carries its own done state and anchor so the sidebar can show
     (and deep-link to) finer-grained progress than just the whole phase. */
  var subLabels = ['Reading', 'Knowledge', 'Outputs'];
  chain.slice(0, 3).forEach(function (pageKey, i) {
    var subSteps = pageKey ? subLabels.map(function (label, bi) {
      return { label: label, anchor: PHASE_BLOCK_ANCHORS[bi], done: isPageBlockComplete(pageKey, bi) };
    }) : [];
    steps.push({
      id: 'phase-' + i,
      /* deptShort/dayRange translated and joined separately at render time
         (see renderSidebarProgress) — e.g. "Accounting" + "Day 1–30" ->
         "Accounting Day 1–30", matching the requested "Accounting Day 1 to
         30" naming instead of a generic "30 Days" label with the department
         shown as a separate sub-line. */
      label: null,
      deptShort: deptShort,
      dayRange: dayRanges[i],
      page: pageKey,
      done: pageKey ? isPagePhaseComplete(pageKey) : false,
      subSteps: subSteps,
      /* Phases are independently reachable/completable in any order now —
         reaching a department at all already required finishing Required
         Documents (the one real gate, enforced when picking the
         department), so every phase page below that point is unlocked. See
         isPhasePageUnlocked in this file for the underlying rule. */
      alwaysUnlocked: true
    });
  });
  /* Completion links to the dedicated PAGES['completion'] page (content.html)
     — a real page now, not an anchor into the department's own Day 61-90
     page pointing at an in-place gated reveal (the old behavior; see
     KNOWN_ISSUES.md for the bug history that motivated replacing it).
     Print Completion Form and the Meet Our Team / Life on Site cards live
     there and only there now. */
  steps.push({
    id: 'completion', label: 'Completion',
    page: 'completion',
    done: isEmployeeOnboardingComplete(),
    /* Clicking through early is harmless — PAGES['completion']'s own gate
       (renderPage, app.html) shows a plain "not finished yet" message
       until isEmployeeOnboardingComplete() is genuinely true, so there's
       no real content to jump ahead of here; only whether the sidebar
       LINK is clickable is being relaxed, matching every phase step
       above it. */
    alwaysUnlocked: true
  });
  return steps;
}

/* Vertical journey stepper — replaces the old flat clickable nav list.
   Each step shows done/current/locked state with a connecting line. Steps
   are no longer forced into strict sequential order (an employee can jump
   straight to a later phase without finishing earlier ones first, per
   explicit request) — a step is unlocked if it's done, marked
   alwaysUnlocked (see getJourneySteps above; true for every step except
   nothing at this point, since the only real remaining lock is Required
   Documents -> Department Selection, enforced elsewhere), or is the very
   next not-yet-done step (kept as a fallback "current" indicator so the
   stepper still visually suggests where to go next, without preventing
   anything else from being clicked). */
function renderSidebarProgress(targetEl) {
  if (!targetEl) return;
  loadProgress(function () {
    var steps = getJourneySteps();
    var firstNotDone = steps.findIndex(function (s) { return !s.done; });
    /* Same lookup as app.html's own private currentPage() — duplicated
       here (rather than exposed cross-file for one read) since it's a
       one-line read of the real page URL, not app state. Needed so the
       Completion step can still show as "current" once the employee is
       actually ON that page — previously, once every step (including
       Completion itself) was done, firstNotDone was -1 and NOTHING in the
       whole stepper showed as current anymore, reported directly ("it
       should show where the user is currently at"). Every other step
       already derives "current" purely from progress state (the next
       not-yet-done item) — Completion is the one step that's still
       meaningfully "current" even after being marked done, since visiting
       it is itself the last real action in the journey. */
    var actualCurrentPage = new URLSearchParams(location.search).get('page') || (typeof window !== 'undefined' && window.INITIAL_PAGE) || 'home';
    var rows = steps.map(function (s, i) {
      var unlocked = s.done || s.alwaysUnlocked || i === firstNotDone;
      var isOnCompletionPage = s.id === 'completion' && actualCurrentPage === 'completion';
      var state = isOnCompletionPage ? 'done completion-done current' :
        s.done ? (s.id === 'completion' ? 'done completion-done' : 'done') :
        (i === firstNotDone ? 'current' : (unlocked ? '' : 'locked'));
      var dotContent = s.done ? icon('check') : String(i + 1);
      var clickable = unlocked && s.page;
      var tag = clickable ? 'a' : 'div';
      var hash = s.anchor ? '#' + s.anchor : '';
      var attrs = clickable ?
        ' href="?page=' + encodeURIComponent(s.page) + hash + '" data-link="' + s.page + '"' +
        (s.anchor ? ' data-anchor="' + s.anchor + '"' : '') : '';
      var stepLabel = s.label != null ? t(s.label) :
        (s.deptShort ? t(s.deptShort) + ' ' : '') + t(s.dayRange);
      var labelHtml = '<span class="stepper-label">' + esc(stepLabel) + '</span>';
      /* Reading/Knowledge/Outputs sub-rows — only meaningful once the phase
         itself is reachable (unlocked), same gating as the phase row's own
         link. Each sub-row deep-links to its own checklist block via the
         anchor stamped on that block's sectionId (see PHASE_BLOCK_ANCHORS
         in content.html), so clicking "Reading" jumps straight to Required
         Reading instead of just the top of the phase page. Rendered inside
         the same .stepper-item wrapper as the row itself (not as a
         following sibling) so .stepper-line — which spans the wrapper's
         full height via top/bottom — keeps running continuously through
         the sub-rows down to the next phase's dot, instead of stopping
         short at the row's own bottom edge. */
      var subStepsHtml = '';
      if (unlocked && s.subSteps && s.subSteps.length) {
        subStepsHtml = '<div class="stepper-substeps">' + s.subSteps.map(function (sub) {
          var subHash = '#' + sub.anchor;
          return '<a class="stepper-substep' + (sub.done ? ' done' : '') + '" href="?page=' + encodeURIComponent(s.page) + subHash + '" data-link="' + s.page + '" data-anchor="' + sub.anchor + '">' +
            '<span class="stepper-substep-dot">' + (sub.done ? icon('check') : '') + '</span>' +
            '<span class="stepper-substep-label">' + esc(t(sub.label)) + '</span>' +
          '</a>';
        }).join('') + '</div>';
      }
      var rowHtml = '<' + tag + ' class="stepper-row ' + state + '"' + attrs + '>' +
        '<span class="stepper-dot">' + dotContent + '</span>' +
        labelHtml +
      '</' + tag + '>';
      var itemClass = 'stepper-item' + (i === steps.length - 1 ? ' last' : '') + (s.done ? ' done' : '') + (s.done && s.id === 'completion' ? ' completion-done' : '');
      return '<div class="' + itemClass + '">' +
        '<span class="stepper-line"></span>' + rowHtml + subStepsHtml +
      '</div>';
    }).join('');
    targetEl.innerHTML = '<div class="stepper">' + rows + '</div>';
  });
}

/* Shows a small inline notice above the checklists explaining why they're
   locked. Reintroduced sequential-phase locking (see isPhasePageUnlocked
   above) means a phase can now be locked for two different reasons — either
   Required Documents isn't done (can't happen in practice, since Department
   Selection itself is already gated on that), or the immediately-previous
   phase isn't finished yet — so the message picks between them instead of
   always blaming Required Documents. The page is still fully readable while
   locked; only the checkboxes are disabled (see initChecklists below, which
   also renders a per-checklist-group note — see 'checklist' in app.html —
   so this banner and that note say the same thing via the same wording,
   just at different scopes: one per page, one per checklist block). */
function renderPhaseLockNotice(container, locked, pageKey) {
  var existing = container.querySelector('.phase-lock-notice');
  if (existing) existing.remove();
  if (!locked) return;
  var reason = (pageKey && !areRequiredDocsComplete()) ?
    t('Complete all Required Documents to unlock this phase.') :
    t('Complete the previous phase to unlock these tasks. You can still read everything below.');
  var notice = document.createElement('div');
  notice.className = 'phase-lock-notice section-inner-narrow';
  notice.innerHTML = '<span class="phase-lock-icon">' + icon('lock') + '</span> ' + esc(reason);
  var firstGroup = container.querySelector('.checklist-group');
  if (firstGroup && firstGroup.parentNode) {
    firstGroup.parentNode.insertBefore(notice, firstGroup);
  }
}

/* Called after a page render to wire up checklist interactivity and load saved state. */
/* onSettled (optional) — see renderOverallProgress above for why this
   matters: renderPhaseLockNotice can insert a whole banner into the page
   once progress has loaded, which (like every other async post-render
   insertion on this page) can shift layout enough to move the scroll
   position the initial forceScroll() landed on. Passed through from
   renderPage in app.html, called after this async work actually lands. */
function initChecklists(container, onSettled) {
  var groups = container.querySelectorAll('.checklist-group');
  if (!groups.length) { if (onSettled) onSettled(); return; }
  loadProgress(function () {
    var pageKey = null;
    var firstBox = container.querySelector('.check-item input[type="checkbox"]');
    if (firstBox) pageKey = pageKeyFromTaskId(firstBox.getAttribute('data-task-id'));
    var unlocked = pageKey ? isPhasePageUnlocked(pageKey) : true;

    groups.forEach(function (group) {
      group.querySelectorAll('.check-item input[type="checkbox"]').forEach(function (box) {
        box.checked = isTaskDone(box.getAttribute('data-task-id'));
        box.disabled = !unlocked;
        var item = box.closest('.check-item');
        if (item) {
          item.classList.toggle('done', box.checked);
          item.classList.toggle('locked', !unlocked);
        }
      });
      refreshGroupProgress(group);
    });

    renderPhaseLockNotice(container, !unlocked, pageKey);
    if (onSettled) onSettled();
  });
}

/* Reflects saved doc-completion state on the Required Documents cards once
   progress has loaded — same load-then-paint pattern as initChecklists,
   including the same onSettled re-scroll reasoning (this is the page where
   "Continue to Required Documents" was landing scrolled past the doc cards
   down at Department Selection — this async update, previously untracked
   by forceScroll, was the missing piece). */
function initDocCards(container, onSettled) {
  var cards = container.querySelectorAll('[data-doc-card]');
  if (!cards.length) { if (onSettled) onSettled(); return; }
  loadProgress(function () {
    cards.forEach(function (card) {
      updateDocCardUI(card.getAttribute('data-doc-card'));
    });
    if (onSettled) onSettled();
  });
}
</script>
