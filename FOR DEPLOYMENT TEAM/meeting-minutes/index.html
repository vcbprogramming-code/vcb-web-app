<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Meeting Minutes · VCB Connect</title>
  <script>
    // Paint the right theme before React mounts, or someone on dark gets a
    // white flash. The key and the class are the ones in shared/src/theme.jsx —
    // vcb_theme + class="dark" on <html>. The old vcb_mm_theme key and the
    // theme-light/theme-dark classes are gone; four selectors across the seven
    // modules was what blocked "one website".
    (function () {
      try {
        var t = localStorage.getItem('vcb_theme') || 'auto';
        var d = t === 'dark' || (t !== 'light' &&
          matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      } catch (e) { /* blocked storage — the provider settles it on mount */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
