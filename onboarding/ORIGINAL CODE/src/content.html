/* Helper builders used inline in PAGES below */
function ph(label) {
  return '<div class="placeholder-box" role="img" aria-label="' + label + '">' +
         '<span class="placeholder-icon">' + icon('camera') + '</span><span>' + label + '</span></div>';
}
function img(url, label) {
  return '<img class="content-image" src="' + url + '" alt="' + label + '" loading="lazy">';
}
/* url is optional — when set (a real Drive/DocuSign link), the link opens
   it in a new tab; otherwise falls back to the placeholder alert, same as
   before. See matchAndLinkRequiredDocuments in Code.gs for how real URLs
   get attached to each doc entry. */
function docLink(label, url) {
  var attrs = url ?
    ' href="' + esc(url) + '" target="_blank" rel="noopener"' :
    ' href="#" onclick="alert(\'Placeholder link — replace with the real DocuSign / document URL.\'); return false;"';
  return '<a class="doc-link-standalone"' + attrs + '>' +
         '<span class="doc-icon">' + icon('document') + '</span>' + label + '<span class="doc-arrow">&rarr;</span></a>';
}

/* A required pre-boarding document: clicking the card itself opens Drive's
   own in-browser preview (doc.viewUrl) so the employee can read it before
   committing to anything, a separate Download button forces an actual file
   download (doc.downloadUrl) only once they choose to, and a completion row
   offers either an upload (saved to Drive, auto-marks done) or a manual
   tick — any of those marks the document complete via the same task-id
   system the department checklists use, so it flows through
   PROGRESS_CACHE/setTaskDone. Not a DocuSign/e-sign flow: the employee
   views/downloads the blank template, fills/signs it themselves (on paper
   or in whatever app they have), then uploads the completed file back via
   the Upload button — see triggerDocUpload in progress.html for that side
   of it. */
function docCard(doc) {
  var taskId = 'doc::' + doc.id;
  var linkAttrs = doc.viewUrl ?
    ' href="' + esc(doc.viewUrl) + '" target="_blank" rel="noopener"' :
    ' href="#" onclick="alert(\'Placeholder link — replace with the real document URL.\'); return false;"';
  var downloadBtnHtml = doc.downloadUrl ?
    '<a class="doc-download-btn" href="' + esc(doc.downloadUrl) + '" download target="_blank" rel="noopener">' +
      icon('download') + '<span>' + esc(t('Download')) + '</span>' +
    '</a>' : '';
  var descHtml = doc.desc ? '<span class="doc-desc">' + esc(t(doc.desc)) + '</span>' : '';
  return '<div class="doc-card" data-doc-card="' + doc.id + '">' +
    '<a class="doc-link"' + linkAttrs + '>' +
      '<span class="doc-icon">' + icon('document') + '</span>' +
      '<span class="doc-link-body"><span class="doc-title">' + esc(t(doc.title)) + '</span>' + descHtml + '</span>' +
      '<span class="doc-arrow">&rarr;</span>' +
    '</a>' +
    '<div class="doc-card-status">' +
      '<label class="doc-check">' +
        '<input type="checkbox" data-doc-task-id="' + taskId + '" onclick="toggleDocTask(\'' + taskId + '\', \'' + doc.id + '\', this)">' +
        '<span class="doc-check-label">' + esc(t('Complete')) + '</span>' +
      '</label>' +
      downloadBtnHtml +
      '<button type="button" class="doc-upload-btn" data-doc-id="' + doc.id + '" onclick="triggerDocUpload(\'' + doc.id + '\')">' +
        icon('upload') + '<span>' + esc(t('Upload')) + '</span>' +
      '</button>' +
    '</div>' +
    /* Filled in by updateDocCardUI (progress.html) when this employee has
       an upload on record for this document — the employee previously got
       no confirmation of what had actually been received. */
    '<div class="doc-uploaded" data-doc-uploaded="' + doc.id + '"></div>' +
  '</div>';
}

/* Tags a checklist item as Senior-only — plain strings in a block's items
   array are shown to every employee regardless of level; wrapping one in
   sr(...) marks it as an extra task that only renders (and only counts
   toward phase completion) for employees on the Senior track. See
   renderSectionContent's 'checklist' case in app.html for where this shape
   is consumed, and getPageTaskIds/getPageBlockTaskIds in progress.html for
   why level-filtering has to happen there too, not just at render time. */
function sr(text) {
  return { text: text, level: 'senior' };
}
/* Wraps a checklist item with a permanent, never-reused id — assigned once
   when the item is authored and kept for its entire lifetime, independent
   of its position in the array. Task completion (see progress.html) is
   keyed on this id, not on array index, specifically so reordering,
   inserting, or deleting items in the admin editor can never silently
   repoint an employee's already-saved checkmark at a different task. */
function it(id, text, opts) {
  var o = { id: id, text: null, level: 'junior' };
  if (typeof text === 'object' && text !== null) {
    // text is actually an sr(...)-wrapped object: { text, level }
    o.text = text.text;
    o.level = text.level;
  } else {
    o.text = text;
  }
  if (opts && opts.level) o.level = opts.level;
  return o;
}
/* Every checklist item is either a plain string (shown at every level) or an
   sr(...)-tagged { text, level: 'senior' } object — these two accessors are
   the single place that distinguishes them, used from app.html (rendering),
   progress.html (task-id generation/completion checks), and the completion
   certificate builder, so all three stay in agreement about what "this
   item's text" and "this item's level" mean. */
function itemText(item) {
  return (item && typeof item === 'object') ? item.text : item;
}
function itemLevel(item) {
  return (item && typeof item === 'object' && item.level) ? item.level : 'junior';
}
/* Every checklist item built via it(...) carries its own permanent id — see
   it() above. Task ids (progress.html) are keyed on THIS, not on the
   item's position in its array, so the admin editor (reorder/insert/
   delete) can never silently repoint an employee's saved checkmark at a
   different task. */
function itemId(item) {
  return (item && typeof item === 'object') ? item.id : null;
}

/* ---------------- PHASE PAGE BUILDER ---------------- */
/* Every phase page's blocks always follow the same fixed order — Required
   Reading, Knowledge Requirements, Required Outputs — so block index maps
   directly onto PHASE_BLOCK_ANCHORS below. Each block gets that anchor as
   its sectionId, letting the sidebar stepper's Reading/Knowledge/Outputs
   sub-rows (see getJourneySteps in progress.html) deep-link and scroll
   straight to the matching section instead of just the page top. Reused
   across every phase page (not made unique per page) is safe because only
   one phase page's DOM exists at a time — see renderPage in app.html. */
var PHASE_BLOCK_ANCHORS = ['phase-reading', 'phase-knowledge', 'phase-outputs'];
function phasePage(opts) {
  var sections = [];
  /* levelpicker is NOT pushed into sections here (it used to be, briefly —
     see git history/conversation) — task ids now come from each item's own
     permanent id (see it()/itemId()), not from its position, so reordering
     or inserting checklist items can no longer orphan an employee's saved
     progress the way it once could. PHASE_BLOCK_ANCHORS[i] (the sidebar's
     Reading/Knowledge/Outputs deep-link) and getPageBlockTaskIds's
     blockIndex parameter still both assume block order is exactly
     [Reading, Knowledge, Outputs] at indices [0,1,2] though, so an extra
     section inserted before Required Reading here would still break THAT
     mapping (wrong block shown under each sidebar sub-step) even though
     individual checkbox state would survive it unharmed. showLevelPicker:
     true is read directly by renderPage (app.html), which renders it
     OUTSIDE this sections array — same pattern as the progress widget
     above it, that already isn't indexed either — so it can't perturb
     PHASE_BLOCK_ANCHORS indexing no matter what. */
  opts.showLevelPicker = true;
  (opts.blocks || []).forEach(function (b, i) {
    sections.push({ type: 'checklist', heading: b.heading, items: b.items, sub: b.sub, sectionId: PHASE_BLOCK_ANCHORS[i] });
  });
  if (opts.closing) {
    sections.push({ type: 'text', body: [opts.closing] });
    /* Used to also append homeFeatureGridSection() (Meet Our Team / Life on
       Site / Print Completion Form) right here as an in-place "gated"
       reveal once onboarding was detected complete — removed per explicit
       request ("it's better for it to be its own actual completion page").
       That reveal depended on an async placeholder-swap
       (revealGatedSections/syncGatedSectionsVisibility, app.html/
       progress.html) that went through five separate rounds of real bugs
       across earlier sessions (see KNOWN_ISSUES.md) and STILL sometimes
       didn't pop in right away — the actual bug report that prompted this
       removal. Finishing the last phase now navigates to a real
       PAGES['completion'] page instead (see below, and
       celebrateOnboardingComplete's Continue button in progress.html) —
       a genuine page render, synchronous like every other page, with
       nothing left to "reveal" after the fact. */
  }
  return {
    hero: { eyebrow: opts.eyebrow, title: opts.title, subtitle: opts.subtitle },
    sections: sections,
    nextPhase: opts.nextPhase,
    showLevelPicker: opts.showLevelPicker
  };
}

/* ---------------- ADMIN CHECKLIST OVERRIDES ---------------- */
/* Layers admin edits (see the Checklist Content sheet, Code.gs) on top of
   the hardcoded checklist baseline just built above — every PAGES entry
   is already fully constructed by this point, so this walks it once and
   mutates in place. Runs unconditionally at load (window.CHECKLIST_OVERRIDES
   is always injected by Index.html, empty object `{}` when nothing's been
   edited yet — see doGet in Code.gs), so a never-touched deploy behaves
   identically to before this feature existed.
   Three things an override can do to an EXISTING hardcoded item (matched
   by itemId — see it()/itemId() above):
     - text/level override: replace displayed text and/or junior-vs-senior
       visibility, in place, without moving it.
     - deleted: true — remove it from its block's items array entirely.
   ...plus adding entirely NEW items (an id with no hardcoded counterpart,
   which requires the override to also carry pageKey + blockIndex to say
   where it belongs — see saveChecklistItem in Code.gs), appended to that
   block's items array. `order` (when present, on either existing or new
   items) determines final position within the block; items without an
   explicit order keep their original relative order and sort before any
   ordered items. */
function applyChecklistOverrides(overrides) {
  if (!overrides) return;

  // Pass 1: apply text/level/deleted edits to items already in PAGES, tracking which override ids matched something.
  var matchedIds = {};
  Object.keys(PAGES).forEach(function (pageKey) {
    (PAGES[pageKey].sections || []).forEach(function (sec) {
      if (sec.type !== 'checklist') return;
      sec.items = sec.items.filter(function (item) {
        var id = itemId(item);
        var ov = id && overrides[id];
        if (!ov) return true;
        matchedIds[id] = true;
        if (ov.deleted) return false;
        if (ov.text) item.text = ov.text;
        if (ov.level) item.level = ov.level;
        if (ov.order !== undefined) item._order = ov.order;
        return true;
      });
    });
  });

  // Pass 2: any override id that didn't match an existing item is a brand new admin-added item.
  Object.keys(overrides).forEach(function (id) {
    if (matchedIds[id]) return;
    var ov = overrides[id];
    if (ov.deleted || !ov.pageKey || ov.blockIndex === undefined || !ov.text) return;
    var page = PAGES[ov.pageKey];
    var sec = page && (page.sections || [])[ov.blockIndex];
    if (!sec || sec.type !== 'checklist') return;
    var newItem = it(id, ov.text, { level: ov.level || 'junior' });
    if (ov.order !== undefined) newItem._order = ov.order;
    sec.items.push(newItem);
  });

  /* Pass 3: re-sort any block that received an explicit _order on at least
     one item — untouched blocks keep their hardcoded order exactly (no
     sort call at all, so array order is guaranteed stable regardless of
     engine). Items with no explicit order default to (their own index *
     1000) rather than their raw index — an admin's explicit order is a
     small integer (0, 1, 2, ...), so without this gap an explicit order:0
     on a NEW or moved item would tie with the item already sitting at
     index 0 (whose default would also be 0), and tie-breaking behavior on
     a tie is not guaranteed consistent across JS engines. The 1000x gap
     means any explicit single/double-digit order value unambiguously
     wins its intended position relative to every un-ordered item. */
  Object.keys(PAGES).forEach(function (pageKey) {
    (PAGES[pageKey].sections || []).forEach(function (sec) {
      if (sec.type !== 'checklist') return;
      if (!sec.items.some(function (item) { return item && item._order !== undefined; })) return;
      sec.items.forEach(function (item, i) { if (item._order === undefined) item._order = i * 1000; });
      sec.items.sort(function (a, b) { return a._order - b._order; });
    });
  });
}
applyChecklistOverrides(typeof window !== 'undefined' ? window.CHECKLIST_OVERRIDES : null);
