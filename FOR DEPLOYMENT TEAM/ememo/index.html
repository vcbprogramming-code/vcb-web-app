<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>E-Memo · VCB Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Sarabun, the face every other module uses. Without it this module fell
       through to Segoe UI, so the same "VCB Group" at the same 24px/800
       rendered 131.5px wide here against 118.2px everywhere else. -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    // Restore persisted dark-mode + mobile detection before paint (ported
    // verbatim from the original Apps Script <head> bootstrap).
    // Reads the SHARED vcb_theme, matching the rest of VCB Connect, and runs
    // before paint so there is no flash of the wrong theme. 'auto' (the shared
    // default) follows the OS.
    try {
      // ?theme= wins over the stored value: localStorage is per-origin, so a
      // module on another port cannot see the portal's choice. The link that
      // brought us here carries it. Persist it immediately, so the rest of the
      // visit — and the next one — uses it.
      var qs = null;
      try { qs = new URLSearchParams(location.search); } catch (e) {}
      var q = qs && qs.get('theme');
      if (q === 'light' || q === 'dark' || q === 'auto') {
        localStorage.setItem('vcb_theme', q);
      }
      var l = qs && qs.get('lang');
      if (l === 'th' || l === 'en') {
        localStorage.setItem('vcb_lang', l);
      }
      var t = localStorage.getItem('vcb_theme') || 'auto';
      var d = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (d) document.documentElement.classList.add('dark');
    } catch (e) {}
    (function () {
      function isPhone() {
        try { if (window.matchMedia && window.matchMedia('(pointer:coarse)').matches && window.innerWidth <= 820) return true; } catch (e) {}
        return /Android|iPhone|iPod|Windows Phone/i.test(navigator.userAgent) ||
          (/iPad|Macintosh/i.test(navigator.userAgent) && 'ontouchend' in document && window.innerWidth <= 1024);
      }
      function apply() { document.documentElement.classList.toggle('is-mobile', isPhone()); }
      apply();
      window.addEventListener('resize', apply);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
