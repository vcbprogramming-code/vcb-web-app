  /* align-items: stretch (the flex default, but explicit here since
     .group-jv-row overrides it below) makes every .group-stem-item in
     the row match the tallest one's height — paired with .group-entity-
     card's own height:100% (see below), this is what keeps sibling cards
     the same size regardless of how many lines their own description
     text wraps to, rather than each card sizing independently to its own
     content and leaving shorter descriptions with a visibly shorter
     card. Previously align-items:flex-start, which is exactly why CVE's
     2-line description and CVN Development's 1-line one produced
     different card heights. */
  .group-entity-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 16px; align-items: stretch; }
  /* Per-entity stem: a line + a small always-visible label ("Subsidiary" /
     "Joint Venture") sitting above each individual card, not just a shared
     heading over the whole row — explicit request: "a line for each one...
     visible on each line", and the line needs to visibly attach down into
     the card "like a tree", not float above it with a gap.
     Built as ONE continuous line spanning the full stem height, positioned
     behind everything (.group-stem-line, absolute, z-index 0) running from
     the top of the stem straight down to the card's top edge with zero
     gap — the label sits ON TOP of that line with its own solid background
     patch (matching whichever panel color it's on) so the line reads as
     passing behind the text rather than stopping at it. Uses --tree-line, a
     dedicated always-visible neutral — --card-border/--card-border-hover
     are tuned as barely-there hairlines for card edges and were nearly
     invisible here, especially in light mode. */
  .group-stem-item { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 26px; }
  .group-stem-line {
    content: ''; position: absolute; top: 0; left: 50%; width: 2px; bottom: 0;
    background: var(--tree-line); transform: translateX(-50%); z-index: 0;
  }
  .group-stem-label {
    position: relative; z-index: 1;
    font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-dim); white-space: nowrap;
    background: var(--pill-bg); padding: 2px 8px; border-radius: 999px;
    margin-bottom: 8px;
  }
  .group-stem-item > .group-entity-card,
  .group-stem-item > .org-team { position: relative; z-index: 1; }
  /* Label patch background matches whichever panel the stem sits on
     (Subsidiaries = --accent-soft tinted panel, Joint Ventures =
     --status-warn-soft tinted panel — see .org-segment-departments /
     .org-segment-pm above) instead of the generic --pill-bg default, so
     the patch blends into its panel rather than reading as a mismatched
     gray chip floating on a colored background. */
  .org-segment-departments .group-stem-label { background: var(--card); }
  .org-segment-pm .group-stem-label { background: var(--card); }
  /* Subsidiaries and Joint Ventures side by side on ONE row, not stacked
     top-to-bottom the way the org chart's own Head Office/Project Sites
     segments are (.org-segment's plain block-level stacking, reused as-is
     there) — explicit request: same horizontal plane, left and right.
     This container also carries .org-tree-branches (see the markup in
     renderGroupStructureHtml, app.html) to inherit the trunk's own
     top-padding/spacing — but NOT .org-tree-branches::before, which draws
     a single center drop meant for a single-column stack (Head Office
     directly below Project Sites). With two panels side by side instead,
     that single drop lands in the gap BETWEEN them, reaching neither —
     disabled here so renderOrgConnectors (app.html) can draw a real
     two-way branch to each panel's own top-center instead, the same
     measured-elbow approach already used inside each panel for its own
     row of cards. */
  .group-structure-branches {
    display: flex; align-items: stretch; gap: 20px; flex-wrap: wrap; position: relative;
    padding: 12px; margin: -12px; border-radius: calc(var(--radius) + 10px);
    /* Faint accent ring wrapping both Subsidiaries + Joint Ventures panels
       together, reinforcing (at the container level, not just the
       connector lines) that this whole region — everything under VCB —
       is the employee's actual scope. Deliberately soft (thin border, no
       fill) so it doesn't compete with the two panels' own --accent-soft/
       --status-warn-soft backgrounds, just frames them as one unit. */
    border: 1px solid var(--accent-soft);
  }
  .group-structure-branches::before { content: none; }
  /* .org-segment::before (a fixed-height CSS drop from a segment's own top
     edge down to its row) was previously hardcoded to 52px here to
     approximate where Subsidiaries/Joint Ventures' row-level connector
     (renderOrgConnectors, app.html) picks up — two independently-guessed
     numbers (a CSS px value centered on the SEGMENT's own box, and a JS
     measurement centered on the ROW's own, narrower box) that happened to
     mostly line up but wasn't guaranteed to, and visibly kinked where they
     met. renderOrgConnectors now draws this same lead-in itself, measured
     directly off the row (see the .group-entity-row/.group-jv-row branch
     in that function) so it can't drift out of sync with the row's own
     bar/drops the way the CSS version could — disabled here entirely so
     the two don't double up. Scoped to .group-structure-frame specifically
     so this can never affect the org chart's own (correct, untouched)
     .org-segment, which still uses its original CSS ::before. */
  .group-structure-frame .org-segment::before { content: none; }
  /* min-width guarantees room for 2 side-by-side .group-entity-card/
     .group-stem-item (200px each, see below) + the row's own 16px gap +
     this segment's own 24px 20px padding = 456px — below that,
     flex-wrap:wrap on .group-entity-row/.group-jv-row (see below) kicks
     in and drops the second card onto its own line. That's a legitimate
     fallback for a genuinely narrow viewport, but Subsidiaries currently
     only ever has 2 entities, so on any ordinary-width screen it should
     never need to wrap — flex-basis alone (the previous 300px) doesn't
     prevent shrinking below that if the two segments' combined 300px+300px
     basis is more than the row has room for; min-width does, by refusing
     to shrink past it regardless of basis or available space. Without
     this, the two entities could silently wrap to separate lines at
     ordinary desktop widths or simply via browser zoom (which shrinks the
     effective CSS-pixel viewport the same way a narrower window does),
     which is what produced the previously-reported "disjointed" connector
     — a real 2-line wrap, correctly drawn as two lines, just not the
     side-by-side layout this view is designed around. */
  .group-structure-branches .org-segment { flex: 1 1 300px; min-width: 456px; margin-bottom: 0; }

  /* Entity card: icon band (tinted, matching .dept-card-icon) + name +
     optional description — not a plain bordered rectangle. Subsidiary
     cards are static (nothing to expand); the parent card gets the
     accent-gradient treatment .dept-card-label uses, since it's the one
     entity in this view that's genuinely the "lead" element. */
  .group-entity-card {
    display: flex; flex-direction: column; width: 200px; max-width: 100%;
    /* flex: 1 (not just width) lets the card grow to fill whatever extra
       vertical space .group-entity-row's align-items:stretch (see above)
       gives its parent .group-stem-item — a shorter one-line description
       (e.g. CVN Development) otherwise leaves its card shorter than a
       sibling with a wrapped 2-line description (e.g. CVE), even with the
       row itself stretched, since nothing was telling the card to consume
       that space rather than just sit at its own natural content height
       inside it. */
    flex: 1 0 auto;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: var(--radius); overflow: hidden; text-align: center;
    box-shadow: var(--shadow-card); transition: box-shadow .18s, border-color .18s, transform .18s;
  }
  .group-entity-card:hover { box-shadow: var(--shadow-card-hover); border-color: var(--card-border-hover); transform: translateY(-2px); }
  .group-entity-icon {
    display: flex; align-items: center; justify-content: center; height: 56px; flex: none;
    background: var(--pill-bg); color: var(--accent);
  }
  .group-entity-icon .icon { width: 24px; height: 24px; }
  /* flex: 1 so the body (not the fixed-height icon band above it) is what
     absorbs the card's flex: 1 0 auto growth (see .group-entity-card) —
     keeps the icon band a consistent 56px on every card regardless of how
     tall the card ends up, with the extra space landing as breathing room
     around the description text instead. */
  .group-entity-body { flex: 1; padding: 12px 14px 14px; }
  .group-entity-label { display: block; font-weight: 700; font-size: 0.9rem; color: var(--text); line-height: 1.3; }
  .group-entity-sub { display: block; margin-top: 4px; font-size: 0.72rem; color: var(--text-dim); line-height: 1.4; }

  .group-entity-parent {
    position: relative; z-index: 1;
    width: 380px; box-shadow: var(--shadow-card-hover);
    border-color: var(--accent); border-width: 1.5px;
  }
  .group-entity-parent .group-entity-icon {
    height: 64px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
  }
  /* The icon's own .dept-icon-svg class sets color: var(--accent) directly
     (see icons.html/styles.html base rule) — two classes on the element
     itself beats the ancestor-scoped .group-entity-icon{color:#fff} above
     by specificity, so the icon was still rendering var(--accent) (dark
     blue) on top of this band's own dark blue gradient background,
     effectively invisible. Must target .dept-icon-svg explicitly to win. */
  .group-entity-parent .group-entity-icon .icon,
  .group-entity-parent .group-entity-icon .dept-icon-svg { width: 28px; height: 28px; color: #fff; }
  .group-entity-parent .group-entity-label { font-size: 1rem; }

  /* Family-owned sibling companies (VPO, Chavananand Holding) flanking VCB
     in .org-tree-top — see groupFamilyCompanyCardHtml/renderGroupStructureHtml
     in app.html. gap/align-items on the row itself (not a new rule, this
     just documents why the existing .org-tree-top {display:flex;
     justify-content:center} is enough): three flex children of
     symmetric-by-construction width (VPO/Holding both use the same
     .group-entity-card base 200px, VCB's own .group-entity-parent is a
     fixed 300px) centered together is what keeps VCB landing at the
     row's — and therefore the frame's — true horizontal center, which
     renderGroupStructureTrunk's own trunk-anchoring depends on. */
  /* align-items: flex-start (not stretch) — VPO/Chavananand Holding are
     now collapsed to just their name by default (see
     groupFamilyCompanyCardHtml, app.html), deliberately much smaller than
     VCB's own always-expanded paragraph, so VCB reads as clearly primary
     next to two visually minor sibling cards rather than three
     equal-weight boxes. Their own two collapsed heights still match each
     other exactly (both are the SAME .org-team-btn markup with no
     variable-length content when collapsed), which is the only equality
     that actually matters here. */
  .group-structure-top { gap: 32px; align-items: flex-start; }
  /* Wraps VPO/Holding/VCB's cards identically (see groupFamilyCompanyCardHtml/
     renderGroupStructureHtml, app.html) — no caption text underneath (a
     written-out "not affiliated with VCB" note was tried and explicitly
     rejected), just the card itself; the dashed connector
     (.group-family-connector below) is the only thing distinguishing
     VPO/Holding's line from VCB's own solid trunk. padding-top reserves
     room above the card for that connector to visibly enter it from
     above rather than touching the row's very top edge. */
  .group-family-slot { display: flex; flex-direction: column; align-items: center; padding-top: 26px; width: 200px; max-width: 100%; }
  /* VCB's own slot needs to be as wide as its card (380px, see
     .group-entity-parent) — the shared 200px .group-family-slot width
     above (sized for VPO/Holding's smaller collapsed cards) was capping
     .group-entity-parent's child width down to 200px despite its own
     width:380px rule, since a flex item can't exceed a width-constrained
     parent without an explicit override. */
  .group-family-slot-parent { width: 380px; }
  /* VPO/Chavananand Holding: plain hover tooltip, no click/expand state
     (changed from the earlier click-to-expand .org-team version per
     explicit request — hover only, fade in/out, nothing to click).
     .group-family-hover is the hover/focus scope; .group-family-tooltip is
     positioned absolutely so it never affects layout/card height, and its
     visibility is pure CSS (opacity + visibility, no JS) so it can't get
     out of sync with any click state the way the old expand panel could. */
  .group-family-hover { position: relative; width: 100%; }
  .group-family-hover:focus { outline: none; }
  /* Same visual shape .org-team-btn uses elsewhere in this chart (card,
     border, shadow, hover lift) reproduced directly since this is now a
     plain div, not an .org-team-btn <button> — overridden only for the
     icon (.group-entity-icon's own fixed 56px band doesn't fit inside a
     button padded the normal .org-team-btn way, so it's shrunk to an
     inline glyph instead, matching how .group-jv-btn's handshake icon
     sits beside its own label rather than above it in its own band). */
  /* Muted on purpose — explicit client request to make it unmistakable
     that employees work for VCB specifically, not these two family-owned
     but otherwise unrelated companies. Grey icon/border/label instead of
     the accent blue every other card in this tree uses (subsidiaries,
     JVs, VCB itself all read var(--accent) somewhere in their resting
     state) is what visually pushes these two into the background —
     hovering still lifts the shadow slightly (still discoverable, still
     legible) but stays grey, never switching to accent, so even mid-
     interaction it doesn't compete with VCB's own branch for attention. */
  .group-family-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 12px 16px; opacity: 0.72;
    box-shadow: var(--shadow-card); transition: box-shadow .18s, border-color .18s, opacity .18s;
  }
  .group-family-hover:hover .group-family-btn, .group-family-hover:focus-visible .group-family-btn {
    box-shadow: var(--shadow-card-hover); opacity: 0.92;
  }
  .group-family-btn .group-entity-icon {
    height: auto; width: 28px; background: none; color: var(--text-dim); margin: 0 auto;
  }
  .group-family-btn .group-entity-icon .icon { width: 22px; height: 22px; }
  .group-family-btn .org-team-label { font-weight: 700; font-size: 0.82rem; color: var(--text-dim); text-align: center; }
  /* Positioned above the card, centered, fading in/out on hover/focus —
     never affects the card's own box, so VPO/Holding's collapsed height
     (and therefore renderGroupStructureTrunk's connector-drop anchor,
     which measures .group-family-btn, not this tooltip) stays fixed
     whether the tooltip is showing or not. */
  .group-family-tooltip {
    position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%) translateY(4px);
    width: 240px; max-width: 60vw;
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    box-shadow: var(--shadow-card-hover); padding: 10px 12px;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .16s ease, transform .16s ease, visibility 0s linear .16s;
    z-index: 5;
  }
  .group-family-hover:hover .group-family-tooltip,
  .group-family-hover:focus-visible .group-family-tooltip,
  .group-family-hover:focus-within .group-family-tooltip {
    opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
    transition: opacity .16s ease, transform .16s ease, visibility 0s linear;
  }
  .group-family-tooltip .group-entity-sub {
    display: block; font-size: 0.76rem; color: var(--text-dim); line-height: 1.5; text-align: center;
  }
  /* Every connector line in this whole tree — VCB's own trunk, the
     Subsidiaries/Joint Ventures fork and everything inside those two
     panels, the shared Chavananand Family fork bar, and VPO/Holding's own
     drops — now renders with the exact same color/weight as the base
     .org-branch-bar/.org-branch-drop rule (var(--tree-line), styles.html).
     .group-scope-line previously recolored VCB's own branch accent-blue
     with a glow, and .group-family-connector previously used a different
     muted color (var(--card-border)) at reduced opacity — two more
     "special" line treatments alongside the base one, which is exactly
     what read as inconsistent ("some lines are darker and bolder than the
     others... use the same code for the lines"). The ONE remaining
     intentional difference is dashed vs solid (still drawn as a
     repeating-linear-gradient background, not CSS border-style, since
     these are plain absolutely-positioned divs — see
     renderGroupStructureTrunk, app.html) — VPO/Holding dashed, everything
     else solid, both using the identical --tree-line color/opacity. */
  .group-family-connector {
    background: repeating-linear-gradient(to bottom, var(--tree-line) 0, var(--tree-line) 5px, transparent 5px, transparent 10px) !important;
  }

  /* Joint venture cards — click-to-expand (see groupJvCardHtml, app.html),
     reusing the org chart's own .org-team/.org-team-btn mechanism. An
     always-visible ownership-chart version (parent boxes + connector lines,
     no click) was tried in between and explicitly reverted back to
     click-to-expand; a plain icon-card version before THAT was also
     rejected as "bland" — so this is deliberately just clean typography, no
     icon, no parent names, until clicked. auto-fit + a shared min width
     keeps 4 cards in a clean 2x2 (or one row on wide screens) instead of
     the 4th wrapping alone underneath 3. */
  .group-jv-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px 100px; width: 100%; max-width: 500px; margin: 0 auto;
  }
  /* A grid column's own gap (14px) leaves each card touching its column's
     full width right up to the gutter — fine collapsed, but an expanded
     card's parent-chip content (see .group-jv-parents-inner) then sits
     right beside the vertical trunk line running down the grid's center
     (drawn in renderOrgConnectors/app.html, the line joining the top row's
     bar to the bottom row's), reading as if the line cuts through the
     card. A first attempt narrowed the card to 190px inside its ~230px
     column, expecting the leftover column space to read as a gap — it
     didn't; the trunk line still sits only ~22px from the card's own
     edge, well inside its border/shadow's visual footprint, so it still
     read as touching. Actually fixed by widening the grid's own COLUMN
     gap (the row's `gap` shorthand is row-gap column-gap — 64px between
     columns, unchanged 14px between the two stacked rows) so there is
     real, unmistakable open space between the two columns regardless of
     which card is expanded, rather than relying on how much of a
     narrowed card's own column width happens to be left over. */
  .group-jv-row .group-stem-item { width: 100%; max-width: 165px; margin: 0 auto; }
  .group-jv-team { width: 100%; }
  .group-jv-btn { flex-direction: row; justify-content: center; gap: 8px; padding: 14px 16px; }
  /* Sized up from the default 16px icon slot — this icon carries real
     detail (two buildings, individual clasped fingers, see icons.html)
     that needs more room to stay legible than a simple abstract shape did. */
  .group-jv-icon { display: inline-flex; color: var(--text-dim); flex: none; }
  .group-jv-icon .icon { width: 24px; height: 24px; display: block; }
  .org-team.open .group-jv-icon { color: var(--accent); }
  /* .org-team-people-inner (base rule, above) sets flex-direction: column —
     same specificity (one class each) as this rule, so whichever is
     declared LATER in the file wins regardless of which one "should" win
     conceptually. That silently stacked the parent-company chips full
     width, one per row, instead of the intended inline "A + B" pair —
     .group-jv-team .group-jv-parents-inner (two classes) makes this
     unambiguous rather than depending on staying below the base rule. */
  .group-jv-team .group-jv-parents-inner {
    flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px;
    max-width: 220px; margin: 0 auto;
  }
  .group-jv-parent-chip {
    background: var(--pill-bg); border: 1px solid var(--card-border); border-radius: 8px;
    padding: 6px 10px; font-size: 0.76rem; font-weight: 600; color: var(--text);
    text-align: center;
  }
  .group-jv-plus { font-size: 0.85rem; font-weight: 700; color: var(--text-dim); }

  /* People list: collapsed to 0 height, JS sets an explicit px max-height
     (from the -inner wrapper's real scrollHeight) to animate open, since
     max-height:none/auto can't be transitioned directly. */
  .org-team-people { max-height: 0; overflow: hidden; width: 100%; transition: max-height .35s ease; }
  .org-team-people-inner { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }

  /* Asset Management's two branches (Inventory & Land Assets, Sai-5
     Maintenance Unit — see orgTeamBranchesNodeHtml, app.html). Two
     earlier versions were explicitly corrected (see that function's own
     comment for the full history): nesting one branch under the other
     read as a false reporting line; making Asset Management a permanent
     always-expanded label broke the "same size as every sibling
     department" row. Asset Management is now a completely ordinary
     .org-team card — collapsed, no width/flex override at all, it sizes
     exactly like Engineering/Accounting/every other department (190px,
     see the base .org-team rule) — and its two branches only exist side
     by side INSIDE its own .org-team-people panel once opened, exactly
     like a Head Office department's normal member list, just laid out as
     a row instead of a column.
     .org-dept-fork.open widens ONLY while open, same idea as Project
     Sites' own opened project cards growing to fit their content — but a
     first attempt at 340px (with 140px-min branches) pushed the total
     Head Office row (6 normal 190px-ish cards + this one + 6 gaps) past
     the row's own available width, forcing exactly the horizontal
     scrollbar this row is meant to never need and clipping Engineering/
     Administration off both ends. Measured directly: at 1400px viewport
     the row has ~1265px to work with, and 6 siblings + gaps already use
     ~1032px of it, leaving only ~230px of real headroom for this one
     card to grow into — so both this width AND the branch cards' own
     min-width are capped tighter than the first attempt, specifically to
     stay inside that measured budget rather than picking a size that
     merely "looked reasonable" and re-triggering the same scrollbar. */
  /* Several attempts chased ZERO horizontal scroll on the Head Office row
     by shrinking this card and its two branches further and further —
     each fix genuinely worked, but by the time the branches were narrow
     enough to guarantee no scroll, their text was wrapping mid-word
     ("Invent-ory & Land-Asset-s"), unreadable. Head Office's row has
     ALWAYS horizontally scrolled once its cards don't all fit (see
     .org-team-row's own "original horizontal-scroll shelf" comment,
     styles.html) — true even before Asset Management had branches at
     all, for the same 7-cards-in-a-fixed-width reason. So this settles
     on a WIDTH (240px) generous enough for both branch labels to read
     normally, accepting that opening Asset Management may need the same
     pre-existing shelf-scroll the row already had, rather than forcing
     an even-narrower card just to avoid scrolling and making the branch
     content illegible to get there. */
  .org-dept-fork.open { width: 400px; }
  .org-dept-fork-branches { position: relative; flex-direction: row; flex-wrap: nowrap; gap: 10px; }
  /* A branch with its own physical location (see b.location, content.html
     — e.g. Vehicles & Machinery's Sai-5 site) renders wrapped in an extra
     .org-dept-branch-site box (app.html) instead of sitting directly
     under this row — THAT wrapper is now the direct flex child needing
     the width rules, with the plain .org-team selector still covering
     any branch with no location wrapper. */
  .org-dept-fork-branches > .org-team,
  .org-dept-fork-branches > .org-dept-branch-site { flex: 1 1 0; min-width: 185px; }
  /* Same technique already used for Project Sites' own cards (see
     .org-project .org-team-label below, min-height reserving 2 lines of
     title regardless of whether the label wraps) — "Inventory & Land
     Assets" is long enough to wrap across this narrow a card while
     "Sai-5 Maintenance Unit" doesn't (or vice versa depending on exact
     width), which left the two branch headers visibly different heights
     even though both cards are otherwise the same width — explicit
     request: same size regardless of the label text inside. Sized for
     this label's own smaller font-size (0.92rem, same as the base
     .org-team-label), not the project-card variant's value, since these
     use the standard label size, not the shrunk-for-project-grid one. */
  .org-dept-fork-branches .org-team-label { min-height: calc(0.92rem * 1.3 * 2); display: flex; align-items: center; justify-content: center; }
  /* Zone color system — blue (default, --accent) = Head Office, amber
     (--status-warn-soft) = off-site/Project Sites, green (--zone-admin) =
     site Administration (see orgPersonHtml/orgAdminPersonHtml, app.html)
     — explicit request so an employee can tell at a glance which "world"
     a person belongs to without reading every card. Sai-5 (this branch)
     gets the off-site amber treatment on its own card border/label,
     matching Project Sites' own segment color — organizationally Asset
     Management, physically distinct — without needing caption text, the
     same established pattern already used for Group Structure's family
     companies (line/color conveys it, not words). Applied to the
     branch's own card border/label only — its expanded people list
     keeps the normal card style, this isn't meant to reread as a
     completely different department, just a visually distinct branch of
     the same one; the PEOPLE inside get their own avatar color via
     .org-zone-offsite (below), independent of this card-level accent. */
  .org-dept-branch-offsite .org-team-btn { border-color: var(--status-warn-soft); }
  .org-dept-branch-offsite .org-team-label { color: #a15c00; }
  .org-dept-branch-offsite.open .org-team-btn { background: linear-gradient(180deg, var(--status-warn-soft), var(--card) 70%); }
  /* Wraps a branch that has its own physical site (see b.location,
     content.html — Vehicles & Machinery / Sai-5) in a distinct outer
     frame, separate from the amber team-color already on the card
     itself: explicit request for "its own frame around it to signify
     that it's a different location" — a visual cue independent of, and
     in addition to, the off-site zone color, since color alone was
     conveying "different team category" while this specifically marks
     "different physical place." A light dashed border (not solid, not
     filled) reads as a boundary/enclosure without competing with the
     branch card's own solid border for attention. The location name
     itself sits below as a small caption, not inside the clickable team
     name (see this function's own comment for why that distinction
     matters here specifically). */
  .org-dept-branch-site {
    display: flex; flex-direction: column; align-items: stretch; gap: 4px;
    padding: 6px; border: 1px dashed var(--status-warn-soft); border-radius: calc(var(--radius) + 4px);
  }
  .org-dept-branch-site-label {
    text-align: center; font-size: 0.66rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: #a15c00;
  }

  /* A project's own expanded panel — ALWAYS the side-by-side layout now
     (2026-08 correction: two earlier rounds had this conditional on the
     org chart's .focused state, showing a plain vertical stack by
     default and only going side-by-side when a project was clicked in
     isolation — explicit follow-up request to drop that distinction
     entirely and make the side-by-side layout the one and only default,
     since both views showed the same content anyway). The Project
     Manager header sits full width on top; Site Operations and Site
     Administration (.org-project-groups, the wrapper around both) sit
     side by side beneath it: Operations LEFT, Administration RIGHT,
     dashed VERTICAL divider between them. Matches the matrix-reporting
     chart the client provided: the PM heads the WHOLE project (both
     branches), Site Operations additionally runs through the normal
     Engineering Team chain of command, Site Administration additionally
     reports to Head Office instead (see .org-project-admin-uplink below)
     — the two columns read as separate branches under one shared head. */
  .org-project-group { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; width: 100%; flex: 1 1 0; min-width: 0; }
  /* Wraps JUST the two groups (not the PM header) — .org-project-lead
     stays outside it, full-width/on-top, while this wrapper alone goes
     side by side. */
  .org-project-groups { display: flex; flex-direction: row; align-items: flex-start; gap: 12px; width: 100%; }
  .org-project-dept {
    background: var(--pill-bg); border: 1px solid var(--card-border); border-radius: 10px;
    padding: 6px 8px 8px;
  }
  /* Gap between stacked people within one department card (lead + staff,
     see dept.staff in content.html) — needed once a department card could
     hold more than one person; previously always exactly one, no gap
     required. */
  .org-project-dept .org-person + .org-person { margin-top: 4px; }
  .org-project-dept-label {
    font-size: 0.62rem; font-weight: 700; color: var(--text-dim); margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  /* The Project Manager themself (project.lead) — a full-width header
     ABOVE both groups in every layout, not nested inside Site Operations
     (2026-08 correction — an earlier draft nested them there, which read
     as Administration not ultimately answering to the PM at all). The PM
     heads the entire project, both branches, so they sit outside/above
     the group split entirely. border-bottom separates them from the
     groups below without implying they're just another group. */
  .org-project-lead {
    position: relative; padding: 10px 0 10px; margin-bottom: 4px; border-bottom: 1px solid var(--card-border);
    display: flex; align-items: center; gap: 8px;
  }
  .org-project-lead .org-person { flex: 1; }
  /* Small role tag next to the PM's name — identifies the role without
     replacing the name as the primary label, consistent with every other
     lead in this chart being shown by name first (see orgAdminPersonHtml's
     "Reports to X" tag for the same "small tag alongside the real
     content" pattern already established here). */
  .org-project-pm-tag {
    flex: none; font-size: 0.6rem; font-weight: 800; letter-spacing: 0.04em;
    color: var(--accent); background: var(--pill-bg); border: 1px solid var(--card-border-hover);
    border-radius: 999px; padding: 2px 8px;
  }
  /* Collapsed AND opened (default layout), every project card is the same
     width — kept equal specifically so none of the 6 looks bigger/smaller
     than its neighbors (Sai-5 Maintenance Unit's longer title used to
     force a 2-line header while the others stayed 1-line, see
     .org-team-label below for that fix) — but that width now STRETCHES to
     fill the row's full available space (flex: 1, replacing a flat 190px)
     rather than staying fixed. min-width keeps cards from getting too
     narrow to read if the row is ever narrower than 6*190px (e.g. a
     smaller viewport/browser zoom) — flex-wrap on the row
     (.org-segment-pm .org-team-row) still handles genuinely-too-narrow
     cases by dropping extra cards to a second line, same as before. */
  /* max-width caps how far a card can stretch — without it, a card left
     alone on a wrapped line (e.g. the 6th project dropping to its own
     line on a narrower viewport, since 5 fit on the line above but not 6)
     would grow to fill that ENTIRE line by itself, ballooning to 4-5x its
     siblings' width — worse than the original cramped-but-uniform look.
     320px is roughly what each of 6 cards gets when comfortably spread
     across the page's ~1520px content width, so normal (all-6-on-one-line)
     layouts are unaffected by this cap; it only kicks in for the
     lone-wrapped-card case. */
  .org-project { width: 190px; flex: 1 1 190px; min-width: 190px; max-width: 320px; }
  /* Wider once opened — the side-by-side Operations/Administration columns
     need more room for a readable department card than the collapsed
     190px allows. Applies to every opened project uniformly now (2026-08
     correction — used to be scoped to .org-chart.focused only, back when
     the side-by-side layout was solo-view-only; now it's the one and only
     expanded layout, so every open project gets it, whether or not others
     are also open at the same time). */
  .org-project.open { width: 380px; flex: 1 1 380px; min-width: 340px; max-width: 480px; }
  /* "Sai-5 Maintenance Unit" is long enough to wrap to 2 lines while every
     other project's 1-2 word title stays on one — left alone, that made
     its header card visibly taller than its 5 siblings even though every
     project card is otherwise sized identically (see .org-project above).
     min-height reserves the same 2-line title space on every project
     header regardless of whether its own title actually needs it, so a
     short 1-line title just centers within that reserved height instead
     of leaving a shorter box — matches the "all cards the same size"
     request. Sized for this label's own font-size/line-height (0.92rem /
     default ~1.3), not a hardcoded guess. */
  .org-project .org-team-label { min-height: calc(0.92rem * 1.3 * 2); display: flex; align-items: center; justify-content: center; }
  /* Smaller person card specifically inside a project's department cards
     (not Head Office's own department lists, which keep their original
     size) — the 28px avatar/0.78rem name at full size left little
     breathing room once each department card also carries its own label
     line above the person button. */
  .org-project-dept .org-person-btn { padding: 5px 6px; gap: 5px; border-radius: 8px; }
  .org-project-dept .org-member-avatar { width: 20px; height: 20px; font-size: 0.5rem; }
  .org-project-dept .org-member-name { font-size: 0.66rem; line-height: 1.2; }
  .org-project-lead .org-person-btn { padding: 6px 7px; gap: 6px; border-radius: 9px; }
  .org-project-lead .org-member-avatar { width: 22px; height: 22px; font-size: 0.52rem; }
  .org-project-lead .org-member-name { font-size: 0.7rem; line-height: 1.2; }

  .org-project-group-label {
    font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-dim); margin-bottom: 4px;
  }
  /* position: relative — the positioning context for .org-project-admin-
     uplink (below). Both groups begin at the SAME Y (Operations and
     Administration are flex siblings starting together), so the uplink
     can anchor directly here with top:0 and
     needs no computed/guessed offset to reach "the top of this group" —
     that IS this element's own top. (An earlier draft tried to route the
     line past this group, past the PM header, all the way to the outer
     card edge — reverted per explicit request after `.org-team-people`'s
     load-bearing `overflow:hidden` (needed for the expand/collapse
     animation shared by every team card, not just projects) turned out
     to clip anything positioned above ITS top, silently rendering a much
     shorter line than the CSS declared. Reaching further would mean
     restructuring the PM header out of that shared animated container —
     out of scope for a decorative connector.) */
  .org-project-admin-group { position: relative; }
  .org-project-admin-group .org-project-group-label { color: var(--accent); }
  /* The matrix line itself — dashed, VERTICAL, full height of the taller
     column (stretch, not the row's own align-items default). A plain div
     rather than a border on one of the two groups so its position/height
     is independent of which group happens to be taller. (2026-08
     correction — this used to also serve a horizontal-divider role for a
     separate "default stacked" layout that no longer exists; now it only
     ever needs to be the vertical version.) */
  .org-project-matrix-divider {
    align-self: stretch; width: 0; height: auto; border-left: 1px dashed var(--card-border-hover);
  }
  /* A short dashed line rising from the Administration group's own top
     edge — visibly "reaching up and off" toward the PM/Head Office rather
     than dead-ending mid-panel. Anchored to .org-project-admin-group
     itself (position:relative set on that class above) via a plain
     top:0, no computed/guessed offset needed: Operations and
     Administration are flex siblings that both begin at the exact same
     Y, so "the top of this group" already IS the row's shared starting
     point.
     Deliberately does NOT reach all the way to the outer CARD edge, past
     the PM header — that was the first goal, but .org-team-people (the
     expand/collapse panel wrapping this whole thing) has a load-bearing
     `overflow: hidden` needed for its max-height animation, shared by
     every team card in this chart, not just projects — anything
     positioned ABOVE that panel's own top edge gets silently clipped, no
     console warning, just a shorter rendered line than the CSS declared
     (caught only by comparing getComputedStyle's declared height against
     the ELEMENT's actual getBoundingClientRect() height in the Playwright
     harness — they disagreed). Reaching further would mean restructuring
     the PM header to live outside that shared animated panel — out of
     scope for a decorative connector; confirmed via explicit request to
     accept this smaller scope instead. */
  .org-project-admin-uplink {
    display: block; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 0; height: 10px; border-left: 1px dashed var(--accent); z-index: 1;
  }
  /* Small tag under an admin member's role text, naming which HQ
     department their function actually reports to (see orgAdminPersonHtml,
     app.html) — the concrete "who do they answer to" detail the matrix
     structure is meant to surface, shown only when opened (same
     .org-person-role-inner panel every member's role text already lives
     in), not cluttering the collapsed card. */
  .org-member-hq-tag {
    display: block; margin-top: 3px; font-size: 0.66rem; font-weight: 700;
    color: var(--zone-admin); text-transform: uppercase; letter-spacing: 0.03em;
  }

  .org-person { width: 100%; }
  .org-person-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: var(--pill-bg); border: 1px solid var(--card-border); border-radius: 10px;
    padding: 8px 10px; cursor: pointer; font-family: inherit; transition: border-color .15s;
  }
  .org-person-btn:hover, .org-person-btn:focus-visible { border-color: var(--accent); }
  .org-person.open .org-person-btn { border-color: var(--accent); }
  .org-member-avatar {
    width: 28px; height: 28px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 0.62rem;
  }
  .org-member-name { font-size: 0.78rem; font-weight: 600; color: var(--text); line-height: 1.3; }

  /* Zone color system (see orgPersonHtml/orgAdminPersonHtml, app.html) —
     blue is the .org-member-avatar default above (Head Office/Leadership/
     Group Structure, nothing to override); .org-zone-offsite (amber) and
     .org-zone-admin (green/teal) recolor just the avatar gradient for
     Project Sites operations and site Administration respectively, an
     explicit request so an employee can tell at a glance which "world" a
     person belongs to without reading every card. Amber reuses
     --status-warn-soft's hue family (matching Project Sites' own segment
     tint and Sai-5's own branch color) rather than introducing a second
     amber token. */
  .org-zone-offsite .org-member-avatar { background: linear-gradient(135deg, #f0a02f, #ffb84a); }
  .org-zone-admin .org-member-avatar { background: linear-gradient(135deg, var(--zone-admin), #14b8a6); }

  /* Role text: same collapsed-to-0/expand-to-measured-height mechanic as
     .org-team-people, one level deeper. */
  .org-person-role { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  .org-person-role-inner { padding: 8px 10px 2px 38px; }
  .org-member-role { font-size: 0.74rem; color: var(--text-dim); line-height: 1.45; }

  /* Leadership's expanded panel: Board of Directors + Board Advisors share
     one green-backed row (.org-leadership-row) — their headings sit side
     by side on top (.org-leadership-row-headings), and all 6 people (4
     directors + 2 advisors) sit in one shared 6-column grid underneath
     (.org-leadership-people-grid, further down), so they read as one row
     of panels rather than two separate groups. Everything below that row
     (Managing Director, Assistant Managing Directors) is wrapped in
     .org-leadership-tiers, sharing the same blue backdrop as the Head
     Office segment further down the tree — the color signals "this tier
     reports into that tier", distinct from the board above it. A short
     connecting line still runs from the row down into the tiers box, and
     from each level to the next within it, so it still reads as one
     continuous tree even collapsed inside the Leadership node's own
     panel. */
  .org-leadership-levels { gap: 18px; }
  .org-leadership-row {
    width: 100%; position: relative; padding: 16px 12px;
    background: var(--status-good-soft); border-radius: var(--radius);
  }
  .org-leadership-row::after {
    content: ''; position: absolute; top: 100%; left: 50%; width: 2px; height: 18px;
    background: var(--card-border); transform: translateX(-50%);
  }
  .org-leadership-row-headings {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%;
  }
  .org-leadership-row-headings .org-leadership-level-heading { flex: 1 1 200px; max-width: 260px; }
  .org-leadership-tiers {
    background: var(--accent-soft); border-radius: var(--radius);
    padding: 12px 12px 6px;
  }
  .org-leadership-level { display: flex; flex-direction: column; align-items: center; }
  .org-leadership-level.has-connector { padding-top: 18px; position: relative; }
  .org-leadership-level.has-connector::before {
    content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 18px;
    background: var(--card-border); transform: translateX(-50%);
  }
  .org-leadership-level-heading {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--accent); margin-bottom: 8px; text-align: center;
  }
  /* Board of Directors (4) + Board Advisors (2) render as one CSS grid
     with a fixed 6-column template — deliberately grid, not a flex-wrap
     row: flexbox's wrap algorithm previously interleaved the two groups'
     cards unpredictably across lines depending on available width. A grid
     with an explicit column count keeps every card in strict source order
     (all 4 directors, then both advisors) even when it wraps to fewer
     columns on narrow screens, because grid auto-placement fills
     left-to-right/top-to-bottom in DOM order rather than flex's
     content-driven line-breaking. */
  .org-leadership-people-grid {
    display: grid; grid-template-columns: repeat(6, minmax(150px, 1fr)); gap: 8px; width: 100%;
  }
  .org-leadership-people-grid .org-person { width: 100%; }

  /* Managing Director / Assistant Managing Directors tiers (rendered via
     orgLeadershipLevelHtml, reusing the generic .org-person markup) — a
     compact side-by-side grid, same idea as the board's row above, NOT
     the plain vertical full-width stack .org-person defaults to elsewhere
     (that default is right for a flat department member list, but reads
     as an odd stretched-out block here). Track size is capped at 260px
     (not 1fr) specifically so a single card (Managing Director) can't
     stretch to fill the whole row — auto-fit only creates as many 200-260px
     tracks as fit, and justify-content:center centers however many of
     them exist (1 for the MD, 2 for the Assistants). */
  .org-leadership-level-people {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 260px)); gap: 8px; width: 100%; justify-content: center;
  }
  .org-leadership-level-people .org-person { width: 100%; }

  @media (max-width: 860px) {
    /* Below the leadership panel's own 760px width, 6 columns get too
       cramped to read — step down to 3 columns (2 rows: 3 directors,
       then the 4th director + both advisors), still strict DOM order. */
    .org-leadership-people-grid { grid-template-columns: repeat(3, minmax(140px, 1fr)); }
  }
  @media (max-width: 640px) {
    /* :not(.org-leadership) is load-bearing. The Leadership panel carries
       BOTH classes (`class="org-team org-leadership"`, see renderOrgChart in
       app.html), so this 260px cap — intended for the small Head Office /
       Project Site team cards — also squashed Leadership down to 260px while
       the surrounding chart laid out at ~838px, leaving it a narrow column
       next to full-width siblings.

       Note this media query tests the REAL viewport (360px), but .org-chart
       is `zoom: 0.42` at that width, so the chart's internal layout box is
       ~838px — the two disagree by design, and any px cap written here lands
       far smaller than it looks. Leadership keeps its own sizing from
       `.org-leadership { width: 980px; max-width: 100% }` instead. */
    .org-team:not(.org-leadership) { width: 100%; max-width: 260px; }
    /* Leadership's base `width: 980px` is wider than .org-tree's own layout
       box at these widths, which made it (and .org-tree-top above it)
       overflow past the chart's right edge. Fill the tree instead of
       asserting a fixed px width — but .org-tree-top is a shrink-to-fit
       flex container, so its own width must be stretched too or a
       `width: 100%` child just inherits the collapsed size. */
    .org-tree-top { align-self: stretch; }
    .org-segment-leadership { flex: 1; }
    .org-leadership { width: 100%; }
    .org-leadership-people-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .org-team-people, .org-person-role, .org-team { transition: none; }
  }

  /* 4 columns on a typical desktop width, stepping down responsively
     rather than a fixed count — auto-fit with a ~200-260px track naturally
     lands on 4 across most content widths without a hard-coded column
     count. Square aspect ratio for every gallery image is set on
     .gallery-grid .content-image itself (see above), which fixed the
     "pancake" look a single wide landscape photo got when it was the only
     image in its own gallery section. Track max is a fixed 260px, NOT 1fr
     — with 1fr, a section with only 1-2 images (fewer than fit per row)
     had that single track absorb ALL the container's leftover width, and
     combined with aspect-ratio:1/1 that turned one photo into an
     enormous square taller than the screen (e.g. Team Work, which has
     only 1 image). A fixed max keeps every tile the same size regardless
     of how many images are in a given gallery. */
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 260px)); justify-content: center; gap: 12px; margin-top: 12px; }
  .gallery-grid .placeholder-box { min-height: 120px; }
  .gallery-tile { display: flex; flex-direction: column; gap: 6px; }
  .gallery-tile-caption { font-size: 0.85rem; font-weight: 600; color: var(--text); text-align: center; }

  .closing-line {
    margin: 30px 28px 0; padding: 24px 0 0; border-top: 1px solid var(--card-border);
    font-size: 0.98rem; color: var(--text-dim); text-align: center;
    display: flex; flex-direction: column; align-items: center;
  }
  .closing-line p { max-width: 640px; margin: 0 auto 16px; }

  /* ---------- Interactive checklist + progress ---------- */
  .checklist-group {
    text-align: left; background: var(--card); border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow-card);
  }

  /* Junior/Senior track picker on a department landing page (see the
     'levelpicker' section type in content.html/app.html). Reuses the same
     card + .seg/.seg-btn segmented-control look as .checklist-group and the
     settings-panel language/theme toggles, so it reads as part of the same
     visual system rather than a one-off control. */
  .level-picker {
    text-align: center; background: var(--card); border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 24px 28px; box-shadow: var(--shadow-card);
  }
  .level-picker-intro { color: var(--text-dim); font-size: 0.9rem; margin: 0 0 14px; }
  .level-picker-seg { display: inline-flex; margin: 0 auto; }
  .level-picker-seg .seg-btn { padding: 8px 28px; font-size: 0.9rem; }
  .progress-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .progress-bar-track { flex: 1; height: 8px; border-radius: 999px; background: var(--pill-bg); overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; transition: width .3s ease; }
  .progress-bar-label { font-size: 0.8rem; font-weight: 700; color: var(--text-dim); white-space: nowrap; }

  ul.check-list { list-style: none; padding: 0; margin: 0; }
  .check-item { margin-bottom: 14px; }
  .check-item label {
    display: flex; align-items: flex-start; gap: 10px; cursor: pointer;
    background: var(--pill-bg); border: 1px solid var(--card-border); border-radius: 10px;
    padding: 16px 18px; transition: background .15s, border-color .15s;
  }
  .check-item label:hover { border-color: var(--card-border-hover); }
  .check-item input[type="checkbox"] { width: 18px; height: 18px; margin-top: 1px; flex: none; accent-color: var(--accent); cursor: pointer; }
  .check-item-text { font-size: 0.95rem; line-height: 1.5; color: var(--text); }
  .check-item.done label { background: var(--accent-soft); border-color: var(--accent-2); }
  .check-item.done .check-item-text { color: var(--text-dim); text-decoration: line-through; }
  .check-item.locked label { opacity: 0.55; cursor: not-allowed; }
  .check-item.locked input[type="checkbox"] { cursor: not-allowed; }
  /* Senior-only extra tasks (see sr() in content.html) — only ever rendered
     at all once the employee is on the Senior track (Junior never sees
     these rows, see the 'checklist' case in app.html), so this is purely
     about making them visually distinct from the shared baseline tasks
     within a Senior employee's own list, using the same warm amber already
     used for the Project Managers org-chart segment elsewhere in this file. */
  .check-item.senior-task label { border-left: 3px solid #a15c00; }
  .senior-badge {
    display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px;
    background: var(--status-warn-soft); color: #a15c00; font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase; vertical-align: middle;
  }
  .check-item.done.senior-task label { border-left-color: var(--accent-2); }

  .phase-lock-notice {
    display: flex; align-items: center; gap: 10px; margin: 0 auto 18px;
    background: var(--pill-bg); border: 1px dashed var(--card-border); border-radius: 10px;
    padding: 12px 16px; font-size: 0.88rem; color: var(--text-dim);
  }

  /* ---------- Modals (name capture, department switch) ---------- */
  .name-modal-overlay {
    position: fixed; inset: 0; background: rgba(2,5,13,0.65); z-index: 300;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .name-modal {
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 28px; max-width: 400px; width: 100%; text-align: center; box-shadow: var(--shadow-card-hover);
  }
  .name-modal h3 { margin: 0 0 8px; color: var(--text); font-size: 1.2rem; }
  .name-modal p { margin: 0 0 18px; color: var(--text-dim); font-size: 0.9rem; }
  .name-modal-input {
    width: 100%; padding: 10px 14px; border: 1px solid var(--card-border); border-radius: 10px;
    font-size: 0.95rem; margin-bottom: 14px; background: var(--bg-0); color: var(--text); font-family: inherit;
  }
  select.name-modal-input { cursor: pointer; }
  select.name-modal-input:disabled { cursor: default; opacity: 1; background: var(--pill-bg); color: var(--text); -webkit-appearance: none; appearance: none; }
  /* Visually hidden but still announced — for labels that would be
     redundant on screen (the field's purpose is obvious from the modal
     heading) but which inputs need in order to have an accessible name.
     Not display:none, which would remove it from the accessibility tree. */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* Cancel/Save row in the rename modal. */
  .name-modal-actions { display: flex; gap: 10px; }
  .name-modal-actions .name-modal-btn { flex: 1; margin-top: 4px; }

  /* "You uploaded: <file>" receipt under a required-document card. */
  .doc-uploaded:empty { display: none; }
  .doc-uploaded {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--card-border);
    font-size: 0.82rem; color: var(--text-dim);
    word-break: break-word;
  }
  .doc-uploaded-label { font-weight: 600; }
  .doc-uploaded a { color: var(--accent); text-decoration: underline; }
  .doc-uploaded-hint { opacity: .75; }

  .name-modal-btn {
    display: block; width: 100%; padding: 11px; border: none; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 0.92rem; cursor: pointer;
    margin: 0 auto; text-align: center;
  }
  .name-modal-btn:hover { filter: brightness(1.08); }
  .name-modal-btn-secondary {
    display: block; width: 100%; padding: 11px; margin: 10px auto 0; border: 1px solid var(--card-border); border-radius: 999px;
    background: transparent; color: var(--text-dim); font-weight: 600; font-size: 0.88rem; cursor: pointer; text-align: center;
  }
  /* Missing-document list inside promptRequiredDocsIncomplete (progress.html) */
  .missing-docs-list {
    text-align: left; margin: 0 0 18px; padding: 0; list-style: none;
  }
  .missing-docs-list li {
    padding: 8px 12px; margin-bottom: 6px; border-radius: 8px;
    background: var(--pill-bg); color: var(--text); font-size: 0.85rem; font-weight: 600;
  }
  .name-modal-btn-secondary:hover { border-color: var(--card-border-hover); color: var(--text); }

  /* ---------- Section-complete milestone overlay ---------- */
  .milestone-overlay {
    position: fixed; inset: 0; background: rgba(2,5,13,0.7); z-index: 350;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 0; transition: opacity .2s ease;
  }
  .milestone-overlay.show { opacity: 1; }
  .milestone-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 20px;
    padding: 36px 32px; max-width: 380px; width: 100%; text-align: center; box-shadow: var(--shadow-card-hover);
    transform: scale(0.9) translateY(10px); transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .milestone-overlay.show .milestone-card { transform: scale(1) translateY(0); }
  .milestone-badge {
    width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 1.8rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .milestone-eyebrow { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 6px; }
  .milestone-card h3 { margin: 0 0 6px; color: var(--text); font-size: 1.25rem; font-family: 'Orbitron', sans-serif; }
  .milestone-sub { margin: 0 0 20px; color: var(--text-dim); font-size: 0.85rem; }
  .milestone-card .name-modal-btn { margin-top: 4px; max-width: 220px; }

  @media (prefers-reduced-motion: reduce) {
    .milestone-overlay, .milestone-card { transition: none; }
  }

  /* ---------- Full 90-day completion celebration (bigger, lingers longer) ---------- */
  .confetti-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 351;
  }
  .completion-card {
    max-width: 460px; padding: 44px 36px; position: relative; z-index: 352;
  }
  .completion-badge {
    width: 76px; height: 76px; font-size: 2.1rem;
    box-shadow: 0 0 0 6px var(--accent-soft);
  }
  .completion-card h3 { font-size: 1.5rem; text-wrap: balance; }
  .completion-sub { font-size: 0.92rem; line-height: 1.7; margin-bottom: 26px; }
  .completion-card .name-modal-btn { max-width: 240px; }

  /* ---------- Reward toast ---------- */
  .reward-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--sidebar-0); color: #fff; padding: 12px 22px; border-radius: 999px;
    font-weight: 700; font-size: 0.9rem; box-shadow: var(--shadow-card-hover);
    opacity: 0; z-index: 400; transition: opacity .25s, transform .25s;
    pointer-events: none;
  }
  .reward-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* Save-failure variant — visually distinct (red, not the default dark
     pill) so it can't be mistaken for a celebration toast at a glance. */
  .reward-toast.is-warning { background: #dc2626; }

  /* ---------- Footer ---------- */
  footer.site-footer {
    background: transparent; color: var(--text-dim); padding: 24px 28px; margin-top: 20px;
    border-top: 1px solid var(--card-border);
  }
  .footer-inner {
    max-width: var(--maxw); margin: 0 auto; display: flex; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; font-size: 0.8rem;
  }
  .footer-inner a { color: var(--text-dim); }
  .footer-inner a:hover { color: var(--accent); }

  /* ---------- Admin checklist editor (?page=admin, see admin.html) ---------- */
  .admin-gate {
    min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .admin-gate-card {
    max-width: 360px; width: 100%; background: var(--card); border: 1px solid var(--card-border);
    border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 28px; text-align: center;
  }
  .admin-gate-card h1 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; margin: 0 0 10px; color: var(--text); }
  .admin-gate-card p { color: var(--text-dim); font-size: 0.88rem; margin: 0 0 18px; }
  .admin-gate-error { color: #d9534f !important; }
  #admin-gate-form { display: flex; flex-direction: column; gap: 10px; }
  #admin-gate-input {
    padding: 10px 14px; border-radius: 10px; border: 1px solid var(--card-border);
    background: var(--bg-1); color: var(--text); font-size: 0.92rem; font-family: inherit;
  }
  #admin-gate-form button {
    padding: 10px 14px; border-radius: 10px; border: none; background: var(--accent); color: #fff;
    font-weight: 700; font-size: 0.9rem; cursor: pointer; font-family: inherit; transition: filter .15s;
  }
  #admin-gate-form button:hover { filter: brightness(1.08); }
  #admin-gate-form button:disabled { opacity: 0.6; cursor: default; }

  .admin-shell { max-width: var(--maxw); margin: 0 auto; padding: 24px 28px 60px; }
  .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .admin-header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; color: var(--text); margin: 0; }
  .admin-exit-link { font-size: 0.85rem; font-weight: 600; color: var(--accent); }
  .admin-exit-link:hover { text-decoration: underline; }

  /* Three nav rows (Department / Phase / Section) are visually a
     hierarchy — department chosen first, phase and section both scoped
     underneath it — but as identical pill buttons at the same weight
     (the first version shipped) that hierarchy wasn't readable at a
     glance. Wrapped in one bordered card with a divider under the
     department row, a small uppercase label per row, and two visually
     distinct tab styles (.admin-tab-main for departments, bigger/bolder;
     .admin-tab-sub for phase+section, smaller and quieter) so the eye
     reads "department, then within it phase, then within it section"
     without needing to parse three identical-looking rows. */
  .admin-nav {
    margin-bottom: 20px; background: var(--card); border: 1px solid var(--card-border);
    border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 16px 16px 14px;
  }
  .admin-nav-group { display: flex; flex-direction: column; gap: 8px; }
  .admin-nav-group + .admin-nav-group { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--card-border); }
  .admin-nav-label {
    font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-dim);
  }
  .admin-nav-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .admin-tab {
    border-radius: 999px; border: 1px solid var(--card-border); background: var(--pill-bg);
    color: var(--text-dim); cursor: pointer; font-family: inherit;
    transition: border-color .15s, color .15s, background .15s, box-shadow .15s;
  }
  .admin-tab:hover { border-color: var(--card-border-hover); color: var(--text); }
  .admin-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .admin-tab-main { padding: 9px 16px; font-size: 0.86rem; font-weight: 700; }
  .admin-tab-main.active { box-shadow: 0 2px 8px var(--accent-soft); }
  .admin-tab-sub { padding: 6px 12px; font-size: 0.78rem; font-weight: 600; background: none; }
  .admin-tab-sub.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .admin-item-list { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .admin-item-row {
    display: flex; align-items: flex-start; gap: 14px; background: var(--card); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 14px; box-shadow: var(--shadow-card); transition: border-color .15s, box-shadow .15s;
  }
  .admin-item-row:hover { border-color: var(--card-border-hover); box-shadow: var(--shadow-card-hover); }
  .admin-item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .admin-item-text {
    width: 100%; resize: vertical; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--card-border);
    background: var(--bg-1); color: var(--text); font-size: 0.88rem; font-family: inherit; line-height: 1.5;
    transition: border-color .15s;
  }
  .admin-item-text:focus { outline: none; border-color: var(--accent); }
  .admin-item-senior { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-dim); cursor: pointer; width: fit-content; }
  .admin-item-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; flex: none; width: 96px; }
  .admin-item-move-pair { display: flex; gap: 6px; }
  .admin-item-move-pair button { flex: 1; }
  .admin-item-actions button {
    padding: 6px 8px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--pill-bg);
    color: var(--text); font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: border-color .15s, color .15s, background .15s;
  }
  .admin-item-actions button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .admin-item-actions button:disabled { opacity: 0.35; cursor: default; }
  .admin-save-btn { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
  .admin-save-btn:hover:not(:disabled) { filter: brightness(1.08); }
  .admin-delete-btn:hover:not(:disabled) { border-color: #d9534f !important; color: #d9534f !important; }
  .admin-item-status { font-size: 0.72rem; font-weight: 600; text-align: center; min-height: 1em; }
  .admin-item-status-ok { color: var(--status-good); }
  .admin-item-status-error { color: #d9534f; }

  .admin-add-btn {
    padding: 10px 18px; border-radius: 999px; border: 1px dashed var(--card-border-hover); background: none;
    color: var(--accent); font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit;
    transition: background .15s;
  }
  .admin-add-btn:hover { background: var(--pill-bg); }
  .admin-loading { color: var(--text-dim); font-size: 0.88rem; }

  /* ---------- Phone-width pass (<=480px) ----------
     Everything above this point was tuned for tablet/small-laptop widths
     (980/860/780/720/640/560px breakpoints) — below 480px those rules
     leave content sized for a ~700px-wide viewport crammed into a
     360-414px one (iPhone SE/12/13 mini and typical Android widths). This
     block follows the same plain-override pattern already used throughout
     this file (grid-template-columns swaps, padding/font-size reduction)
     rather than introducing a new methodology. The sidebar needs no changes
     in THIS block — it is sized in the max-width:980px block near the top,
     which caps the drawer at min(86vw, 320px). (That comment previously
     claimed the drawer was already "full-viewport-width" below 980px; it
     was not — it stayed a fixed 274px at every breakpoint, covering ~76%
     of a 360px phone with the fixed hamburger sitting over the brand.) */
  @media (max-width: 480px) {
    /* ---- shell / hero ---- */
    .menu-toggle { top: 10px; left: 10px; padding: 8px; }
    .settings-wrap.settings-wrap-floating { top: 12px; right: 12px; }
    .hero { min-height: 0; padding: 60px 18px 32px; margin-bottom: 16px; }
    .hero h1 { font-size: 1.5rem; margin-bottom: 10px; }
    .hero .subtitle { font-size: 0.92rem; }
    .hero .lead { font-size: 0.9rem; }
    .hero .cta { width: 100%; text-align: center; padding: 12px 18px; }
    .overall-progress-wrap:not(:empty) { margin: 10px 14px 18px; }
    .overall-progress { padding: 16px 16px; }

    /* ---- sections / general content ---- */
    section.block { padding: 8px 16px 22px; }
    section.block.band-teal { padding-top: 44px; padding-bottom: 48px; min-height: 0; }
    section.block.band-teal h2 { font-size: 1.4rem; }
    section.block h2 { font-size: 1.1rem; }
    .closing-line { margin: 24px 16px 0; padding: 20px 0 0; }

    /* ---- quote / values ---- */
    .quote-card { padding: 18px; }
    .quote-portrait { width: 64px; height: 64px; }
    .value-card { padding: 16px; }

    /* ---- feature card / tiles ---- */
    .feature-card { padding: 16px; gap: 16px; }
    .feature-grid { gap: 14px; }
    .feature-tile-text { padding: 14px 16px 18px; }

    /* ---- carousel ---- */
    .carousel-slide { height: 180px; }
    .carousel-arrow { width: 34px; height: 34px; }

    /* ---- document grid / cards ---- */
    .doc-link { padding: 14px 16px; }
    .doc-card-status { flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
    .doc-upload-btn { margin-left: 0; }
    .doc-download-btn, .doc-upload-btn { flex: 1 1 auto; justify-content: center; }

    /* ---- department selection grid ---- */
    .deptgrid-intro { margin-bottom: 24px; font-size: 0.92rem; }
    .dept-card-icon { height: 90px; }
    .dept-card-icon .dept-icon-svg { width: 38px; height: 38px; }

    /* ---- phase grid / trail ---- */
    .phase-grid { grid-template-columns: 1fr; }
    .phase-card { padding: 14px; }

    /* ---- team members / org chart / group structure ----
       The connector-line rendering itself (renderOrgConnectors,
       renderGroupStructureTrunk in app.html) is left untouched per
       instructions — these are CSS-only size/spacing reductions of the
       same elements it already measures, so its offsetTop/offsetLeft
       reads still land on the same boxes, just smaller ones. .org-chart
       already fully mitigates narrow widths via `zoom`, shrinking the
       ENTIRE tree (and everything inside it, connectors included)
       uniformly — a lower zoom here is the same technique already in use
       at the base rule, not a new one. */
    .team-members { grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 10px; }
    .team-member { height: 130px; }
    .org-chart { zoom: 0.5; }
    .org-view-toggle .seg-btn { min-width: 0; flex: 1; padding: 10px 12px; font-size: 0.84rem; }
    /* superseded by the 980px rule above — kept so this block still reads
       as the phone's complete org-chart pass */
    .group-structure-branches .org-segment { min-width: 0; }
    .group-jv-row { gap: 14px 40px; }

    /* ---- checklist / progress ---- */
    .checklist-group { padding: 18px; }
    .check-item label { padding: 13px 14px; }
    .level-picker { padding: 18px; }
    .level-picker-seg { display: flex; width: 100%; }
    .level-picker-seg .seg-btn { flex: 1; padding: 8px 10px; }

    /* ---- modals ---- */
    .name-modal { padding: 22px; }
    .milestone-card { padding: 26px 20px; }
    .completion-card { padding: 30px 20px; }

    /* ---- footer ---- */
    footer.site-footer { padding: 18px 16px; }
    .footer-inner { justify-content: center; text-align: center; }

    /* ---- admin editor ---- */
    .admin-shell { padding: 16px 14px 40px; }
